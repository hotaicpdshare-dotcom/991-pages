<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三倉看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23941e34%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E%E4%B8%89%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#17222d;--ink2:#3a4a59;--muted:#617283;--line:#e2e8ee;--line2:#edf1f5;--soft:#f7f9fb;
  --brand:#941e34;--brandS:#fbeff2;--accent:#0b7285;--accentS:#e3f4f7;
  /* 顏色語意（第三看板也照這套）：
     --f2 --f3（與淡色 --f2s --f3s）只給 2F／3F 樓層，任何圖表／標籤不可拿來表示別的東西
     --c1…--c6 分類色（作業別、環節、狀態分類…），刻意避開藍／橘（樓層）與紅／綠／琥珀（狀態）
     --good --bad --warn 只表好壞（改善／變差／逾期／警示），不拿來當分類
     --neutral(S) 中性（空白、未超過、背景比例條） */
  --f2:#2563eb;--f2s:#9db8ff;--f3:#e8710a;--f3s:#ffc999;
  --c1:#1b94a8;--c2:#6f4bc4;--c3:#b83b8e;--c4:#8a6347;--c5:#5f7388;--c6:#0b4f6c;
  --neutral:#8795a3;--neutralS:#c9d3dd;
  --good:#12805c;--goodS:#e3f5ee;--bad:#c0362c;--badS:#fde9e7;--warn:#a56a2c;--warnS:#fdf1e0;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent);text-decoration:none;font-weight:700}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---------- 頂部（W19：品牌、四個看板鈕、件號輸入、資料時間；沒有左側欄） ---------- */
header.top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);font-weight:800;font-size:18px}
.brand:hover{text-decoration:none}
.brand i{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:18px}
.boards{display:flex;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:11px}
.boards a{padding:7px 18px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:16px;color:var(--muted);line-height:1.5;white-space:nowrap}
.boards a:hover{text-decoration:none;color:var(--ink)}
.boards a.on{background:var(--brand);color:#fff}
.search{position:relative;flex:1;max-width:340px;margin-left:auto}
.search input{width:100%;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.search input::placeholder{color:#8c9aa8}
.sugg{position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);display:none;overflow:hidden}
.sugg.on{display:block}.sugg button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;font-size:15.5px}
.sugg button:hover{background:var(--soft)}
.fresh{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink2);white-space:nowrap;font-weight:400}
.fresh:hover{text-decoration:underline}
.fresh .dot{width:9px;height:9px;border-radius:50%;background:var(--neutral);flex:none}
.fresh.ok .dot{background:var(--good)}.fresh.warn .dot{background:#e0a100}.fresh.bad .dot{background:var(--bad)}.fresh.warn,.fresh.bad{font-weight:700}
#freshShort{display:none}
/* ---------- 版型 ---------- */
main{min-width:0}.content{max-width:1200px;margin:0 auto;padding:22px 24px 60px}
.ph{margin:0 0 16px}.ph-t{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}.dtag{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--accentS);color:var(--accent);font-size:13.5px;font-weight:700;white-space:nowrap}.ph h1{margin:0;font-size:26px;font-weight:800}
.banner{margin:10px 0 0;padding:10px 16px;border-radius:10px;font-size:14.5px;line-height:1.5}.banner.warn{background:var(--warnS);color:var(--warn)}
.errcard{border-left:4px solid var(--warn)}.errcard .why{margin:0 0 6px;color:var(--ink2);font-size:15.5px}.errcard .note{margin:4px 0 0}
.grid{display:grid;gap:20px;align-items:stretch}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px}
.card-h h3{margin:0;font-size:17px;font-weight:800;color:var(--ink)}.card-h>span{font-size:14.5px;color:var(--muted)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:700;background:var(--warnS);color:var(--warn);margin-left:8px;vertical-align:1px}
a.card,button.card{text-align:left;color:inherit;font-weight:400;width:100%}a.card:hover,button.card:hover{text-decoration:none;border-color:var(--accent)}
/* 2F | 3F 對齊欄位 */
.cols{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);column-gap:28px}
.col{min-width:0}
.pill{display:inline-block;min-width:38px;padding:1px 10px;border-radius:99px;font-size:14px;font-weight:800;color:#fff;text-align:center}
.pill.f2{background:var(--f2)}.pill.f3{background:var(--f3)}.pill.all{background:var(--ink2)}
.big{margin:8px 0 0;font-size:38px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line2);font-size:15.5px;color:var(--ink2);white-space:nowrap}
.ln:first-of-type{margin-top:14px}.ln b{color:var(--ink);font-variant-numeric:tabular-nums}
.d{font-size:13.5px;font-weight:700;margin-left:5px}.d.up{color:var(--bad)}.d.down{color:var(--good)}.d.eq{color:var(--muted)}
.foot{margin-top:auto;padding-top:14px;font-size:14.5px;color:var(--muted)}
/* 控制列 */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 18px}.tools .sp{flex:1}.tools .seg button{padding:7px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{padding:8px 16px;border:0;background:transparent;font-weight:700;color:var(--muted);font-size:15px}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--accent);color:#fff}
.cc-btns .btn{height:34px;padding:0 11px;font-size:14px}.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:14.5px}.btn:hover{border-color:var(--accent);color:var(--accent)}
input[type=search],.in{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15.5px;min-width:240px}
/* 圖表卡片 */
.cc{margin:0}
.cc-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.cc-t{min-width:0;flex:1}
.cc-h h3{margin:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.cc-h p{margin:3px 0 0;color:var(--muted);font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-btns{display:flex;gap:8px;flex-wrap:nowrap;flex:none;justify-content:flex-end}
.cc-btns .btn.custom{border-color:var(--accent);color:var(--accent)}
.tag.dt{background:var(--accentS);color:var(--accent)}
/* 營運首頁：今日注意、小卡右上角資料日、熱點小卡、常用圖表卡 */
.alerts{margin:18px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.al-h{display:flex;align-items:baseline;gap:14px;padding:12px 20px;background:var(--soft);border-bottom:1px solid var(--line)}.al-h b{font-size:17px;font-weight:800}.al-h span{font-size:14px;color:var(--muted)}
.al{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line2);color:var(--ink);font-weight:600;font-size:15.5px;line-height:1.45}.al:first-of-type{border-top:0}
a.al:hover{background:var(--soft);text-decoration:none}.al span{flex:1;min-width:0}.al em{flex:none;font-style:normal;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}.al.bad em{color:var(--bad)}.al.warn em{color:var(--warn)}
.ai{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;font-style:normal;font-weight:800;font-size:15px;line-height:1;color:#fff}
.ai.bad{border-radius:50%;background:var(--bad)}.ai.warn{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:7px;font-size:13px}.ai.ok{border-radius:50%;background:var(--good)}
.alerts.ok .al{color:var(--good);font-weight:700}
.card-h>div{min-width:0}.csub{display:block;margin-top:2px;color:var(--muted);font-size:14px;font-weight:400;line-height:1.4}
.card-h>.dtag{flex:none;font-size:13.5px;padding:1px 10px;color:var(--accent)}
.card.fc .card-h h3 a{color:var(--ink)}.card.fc .col{display:block;color:inherit;font-weight:400;border-radius:10px;padding:8px 10px;margin:-8px -10px}.card.fc .col:hover{background:var(--soft);text-decoration:none}
.rp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:34px}.rp-col{min-width:0}.rp-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px}.rp-h h3{margin:0;font-size:17px;font-weight:800;line-height:1.3}.rp-h h3 a{color:var(--ink)}.rp-h .dtag{font-size:13.5px;padding:1px 10px}
.rp-fl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;margin-top:6px}.rp-f{display:flex;gap:10px;align-items:flex-start;color:inherit;font-weight:400;border-radius:10px;padding:8px 10px;margin:0 -10px}a.rp-f:hover{background:var(--soft);text-decoration:none}.rp-f .pill{margin-top:6px}.rp-v{min-width:0}.home .rp .big{font-size:30px}.rp-s{margin-top:2px;font-size:14px;color:var(--ink2);line-height:1.4}.rp-f.na .rp-s{color:var(--muted)}
@media (max-width:1000px){.rp-fl{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.rp-cols{grid-template-columns:minmax(0,1fr);row-gap:18px}}
.hot5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.hot5>div{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"rk id" "pl em";gap:2px 10px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:10px}
.hot5 .rk{grid-area:rk;font-weight:800;color:var(--muted);font-size:18px}.hot5 b{grid-area:id;font-size:15.5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}.hot5 .pill{grid-area:pl;justify-self:start}.hot5 em{grid-area:em;font-style:normal;font-size:14px;color:var(--ink2);font-weight:700;white-space:nowrap}
.hc{margin-top:20px}.hc-r{display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap;justify-content:flex-end}.hc-r .seg button{padding:6px 12px;font-size:14px}.hc .grid{gap:28px}
.home .sec{margin:26px 0 12px;padding-bottom:8px}.home .vz{padding:9px 0}.home .vz.ax{padding-bottom:30px}.home .card{padding:18px 22px}.home .big{font-size:34px;margin:0}.fc .top{display:flex;align-items:baseline;gap:12px}.home .alerts .al{padding:8px 20px}.home .ln:first-of-type{margin-top:8px}.home .ln{padding:5px 0}.home .foot{padding-top:8px}
.top2{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.agebar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:14px 0 12px}
.agelist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.agelist a{display:grid;grid-template-columns:12px 1fr;align-items:center;gap:0 8px;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--ink2);font-weight:600;font-size:14px;line-height:1.35}.agelist a:hover{text-decoration:none;background:var(--line2)}
.agelist i{width:12px;height:12px;border-radius:3px}.agelist b{grid-column:2;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse}.cmp th,.cmp td{padding:10px 8px;text-align:left;border-top:1px solid var(--line2);vertical-align:top}.cmp thead th{border-top:0;color:var(--muted);font-size:14px;font-weight:700}.cmp thead small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cmp tbody th{font-weight:700;color:var(--ink2);font-size:15px;white-space:nowrap}.cmp td b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}.cmp td em{display:block;font-style:normal;font-size:13.5px;color:var(--muted)}
.cc.flat{border:0;box-shadow:none;padding:0;background:transparent}
/* 昨日重點：圖形列 */
.vz{display:grid;grid-template-columns:96px minmax(0,1fr) 112px;column-gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line2)}
.vz:first-of-type{border-top:0;padding-top:4px}.vz.ax{padding-bottom:34px}
.vz .l{color:var(--ink2);font-size:15.5px;white-space:nowrap}.vz .v{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.4}.vz .v b{display:block}.vz .v .a{color:var(--f2)}.vz .v .c{color:var(--f3)}.vz .v .r{color:var(--bad)}.vz .v .m{color:var(--muted)}
.axis{position:relative;height:32px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/var(--stepw) 100%}
.axis .dot.c3{top:66%}.axis .tk{position:absolute;top:36px;font-size:13px;color:var(--muted);transform:translateX(-50%)}
.axis .dot{position:absolute;top:34%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.dbars{display:grid;gap:5px}.dbar{height:18px;border-radius:5px;background:var(--soft);position:relative;overflow:hidden}.dbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.stk{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--soft)}.stk i{display:block}
.vz .fl{display:flex;align-items:center}
.cc-ctl{display:none;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:0 0 14px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14.5px;color:var(--ink2)}
.cc-ctl label{display:inline-flex;gap:10px;align-items:center}.cc-ctl output{min-width:58px;color:var(--ink);font-weight:800}
.cc-ctl input[type=range]{width:150px;accent-color:var(--accent)}.cc-ctl .seg button{padding:6px 12px;font-size:14px}
.cc.open .cc-ctl{display:flex}.cc-cv{position:relative;margin-top:auto}.cc-cv canvas{width:100%;display:block;border-radius:10px;background:#fff}
.tip{position:absolute;pointer-events:none;z-index:5;min-width:170px;padding:10px 12px;border-radius:10px;background:#17222d;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:none}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:18px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.bad{background:var(--badS);color:var(--bad)}.chip.warn{background:var(--warnS);color:var(--warn)}.chip.ok{background:var(--goodS);color:var(--good)}.chip.blue{background:var(--accentS);color:var(--accent)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.stat div{padding:14px 16px;border-radius:12px;background:var(--soft)}.stat small{display:block;color:var(--muted);font-size:14px;font-weight:700}.stat b{font-size:26px;font-variant-numeric:tabular-nums}.stat em{display:block;font-style:normal;font-size:13.5px;color:var(--muted)}
.stat .w b{color:var(--warn)}.stat .r b{color:var(--bad)}
.wait{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wait div{padding:14px 16px;background:var(--soft);border-radius:12px}.wait small{display:block;color:var(--muted);font-size:14px;font-weight:700}.wait b{font-size:30px}.wait b span{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.note{color:var(--muted);font-size:14px;margin:12px 2px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:11px 20px;border-radius:10px;background:#17222d;color:#fff;font-size:15px;z-index:99;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}.acc+.acc{margin-top:12px}.acc>button{width:100%;display:flex;justify-content:space-between;padding:13px 16px;border:0;background:var(--soft);font-weight:700;font-size:16px;text-align:left}
.acc .ab{padding:6px 16px 14px;display:none}.acc.on .ab{display:block}
.hero{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin:0 0 18px}.hero h2{margin:0;font-size:30px}.hero span{color:var(--muted);font-size:16px}
@media (max-width:1000px){
  header.top{padding:0 16px;gap:12px}
  .cc-h{flex-wrap:wrap}.cc-btns{width:100%}
  .content{padding:18px 16px 48px}.g2,.g3,.g4{grid-template-columns:1fr}.cols{column-gap:14px}
  .tools .chip{white-space:normal;border-radius:12px}.hot5{grid-template-columns:repeat(2,minmax(0,1fr))}.agelist{grid-template-columns:repeat(2,minmax(0,1fr))}.hc-r{justify-content:flex-start;width:100%;min-width:0}.hc-r .seg{max-width:100%;overflow-x:auto;scrollbar-width:thin}.hc-r .seg button{white-space:nowrap}.al{align-items:flex-start}.al em{display:none}
  /* 表格比螢幕寬時，左右邊緣出現漸層陰影提示「還能橫向捲動」（純 CSS：scroll／local 兩層背景） */
  .tw{background:linear-gradient(to right,#fff 30%,rgba(255,255,255,0)) left center/36px 100% no-repeat local,linear-gradient(to left,#fff 30%,rgba(255,255,255,0)) right center/36px 100% no-repeat local,linear-gradient(to right,rgba(16,24,40,.22),rgba(16,24,40,0)) left center/14px 100% no-repeat scroll,linear-gradient(to left,rgba(16,24,40,.22),rgba(16,24,40,0)) right center/14px 100% no-repeat scroll #fff}
}
/* ---------- 第三看板（盤點追查）：只用上面的 token；字級 >= 13px ---------- */
.banner.bad{background:var(--badS);color:var(--bad);font-weight:700}
.banner.rehearsal{background:var(--warnS);color:var(--warn);border:1px solid var(--warn);font-weight:700}
.frsw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.frs{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.frs:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neutral)}
.frs.ok:before{background:var(--good)}.frs.warn:before{background:var(--warn)}.frs.bad:before{background:var(--bad)}

/* ================= 區塊狀態與錯誤隔離 =================

const META=D.meta||null;

const DAYS=(D.ops&&D.ops.days)||[], LAST=DAYS[DAYS.length-1]||null, OPN={north:'北區出貨',replenish:'副倉補充',follow:'副倉FOLLOW',puton:'進貨上架'};

/* ================= 圖表引擎 =================
   畫面：依卡片寬度畫（真實像素字級，所以字不會被縮小）、2 倍以上解析度。
   複製／PNG：另外用 1400×600、2 倍解析度重畫一張（底下多一行資料來源頁尾），貼進信件或簡報不糊。
   用法：頁面函式回傳 chartCard(id, cfg)；路由完成後 MOUNT 表裡列出的 id 會各呼叫一次 mountChart(id)。
   cfg 欄位（折線＋長條圖）：
     flat             true＝不畫卡片外框（放在另一張卡片裡面時用，例如首頁常用圖表 2F｜3F 並排）
     title            標題（純文字，一行；太長會省略）        canvasTitle  匯出圖上的標題（預設同 title）
     sub              副標（最多兩行，超出省略，滑過看全文）   tag          標題旁的小標籤（HTML，例如熱點圖的日期）   sample 加「示意」
     labels[]         橫軸類別（字串）                         sub2[]       橫軸第二行（例如星期）
     bars[{name,color,values,fmt}]  長條（預設堆疊；grouped:true 改並排）
     lines[{name,color,values,fmt,dash,axis:'right',marker}]  marker：資料點形狀 'circle'（圓圈，預設）或 'triangle'（三角形）；有設的線，圖例也會畫出該形狀；PNG 匯出同
     left{title,fmt,min,max,adjMin,fixed}  左軸；min＝座標下限（資料更低時自動往下延伸）；max＝上限；adjMin 讓「調整」面板出現下限拉桿
     right{title,def,unit,cap}  右軸（預設百分比 0～100）；unit＝刻度後面的單位（預設 '%'，不要單位傳 ''）、cap＝上限（預設 100；數值比 100 大時用，例如每站效率）

/* 折線資料點：circle＝白底圓圈（預設）、triangle＝白底三角形；r＝圓的半徑（三角形外接同一個圓），k＝畫布倍率 */
function drawMark(ctx,shape,x,y,r,color,k){
  ctx.beginPath();
  if(shape==='triangle'){const h=r*1.3;ctx.moveTo(x,y-h);ctx.lineTo(x+h*.95,y+h*.62);ctx.lineTo(x-h*.95,y+h*.62);ctx.closePath()}

const CFG={}, st=id=>(LS[id]=LS[id]||{});
function niceCeil(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e}

function visible(cfg,s){const n=cfg.labels.length,r=cfg.ranges?Math.min(n,s.range||cfg.defRange||n):n;return {from:n-r,n:r}}
const plainText=h=>String(h==null?'':h).replace(/<[^>]+>/g,'');
function chartCard(id,cfg){
  CFG[id]=cfg;const pt=plainText(cfg.title),ps=plainText(cfg.sub);
  return `<section class="card cc${cfg.flat?' flat':''}" id="cc-${id}"><div class="cc-h"><div class="cc-t"><h3 title="${esc(pt)}">${cfg.title}${cfg.sample?'<span class="tag">示意</span>':''}${cfg.tag?`<span class="tag dt">${cfg.tag}</span>`:''}</h3></div><div class="cc-btns"><button class="btn" data-ca="adj" data-id="${id}">調整</button><button class="btn" data-ca="copy" data-id="${id}">複製圖</button><button class="btn" data-ca="png" data-id="${id}">PNG</button></div></div><div class="cc-ctl" id="ctl-${id}"></div><div class="cc-cv"><canvas id="cv-${id}" role="img" aria-label="${esc(pt)}"></canvas><div class="tip" id="tip-${id}"></div></div></section>`;
}
function autoScale(cfg,s){
  const {from,n}=visible(cfg,s);let hi=0;
  if(cfg.bars&&cfg.bars.length){if(cfg.grouped){cfg.bars.forEach(b=>b.values.slice(from).forEach(v=>{if(v>hi)hi=v}))}else{for(let i=from;i<from+n;i++)hi=Math.max(hi,cfg.bars.reduce((a,b)=>a+(b.values[i]||0),0))}}
  const leftLines=(cfg.lines||[]).filter(l=>l.axis!=='right');
  leftLines.forEach(l=>l.values.slice(from).forEach(v=>{if(v!=null&&v>hi)hi=v}));
  const auto=cfg.left&&cfg.left.max!=null?cfg.left.max:niceTop(hi*1.03||1);
  /* 下限：資料有負值 → 往下延伸到負值；cfg.left.min 有設就從它開始（資料比它還低時再往下延伸）；否則從 0 */
  let lo=0,dmin=Infinity;
  leftLines.forEach(l=>l.values.slice(from,from+n).forEach(v=>{if(v!=null){if(v<lo)lo=v;if(v<dmin)dmin=v}}));
  if(cfg.grouped&&cfg.bars)cfg.bars.forEach(b=>b.values.slice(from,from+n).forEach(v=>{if(v!=null){if(v<lo)lo=v;if(v<dmin)dmin=v}}));

  if(s.leftMin!=null)lLo=s.leftMin;

  let rMax=null;if(cfg.right){let rh=0;(cfg.lines||[]).filter(l=>l.axis==='right').forEach(l=>l.values.slice(from).forEach(v=>{if(v!=null&&v>rh)rh=v}));rMax=s.rightMax!=null?s.rightMax:Math.max(cfg.right.def||50,Math.min(cfg.right.cap||100,Math.ceil(rh/5)*5))}

const lineLab=(cfg,s)=>s.lineLabels!=null?s.lineLabels:cfg.lineLabels!=null?cfg.lineLabels:!!(cfg.bars&&cfg.bars.length);
/* 座標是否被使用者自訂過（左軸上下限、右軸上限）；自訂過的圖「調整」按鈕會寫成「調整・已自訂」 */

function syncAdj(id){const b=$('#cc-'+id+' [data-ca="adj"]');if(!b)return;const c=isCustom(id);b.textContent=c?'調整・已自訂':'調整';b.classList.toggle('custom',c)}

function mountChart(id){

function ltHatch(c,k){const key=c+'|'+k;if(LT_HATCH[key])return LT_HATCH[key];const sz=Math.max(6,Math.round(8*k)),cv=document.createElement('canvas');cv.width=cv.height=sz;const g=cv.getContext('2d');g.fillStyle=tint(c.startsWith('#')?c:TOK.neutral,.4);if(c.startsWith('#'))g.fillStyle=tint(c,.4);g.fillRect(0,0,sz,sz);g.strokeStyle=c;g.lineWidth=Math.max(1.6,2*k);g.beginPath();[[0,sz,sz,0],[-sz/2,sz/2,sz/2,-sz/2],[sz/2,sz*1.5,sz*1.5,sz/2]].forEach(([a,b,c2,d])=>{g.moveTo(a,b);g.lineTo(c2,d)});g.stroke();return LT_HATCH[key]=g.createPattern(cv,'repeat')}

/* ================= 最晚完成時間跟什麼有關（W19 §8；營運「作業量、效率與時段」ops/eff 第一張圖）=================
   問題：「這一天的揀貨最晚完成時間，比平常晚（早）幾分鐘？晚在哪裡？」每個樓層一張圖：上方＝每天一條堆疊長條（比基準日晚＝往上、早＝往下；各因素一色，加總＝總差），
   下方＝同一條時間軸的最晚完成時間折線（基準日虛線、7 作業日移動平均）；點某一天（或用下拉選日期）在圖下面展開那天各因素的數字。
   資料：ops.json 每天 t[樓層].pick＝[第一筆開始, 最後一筆結束]（小時）、m[作業別][樓層]（站數、點數、站均實際／等待小時）、rw.all[樓層].sec（等待同貨架秒）；不新增任何 WES／HOPES 查詢。
   模型（詳細說明 #ref/drv）：
     作業時間 E ＝ 最後一筆結束 − 第一筆開始（小時）；P＝出貨總點數（北區出貨＋副倉補充＋副倉FOLLOW）；H＝站·小時＝Σ 站數 ×（站均實際＋站均等待）；
     τ＝每點總秒數＝H×3600÷P＝a（每點實際作業）＋ w_o（每點等待，不含等待同貨架）＋ w_r（每點等待同貨架）；N＝有效開站數＝H÷E（站·小時 ÷ 作業時間）。
     所以 E ＝ P × τ ÷ (3600 × N)（恆等式）；最晚完成 ＝ 開工時間 ＋ E。
   與基準日（近 30 個作業日裡「最晚完成時間排在中位數」的那一天）比：ΔE 用對數平均分解（LMDI）：L＝(E−E0)÷ln(E÷E0)（E＝E0 時 L＝E0），
     點數 ＝ L×ln(P÷P0)；開站數 ＝ −L×ln(N÷N0)；每點總秒 ＝ L×ln(τ÷τ0)，再依 Δa、Δw_o、Δw_r 占 Δτ 的比例分成三項；開工時間 ＝ 開工 − 開工0。
   各因素分鐘加總 ＝ 最晚完成時間差（恆等，誤差只有浮點；work\test_w19.py 逐天驗證 ≤ 1 分鐘，並和 Python 獨立重算對照）。
   全域名稱一律 drv／DRV 開頭。 */
const DRV_N=30;
const DRV_F=[['start','開工時間',TOK.c5],['P','作業點數',TOK.c2],['N','開站數',TOK.c1],['a','每點實際作業秒',TOK.c3],['wo','等待（不含等待同貨架）',TOK.c4],['wr','等待同貨架',TOK.c6]];
const DRV_SEL={'2F':null,'3F':null};
/* 一天一個樓層的原始量；缺任何一項回 null */
function drvDay(d,f){
  const t=d.t&&d.t[f],pk=t&&t.pick;if(!pk||pk[0]==null||pk[1]==null)return null;
  let P=0,H=0,W=0;
  ['north','replenish','follow'].forEach(op=>{const m=d.m&&d.m[op]&&d.m[op][f];if(m){P+=m.points;H+=m.stations*(m.actualHours+m.waitHours);W+=m.stations*m.waitHours}});
  const rw=d.rw&&d.rw.all&&d.rw.all[f],E=pk[1]-pk[0];
  if(!rw||!(P>0)||!(H>0)||!(E>0))return null;
  const tau=H*3600/P,wt=W*3600/P,wr=rw.sec/P;
  return {d:d.d,start:pk[0],last:pk[1],E,P,H,N:H/E,tau,a:tau-wt,wo:wt-wr,wr,ratio:W/H,rwMin:rw.sec/60};
}
/* 把 x 相對 b（基準日）的總差（分鐘）分給六個因素 */
function drvSplit(x,b){
  const lm=Math.abs(x.E-b.E)<1e-12?b.E:(x.E-b.E)/Math.log(x.E/b.E);
  const cP=lm*Math.log(x.P/b.P),cN=-lm*Math.log(x.N/b.N),cT=lm*Math.log(x.tau/b.tau),dT=x.tau-b.tau,sh=k=>dT===0?0:cT*(x[k]-b[k])/dT;
  const c={start:(x.start-b.start)*60,P:cP*60,N:cN*60,a:sh('a')*60,wo:sh('wo')*60,wr:sh('wr')*60};
  c.total=(x.last-b.last)*60;
  return c;
}
/* 近 DRV_N 個有資料的作業日；基準日＝最晚完成時間排在中位數（偶數取偏早的那一天）的日子 */
function drvModel(f){
  const all=DAYS.map(d=>drvDay(d,f)).filter(Boolean),days=all.slice(-DRV_N);
  if(days.length<3)return null;
  const srt=days.slice().sort((p,q)=>p.last-q.last),base=srt[Math.floor((srt.length-1)/2)];
  days.forEach(x=>{x.c=drvSplit(x,base)});
  const lasts=days.map(x=>x.last);
  days.forEach((x,i)=>{const w=lasts.slice(Math.max(0,i-6),i+1);x.ma=w.length===7?w.reduce((p,q)=>p+q,0)/7:null});
  return {f,days,base};
}
/* 驗收：各因素分鐘加總與總差的最大誤差（分鐘） */
function drvMaxErr(f){const M=drvModel(f);if(!M)return null;return Math.max(...M.days.map(x=>Math.abs(DRV_F.reduce((s,[k])=>s+x.c[k],0)-x.c.total)))}
const drvSg=(v,d=0)=>v==null||isNaN(v)?'–':(v>0.05*Math.pow(10,-d)?'+':v<-0.05*Math.pow(10,-d)?'−':'')+fmt(Math.abs(v),d);
function drvPanel(f){
  const M=drvModel(f);if(!M)return '';
  let i=DRV_SEL[f];if(i==null||i<0||i>=M.days.length)i=M.days.length-1;
  const x=M.days[i],b=M.base,c=x.c;
  const row=(name,tv,bv,eff,col)=>`<tr><td class="k"><span class="sw" style="background:${col}"></span>${name}</td><td class="n" data-l="這天">${tv}</td><td class="n" data-l="基準日">${bv}</td><td class="n" data-l="影響（分鐘）"><b>${eff}</b></td></tr>`;
  const T=DRV_F.reduce((o,[k,n,col])=>{o[k]=col;return o},{});
  return `<div class="drv-p" data-drv-panel="${f}"><div class="tools"><label>看哪一天 <select class="in" data-drvsel="${f}" aria-label="${f} 選擇日期">${M.days.slice().reverse().map((q,j)=>{const ix=M.days.length-1-j;return `<option value="${ix}"${ix===i?' selected':''}>${md(q.d)}${dayWk(q.d)}</option>`}).join('')}</select></label><span class="muted">基準日＝近 ${M.days.length} 個作業日最晚完成排在中位數的 ${md(b.d)}${dayWk(b.d)}（${hh(b.last)}）</span></div>
  <div class="tbox"><table class="t"><thead><tr><th>因素</th><th class="n">${md(x.d)}</th><th class="n">基準日 ${md(b.d)}</th><th class="n">影響（分鐘）</th></tr></thead><tbody>
  ${row('開工時間（第一筆開始）',hh(x.start),hh(b.start),drvSg(c.start,0),T.start)}
  ${row('作業點數（點）',fmt(x.P),fmt(b.P),drvSg(c.P,0),T.P)}
  ${row('有效開站數（站·小時 ÷ 作業時間）',fmt(x.N,2),fmt(b.N,2),drvSg(c.N,0),T.N)}
  ${row('每點實際作業（秒）',fmt(x.a,1),fmt(b.a,1),drvSg(c.a,0),T.a)}
  ${row('每點等待，不含等待同貨架（秒）',fmt(x.wo,1),fmt(b.wo,1),drvSg(c.wo,0),T.wo)}
  ${row('每點等待同貨架（秒）',fmt(x.wr,2),fmt(b.wr,2),drvSg(c.wr,0),T.wr)}
  <tr class="sl-avg"><td class="k">最晚完成</td><td class="n" data-l="這天">${hh(x.last)}</td><td class="n" data-l="基準日">${hh(b.last)}</td><td class="n" data-l="影響（分鐘）"><b>${drvSg(c.total,0)}</b></td></tr>
  </tbody></table></div>
  <p class="muted">參考：站·小時 ${fmt(x.H,1)}、作業時間 ${fmt(x.E,2)} 小時；等待佔比 ${pct(x.ratio,0)}（基準日 ${pct(b.ratio,0)}）；等待同貨架 ${fmt(x.rwMin,1)} 分鐘（基準日 ${fmt(b.rwMin,1)}）。各因素分鐘加總＝最晚完成時間差。</p></div>`;
}
function drvCfg(f){
  const M=drvModel(f),id='drv'+f.charAt(0);
  if(!M)return {title:`WES ${f} 揀貨最晚完成時間：由什麼造成`,labels:[],noData:1,draw:(ctx,W,H)=>{ctx.fillStyle='#5b6b7a';ctx.font=`15px ${FONT}`;ctx.textAlign='center';ctx.fillText('資料不足（至少要 3 個有完整資料的作業日）',W/2,H/2);return null},height:()=>160,src:['ops']};

  if(m)return `HOPES ${m[2]}（${m[1]}${k3?'，單號 '+k3:''}）；WES 沒有`+t.slice(m[0].length);
  m=/^WES pc 人工開單上架，HOPES 無對應進貨\([^)]*\)/.exec(t);if(m)return 'WES pc 人工開單上架；HOPES 沒有進貨'+t.slice(m[0].length);
  m=/^WES 手動出庫單 (\S+?)（Type \d+），HOPES 無對應銷貨/.exec(t);if(m)return `WES 手動出庫單 ${m[1]}；HOPES 沒有銷貨`+t.slice(m[0].length);
  m=/^WES 手動庫存調整（[^）]*）/.exec(t);if(m)return 'WES 手動庫存調整；HOPES 沒有'+t.slice(m[0].length);
  return null;
}
function invEv(s,k3){let t=String(s==null?'':s);const r8=inv8(t,k3);if(r8!=null)return r8;INV_EVR.forEach(([re,to])=>{t=t.replace(re,to)});return t}

/* ---------------- 資料存取（區塊 → 列 → 欄名） ---------------- */
const invGet=k=>(INV.data&&INV.data[k]!=null)?INV.data[k]:null;
function invNeed(k){const v=invGet(k);if(v==null)throw new NoData('inv','盤點追查資料沒有「'+k+'」區塊');return v}
const invRows=k=>{const b=invGet(k);return Array.isArray(b)?b:(b&&Array.isArray(b.rows))?b.rows:[]};
/* 欄名 → 列索引：const c=invCols('parts'); r[c.part] */
function invCols(k){if(INV.cols[k])return INV.cols[k];const b=invGet(k),o={};if(b&&Array.isArray(b.columns))b.columns.forEach((n,i)=>{o[n]=i});return INV.cols[k]=o}
/* 一列 → 物件（缺的欄是 undefined） */
function invRec(k,r){const o={},c=invCols(k);for(const n in c)o[n]=r[c[n]];return o}
/* 1.0 版面沒有的區塊數量：缺就 null */
const invCount=k=>invGet(k)==null?null:invRows(k).length;
const invMeta=()=>invGet('meta')||{};
/* 索引：part（keyOf 後）→ 列；bare（去掉第 1 碼）→ 列們；rack → 儲位列們；part → 儲位列們；rack → 貨架列 */
function invIdx(){
  if(INV.idx)return INV.idx;
  const ix={part:new Map(),bare:new Map(),rackSlots:new Map(),partSlots:new Map(),rack:new Map(),c:{parts:invCols('parts'),slots:invCols('slots'),racks:invCols('racks')}};
  const pc=ix.c.parts.part;
  if(pc!=null)invRows('parts').forEach(r=>{const k=keyOf(r[pc]);ix.part.set(k,r);const b=k.slice(1);if(!ix.bare.has(b))ix.bare.set(b,[]);ix.bare.get(b).push(r)});
  const sp=ix.c.slots.pos,sq=ix.c.slots.part;
  if(sp!=null)invRows('slots').forEach(r=>{const pos=String(r[sp]),rk=pos.slice(0,9);if(!ix.rackSlots.has(rk))ix.rackSlots.set(rk,[]);ix.rackSlots.get(rk).push(r);
    if(sq!=null&&r[sq]){const k=keyOf(r[sq]);if(!ix.partSlots.has(k))ix.partSlots.set(k,[]);ix.partSlots.get(k).push(r)}});
  const rc=ix.c.racks.rack;
  if(rc!=null)invRows('racks').forEach(r=>ix.rack.set(String(r[rc]),r));
  return INV.idx=ix;
}
/* 用輸入的件號（可帶或不帶商品別、可帶橫線）找零件列；找不到回 []，帶商品別不同的同 bare 件會一起回傳 */
function invFindPart(input){
  const k=keyOf(input),ix=invIdx();if(!k)return [];
  if(ix.part.has(k))return [ix.part.get(k)];
  return ix.bare.get(k)||[];
}

/* ---------------- 分片（零件履歷）：invp/NN.enc ---------------- */
/* FNV-1a 32 位元；分片鍵＝fnv1a(keyOf(件號)) % 32（整串，含第 1 碼商品別；測試向量見 fixtures\inv_hash_vectors.json） */
function fnv1a(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)&255;h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const invShardN=()=>((invMeta().shards||{}).n)||32;
const invShardNo=part=>fnv1a(keyOf(part))%invShardN();
function invShardLoad(nn){
  if(INV.shard.has(nn))return INV.shard.get(nn);
  const p=invFetchEnc('invp/'+String(nn).padStart(2,'0')+'.enc').then(d=>({ok:true,nn,data:d}),e=>{INV.shard.delete(nn);return {ok:false,nn,kind:e.kind||'error',msg:e.message||String(e)}});
  INV.shard.set(nn,p);return p;
}
/* 載入某件號所在的分片。輸入不帶商品別（第 1 碼）時，先用 parts 找出完整件號再算分片（通常只有 1 片；同 bare 的不同商品別各一片）。
   永遠 resolve，不丟例外：{part:keyOf(輸入), shards:[NN…], recs:[[分片裡的件號, 內容物件]…], errors:[{shard,kind,msg}…]}（檔案還不存在＝errors 有 kind:'missing'）。
   分片內容預期 {件號: {p,c,l,d,e,x,a,f}}（schema 的 $defs.shardFile；也容許包在 parts 底下） */
async function invShard(part){
  const k=keyOf(part),N=invShardN();
  if(INV.status!=='ready')return {part:k,shards:[],recs:[],errors:[{shard:-1,kind:'notready',msg:'盤點追查資料尚未載入'}]};
  const pc=invIdx().c.parts.part,full=invFindPart(part).map(r=>keyOf(r[pc])),keys=full.length?full:[k],nns=[...new Set(keys.map(x=>fnv1a(x)%N))];
  const res=await Promise.all(nns.map(invShardLoad)),recs=[],errors=[];
  res.forEach(r=>{
    if(!r.ok){errors.push({shard:r.nn,kind:r.kind,msg:r.msg});return}
    const d=r.data&&typeof r.data==='object'?(r.data.parts&&typeof r.data.parts==='object'&&!Array.isArray(r.data.parts)?r.data.parts:r.data):{};
    for(const key in d){if(keys.includes(keyOf(key)))recs.push([key,d[key]])}
  });
  return {part:k,shards:nns,recs,errors};
}

}

/* 資料來源新鮮度小膠囊：盤點後監控／帳差監控／WES 現量（meta.fresh，UTC）＋最近盤點夜＋meta.health.warnings；老化用「上班小時」（同右上角燈號的算法） */

   數字一律從 inv.json 算（invRows／invIdx），沒有的區塊（v2 資料、缺 v3 欄位）顯示「還沒有資料」，不丟例外。 */
INV_MOUNT['inv/home']=['invProg'];   /* 盤點中才有每日累計圖 */

/* ---------- 共用：常數、日期 ---------- */
const IW_FL=['2F','3F'],IW_PH={'低':'low','中':'mid','高':'high'},IW_CLS3=['低','中','高'];
const IW_CACHE=new WeakMap();
const iwCache=()=>{const d=INV.data;if(!d)return {};let c=IW_CACHE.get(d);if(!c){c={};IW_CACHE.set(d,c)}return c};
const iwDay=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const iwDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const iwHol=()=>new Set((META&&META.calendar&&META.calendar.holidays)||[]);
const iwIsWD=(d,h)=>new Date(d+'T00:00:00Z').getUTCDay()!==0&&!h.has(d);
function iwWDays(a,b){const h=iwHol();let n=0;for(let d=a;d<=b&&n<400;d=iwDay(d,1))if(iwIsWD(d,h))n++;return n}
function iwAddWD(d,n){const h=iwHol();let k=0,x=d;for(let i=0;i<800&&k<n;i++){x=iwDay(x,1);if(iwIsWD(x,h))k++}return x}
const iwTm=s=>s?mdy(String(s).slice(0,10))+' '+String(s).slice(11,16):'–';
const iwPct=(a,b,d=1)=>b>0?pct(a/b,d):'–';

/* ---------- 共用：參考日、計畫、進度 ---------- */
/* today＝看板的「今天」（預演資料用最後一個盤點夜的隔天）；cut＝計畫應完成的截止日（今天的前一天＝資料涵蓋到昨晚）；night＝最近一個有盤點紀錄的晚上 */
function invRef(){
  const m=invMeta(),hl=m.health||{},r=m.round||{},night=hl.lastCountNight||'';
  let today=m.today||isoDay(Date.now());
  if(invMode()==='rehearsal'){const base=night||r.start||today;today=iwDay(base,1)}
  return {today,night,cut:iwDay(today,-1)};
}
const iwPhases=()=>((invMeta().round||{}).phases)||[];
const iwPhase=code=>iwPhases().find(p=>p.code===code)||null;
function iwPlan(){
  const c=iwCache();if(c.plan)return c.plan;
  const pc=invCols('plan'),by={};
  invRows('plan').forEach(r=>{const k=r[pc.cls];(by[k]=by[k]||[]).push([r[pc.date],+r[pc.cum]||0])});
  Object.values(by).forEach(a=>a.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0));
  return c.plan={by,has:Object.keys(by).length>0};
}
const iwPlanAt=(cls,d)=>{const a=iwPlan().by[cls]||[];let v=0;for(const x of a){if(x[0]<=d)v=x[1];else break}return v};
function iwProg(){
  const c=iwCache();if(c.prog)return c.prog;
  const pc=invCols('progress');
  return c.prog=invRows('progress').map(r=>({date:r[pc.date],floor:r[pc.floor],cls:r[pc.cls],racks:+r[pc.racks]||0,slots:+r[pc.slots]||0,diffSlots:+r[pc.diffSlots]||0}));
}

/* ---------- 共用：貨架物件（racks 每列轉成物件，欄名同 racks.columns；state 缺時由 invRackState 推）---------- */
function invRO(){
  const c=iwCache();if(c.racks)return c.racks;
  const cc=invIdx().c.racks,num=['slots','used','rd','never','swap','moved','abn','mis','diffParts','star','nw','disc','add','miss','estH','posN'];
  c.racks=invRows('racks').map(r=>{
    const o={row:r};for(const k in cc)o[k]=r[cc[k]];
    num.forEach(k=>{o[k]=+o[k]||0});o.cls=o.cls||'未分類';o.state=invRackState(r);o.rAt0=o.rAt0||'';o.rAt1=o.rAt1||'';o.phase=o.phase||IW_PH[o.cls]||'';o.pd=o.pd||'';o.ord=o.ord==null?null:+o.ord;
    return o;
  });
  c.rmap=new Map(c.racks.map(o=>[o.rack,o]));
  return c.racks;
}
const invRMap=()=>{invRO();return iwCache().rmap};
const iwDone=o=>o.state==='done'||o.state==='doneMiss';
/* 計畫順序（計畫書 v6 D8：第一輪按貨架編號整座盤）＝racks.ord；沒有 ord 的貨架排最後，依貨架編號 */
const iwOrderOf=list=>list.slice().sort((a,b)=>(a.ord==null?1e9:+a.ord)-(b.ord==null?1e9:+b.ord)||(a.rack<b.rack?-1:a.rack>b.rack?1:0));
function iwOrder(){const c=iwCache();return c.order||(c.order=iwOrderOf(invRO()))}

/* 分類統計（低／中／高／空架／未分類）：座數、已盤、待盤、應完成（計畫線在 cut 的累計）、落後、盤點儲位、差異儲位、預估完成 */
function iwCls(){
  const c=iwCache();if(c.cls)return c.cls;
  const ref=invRef(),pl=iwPlan(),out={};
  ['低','中','高','空架','未分類'].forEach(k=>{out[k]={cls:k,n:0,n2:0,n3:0,done:0,d2:0,d3:0,todo:0,empty:0,rd:0,disc:0,plan:null,lag:0,eta:'–'}});
  invRO().forEach(o=>{
    const s=out[o.cls]||(out[o.cls]={cls:o.cls,n:0,n2:0,n3:0,done:0,d2:0,d3:0,todo:0,empty:0,rd:0,disc:0,plan:null,lag:0,eta:'–'});
    s.n++;if(o.floor==='2F')s.n2++;else s.n3++;
    if(o.state==='empty')s.empty++;
    else if(iwDone(o)){s.done++;if(o.floor==='2F')s.d2++;else s.d3++;s.rd+=o.rd;s.disc+=o.disc}
    else s.todo++;
  });
  const prog=iwProg();
  IW_CLS3.forEach(k=>{
    const s=out[k];if(pl.has){s.plan=iwPlanAt(k,ref.cut);s.lag=Math.max(0,s.plan-s.done)}
    if(!s.todo){s.eta=s.n?'已完成':'–';return}
    const byDate={};prog.forEach(p=>{if(p.cls===k&&p.date<=ref.cut&&p.racks>0)byDate[p.date]=(byDate[p.date]||0)+p.racks});
    const ds=Object.keys(byDate).sort().slice(-3);
    if(ds.length){const pace=ds.reduce((a,d)=>a+byDate[d],0)/ds.length;s.eta=md(iwAddWD(ref.cut,Math.ceil(s.todo/pace)))}
  });
  return c.cls=out;
}
/* 全部合計：已盤／待盤（不含空架）、2F／3F、已過計畫期間、盤點後新放進去／可能沒盤到／換件、盤點儲位／差異儲位 */
function iwTot(){
  const c=iwCache();if(c.tot)return c.tot;
  const ref=invRef(),t={all:0,empty:0,nonEmpty:0,done:0,d2:0,d3:0,todo:0,t2:0,t3:0,todoBy:{'低':0,'中':0,'高':0,'其他':0},late:0,addR:0,addS:0,missR:0,missS:0,swapR:0,swapS:0,discR:0,discS:0,rd:0,rdAll:0,plan:null,lag:0};
  invRO().forEach(o=>{
    t.all++;
    if(o.state==='empty'){t.empty++;return}
    t.nonEmpty++;
    if(iwDone(o)){t.done++;if(o.floor==='2F')t.d2++;else t.d3++}
    else{t.todo++;if(o.floor==='2F')t.t2++;else t.t3++;t.todoBy[IW_CLS3.includes(o.cls)?o.cls:'其他']++;if(o.pd&&o.pd<ref.today)t.late++}
    t.rd+=o.rd;if(o.add>0){t.addR++;t.addS+=o.add}if(o.miss>0){t.missR++;t.missS+=o.miss}if(o.swap>0){t.swapR++;t.swapS+=o.swap}if(o.disc>0){t.discR++;t.discS+=o.disc}
  });
  const cs=iwCls();
  if(iwPlan().has){t.plan=IW_CLS3.reduce((a,k)=>a+cs[k].plan,0);t.lag=IW_CLS3.reduce((a,k)=>a+cs[k].lag,0)}
  return c.tot=t;
}
/* 零件統計：已盤零件、有事件的件、10 種事件各幾件、★件 */
function iwParts(){
  const c=iwCache();if(c.parts)return c.parts;
  const pc=invIdx().c.parts,t={n:0,hasEvt:pc.evt!=null,hasRnd:pc.rAt0!=null,rnd:0,evt:0,bit:new Array(10).fill(0),star:0,starRnd:0,starOpen:0,starEvt:0,eff:0,effAmt:0,rows:[]};
  invRows('parts').forEach(r=>{
    t.n++;const evt=pc.evt!=null?(+r[pc.evt]||0):0,rnd=pc.rAt0!=null&&!!r[pc.rAt0],eff=+r[pc.eff]||0;
    if(rnd)t.rnd++;
    if(evt){t.evt++;for(let i=0;i<10;i++)if(evt&(1<<i))t.bit[i]++;t.rows.push(r)}
    if(eff){t.eff++;t.effAmt+=Math.abs(pc.effAmt!=null?(+r[pc.effAmt]||0):eff*(+r[pc.price]||0))}
    if(pc.star!=null&&+r[pc.star]){t.star++;if(rnd)t.starRnd++;if(eff)t.starOpen++;if(evt)t.starEvt++}
  });
  return c.parts=t;
}
/* ---------- 每日累計已盤貨架圖（首頁、貨架進度共用）---------- */
function invProgCfg(){
  const pl=iwPlan(),pg=iwProg(),ref=invRef(),r=invMeta().round||{};
  const ds=[...new Set([...Object.values(pl.by).flat().map(x=>x[0]),...pg.map(x=>x.date)])].filter(d=>!r.start||d>=r.start).sort();
  if(!ds.length)return null;
  const last=ds.filter(d=>d<=ref.cut).pop()||'';
  const cum=f=>{let a=0;return ds.map(d=>{pg.forEach(x=>{if(x.date===d&&x.floor===f)a+=x.racks});return d<=ref.cut||d<=last?a:null})};
  const plan=ds.map(d=>IW_CLS3.reduce((a,k)=>a+iwPlanAt(k,d),0));
  return {title:'WES 每日累計已盤貨架（座）',canvasTitle:'WES 每日累計已盤貨架座數（2F／3F）',sub:'長條＝實際累計（2F／3F 堆疊，含空架）；折線＝照計畫累計（低銷／中銷／高銷，不含空架）',labels:ds.map(md),sub2:ds.map(wk),
    bars:IW_FL.map(f=>({name:f,color:COL[f],values:cum(f)})),
    lines:pl.has?[{name:'照計畫累計',color:TOK.c6,dash:1,values:plan,fmt:v=>fmt(v)}]:[],
    left:{title:'座數',fmt:v=>fmt(v)},minSlots:10};
}

/* ---------- 階段條（W19）：現在那一格反白；開盤前還沒進任何階段時，反白第一格（前置作業） ---------- */
function invPhaseBar(ref){
  const ps=iwPhases();if(!ps.length)return '';
  let now=ps.findIndex(p=>p.start<=ref.today&&ref.today<=p.end);
  if(now<0&&invMode()==='pre')now=0;
  const rng=p=>p.start===p.end?md(p.start):md(p.start)+'～'+md(p.end);
  return `<div class="phase" role="list" aria-label="本輪階段">${ps.map((p,i)=>`<span role="listitem" class="${i===now?'now':''}" title="${esc(mdy(p.start)+(p.end!==p.start?'～'+mdy(p.end):''))}">${esc(p.name)}<small>${esc(rng(p))}</small></span>`).join('')}</div>`;
}
/* 今晚（或第一晚）：meta.tonight＝預定盤點的貨架（含空架）、要先清的儲位（WES 異常數量／倉缺暫存）；D9：座數含空架，空架另計（詳細說明 #ref/inv） */
function invTonightInfo(){
  const t=invMeta().tonight;if(!t||!Array.isArray(t.racks)||!t.racks.length)return null;
  const rm=invRMap(),empty=t.racks.filter(r=>{const o=rm.get(r);return o&&o.state==='empty'}).length;
  const rows=t.rows&&Array.isArray(t.rows.rows)?t.rows.rows:[],used=t.racks.reduce((a,r)=>{const o=rm.get(r);return a+(o&&o.state!=='empty'?o.used:0)},0);
  return {date:t.date,isToday:!!t.isToday,racks:t.racks.length,empty,todo:+t.todo||0,clearBy:t.clearBy||'18:30',slots:+t.rowsTotal||rows.length,rows,used};
}
/* 準備度檢查（盤點前）：分類清單、盤點後資料每天有更新、2F／3F 的 WES 盤點紀錄 */
function invReadyItems(){
  const m=invMeta(),hl=m.health||{},cs=iwCls(),n=invCount('racks')||0,ix=invIdx(),sc=ix.c.slots,items=[];
  items.push([n>0&&cs['低'].n&&cs['中'].n&&cs['高'].n?'ok':'no',esc(`貨架分類清單 ${fmt(n)} 座（低銷 ${fmt(cs['低'].n)}、中銷 ${fmt(cs['中'].n)}、高銷 ${fmt(cs['高'].n)}、空架 ${fmt(cs['空架'].n)}）`)]);
  const monOk=!m.stale&&hl.complete!==false&&!(hl.warnings||[]).length;
  items.push([monOk?'ok':'no',esc(`盤點後的資料每天有更新${monOk?'':'：'+((hl.warnings||[])[0]||m.staleText||'資料不完整')}`)]);
  if(invDegraded())items.push(['wn','2F／3F 的 WES 盤點紀錄：資料太多先省略，儲位沒全列，這項無法判斷']);
  else if(sc.cntAt!=null){
    const per={'2':0,'3':0};invRows('slots').forEach(r=>{if(r[sc.cntAt]){const f=String(r[sc.pos])[0];per[f]=(per[f]||0)+1}});
    ['2','3'].forEach(f=>{items.push(per[f]>0?['ok',esc(`${f}F 已有 WES 盤點紀錄（${fmt(per[f])} 個儲位）`)]:['wn',esc(`${f}F 還沒有 WES 盤點紀錄：第一晚確認有寫入`)])});
  }else items.push(['wn','WES 盤點紀錄：還沒有資料']);
  return items;
}
const invChk=items=>{const sym={ok:'✓',wn:'!',no:'✗'};return `<div class="card chk" data-w1="ready">${items.map(([k,t])=>`<div><b class="${k}">${sym[k]||'☐'}</b>${t}</div>`).join('')}</div>`};
/* 關帳條件一行：盤點後出問題全部 0 筆，而且有貨儲位 100% 盤過 */
function invCloseCard(){

}
function pInvHome(arg){

/* ================= 第三看板：盤點：貨架（W1；W19 第 5 期改版）=================
   pInvRacks(arg)：網址 inv/racks[/<貨架或儲位>][?f=todo|done|added|missed|disc|tonight]（舊的 inv/racks/<分類>、inv/rack/<貨架> 都轉到這裡，見 router.js）。
   上：分類進度 6 欄；下：貨架清單 6 欄，點一列就地展開那座貨架的儲位格（格子圖例、儲位詳情、盤點後變動）；網址帶貨架（或儲位）就把那一列排第一個並展開。
   其他欄（分類、預計盤點日、盤點後新放進去、可能沒盤到、換了零件、帳差零件、預估工時）只在展開內容與匯出 Excel 裡。共用工具（invRO／iwCls／iwTot／invRef／invProgCfg…）在 inv_home.js。 */
INV_MOUNT['inv/racks']=['invProgR'];

const IW_RF=[['all','全部'],['todo','待盤'],['done','已盤'],['added','盤點後新放進去'],['missed','可能沒盤到'],['disc','盤點有差異'],['tonight','今晚要盤']];
const invTnSet=()=>new Set(((invMeta().tonight)||{}).racks||[]);
const IW_RFILT={all:()=>true,todo:o=>o.state==='todo',done:iwDone,added:o=>o.add>0,missed:o=>o.miss>0,disc:o=>o.disc>0};
const IW_RST={todo:0,doneMiss:1,done:2,empty:3};
const iwSigned=n=>(n>0?'+':'')+fmt(n);
const iwYmd=s=>/^\d{6}$/.test(String(s||''))?s.slice(2,4)+'/'+s.slice(4,6):'–';

/* 一座貨架的有貨儲位清單：[儲位, 件號, 品名, WES 現量, 有未清項目, 先查原因] */
function iwRackParts(rack){
  const ix=invIdx(),sc=ix.c.slots,pc=ix.c.parts;
  return (ix.rackSlots.get(rack)||[]).filter(r=>+r[sc.qty]>0).map(r=>{
    const pr=ix.part.get(keyOf(r[sc.part])),why=[];
    if(pr){const eff=+pr[pc.eff]||0;if(eff)why.push('帳差 '+iwSigned(eff)+' 個');else if(pc.star!=null&&+pr[pc.star])why.push('有暫存／封箱／在途');if(pc.grade!=null&&pr[pc.grade]==='A')why.push('優先查')}
    if(sc.abn!=null&&+r[sc.abn]>0)why.push('WES 異常數量 '+r[sc.abn]+' 個');if(sc.mis!=null&&+r[sc.mis]>0)why.push('WES 倉缺暫存 '+r[sc.mis]+' 個');
    return [String(r[sc.pos]),String(r[sc.part]),pr&&pc.name!=null?pr[pc.name]||'':'',+r[sc.qty]||0,pr&&pc.star!=null?+pr[pc.star]||0:0,why.join('、')];
  }).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
}
const iwDegNote=()=>invDegraded()?'<p class="note" style="margin:8px 0 0">資料太多先省略：只列出有資料的儲位，其他有貨的格沒列，這份清單可能不完整。</p>':'';
const iwPartsTable=rows=>`<div class="tw" style="max-height:340px"><table class="t"><thead><tr><th>儲位</th><th>件號</th><th>品名</th><th class="n">WES 現量（個）</th><th>有未清項目</th><th>先查原因</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${rkl(r[0])}</td><td>${tlk(r[1])}</td><td>${esc(r[2])}</td><td class="n">${fmt(r[3])}</td><td>${r[4]?'有':''}</td><td>${esc(r[5]||'–')}</td></tr>`).join('')||'<tr><td colspan="6">沒有有貨的格</td></tr>'}</tbody></table></div>${iwDegNote()}`;

/* ================= 分類進度（6 欄） ================= */
function iwClsRows(){
  const cs=iwCls(),T=iwTot(),pass=((invGet('rules')||{}).round||{}).diffRatePass||0.02,keys=['低','中','高','空架'].concat(cs['未分類'].n?['未分類']:[]);
  const rows=keys.map(k=>{const s=cs[k],plan=IW_CLS3.includes(k)&&s.plan!=null;
    return [k==='空架'||k==='未分類'?k:k+'銷',s.n,s.done,plan?s.lag:null,s.rd>0?s.disc/s.rd:null,IW_CLS3.includes(k)?s.eta:'–',pass]});
  rows.push(['合計',T.all,T.done,T.plan==null?null:T.lag,T.rd>0?T.discS/T.rd:null,'–',pass]);
  return rows;
}
function iwClsTable(){
  const rows=iwClsRows(),pass=rows[0][6];
  return dataTable('invCls',[{h:'分類',f:r=>`<b>${esc(r[0])}</b>`,sv:r=>r[0]},{h:'座數',n:1,f:r=>fmt(r[1]),sv:r=>r[1]},{h:'已盤（座）',n:1,f:r=>fmt(r[2]),sv:r=>r[2]},
    {h:'落後（座）',n:1,f:r=>r[3]==null?'–':r[3]>0?`<b class="r">${fmt(r[3])}</b>`:'0',sv:r=>r[3]==null?-1:r[3]},{h:'盤點差異率',n:1,f:r=>r[4]==null?'–':r[4]>pass?`<b class="r">${pct(r[4],1)}</b>`:pct(r[4],1),sv:r=>r[4]==null?-1:r[4]},
    {h:'預估完成日',f:r=>esc(r[5]),sv:r=>r[5]}],rows,{bare:1,limit:10});
}

/* ================= 貨架清單（6 欄；點一列展開） ================= */
const RK={open:new Set(),sel:{}};
function rkBody(rack){
  const o=invRMap().get(rack);if(!o)return `<div class="empty">貨架 ${esc(rack)} 不在盤點清單裡（可能是新建的貨架，或編號打錯）</div>`;
  const sel=RK.sel[rack]||'',ix=invIdx(),sc=ix.c.slots,slots=ix.rackSlots.get(rack)||[],grid=rackGrid(rack,sel);
  const posChg=o.posN&&o.posN!==o.slots,swapN=sc.rk!=null?slots.filter(r=>r[sc.rk]==='swap').length:o.swap;
  const stat=invStat([['分類',esc(o.cls)+(o.pd?`<span class="iw-lbl">（預計 ${esc(mdy(o.pd))}）</span>`:'')],['儲位（個）',o.slots,'',posChg?`今天 ${o.posN} 個（貨架結構變動）`:''],['有貨的儲位（個）',o.used],['本輪已盤的儲位（個）',o.rd,'',o.rd===0&&iwDone(o)?'盤點紀錄的件已不在這座貨架':''],['盤差的儲位（個）',o.disc,o.disc?'r':''],
    ['盤點後新放進去（個）',o.add,o.add?'w':''],['可能沒盤到（個）',o.miss,o.miss?'w':''],['盤點後換了零件（個）',swapN],['帳差的零件（種）',o.diffParts,o.diffParts?'w':''],['有未清項目的零件（種）',o.star],['預估工時（小時）',o.estH?fmt(o.estH,2):'–']]);
  const chg=iwRackChanges(o),showStar=o.state==='todo'||o.state==='empty',starRows=showStar?iwRackParts(rack).filter(r=>r[4]||r[5]):[];
  return stat+`<div class="card iw-rack">${slotLegend()}${grid.html}${invDegraded()?'<p class="note" style="margin:12px 0 0">資料太多先省略：沒列到的儲位畫成虛線「未列出」格，不代表空格或沒貨；貨架狀態與上面的數字以貨架彙總為準。</p>':''}</div>`+(sel?iwSlotCard(o,sel):'')
    +(chg.rows.length?`<h3 class="sh2">盤點後變動</h3>`+dataTable('invRkChg-'+rack,[{h:'儲位',f:r=>esc(r[0]),sv:r=>r[0]},{h:'類型',f:r=>r[1]==='moved'?'<span class="chip">盤點後有進出</span>':rkChip(r[1]),sv:r=>r[1]},
      {h:'零件',f:r=>(r[2]?tlk(r[2]):'–')+(r[3]?`<small class="iw-lbl" style="display:block;font-weight:400">${esc(r[3])}</small>`:''),sv:r=>r[2]},{h:'時間',f:r=>r[4]?esc(iwTm(r[4])):'–',sv:r=>r[4]},{h:'現量（個）',n:1,f:r=>fmt(r[5]),sv:r=>r[5]},{h:'說明',f:r=>esc(r[6]),sv:r=>r[6]}],chg.rows,{limit:10,bare:chg.rows.length<=8,name:'貨架 '+rack+' 盤點後變動'}):'')
    +(starRows.length?`<h3 class="sh2">盤點前要先查的零件</h3>`+iwPartsTable(starRows):'');
}
function rkInsert(tr,rack){
  const x=document.createElement('tr');x.className='xrow';x.dataset.rack=rack;
  x.innerHTML=`<td colspan="6"><div class="rkx">${rkBody(rack)}</div></td>`;
  tr.after(x);tr.setAttribute('aria-expanded','true');tr.classList.add('on');const b=tr.querySelector('.rk-b');if(b)b.setAttribute('aria-expanded','true');
  fitTables(x);iwSlotAsync(x);
}
function rkToggle(rack,tr){
  const nx=tr.nextElementSibling;
  if(nx&&nx.classList.contains('xrow')&&nx.dataset.rack===rack){nx.remove();RK.open.delete(rack);tr.setAttribute('aria-expanded','false');tr.classList.remove('on');const b=tr.querySelector('.rk-b');if(b)b.setAttribute('aria-expanded','false');return}
  RK.open.add(rack);rkInsert(tr,rack);
}
/* 表格重畫（排序、篩選、再顯示）後，把已展開的貨架補回去 */
function rkRestore(box){
  if(!box)return;
  box.querySelectorAll('tr[data-rack]').forEach(tr=>{if(RK.open.has(tr.dataset.rack)&&!(tr.nextElementSibling&&tr.nextElementSibling.classList.contains('xrow')))rkInsert(tr,tr.dataset.rack)});
}
INV_ACT.rk=(d,el)=>{const tr=el.closest('tr[data-rack]');if(tr)rkToggle(d.invRack,tr)};
/* 儲位格：在展開內容裡就地換選中的那一格；不在（例如別處的連結）就換頁 */
INV_ACT.slot=(d,el)=>{
  const bx=el.closest('.rkx'),xr=el.closest('tr.xrow');
  if(!bx||!xr){go('inv/racks/'+d.invSlot);return}
  const rack=xr.dataset.rack;RK.sel[rack]=RK.sel[rack]===d.invSlot?'':d.invSlot;
  bx.innerHTML=rkBody(rack);fitTables(bx);iwSlotAsync(bx);
  try{const p='inv/racks/'+(RK.sel[rack]||rack);PATH=p;history.replaceState(null,'',hashOf(p))}catch(e){}
};
function pInvRacks(arg){
  const a=invArg(arg).toUpperCase(),isSlot=INV_SLOT_RE.test(a),rid=isSlot?a.slice(0,9):INV_RACK_RE.test(a)?a:'',T=iwTot(),cc=invIdx().c.racks;
  const f0=QP.get('f')||'all';let f=IW_RF.some(x=>x[0]===f0)?f0:'all';
  const head=invPh('貨架',null,{ref:'inv',sum:invCount('racks')?`已盤 <b>${fmt(T.done)}</b>／${fmt(T.nonEmpty)} 座`:''});
  if(!invCount('racks'))return head+`<div class="card">${invNA('貨架資料')}</div>`;
  const tn=invTnSet(),filt=f==='tonight'?(o=>tn.has(o.rack)):IW_RFILT[f];
  let list=f==='done'?invRO().filter(IW_RFILT.done).sort((x,y)=>x.rAt1<y.rAt1?1:x.rAt1>y.rAt1?-1:0):iwOrder().filter(filt);
  if(rid&&!list.some(o=>o.rack===rid)){f='all';list=iwOrder()}
  if(rid){const hit=list.find(o=>o.rack===rid);if(hit)list=[hit].concat(list.filter(o=>o!==hit))}
  RK.open=new Set(rid&&invRMap().has(rid)?[rid]:[]);RK.sel=isSlot?{[rid]:a}:{};
  const seg=invSeg(IW_RF.map(x=>['inv/racks'+(x[0]==='all'?'':'?f='+x[0]),x[1]]),'inv/racks'+(f==='all'?'':'?f='+f));
  const X=(h,n,fn)=>({h,n,f:fn});
  const xcols=[X('分類',0,o=>esc(o.cls)),X('預計盤點日',0,o=>o.pd?esc(mdy(o.pd)):''),X('本輪盤點日',0,o=>o.rAt1?esc(mdy(o.rAt1.slice(0,10))):''),X('有貨的儲位（個）',1,o=>fmt(o.used)),X('盤點後新放進去（個）',1,o=>o.add?fmt(o.add):''),X('可能沒盤到（個）',1,o=>o.miss?fmt(o.miss):''),
    X('盤點後換了零件（個）',1,o=>o.swap?fmt(o.swap):''),X('帳差的零件（種）',1,o=>o.diffParts?fmt(o.diffParts):''),X('預估工時（小時）',1,o=>o.estH?fmt(o.estH,2):'')];
  const cols=[{h:'貨架',f:o=>`<button type="button" class="rk-b" data-inv-act="rk" data-inv-rack="${esc(o.rack)}" aria-expanded="${RK.open.has(o.rack)}">${esc(o.rack)}</button>`,sv:o=>o.rack},{h:'樓層',f:o=>esc(o.floor),sv:o=>o.floor},
    {h:'狀態',f:o=>stChip(o.state),sv:o=>IW_RST[o.state]==null?9:IW_RST[o.state]},{h:'已盤儲位／有貨儲位',n:1,f:o=>o.state==='empty'?'–':`${fmt(o.rd)}／${fmt(o.used)}`,sv:o=>o.rd},
    {h:'有差儲位（個）',n:1,f:o=>o.disc?fmt(o.disc):'',sv:o=>o.disc},{h:'有未清項目零件（種）',n:1,f:o=>o.star?fmt(o.star):'',sv:o=>o.star}];
  let h=head+sec('分類進度','','inv')+safe('分類進度',iwClsTable);
  if(invMode()!=='pre')h+=safe('每日累計已盤座數',()=>{const cfg=invProgCfg();return cfg?chartCard('invProgR',cfg):`<div class="card">${invNA('每日進度與計畫線')}</div>`});
  h+=sec('貨架清單',`${fmt(list.length)} 座・點一列展開儲位格`)+`<div class="tools">${seg}</div>`
    +safe('貨架清單',()=>dataTable('invRacks',cols,list,{limit:10,floorOf:o=>o.floor,url:true,name:'貨架清單',text:o=>o.rack+' '+o.cls+' '+o.floor,rowAttr:o=>`data-rack="${esc(o.rack)}" data-inv-act="rk" data-inv-rack="${esc(o.rack)}" aria-expanded="${RK.open.has(o.rack)}"`,xcols,after:rkRestore}));
  return h;
}
INV_AFTER['inv/racks']=arg=>{
  const box=document.getElementById('tb-invRacks');rkRestore(box);
  const rid=[...RK.open][0];if(rid&&box){const tr=box.querySelector(`tr[data-rack="${rid}"]`);if(tr)setTimeout(()=>tr.scrollIntoView({block:'start'}),40)}
  try{ivlProbeExport()}catch(e){}
};

/* 一格的判定說明 */
function iwWhy(k,r,o,sc){
  const g=n=>sc[n]==null?undefined:r[sc[n]],part=g('part'),rk=g('rkAt'),t=rk?iwTm(rk):'',cnt=g('cntQty'),d=g('disc'),n=+g('rndN')||0;
  let s;
  if(k==='add')s=`${o.rAt1?iwTm(o.rAt1)+' 這座貨架盤完後，':'盤完後，'}${t||'之後'} 才放入 ${part}（回推盤點當下這格沒有這個件號）→ 盤點後新放進去`;
  else if(k==='miss')s=`盤點當下回推這格應該就有 ${part}，但本輪沒有它的盤點紀錄 → 可能沒盤到，建議補盤（也可能盤了但紀錄沒寫進 WES）`;
  else if(k==='swap')s=`盤點後這格的零件換成 ${part}${g('prev')?'（原本是 '+g('prev')+'）':''}${t?'，'+t+' 起':''} → 盤點後換了零件`;
  else if(k==='disc')s=`盤點量 ${fmt(cnt)}、盤點前 ${fmt((+cnt||0)-(+d||0))}，盤差 ${iwSigned(+d||0)}${n>1?`；同晚複點 ${n-1} 次（取最後一筆）`:''} → 已盤有盤差`;
  else if(k==='ok')s=`盤點量與盤點前相同（${fmt(cnt)}）${n>1?`；同晚複點 ${n-1} 次`:''} → 已盤無差`;
  else if(k==='todo')s=`這格有貨（${fmt(g('qty'))}），本輪尚未盤點${iwDone(o)?'，但這座貨架其他儲位已盤':''}`;
  else s='空格（沒有貨）';
  const calc=g('calc');if(calc!=null&&calc!==0)s+=`；WES 自己對不上：WES 現量 ≠ 盤點量＋盤點後進出，相差 ${iwSigned(calc)} 個`;
  if(+g('abn')>0)s+=`；WES 異常數量 ${g('abn')} 個`;if(+g('mis')>0)s+=`；WES 倉缺暫存 ${g('mis')} 個`;
  return s;
}
function iwSlotCard(o,pos){
  const ix=invIdx(),sc=ix.c.slots,pc=ix.c.parts,rows=(ix.rackSlots.get(o.rack)||[]).filter(r=>String(r[sc.pos])===pos);
  if(!rows.length)return `<div class="card" style="margin-top:16px"><div class="card-h"><h3>儲位 ${esc(pos)}</h3><span>${INV_SK.empty[0]}</span></div><p class="note" style="margin:0">這格沒有任何資料（空格，也沒有盤點紀錄或暫存）。</p></div>`;
  return rows.map(r=>{
    const k=invSlotKind(r),g=n=>sc[n]==null?undefined:r[sc[n]],part=g('part'),pr=part?ix.part.get(keyOf(part)):null,d=g('disc'),rndN=+g('rndN')||0;
    const stats=[['現在放的零件',part?tlk(part)+(pr&&pc.name!=null&&pr[pc.name]?`<small class="iw-lbl" style="display:block;font-weight:400">${esc(pr[pc.name])}</small>`:''):'–'],['WES 現量（個）',fmt(g('qty'))],
      ['本輪盤點',+g('rd')?iwYmd(g('cntAt')):'尚未盤'],['盤點前→盤點量（個）',+g('rd')&&g('cntQty')!=null?`${fmt((+g('cntQty')||0)-(+d||0))} → ${fmt(g('cntQty'))}`:'–'],
      ['盤差（個）',+g('rd')&&d!=null?iwSigned(+d):'–',+d?'r':''],['複點次數',+g('rd')?String(Math.max(0,rndN-1))+' 次':'–']];
    const extra=[];if(g('calc')!=null&&g('calc')!==0)extra.push(['WES 自己對不上（個）',iwSigned(g('calc')),'w']);if(+g('abn')>0)extra.push(['WES 異常數量（個）',fmt(g('abn')),'w']);if(+g('mis')>0)extra.push(['WES 倉缺暫存（個）',fmt(g('mis')),'w']);if(g('bind'))extra.push(['指定零件',esc(g('bind'))]);
    return `<div class="card" style="margin-top:16px" data-slotcard="1"><div class="card-h"><h3>儲位 ${esc(pos)}</h3><span>${esc(INV_SK[k][0])}${INV_SK[k][1]?`（${INV_SK[k][1]}）`:''}　${rkChip(g('rk'))}</span></div>${invStat(stats.concat(extra))}
      <p class="note" style="margin:12px 0 0"><b>判定說明：</b>${esc(iwWhy(k,r,o,sc))}${part?`　${tlk(part,'零件履歷 ›')}`:''}</p>${part?`<div class="iw-slot-async" data-part="${esc(part)}" data-pos="${esc(pos)}" style="margin-top:12px"><span class="iw-lbl">載入這個零件的盤點紀錄與進出歷程…</span></div>`:''}</div>`;
  }).join('');
}
/* 儲位詳情的非同步補畫：從該件所在分片取本輪盤點紀錄（時間、盤點前、盤點量、盤差、盤點單）與這個儲位的進出歷程 */
function iwSlotAsync(root){(root||document).querySelectorAll('.iw-slot-async:not([data-done])').forEach(el=>{
  el.dataset.done='1';const part=el.dataset.part,pos=el.dataset.pos;
  invShard(part).then(res=>{
    if(!document.body.contains(el))return;
    const rec=res.recs.find(x=>keyOf(x[0])===keyOf(part));
    if(!rec){const e=res.errors[0];el.innerHTML=`<span class="iw-lbl">${e&&e.kind==='missing'?'這個零件的詳細資料（分片）還沒有發布，暫時看不到盤點時間與進出歷程。':'這個零件的詳細資料暫時讀不到'+(e?'：'+esc(e.msg):'（分片裡沒有這個件號）')+'。'}</span>`;return}
    const d=rec[1],p=(d.p||[]).find(x=>x[0]===pos),start=(invMeta().round||{}).start||'',cs=(d.c||[]).filter(x=>x[0]===pos).sort((a,b)=>a[1]<b[1]?-1:1);
    let h='';
    if(p)h+=`<p class="note" style="margin:0 0 8px">此件在這格的歷程：第一次紀錄 ${esc(String(p[1]).startsWith('≤')?'≤'+md(String(p[1]).slice(1,11)):iwTm(p[1]))}、最後 ${esc(iwTm(p[2]))}；進 ${fmt(p[3])} 次 ${fmt(p[4])} 個、出 ${fmt(p[5])} 次 ${fmt(p[6])} 個（全期間，非只有盤點後）。</p>`;

function iwRackChanges(o){
  const ix=invIdx(),sc=ix.c.slots,pc=ix.c.parts,KL={added:'盤點後新放進去',missed:'可能沒盤到',swap:'盤點後換了零件',moved:'盤點後有進出'};
  const rows=[];
  (ix.rackSlots.get(o.rack)||[]).forEach(r=>{
    const rk=sc.rk!=null?r[sc.rk]:'',st=sc.st!=null?r[sc.st]:'',calc=sc.calc!=null?r[sc.calc]:null;
    const kind=rk||(iwDone(o)&&st==='moved'?'moved':'');if(!kind)return;
    const part=r[sc.part],pr=part?ix.part.get(keyOf(part)):null;
    const desc=kind==='added'?'回推盤點當下這格沒有此件':kind==='missed'?'回推盤點當下應有貨，但沒有盤點紀錄':kind==='swap'?(r[sc.prev]?'原本是 '+r[sc.prev]:'零件換了'):(calc?`盤點後有進出，WES 對不上 ${iwSigned(calc)}`:'盤點後有進出，帳內一致');

  });

  rows.sort((a,b)=>rank[a[1]]-rank[b[1]]||(a[0]<b[0]?-1:1));

}
/* ================= 零件履歷（W2 起；W19：查零件裡「零件履歷 ›」就地展開）=================

/* ---------------- 輸入解析 ---------------- */
/* 回傳 {id 原輸入, k keyOf, rows 找到的零件列, row 唯一列, pick 有多個商品別要使用者選, full 完整件號（找不到時＝keyOf(輸入)）} */

function invPartTrailHtml(R,rec,l,rc){

/* ================= 第三看板：共用小工具與 Excel 匯出（W3；W19 第 5 期把舊的清單頁都拿掉了）=================
   這裡只剩：待辦節點用的日期／工作日工具（ivlToday、ivlWD、ivlDays、ivlFloorOf…）、盤點後問題的 Excel 匯出（inv_export.enc，按鈕在盤點首頁）。

/* ---------------- 小工具 ---------------- */
const ivlToday=()=>invMeta().today||isoDay(Date.now());

/* 工作日數：a 之後到 b（含 b），週日與假日不算（同 ageWD）；a 可帶「≤」 */
function ivlWD(a,b){
  a=String(a||'').replace('≤','').slice(0,10);b=String(b||'').slice(0,10);if(!a||b<=a)return 0;
  const hol=ivlHol();let n=0;
  for(let t=Date.parse(a+'T00:00:00Z')+864e5,e=Date.parse(b+'T00:00:00Z');t<=e;t+=864e5){const d=new Date(t);if(d.getUTCDay()===0||hol.has(d.toISOString().slice(0,10)))continue;n++}
  return n;
}
const ivlDays=(a,b)=>{a=String(a||'').replace('≤','').slice(0,10);b=String(b||'').slice(0,10);return a&&b>a?Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5):0};
const ivlWrap=(t,w)=>`<span class="wr">${esc(invEv(t))}</span>`;   /* W11：寬度由欄決定（table.js 的 fitTables／shell.html 的 .fx），w 保留只是為了舊呼叫不用改 */
/* 一個件號的資料列（parts）：回傳物件或 null */
function ivlPart(p){const ix=invIdx(),r=ix.part.get(keyOf(p));return r?invRec('parts',r):null}
const ivlFloorOf=(pos,p)=>{const r=p?ivlPart(p):null;if(r&&r.floor)return r.floor;const m=/^([23])-/.exec(String(pos||''));return m?m[1]+'F':''};

/* ---------------- 盤點後風險 Excel（inv_export.enc）---------------- */
const IVLX={state:'unknown',busy:false};   /* unknown｜ok（確定有檔）｜missing（尚未產生） */
const IVLX_LABEL='匯出 Excel：盤點後問題（每種問題一頁）';
/* 抓加密檔 → 解密（同一把金鑰；若內容是 gzip 再解壓）→ xlsx 位元組。失敗丟 Error，e.kind＝missing／net／http／decrypt／format */
async function ivlFetchDec(name){
  let r;try{r=await fetch(name,{cache:'no-cache'})}catch(e){throw invErr('net','讀取 '+name+' 失敗（網路不通）')}
  if(r.status===404)throw invErr('missing','找不到 '+name);
  if(!r.ok)throw invErr('http','讀取 '+name+' 失敗（HTTP '+r.status+'）');
  const buf=new Uint8Array(await r.arrayBuffer());
  if(buf.length<29)throw invErr('decrypt',name+' 太短，不是加密檔');
  let plain;try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},await invKey(),buf.slice(12)))}catch(e){throw invErr('decrypt',name+' 解密失敗')}
  if(plain[0]===0x1f&&plain[1]===0x8b){try{plain=new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}catch(e){throw invErr('decrypt',name+' 解壓縮失敗')}}
  if(!(plain[0]===0x50&&plain[1]===0x4b))throw invErr('format',name+' 不是 xlsx 檔');
  return plain;
}
/* 檔名時間：以盤點追查資料的整理時間為準（監控快照時間，台北時間 YYYYMMDD_HHMM）；沒有就用現在 */
function ivlStamp(){
  const m=invMeta(),mo=m.monitor||{};let t=parseT(mo.snapTime||mo.generatedAt||m.generatedAt);if(!isFinite(t))t=Date.now();
  const d=TP(t);return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'_'+p2(d.getUTCHours())+p2(d.getUTCMinutes());
}
function ivlXlsxBtn(){
  const b=document.getElementById('invXlsxBtn');if(!b)return;

async function ivlExport(){

  if(m.mode==='h3b')return {m,head:['暫存方式','筆數','數量（個）','最久建立日','HOPES 會通知 WES'],rows:m.kinds.map(k=>[k.name,fmt(k.records),fmt(k.qty),k.oldest?mdy(k.oldest)+'（'+fmt(k.oldAge)+' 天）':'–',k.notify?'會':'不會'])};
  const rows=Object.keys(m.kinds).filter(k=>IVT_TMP_KINDS.includes(k)||m.kinds[k]>0).map(k=>[k,fmt(m.kinds[k]),'','','']);

}

/* ---------------- 索引（每份 inv 資料只建一次）---------------- */
function fdIndex(){
  const c=iwCache();if(c.fd)return c.fd;
  const ix={loop:new Map(),iss:new Map(),diff:new Map(),hopes:null,hopesIss:new Map()};
  const push=(m,k,o)=>{if(!k)return;let a=m.get(k);if(!a)m.set(k,a=[]);a.push(o)};
  const lr=invCols('loopRows');
  if(lr.n!=null)invRows('loopRows').forEach(r=>{
    const n=r[lr.n];if(n===0||n===1||n===4||n===9)return;
    push(ix.loop,keyOf(r[lr.part]),{n,part:r[lr.part]||'',pos:r[lr.pos]||'',at:r[lr.at]||'',ev:r[lr.ev]||'',bl:lr.bl!=null?+r[lr.bl]||0:0,q:lr.qty!=null&&r[lr.qty]!=null?+r[lr.qty]:null,
      k1:lr.k1!=null?r[lr.k1]:null,k2:lr.k2!=null?r[lr.k2]:null,k3:lr.k3!=null?r[lr.k3]:null});
  });
  const ic=invCols('issues');
  if(ic.stage!=null)invRows('issues').forEach(r=>{
    const st=r[ic.stage];if(st!=='abncase'&&st!=='mistemp'&&st!=='hopestmp'&&st!=='putdiff')return;
    push(ix.iss,keyOf(r[ic.part]),{stage:st,part:r[ic.part]||'',ref:String(r[ic.ref]==null?'':r[ic.ref]),qty:+r[ic.qty]||0,since:r[ic.since]||'',age:ic.ageWD!=null?r[ic.ageWD]:null,note:String(r[ic.note]||'')});
  });
  const dc=invCols('diffs');
  if(dc.part!=null)invRows('diffs').forEach(r=>ix.diff.set(keyOf(r[dc.part]),invRec('diffs',r)));
  /* HOPES 倉缺暫存：meta.hopesTmp.rows（件號×暫存方式，各自的數量）；舊資料沒有就退回 issues 的 hopestmp（只知道種類、數量是合計） */
  const h=invMeta().hopesTmp,hr=h&&(h.rowsAll||h.rows);   /* rowsAll＝不限建立日（10/15 起）；舊資料只有 3/1 起的 rows */
  if(hr&&Array.isArray(hr.rows)){
    const hc=Object.fromEntries((hr.columns||[]).map((n,i)=>[n,i]));
    ix.hopes=new Map();ix.hopesOther=new Map();
    hr.rows.forEach(r=>{
      const k=keyOf(r[hc.part]);if(!k)return;
      const kind=String(r[hc.kind]||''),q=+r[hc.qty]||0,at=String(r[hc.since]||'').slice(0,10);
      if(q<=0)return;
      if(kind==='mis_mobile'||kind==='mis_510'){
        let e=ix.hopes.get(k);if(!e)ix.hopes.set(k,e={mobile:0,m510:0,at:''});
        if(kind==='mis_mobile')e.mobile+=q;else e.m510+=q;
        if(at&&(!e.at||at<e.at))e.at=at;
      }else{
        let a=ix.hopesOther.get(k);if(!a)ix.hopesOther.set(k,a=[]);
        const o=a.find(x=>x.kind===kind);if(o){o.q+=q;if(at&&at<o.at)o.at=at}else a.push({kind,q,at});
      }
    });
  }
  return c.fd=ix;
}
/* 件號 k（含商品別）的紀錄；資料端有些來源（異常案件）沒填商品別，只有 bare：bare 不是任何已知完整件號時一併算進來 */
function fdGet(map,k,bare){
  let a=map.get(k)||[];
  if(bare&&bare!==k&&!invIdx().part.has(bare))a=a.concat(map.get(bare)||[]);
  return a;
}

function fdPartInfo(row){
  const ix=invIdx(),c=ix.c.parts,key=keyOf(row[c.part]),bare=key.slice(1),sl=ix.partSlots.get(key)||[],qi=ix.c.slots.qty;
  return {row,part:String(row[c.part]),key,bare,frcd:key.charAt(0),name:c.name!=null?String(row[c.name]||''):'',floor:c.floor!=null?row[c.floor]:'',
    eff:c.eff!=null?+row[c.eff]||0:0,wes:qi!=null?sl.reduce((a,r)=>a+(+r[qi]||0),0):null};
}
/* 輸入 → {kind:'one'|'many'|'none'|'empty', rows} ；完整件號（含商品別）優先；只有一筆符合就直接用（byBare＝輸入沒有商品別） */
function fdResolve(input){
  const k=keyOf(input);if(!k)return {kind:'empty',rows:[]};
  const ix=invIdx();
  if(ix.part.has(k))return {kind:'one',rows:[ix.part.get(k)],byBare:false};
  const rs=ix.bare.get(k)||[];
  if(rs.length===1)return {kind:'one',rows:rs,byBare:true};
  if(rs.length>1)return {kind:'many',rows:rs};
  return {kind:'none',rows:[]};
}
/* 這個件號目前有幾筆還沒清的紀錄（選商品別時給使用者參考） */
function fdOpenCount(P){
  const ix=fdIndex();
  return fdGet(ix.loop,P.key,P.bare).length+fdGet(ix.iss,P.key,P.bare).filter(r=>r.stage==='abncase').length+(P.eff?1:0);
}

/* ---------------- 比對（核心）----------------
   回傳排序好的候選；每個候選：{ord,key,name,means,R 紀錄量（null＝不明）,N 動作數量,qc 數量符合度（0 剛好／1 紀錄比手上多／2 手上比紀錄多）,pc 找到的地方（0 優先／1）,at,atMs,action,hopes,ev:[[標籤,HTML]],notes:[],own:[節點],clears:[…]} */
function fdSub(recs,H){const one=recs.find(r=>r.q===H);return one?[one]:recs}
function fdCands(P,H,place){
  const ix=fdIndex(),k=P.key,b=P.bare,L=n=>fdGet(ix.loop,k,b).filter(r=>r.n===n),I=st=>fdGet(ix.iss,k,b).filter(r=>r.stage===st);
  const dRow=ix.diff.get(k)||null,out=[],pref=FD_PREF[place]||[];
  const add=o=>{
    const def=FD_RULES[o.ord];Object.assign(o,{key:def.key,name:o.name2||def.name,means:def.means});
    o.R=o.R==null||isNaN(o.R)?null:o.R;
    o.N=o.R==null?H:Math.min(H,o.R);
    o.qc=o.R==null?1:H===o.R?0:H<o.R?(o.partOk?0:1):2;   /* partOk：HOPES 倉缺暫存釋回本來就會分次，手上比暫存少也算符合（使用者 10/15） */
    o.pc=pref.includes(o.ord)?0:1;
    o.atMs=parseT(String(o.at||'').slice(0,19));if(!isFinite(o.atMs))o.atMs=-Infinity;
    o.action=o.act?o.act(o.N):'';o.notes=o.notes||[];o.ev=o.ev||[];
    out.push(o);
  };
  /* 1 補上架還沒補（loopRows n=10：台車 k2、批次 k3、原因 k1） */
  L(10).forEach(r=>{
    const pq=ivtPutQty(r.ev),q=fdQ10(r);if(q!=null&&q<=0)return;
    const tag=[r.k2?'台車 '+r.k2:'',r.k3?'批次 '+r.k3:''].filter(Boolean).join('、');
    add({ord:1,R:q,at:r.at,own:[40],dpos:true,up:true,
      act:N=>`WES 補上架 ${fmt(N)} 個`+(tag?`（${tag}）`:''),
      ev:[['取消時間',esc(fdD(r.at))],['台車',esc(r.k2||'–')],['儲位',fdSlotL(r.pos)],['批次',esc(r.k3||'–')],['數量',pq?`這格應上 ${fmt(pq[0])}、實上 ${fmt(pq[1])}，還沒補 ${fmt(q)} 個`:(q!=null?`還沒補 ${fmt(q)} 個`:'–')],['原因',esc(ivtPutReason(r.k1))]]});
  });
  /* 1.5 這台車已開始上架，這個零件還沒上（W18）：991 未上架追蹤有這個件號（台車＋開箱日），而且同一台車、開箱日之後 WES 有其他零件的上架紀錄（inv.enc meta.cartPut）；
     這個零件的已上架量 < 應上架量才算。這一筆如果就是「補上架」那一格（同台車有補上架）只列補上架。整台車都還沒開始上架的（正常的未上架）不列，只在格子 */
  try{
    const put10=new Set(L(10).map(r=>String(r.k2||'').trim()).filter(Boolean));
    (ktCarts({frcd:P.frcd,bare:P.bare,keys:[k]})||[]).filter(e=>e.started&&keyOf(e.part)===k&&e.need-e.put>0&&!put10.has(e.cart)).forEach(e=>{
      const R=e.need-e.put;
      add({ord:1.5,R,at:e.open,own:[],cartRow:e,act:N=>`放回台車 ${e.cart}，WES 上架 ${fmt(N)} 個`,
        ev:[['台車',pl(e.cart)],['開箱日',esc(mdy(e.open))],['這台車已上架的零件數',`${fmt(e.parts)} 種（開箱日之後 WES 有上架紀錄；最後一筆 ${esc(fdD(e.last))}）`],['這個零件',`應上架 ${fmt(e.need)} 個、已上架 ${fmt(e.put)} 個，還沒上 ${fmt(R)} 個`]],
        notes:['台車已經開始上架，這個零件卻沒有上完：可能是零件異常、也可能漏上。']});
    });
  }catch(e){console.error(e)}
  /* 2 補揀的貨卡在 WES 揀貨暫存區（loopRows n=6；數量＝補揀拿下 − 分播出） */
  L(6).forEach(r=>{
    const q=fdQ6(r);if(q!=null&&q<=0)return;
    add({ord:2,R:q,at:r.at,own:[11],dpos:true,act:N=>`WES 分播出貨 ${fmt(N)} 個`,
      ev:[['補揀時間',esc(fdD(r.at))],['儲位',fdSlotL(r.pos)],['數量',esc(invEv(r.ev))]]});
  });
  /* 3 WES 異常儲位還沒處理（loopRows n=3：每格一列，數量＝異常數量）；有一格剛好等於手上數量就只指那一格，否則全部格 */
  const l3=L(3).map(r=>Object.assign({},r,{q:fdQ3(r)})).filter(r=>r.q==null||r.q>0);
  if(l3.length){
    const sel=fdSub(l3,H),R=sel.every(r=>r.q!=null)?sel.reduce((a,r)=>a+r.q,0):null,at=sel.map(r=>r.at).sort().pop();
    add({ord:3,R,at,own:[6],act:()=>`補出給那張出貨單，或放回原儲位 ${fdSlotsTxt(sel)}，再清 WES 異常數量`,
      ev:sel.slice(0,6).map(r=>['異常儲位',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜異常數量 ${r.q==null?'–':fmt(r.q)} 個`]).concat(sel.length>6?[['',`還有 ${sel.length-6} 格`]]:[]),
      notes:l3.length>sel.length?[`這個件號共有 ${l3.length} 格異常儲位；其中一格的異常數量剛好等於手上數量，先看那一格。`]:[]});
  }
  /* 4 WES 異常區還有貨（loopRows n=5：儲位＝異常揀貨的來源貨架，k1＝T2 回推筆數） */
  const l5=L(5);
  if(l5.length){
    const sel=fdSub(l5.map(r=>Object.assign({},r)),H),R=sel.every(r=>r.q!=null)?sel.reduce((a,r)=>a+r.q,0):null,at=sel.map(r=>r.at).sort().pop(),src=sel.filter(r=>r.pos);
    add({ord:4,R,at,own:[9],act:()=>src.length?`放回原貨架 ${fdSlotsTxt(src)}`:'放回原貨架（找不到異常揀貨紀錄，來源儲位不明）',
      ev:sel.slice(0,6).map(r=>['異常區',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜${r.q==null?'':fmt(r.q)+' 個｜'}${esc(invEv(r.ev))}`]),
      notes:src.length?[]:['找不到異常揀貨紀錄：實物在就放回貨架，找不到來源貨架時先問 WES 的人。']});
  }
  /* 5 已認列倉缺，而且做了 HOPES 倉缺暫存：WES 倉缺暫存（issues.mistemp）和 HOPES 倉缺暫存（手機揀貨回報＋2F510 人工建立）兩邊都有量 */
  const mis=I('mistemp'),W=mis.reduce((a,r)=>a+r.qty,0);
  let Hq=0,hAt='',hTxt='';
  if(ix.hopes){const e=ix.hopes.get(k);if(e){Hq=e.mobile+e.m510;hAt=e.at;hTxt=`手機揀貨回報 ${fmt(e.mobile)}、2F510 人工建立 ${fmt(e.m510)}`}}
  else{const hs=I('hopestmp').filter(r=>/倉缺/.test(r.ref));Hq=hs.reduce((a,r)=>a+r.qty,0);hAt=hs.map(r=>r.since).sort()[0]||'';hTxt='舊資料，數量含同件號其他暫存方式'}
  if(W>0&&Hq>0){
    const R=Math.min(W,Hq),at=mis.map(r=>r.since).filter(Boolean).sort().pop()||hAt;
    add({ord:5,R,at,own:[],partOk:true,act:N=>`WES 開新上架單 ${fmt(N)} 個；HOPES 倉缺暫存釋回 ${fmt(N)} 個`,
      ev:[['WES 倉缺暫存',`${fmt(W)} 個｜${mis.slice(0,3).map(r=>fdSlotL(r.ref)).join('、')}${mis.length>3?` 等 ${mis.length} 格`:''}｜${esc(fdD(at))}`],['HOPES 倉缺暫存',`${fmt(Hq)} 個（${esc(hTxt)}）｜${esc(fdD(hAt))}`]],
      notes:['HOPES 倉缺暫存釋回可以分次：手上有幾個就先釋回幾個。',
        '原本倉缺暫存的貨補回後，HOPES 可能重新拋單；如果這些貨就是要出給那張單的，要通知 HOPES。',
        `盤點期間（${fdRoundTxt()}）改成：放回原儲位，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）。`].concat(W!==Hq?[`兩邊倉缺數量不同（WES ${fmt(W)}、HOPES ${fmt(Hq)}），入帳量以較小的為準。`]:[])});
  }
  /* 5.7 只有 HOPES 有倉缺暫存（WES 沒有倉缺暫存）：HOPES 倉缺暫存釋回，可以分次（使用者 10/15） */
  if(Hq>0&&W===0){
    add({ord:5.7,R:Hq,at:hAt,own:[],partOk:true,act:N=>`HOPES 倉缺暫存釋回 ${fmt(N)} 個`,
      ev:[['HOPES 倉缺暫存',`${fmt(Hq)} 個（${esc(hTxt)}）｜${esc(fdD(hAt))}`],['WES 倉缺暫存','沒有']],
      notes:['釋回可以分次：手上有幾個就先釋回幾個。',`盤點期間（${fdRoundTxt()}）改成：放回原儲位，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）。`]});
  }
  /* 5.8 HOPES 其他暫存（未結、借料、滯銷、破損）還沒結：撿到的就可以釋回，可以分次（使用者 10/15） */
  const FD_TMPN={unclosed:'未結暫存',borrow:'借料暫存',slow:'滯銷暫存',damage:'破損暫存'};
  (ix.hopesOther&&ix.hopesOther.get(k)||[]).forEach(t=>{
    const nm=FD_TMPN[t.kind]||'暫存';
    add({ord:5.8,R:t.q,at:t.at,own:[],partOk:true,act:N=>`HOPES ${nm}釋回 ${fmt(N)} 個`,name2:`HOPES 有${nm}還沒結`,
      ev:[[`HOPES ${nm}`,`${fmt(t.q)} 個｜最早 ${esc(fdD(t.at))}`]],
      notes:['釋回可以分次：手上有幾個就先釋回幾個。']});
  });
  /* 5.5 WES 已認列倉缺，HOPES 還沒做倉缺暫存（WES 倉缺暫存比 HOPES 倉缺暫存多的部分）：使用者 10/15＝開新上架單 */
  if(W>Hq){
    const R=W-Hq,at=mis.map(r=>r.since).filter(Boolean).sort().pop()||'';
    add({ord:5.5,R,at,own:[],act:N=>`WES 開新上架單 ${fmt(N)} 個`,
      ev:[['WES 倉缺暫存',`${fmt(W)} 個｜${mis.slice(0,3).map(r=>fdSlotL(r.ref)).join('、')}${mis.length>3?` 等 ${mis.length} 格`:''}｜${esc(fdD(at))}`],['HOPES 倉缺暫存',Hq?`${fmt(Hq)} 個（${esc(hTxt)}）`:'沒有']],
      notes:[`盤點期間（${fdRoundTxt()}）改成：放回原儲位，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）。`]});
  }
  /* 6 盤點期間這格盤少（slots：本輪有盤點 rd＝1，盤差 disc < 0） */
  if(invMode()!=='pre'){
    const sc=invIdx().c.slots,g=(r,n)=>sc[n]==null?undefined:r[sc[n]];
    const l6=(invIdx().partSlots.get(k)||[]).filter(r=>+g(r,'rd')===1&&g(r,'disc')!=null&&+g(r,'disc')<0).map(r=>({pos:String(g(r,'pos')),q:-(+g(r,'disc')),at:g(r,'cntAt')||'',cnt:g(r,'cntQty')}));
    if(l6.length){
      const sel=fdSub(l6,H),R=sel.reduce((a,r)=>a+r.q,0),at=sel.map(r=>fdIso(r.at)).sort().pop();
      add({ord:6,R,at,own:[],act:()=>`放回原儲位 ${fdSlotsTxt(sel)}，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）；不要開上架單`,
        ev:sel.slice(0,6).map(r=>['盤少的儲位',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜盤差 −${fmt(r.q)} 個${r.cnt==null?'':'（盤點量 '+fmt(r.cnt)+'）'}`]),
        notes:[`不要開新上架單：上架單不回報 HOPES，HOPES 永遠不會加這 ${fmt(Math.min(H,R))} 個。`]});
    }
  }
  /* 7.5 1–6（含 1.5、5.5、5.7、5.8）都沒有，但有未清帳差且 HOPES > WES（parts.eff＝已扣掉盤點調帳的帳差）。異常案件不是候選（使用者 10/15：本來就該先移出，只在格子） */
  if(!out.length&&P.eff>0){
    const why=dRow?ivtWhy(dRow.causeCode,dRow.lastReason):'';
    add({ord:7.5,R:P.eff,at:dRow?String(dRow.first||'').replace(/^≤/,''):'',own:[1],dpos:true,up:true,
      act:N=>`WES 開單上架 ${fmt(N)} 個`,
      ev:[['帳差（HOPES−WES）',`${fdSgn(P.eff)} 個`],['第一次出現日',dRow?esc(mdy(String(dRow.first||'').replace(/^≤/,'').slice(0,10))):'–']].concat(why?[['帳差原因',esc(why)]]:[]),
      notes:['HOPES 已經多了，不用再動。']});
  }
  /* 8 沒有對應的紀錄（沒有 1–6，也沒有正向帳差；帳差方向相反也走這裡）：動作留空 */
  if(!out.length){
    add({ord:8,R:null,at:'',own:[],act:()=>'',
      ev:P.eff<0?[['帳差（HOPES−WES）',`${fdSgn(P.eff)} 個（WES 比 HOPES 多，方向相反）`]]:[]});
    out[0].qc=0;
  }
  out.sort((a,c)=>a.qc-c.qc||a.pc-c.pc||c.atMs-a.atMs||a.ord-c.ord);
  out.forEach(o=>{o.clears=fdClears(P,o,H,dRow,L,I)});
  return out;
}
/* 做完之後會一起消失的待辦：帳差（HOPES−WES；補上架、補揀、WES 少帳這類會讓 WES 變多／出貨的動作，帳差 > 0 才算方向相符；其他動作看資料端判定的 diffs.toNode）、WES 上架 < HOPES 入帳（迴路 7、putdiff） */
function fdClears(P,c,H,dRow,L,I){
  const out=[];
  if(P.eff!==0&&(P.eff>0&&c.dpos||(dRow&&dRow.toNode&&(c.own||[]).includes(+dRow.toNode))))
    out.push({id:1,kind:'diff',html:`HOPES 庫存 ≠ WES 庫存：還沒清的帳差 <b>${fdSgn(P.eff)}</b> 個（HOPES−WES）`});
  if(c.cartRow)out.push({id:0,kind:'open',html:`未上架（991 追蹤）：台車 ${esc(c.cartRow.cart)} 的這個件號（應上架 ${fmt(c.cartRow.need)}、已上架 ${fmt(c.cartRow.put)}）`});
  if(c.up){
    L(7).forEach(r=>{
      const m=/HOPES 入帳 (\d+) > WES 上架 (\d+)/.exec(r.ev||'');
      out.push({id:3,kind:'l7',html:`WES 上架數量 < HOPES 入帳數量：${m?`WES 上架 ${m[2]} &lt; HOPES 入帳 ${m[1]}`:esc(invEv(r.ev))}（${esc(fdD(r.at))}）`});
    });
    I('putdiff').forEach(r=>out.push({id:0,kind:'putdiff',html:`HOPES 上架數 ≠ WES 上架數：台車 ${esc(r.ref)}，${esc(r.note.replace(/^上架數量不一致：/,''))}（${esc(fdD(r.since))}）`}));
  }
  return out;
}
function fdRoundTxt(){const r=invMeta().round||{};return r.start&&r.end?`${mdy(r.start)}～${mdy(r.end)}`:'11/03～12/04'}

/* ---------------- 畫面（W19：查零件一頁）---------------- */
/* 數量符合度的短標籤（≤ 12 字） */
function fdQcChip(c,H){
  if(c.ord===8)return '';
  if(c.R==null)return `<span class="chip">紀錄沒有數量</span>`;
  if(c.qc===0&&H<c.R)return `<span class="chip ok">可分次釋回 ${fmt(H)}≤${fmt(c.R)}</span>`;
  if(c.qc===0)return `<span class="chip ok">數量相符 ${fmt(H)}＝${fmt(c.R)}</span>`;
  if(c.qc===1)return `<span class="chip w">只找到一部分 ${fmt(H)}＜${fmt(c.R)}</span>`;
  return `<span class="chip w">手上比紀錄多 ${fmt(H)}＞${fmt(c.R)}</span>`;
}
/* 候選卡：收合時看得到標籤、名稱、動作；第一張（最可能）預設展開；展開內容＝代表什麼、證據、提醒、做完會一起消失 */
function fdCard(c,i,H,place){
  const top=i===0,pl=(FD_PLACES.find(x=>x[0]===place)||[])[1];
  const chips=`<span class="chip ${top?'r':''} fd-top">${top?'最可能':'其他可能'}</span>${fdQcChip(c,H)}${c.pc===0&&pl?`<span class="chip ok">地點相符：${esc(pl)}</span>`:''}`;
  const rows=[['代表什麼',esc(c.means)]].concat(c.ev.map(([l,v])=>[esc(l),v]));
  if(c.R!=null&&H>c.R)rows.push(['提醒',`手上比紀錄多 ${fmt(H-c.R)} 個：多的部分這張卡找不到對應紀錄，先確認件號和來源。`]);
  if(c.R!=null&&H<c.R&&c.qc!==0)rows.push(['提醒',`手上只有 ${fmt(H)} 個，先處理 ${fmt(H)} 個；紀錄還剩 ${fmt(c.R-H)} 個沒找到。`]);
  c.notes.forEach(t=>rows.push(['提醒',esc(t)]));
  if(c.ord!==8)rows.push(['做完會一起消失',c.clears.length?c.clears.map(x=>`<span data-fd-clear="${x.kind}">${x.html}</span>`).join('<br>')+(c.R!=null&&H<c.R?'<br><span class="muted">手上比紀錄少，補完手上這些之後，上面的待辦還會剩一部分。</span>':''):'沒有其他待辦會跟著消失，只有這一筆。']);
  return `<details class="cand${top?' top':''}" data-fd-card="${c.key}" data-fd-ord="${c.ord}" data-fd-rank="${i}"${top?' open':''}><summary><div>${chips}<div class="cn">${esc(c.name)}</div>${c.action?`<div class="ca" data-fd="action">${esc(c.action)}</div>`:''}</div></summary><div class="bd"><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></details>`;
}
/* 零件一行：商品別、件號、品名、樓層、「零件履歷 ›」（點開就地展開；展開時才載入分片，見 inv_part.js 的 histFill） */
function fdPartLine(P,open){

function pFind(arg){
  const segs=String(arg||'').split('/').filter(Boolean);
  const input=invArg(segs[0]||''),qraw=invArg(segs[1]||''),place=FD_PLACES.some(x=>x[0]&&x[0]===QP.get('at'))?QP.get('at'):'';
  const tip=`<p class="muted">只填件號＝看這個零件的所有數字。撿到東西時再填手上數量，會列出最可能的狀況和要做的動作。</p>`;
  if(!input&&!qraw)return fdHead()+fdForm('','',place)+tip;
  if(!input)return fdHead()+fdForm('',qraw,place,'請輸入件號或台車號。')+tip;
  const H=qraw?fdQty(qraw):null;
  if(qraw&&H==null)return fdHead()+fdForm(input,qraw,place,'手上數量請輸入 1 以上的整數，或不填。')+tip;
  const form=fdForm(input,H==null?'':String(H),place);
  const cart=((D.inbound&&D.inbound.carts)||[]).find(c=>c.cart===keyOf(input));
  if(cart)return fdCartView(cart,form);
  const res=fdResolve(input),qs=H==null?'':'/'+H;
  if(res.kind==='none'){
    const k=keyOf(input),ix=invIdx(),pc=ix.c.parts,sug=[];
    if(k.length>=4)for(const [key,r] of ix.part){if(key.includes(k)){sug.push(r);if(sug.length>=8)break}}
    return fdHead()+form+`<div class="card" data-fd="notfound"><h3>查不到這個件號</h3><p>資料裡沒有「${esc(input)}」（只有 2F／3F 的零件和台車）。請確認件號有沒有打錯；商品別可以不輸入。</p>`
      +(sug.length?`<p class="muted">件號裡有包含這串字的：</p><div class="fd-opts">${sug.map(r=>`<a class="fd-opt" href="${esc(hashOf(withQ('find/'+encodeURIComponent(r[pc.part])+qs,{at:place})))}"><b>${esc(r[pc.part])}</b><span>${esc(pc.name!=null?r[pc.name]||'':'')}</span></a>`).join('')}</div>`:'')+'</div>';
  }
  if(res.kind==='many'){
    const items=res.rows.map(fdPartInfo).sort((a,b)=>a.frcd<b.frcd?-1:1);
    return fdHead()+form+`<div class="card" data-fd="pick"><h3>這個件號有 ${items.length} 個商品別，請點選要查的零件</h3>`
     +`<div class="fd-opts">${items.map(P=>`<a class="fd-opt" data-fd-opt="${esc(P.frcd)}" href="${esc(hashOf(withQ('find/'+encodeURIComponent(P.part)+qs,{at:place})))}"><span class="chip blue">商品別 ${esc(P.frcd)}</span><b>${esc(P.part)}</b><span>${esc(P.name||'（沒有品名）')}</span><small>${esc(P.floor||'–')}｜WES 現量 ${P.wes==null?'–':fmt(P.wes)} 個｜未清紀錄 ${fmt(fdOpenCount(P))} 筆</small></a>`).join('')}</div></div>`;
  }
  const P=fdPartInfo(res.rows[0]),sel={frcd:P.frcd,bare:P.bare,keys:[P.key]};
  let h=fdHead()+form+fdPartLine(P,QP.get('open')==='hist');
  if(H!=null){
    const cs=fdCands(P,H,place);
    h+=sec(`手上 ${fmt(H)} 個，${cs[0].ord===8?'這個件號沒有對應的紀錄':`可能是 ${cs.length} 種狀況`}`,'',cs[0].ord===8?'':'findrule')+cs.map((c,i)=>fdCard(c,i,H,place)).join('');
  }

  return h;
}
