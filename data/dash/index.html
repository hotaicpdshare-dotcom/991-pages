      K.xtable('#cl',{empty:'目前沒有預定要盤的貨架',head:[['儲位']],rows:[]});return}
    const rows=TN.rows.filter(r=>(st.fl==='all'||r[1][0]===st.fl[0])&&(!st.q||r[1].startsWith(st.q.slice(0,9))||String(r[2]).toUpperCase().includes(st.q)));
    document.getElementById('clH').textContent=`${nmTn} ${md(TN.date)} 要先清的儲位`;
    document.getElementById('clB').textContent=`${TN.clearBy} 前要清 · WES 異常數量或倉缺暫存`+(live?` · 今晚預定 ${fmt(TNSET.size)} 座（含空架 ${fmt(TN.empty)} 座）`:'');
    K.xtable('#cl',{limit:8,empty:`目前 0 個儲位要先清`,head:[['儲位'],['件號','','m-hide'],['WES 異常數量','pcs'],['WES 倉缺暫存','pcs']],
      rows:rows.map(r=>({c:[`${tag(r[1][0]+'F')} <button class="dn-l mono" data-rk="${esc(r[0])}">${esc(r[1])}</button>`,r[2]?`<span class="mono">${esc(r[2])}</span>`:'<span class="na">—</span>',r[3]?fmt(r[3]):'<span class="na">—</span>',r[4]?fmt(r[4]):'<span class="na">—</span>']})),
      after:el=>el.querySelectorAll('[data-rk]').forEach(b=>b.onclick=e=>{e.stopPropagation();qi.value=b.dataset.rk;
        if(live)S.set({q:b.dataset.rk,st:'all',open:S.get('open'),rk:b.dataset.rk});else S.set({q:b.dataset.rk,st:'all',open:b.dataset.rk});toRk()})});
  });

  /* ⑤ 分類進度＋累計圖 */
  S.on(st=>{
    const f=st.fl;
    const rows=['低','中','高','空架'].map(k=>{const c=D.cls[k],n=f==='all'?c.n:f==='2F'?c.n2:c.n3,dn=f==='all'?c.done:f==='2F'?c.d2:c.d3;
      return {cls:(st.cls===k?'sel':'')+(st.cls!=='all'&&st.cls!==k?' dim':''),c:[`<button class="dn-l" data-cl="${k}">${clsName(k)}</button>`,fmt(n),fmt(dn),k==='空架'?'<span class="na">—</span>':fmt(c.lag),c.rd?fmt(c.disc/c.rd*100,1)+'%':'<span class="na">—</span>',c.eta&&c.eta!=='–'?c.eta:'<span class="na">—</span>']}});
    const tot=f==='all'?D.T.all:D.racks.filter(r=>r.floor===f).length;
    rows.push({cls:'tot',c:['合計',fmt(tot),fmt(f==='all'?D.T.done:f==='2F'?D.T.d2:D.T.d3),fmt(D.T.lag),'<span class="na">—</span>','']});
    K.xtable('#cls',{head:[['分類'],['座數','座'],['已盤','座'],['落後','座'],['盤點差異率','%'],['預估完成日']],rows,
      after:el=>el.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>S.set('cls',st.cls===b.dataset.cl?'all':b.dataset.cl))});
    const P=D.prog;
    if(!P||P.ds.length<2){document.getElementById('pg').innerHTML='<div class="empty">還沒有每日進度與計畫線</div>';return}
    const act=P.act.map(v=>v||0),li=(()=>{let i=-1;P.act.forEach((v,j)=>{if(v!=null)i=j});return i})();
    K.barLine('#pg',{cats:P.ds.map(md),sub:P.ds.map(wk),stacks:[{vals:act,color:K.C.act}].concat(P.plan?[{vals:P.plan.map((p,i)=>Math.max(0,p-act[i])),color:'#e4e8ed'}]:[]),line:null,yUnit:'座',h:240,topLabel:true,head:1.2,sel:live&&li>=0?li:undefined,
      tip:i=>K.tip.card(`${ymd(P.ds[i])}（${wk(P.ds[i])}）`,live?'累計（全倉）':'第一輪累計（全倉）',[[K.C.act,'實際已盤',P.act[i]==null?'還沒盤':fmt(P.act[i]),P.act[i]==null?'':'座'],...(P.plan?[['','計畫累計',fmt(P.plan[i]),'座']]:[])])});
  });

  /* ⑥ 下載盤點貨架清單：分類（多選）＋樓層（預設跟上方、可自選）＋避開『已綁定未上架』（盤點前模式才有） */
  if(!live){
    const hasBind=D.hasBind;
    K.chips('#dlCls',S,'dlCls',ORD.map(c=>[c,clsName(c)]));
    const dlFlBtns=[['all','全部'],['2F','2F','f2b'],['3F','3F','f3b']];
    document.getElementById('dlFl').innerHTML=`<div class="seg">${dlFlBtns.map(([v,t,c])=>`<button type="button" data-v="${v}" class="${c||''}">${t}</button>`).join('')}</div>`;
    document.querySelectorAll('#dlFl button').forEach(b=>b.onclick=()=>S.set('dlFl',b.dataset.v));
    const dlAv=document.getElementById('dlAv');dlAv.onchange=()=>S.set('dlAvoid',dlAv.checked);
    if(!hasBind){dlAv.disabled=true;document.getElementById('dlAvL').classList.add('off');document.getElementById('dlAvT').textContent='避開有「已綁定未上架」儲位的貨架（綁定資料準備中）'}
    let lastFl=S.get('fl'),DL={rows:[],base:[],st:null,fl:'all',avoid:false};
    S.on(st=>{if(st.fl!==lastFl){lastFl=st.fl;st.dlFl=null}});          // 上方樓層一改，這裡就回到「跟隨上方」
    const bindEmptyIds=r=>((D.bindEmpty&&D.bindEmpty[r.rack])||[]).map(c=>r.rack+'-'+c);
    S.on(st=>{
      const fl=st.dlFl||st.fl,fls=fl==='all'?['2F','3F']:[fl],B=D.bind||{},bf=B.byFl||{'2F':{},'3F':{}},avoid=hasBind&&st.dlAvoid;
      document.querySelectorAll('#dlFl button').forEach(b=>b.classList.toggle('on',b.dataset.v===fl));
      document.getElementById('dlFlN').textContent=st.dlFl&&st.dlFl!==st.fl?'（自選；上方篩選是 '+(st.fl==='all'?'全部':st.fl)+'）':'（跟隨上方樓層）';
      dlAv.checked=hasBind&&st.dlAvoid;
      document.getElementById('dlB').textContent=hasBind?`依銷售分類挑要盤的貨架 · 全倉已綁定未上架 ${fmt((bf['2F'].bindEmpty||0)+(bf['3F'].bindEmpty||0))} 格`:'依銷售分類挑要盤的貨架 · 綁定資料準備中';
      const base=D.racks.filter(r=>(fl==='all'||r.floor===fl)&&st.dlCls.includes(r.cls)).sort((a,b)=>(a.ord||99999)-(b.ord||99999)||(a.rack<b.rack?-1:1));
      const hit=hasBind?base.filter(r=>r.bindEmpty>0):[],rows=avoid?base.filter(r=>!(r.bindEmpty>0)):base;
      DL={rows,base,st,fl,hit,avoid};
      const slotN=arr=>arr.reduce((s,r)=>s+(r.bindEmpty||0),0);
      const avoidTxt=h=>!hasBind?'已綁定未上架：<b>—</b>（綁定資料準備中）':avoid?`避開 <b>${fmt(h.length)}</b> 座（含已綁定未上架儲位 ${fmt(slotN(h))} 格）`:`沒有避開，其中 <b>${fmt(h.length)}</b> 座有已綁定未上架儲位（${fmt(slotN(h))} 格），表中標色`;
      const line=f=>{const k=rows.filter(r=>r.floor===f),h=hasBind?base.filter(r=>r.floor===f&&r.bindEmpty>0):[];
        const parts=st.dlCls.map(c=>`${clsName(c)} <b>${fmt(k.filter(r=>r.cls===c).length)}</b> 座`).join('、');
        return `<div>${tag(f)} ${parts}，共 <b>${fmt(k.length)}</b> 座；${avoidTxt(h)}</div>`};
      let h=fls.map(line).join('');
      if(fls.length>1)h+=`<div>${tag('all')} 兩層合計 <b>${fmt(rows.length)}</b> 座；${avoidTxt(hit)}</div>`;
      document.getElementById('dlSum').innerHTML=h;
      K.xtable('#dlTb',{limit:10,empty:`目前 0 座：請至少選一個分類${hasBind?'，或把「避開」關掉':''}`,
        head:[['貨架'],['樓層'],['分類'],['儲位數','個'],['已綁定未上架','格'],['預計盤點日','','m-hide']],
        rows:(avoid?rows:[...rows.filter(r=>r.bindEmpty>0),...rows.filter(r=>!(r.bindEmpty>0))]).map(r=>({cls:hasBind&&r.bindEmpty>0?'bmk':'',c:[`<span class="mono">${r.rack}</span>`,tag(r.floor),clsName(r.cls),fmt(r.slots),!hasBind?'<span class="na">—</span>':r.bindEmpty>0?`<span class="bm">${fmt(r.bindEmpty)}</span>`:'<span class="na">—</span>',r.pd?md(r.pd):'—']}))});
      document.getElementById('dlCsv').disabled=document.getElementById('dlXls').disabled=!rows.length;
      document.getElementById('dlNote').textContent=`${fmt(rows.length)} 座${!avoid&&hit.length?'（預覽先列有標記的；下載檔照盤點順序）':''} · 欄位：貨架、樓層、分類、儲位數、有貨儲位、已綁定儲位、已綁定未上架儲位、已綁定未上架儲位代碼${hasBind?'':'（綁定資料準備中，這三欄先留空）'}`;
      document.getElementById('dlDef').innerHTML=hasBind
        ?`「已綁定未上架」＝WES 這格有指定固定零件（Position.BindObjectId 非空），但 WES 這格該零件的庫存是 0。綁定清單 ${B.list?md(B.list):'—'}（內容同 ${B.listSrc?md(B.listSrc):'—'} 匯出），庫存為 WESOH ${esc(B.wesoh||'—')}；2F 綁定 ${fmt(bf['2F'].bound)} 格、未上架 ${fmt(bf['2F'].bindEmpty)} 格，3F 綁定 ${fmt(bf['3F'].bound)} 格、未上架 ${fmt(bf['3F'].bindEmpty)} 格。`
        :'「已綁定未上架」＝WES 這格有指定固定零件（Position.BindObjectId 非空），但 WES 這格該零件的庫存是 0。這份資料還沒有每座貨架的綁定數量（資料整理程式新增中），所以現在無法避開這類貨架；下載檔的「已綁定儲位」「已綁定未上架儲位」兩欄先留空。';
    });
    const dlTable=()=>DL.rows.map(r=>[r.rack,r.floor,clsName(r.cls),r.slots||0,r.used||0,hasBind?(r.bound||0):'',hasBind?(r.bindEmpty||0):'',hasBind?bindEmptyIds(r).join('、'):'']);
    const dlName=ext=>{const d=new Date(),ymd8=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
      return `盤點貨架_${DL.fl==='all'?'2F3F':DL.fl}_${ORD.filter(c=>DL.st.dlCls.includes(c)).join('')}_${DL.avoid?'避開已綁定未上架':'含已綁定未上架'}_${ymd8}.${ext}`};
    document.getElementById('dlCsv').onclick=()=>V5.csv(DL_HEAD,dlTable(),dlName('csv'),[0]);   // 貨架代號寫成 ="2-01-0012"，Excel 才不會把它當日期
    document.getElementById('dlXls').onclick=()=>V5.xlsx('盤點貨架',DL_HEAD,dlTable(),dlName('xlsx'));
  }

  /* ⑦ 貨架清單＋儲位格（儲位格只畫展開那一座） */
  const KIND={has:'有貨未盤',ok:'已盤無差',disc:'已盤有盤差',clr:'要先清（異常／倉缺）'};
  const rackSlots=rack=>{   // 一座貨架的儲位：同一儲位多個件號合成一格（格色取最該注意的，數量加總）
    const by=new Map();
    (ix.rackSlots.get(rack)||[]).forEach(r=>{const pos=String(r[sc.pos]),code=pos.slice(10),k=invSlotKind(r),q=+r[sc.qty]||0;let e=by.get(code);
      if(!e)by.set(code,e={code,pos,kind:'empty',qty:0,has:false,parts:[],disc:0});
      if(KP[k]>KP[e.kind]){e.kind=k;const d=sc.rndDisc!=null&&r[sc.rndDisc]!=null?r[sc.rndDisc]:sc.disc!=null?r[sc.disc]:0;e.disc=+d||0}
      if(sc.qty!=null&&r[sc.qty]!=null){e.qty+=q;e.has=true}
      if(r[sc.part]&&(sc.qty==null||q>0))e.parts.push(String(r[sc.part]))});
    return by;
  };
  const DG=!!invDegraded();
  function grid(r,q){
    const by=rackSlots(r.rack),shape=D.shapes[r.lay]||[];
    if(!shape.length&&!by.size)return `<div class="note">這座貨架沒有儲位資料。</div>`;
    const qk=q&&!/^[0-9]-[0-9][0-9]-/.test(q)?q:'';
    const cellOf=(code,label,pos)=>{const s=by.get(code),k=s?s.kind:'empty',has=s&&s.qty>0;
      const cl=!s&&DG?'unk':live?(k==='empty'?'':k):(has?(k==='disc'?'disc':k==='ok'?'ok':'has'):'');
      const hit=(qk&&s&&s.parts.some(p=>p.toUpperCase().includes(qk)))||(q&&pos===q);
      return `<span class="cell ${[cl,clrSet.has(pos)?'clr':'',hit?'hit':''].join(' ')}" data-tip="${esc(pos)}">${label}${live&&k&&SK[k]?SK[k][0]:''}${has?`<small>${fmt(s.qty)}</small>`:''}</span>`};
    let faces;
    if(shape.length)faces=shape.map(([face,layers])=>{const mx=Math.max(...layers.map(l=>l[1]));
      const cells=layers.map(([ly,n])=>Array.from({length:mx},(_,i)=>{if(i>=n)return '<span></span>';const code=`${face}-${ly}${String(i+1).padStart(2,'0')}`;return cellOf(code,`${ly}${String(i+1).padStart(2,'0')}`,r.rack+'-'+code)}).join('')).join('');
      return `<div class="face"><b>${face} 面</b><div class="grid" style="grid-template-columns:repeat(${mx},auto)">${cells}</div></div>`}).join('');
    else faces=`<div class="face"><b>沒有版面資料，依編號列出有資料的儲位</b><div class="grid" style="grid-template-columns:repeat(8,auto)">${[...by.keys()].sort().map(c=>cellOf(c,c.slice(2),r.rack+'-'+c)).join('')}</div></div>`;
    const lg=live?Object.entries(SK).map(([k,v])=>`<span><span class="cell ${k}"></span>${v[1]}${v[0]?'（'+v[0]+'）':''}</span>`).join('')+'<span><span class="cell clr"></span>今晚要先清</span><span><span class="cell"></span>空</span>'
      :`<span><span class="cell has"></span>${KIND.has}</span><span><span class="cell ok"></span>已盤無差（✓）</span><span><span class="cell disc"></span>已盤有盤差（差）</span><span><span class="cell clr"></span>${KIND.clr.slice(0,3)}</span><span><span class="cell"></span>空</span>`;
    return `<div class="faces">${faces}</div><div class="lg2">${lg}${DG?'<span><span class="cell unk"></span>未列出（資料太多先省略，不代表空格）</span>':''}${qk?'<span><span class="cell hit"></span>含查的件號</span>':''}</div>`;
  }
  const rkKey=live?'rk':'open';
  const rkNm=r=>live?(isTn(r)?'<b>今晚</b>':r.state==='done'?'已盤':r.state==='doneMiss'?'已盤（有漏）':r.state==='empty'?'空架':'待盤'):(isTn(r)?'<b>第一晚</b>':({todo:'待盤',done:'已盤',empty:'空架'})[r.state]||r.state);
  const rkStat=r=>live?(isTn(r)?'今晚':r.state==='done'?'已盤':r.state==='doneMiss'?'已盤（有漏）':r.state==='empty'?'空架':'待盤'):(isTn(r)?'第一晚':({todo:'待盤',done:'已盤',empty:'空架'})[r.state]||r.state);
  const info=r=>live
    ?`<div class="k">${clsName(r.cls)}（預計 ${r.pd?md(r.pd):'—'}）· 儲位 ${fmt(r.slots)} 個 · 有貨 ${fmt(r.used)} 個 · 本輪已盤 ${fmt(r.rd)} 個${r.rAt1?`（最後 ${md(r.rAt1)} ${r.rAt1.slice(11,16)}）`:''} · 盤差 ${fmt(r.disc)} 個 · 盤點後新放進去 ${fmt(r.add)} 個 · 可能沒盤到 ${fmt(r.miss)} 個 · 盤點後換了零件 ${fmt(r.swap)} 個 · 帳差零件 ${fmt(r.diffParts)} 種 · 預估工時 ${fmt(r.estH,2)} 小時</div>`
    :`<div class="k">${r.cls==='空架'?'空架':r.cls+'銷'}（預計 ${r.pd?md(r.pd):'—'}）· 儲位 ${fmt(r.slots)} 個 · 有貨 ${fmt(r.used)} 個 · 本輪已盤 ${fmt(r.rd)} 個 · 盤差 ${fmt(r.disc)} 個 · 盤點後新放進去 ${fmt(r.add)} 個 · 可能沒盤到 ${fmt(r.miss)} 個 · 盤點後換了零件 ${fmt(r.swap)} 個 · 帳差零件 ${fmt(r.diffParts)} 種 · 預估工時 ${fmt(r.estH,2)} 小時</div>`;
  S.on(st=>{
    document.getElementById('rkB').textContent=`${fmt(R.length)} 座 · 點一列就地展開儲位格`;
    const cur=st[rkKey];
    K.xtable('#rk',{limit:12,open:cur?R.findIndex(r=>r.rack===cur):null,empty:'沒有符合篩選的貨架',
      head:live?[['貨架'],['狀態'],['已盤<wbr>／有貨','儲位個'],['有差','儲位個'],['未清','零件種','m-hide'],['盤點後','新／漏／換','m-hide']]
        :[['貨架'],['狀態'],['已盤<wbr>／有貨','儲位個'],['有差','儲位個'],['未清','零件種','m-hide'],['預計盤點日','','m-hide']],
      rows:R.map(r=>({c:live
        ?[`${tag(r.floor)} <span class="mono">${r.rack}</span> <span class="k">${clsName(r.cls)}</span>`,rkNm(r),`${fmt(r.rd)}／${fmt(r.used)}`,r.disc?fmt(r.disc):'<span class="na">—</span>',r.diffParts?fmt(r.diffParts):'<span class="na">—</span>',(r.add||r.miss||r.swap)?`${fmt(r.add)}／${fmt(r.miss)}／${fmt(r.swap)}`:'<span class="na">—</span>']
        :[`${tag(r.floor)} <span class="mono">${r.rack}</span> <span class="ki">${clsName(r.cls)}</span>`,rkNm(r),`${fmt(r.rd)}／${fmt(r.used)}`,r.disc?fmt(r.disc):'<span class="na">—</span>',r.diffParts?fmt(r.diffParts):'<span class="na">—</span>',r.pd?md(r.pd):'—'],
        x:()=>info(r)+grid(r,S.get('q'))})),

/* ================= v5 查零件（find）：設計稿 find（件號）／find_cart（台車）／find_empty（空白、輸入中、查不到、多個商品別）的上線版 =================
   同一個模組依路由換三種畫面：
     find                       空白（說明＋最近查過）；輸入中列出含這串字的件號；按「查」→ 一個零件／多個商品別／查不到／台車
     find/<件號>[/<手上數量>]   零件結果：件號決定整頁；手上數量改了＝「可能是 N 種狀況」整個重算；履歷期間帶動儲位歷程、帳差紀錄、最近異動與 KPI「期間內有進出的儲位」
     find/<台車號>              台車：未上架零件表（可排序），件號列就地展開這個零件的數字小卡
   資料轉接：設計稿 FIND_JS 是「抓舊頁畫面文字」，這裡改成直接呼叫產生那些格子與表的函式——
     ktModel（格子與明細表；表的內容讀 dataTable 登記的 TBL，不抓畫面）、ktFig／ktDash／ktLookup（零件查詢發布檔，非同步）、fdCands（可能的狀況，排序與動作文字照舊）、
     invShard（零件履歷分片，非同步）、invPartTrailHtml／ipCoreLedger（足跡與帳差紀錄）、invNodeModel（這個件號在哪些待辦裡）。
   「找到的地方」已從畫面拿掉（使用者 10/23）：fdCands 的 place 參數還在（inv_todo 用）；舊網址的 ?at= 仍接受並傳進去。
   「回到商品別」：從「這個件號有多個商品別」點進結果頁時，網址帶 from=<輸入的號碼>，篩選列最左邊出現「‹ 回到「…」的商品別」。
   網址：find／find/<件號>[/<數量>][?pd=7|30&from=&at=]／find/<台車號>；舊網址 ?open=hist 捲到零件履歷。 */
(()=>{
const {fmt,md,tag}=K;
const esc=K.esc;
const PCS=V5.pcs;   /* 全站規則：零件數量用 pcs */
const AT_OK=['cart','abn','shelf','ground','other'];
const plain=h=>new DOMParser().parseFromString('<body>'+String(h==null?'':h).replace(/<br\s*\/?>/gi,' ')+'</body>','text/html').body.textContent.replace(/\s+/g,' ').trim();
const sgn=v=>(v>0?'+':'')+fmt(v);
const norm=s=>String(s||'').replace(/[\s　]/g,'').toUpperCase();
const numTxt=v=>/^[+−-]?[\d,.]+$/.test(String(v));
const qtyHash=(part,n,o)=>hashOf(withQ('find/'+encodeURIComponent(part)+(n?'/'+n:''),o));
const carts=()=>(D.inbound&&Array.isArray(D.inbound.carts))?D.inbound.carts:[];

/* ---------- 零件結果的資料（每個件號一份，履歷與零件查詢非同步補） ---------- */
const PM={};
function partModel(part){
  const res=fdResolve(part);if(res.kind!=='one')return null;
  const key=keyOf(res.rows[0][invIdx().c.parts.part]);
  if(PM[key])return PM[key];
  const row=res.rows[0],P=fdPartInfo(row),rec=invRec('parts',row),R=invPartResolve(P.part),sel={frcd:P.frcd,bare:P.bare,keys:[P.key]};
  const fig=ktFig(sel),dash=ktDash(sel);
  const pm={part:P.part,key,P,rec,R,sel,fig,dash,lk:{state:'loading',s:null},shard:null,M:null,items:null};
  pm.build=()=>{   /* 格子與明細表：lk（零件查詢）載好後重算 */
    pm.M=ktModel({sel,fig,dash,lk:pm.lk});
    const dif=dash.dif,items=[];
    if(dif&&dif.length){const c=pm.M.core[2];
      items.push({key:'diff',l:c.l,v:c.v,u:c.u,s:c.s||'',def:'',tab:{head:['商品別','樓層','HOPES（個）','WES（個）','封箱／在途（個）','帳差（個）'],
        rows:dif.map(r=>[String(r[9]||''),String(r[0]),fmt(r[3]),fmt(r[4]),`${fmt(r[5])}／${fmt(r[7])}`,ktSigned(r[6])])}})}
    pm.M.items.forEach(m=>{
      let h='';try{h=m.det()}catch(e){console.error(e)}
      const tb=typeof TBL!=='undefined'?TBL['kt'+m.key]:null;
      const p0=new DOMParser().parseFromString('<body>'+h+'</body>','text/html').body.querySelector('.def,p:not(.more)');
      items.push({key:m.key,l:m.l,v:m.v,u:m.u||'',s:m.s||'',def:p0?p0.textContent.replace(/\s+/g,' ').trim():'',
        tab:tb?{head:tb.cols.map(c=>c.h),rows:tb.rows.map(r=>tb.cols.map(c=>plain(c.f(r))))}:null});
    });
    pm.items=items;
  };
  pm.build();
  return PM[key]=pm;
}
/* 零件履歷（分片）→ 三張表的列：儲位歷程／帳差紀錄／最近異動（口徑同 inv_part.js histHtml） */
function histRows(pm){
  if(pm._h&&pm._hs===pm.shard)return pm._h;
  const R=pm.R,rec=pm.rec,rc=pm.shard&&pm.shard.rc,ix=invIdx(),sc=ix.c.slots,rs=ipRound();
  const l=rc?ipArr(rc.l):ipCoreLedger(R.full).map(x=>[x.t,x.prev,x.cur,x.kind,x.cat,x.code,x.ev,x.after]);
  const out={slots:[],ledger:[],events:[],hasShard:!!rc};
  if(rc){
    const p=ipArr(rc.p),c=ipArr(rc.c),qty=new Map(),lastC=new Map();
    (ix.partSlots.get(R.full)||[]).forEach(r=>{qty.set(String(r[sc.pos]),r[sc.qty])});
    c.slice().sort((a,b)=>String(a[1]).localeCompare(String(b[1]))).forEach(x=>lastC.set(x[0],x));
    out.slots=p.map(r=>{const lc=lastC.get(r[0]);
      const cl=r[8]>0&&lc?`${ipD(lc[1])>=rs?'本輪':'歷史'} ${ipT(lc[1])} 盤點量 ${fmt(lc[3])} 個（差 ${ipSign(lc[4])}）`:(invMode()==='pre'?'–':'本輪未盤');
      return {pos:r[0],cur:r[7]?1:0,last:String(r[2]),io:`${fmt(r[4])}／${fmt(r[6])}`,cl,q:qty.has(r[0])?qty.get(r[0]):null}}).sort((a,b)=>b.cur-a.cur||String(b.last).localeCompare(String(a.last)));
    const e=ipArr(rc.e).slice().reverse().sort((a,b)=>String(b[0]).localeCompare(String(a[0])));   /* 分片的異動由舊到新：先反過來再依時間排，同一秒的順序同設計稿 */
    out.events=e.map(r=>({t:String(r[0]),sys:r[1]==='W'?'WES':'HOPES',what:r[2]==='T8'&&r[1]==='W'?ipT8(r):IPT_T[r[2]]&&r[1]==='W'?IPT_T[r[2]]:IPT_H[r[2]]&&r[1]==='H'?IPT_H[r[2]]:invEv(r[2]),q:r[3],ref:String(r[5]==null?'':r[5])}));
  }
  out.ledger=l.slice().sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).map(r=>({t:String(r[0]),chg:`${ipSign(r[1])} → ${ipSign(r[2])}`,d:ipSign(r[2]-r[1]),cat:plain(ipCat(r[4])),why:(r[7]?'盤點後 ':'')+(invEv(r[6])||'–')}));
  pm._h=out;pm._hs=pm.shard;return out;
}
const trailText=pm=>{
  const rc=pm.shard&&pm.shard.rc;let h='';
  try{h=invPartTrailHtml(pm.R,pm.rec,rc?ipArr(rc.l).map(x=>({t:x[0],prev:x[1],cur:x[2],kind:x[3],cat:x[4]})):null,rc||null)}catch(e){console.error(e)}
  return plain(h).replace(/^本輪 /,'本輪：').replace(/ → 盤點後 /,' → 盤點後：').replace(/ → 帳差 /,' → 帳差：');
};
/* 這個件號在哪些待辦裡（帳差未清＋異常待辦＋盤點後出問題）：口徑同異常頁的待辦卡 */
function todoCards(pm){
  const m=invNodeModel(),k=pm.key,out=[],node=id=>INV_NODES.find(t=>t.id===id)||{};
  const mk=(c,link)=>{const t=node(c.id),ui=IVN_UI[c.id]||{},rows=(c.rows||[]).filter(r=>keyOf(r.part)===k).map(r=>({pos:r.pos||'',q:r.qty,a:r.age==null?null:r.age,ge:!!(t.fromFirst||r.ge),ev:plain(r.ev),
      act:(()=>{try{return t.act?String(t.act(r)||''):''}catch(e){return ''}})()}));
    return rows.length?{name:c.name,tag:c.tag||'',def:ui.sdef||t.def||'',act:ui.act1||(t.todo&&t.todo[0])||'',lim:t.lim||'',rows,link}:null};
  const d1=m.cards[1];
  if(d1){const rows=(d1.rows||[]).filter(r=>keyOf(r.part)===k).map(r=>({pos:'',q:r.qty,a:r.age==null?null:r.age,ge:!!r.ge,act:plain(r.why),ev:plain(r.ev)}));
    if(rows.length)out.push({name:'帳差未清',tag:'HOPES ≠ WES',def:'帳差＝HOPES − WES − 封箱 − 在途，不是 0',act:'看「原因」：原因明確的，到另一邊補做；找不到原因的，記下件號回報',lim:'3 工作日',rows,link:'ab'})}
  m.daily.all.forEach(c=>{if(c.pending)return;const o=mk(c,'ab/'+ivnSlug(c));if(o)out.push(o)});
  m.board.all.forEach(c=>{if(c.pending)return;const o=mk(c,'inv/'+ivnSlug(c));if(o)out.push(o)});
  return out;
}
/* 可能的狀況（手上數量）：fdCands 的結果整理成卡片列；排序、動作文字照舊，提醒與數量符合標籤隨手上數量重算 */
function candCards(pm,H,place){
  const cs=fdCands(pm.P,H,place||'');
  return cs.map((c,i)=>{
    const rows=[['代表什麼',c.means]].concat(c.ev.map(([l,v])=>[l,plain(v)]),c.notes.map(t=>['提醒',t]));
    if(c.ord!==8){
      const cl=c.clears.map(x=>plain(x.html));
      rows.push(['做完會一起消失',cl.length?cl:['沒有其他待辦會跟著消失，只有這一筆。']]);
      if(cl.length&&c.R!=null&&H<c.R)rows[rows.length-1][1]=cl.concat(['手上比紀錄少，補完手上這些之後，上面的待辦還會剩一部分。']);
    }
    if(c.R!=null&&H<c.R&&c.qc!==0)rows.push(['提醒',`手上只有 ${fmt(H)} 個，先處理 ${fmt(H)} 個；紀錄還剩 ${fmt(c.R-H)} 個沒找到。`]);
    else if(c.R!=null&&H>c.R)rows.push(['提醒',`手上比紀錄多 ${fmt(H-c.R)} 個：多的部分這張卡找不到對應紀錄，先確認件號和來源。`]);
    return {top:i===0,ord:c.ord,name:c.name,action:PCS(c.action||''),R:c.R,qc:c.qc,rows};
  });
}
const qchip=(c,H)=>{
  if(c.ord===8)return '';
  const r=c.R;if(r==null)return '<span class="chipx">紀錄沒有數量</span>';
  if(c.qc===0&&H<r)return `<span class="chipx ok">可分次釋回 ${fmt(H)}≤${fmt(r)}</span>`;
  return H<r?`<span class="chipx">只找到一部分 ${fmt(H)}＜${fmt(r)}</span>`:H===r?'<span class="chipx ok">數量相符</span>':`<span class="chipx">手上比紀錄多 ${fmt(H-r)}</span>`;
};

/* ===== 空白／輸入中／查不到／多個商品別 ===== */
function mountEmpty(S,ctx){
  const qEl=document.getElementById('fq'),nEl=document.getElementById('fn');
  qEl.value=S.get('q')||'';nEl.value=S.get('n')||'';
  /* 最近查過（localStorage，可選）；沒有紀錄就不顯示 */
  const RK='v5_find_recent';
  const rget=()=>{try{const x=JSON.parse(localStorage.getItem(RK)||'null');if(Array.isArray(x))return x.filter(s=>typeof s==='string').slice(0,6)}catch(_){}return []};
  const rput=x=>{try{const a=[x].concat(rget().filter(y=>y!==x)).slice(0,6);localStorage.setItem(RK,JSON.stringify(a))}catch(_){}};
  const rclear=()=>{try{localStorage.removeItem(RK)}catch(_){}};
  qEl.addEventListener('input',()=>S.set({q:norm(qEl.value),sub:null,ra:''}));
  nEl.addEventListener('input',()=>S.set({n:nEl.value.trim(),sub:null,ra:''}));
  document.getElementById('frm').onsubmit=e=>{e.preventDefault();submit(qEl.value)};
  function submit(val){
    const q=norm(val),n=nEl.value.replace(/[\s,　]/g,'');
    if(!q){S.set({sub:{err:'請輸入件號或台車號。'}});qEl.focus();return}
    if(n&&!/^[1-9]\d*$/.test(n)){S.set({sub:{err:'手上數量請輸入 1 以上的整數，或不填。'}});nEl.focus();return}
    S.set({q,n,sub:{q,n,at:S.get('at')},ra:encodeURIComponent(q)+(n?'/'+n:'')});
  }
  const cartOf=q=>carts().find(c=>c.cart===keyOf(q));
  const partRow=r=>{const pc=invIdx().c.parts,rec=invRec('parts',r);return {part:String(r[pc.part]),name:rec.name||'',floor:rec.floor||'',slots:rec.curSlots||0}};
  const sugOf=q=>{const k=keyOf(q);if(k.length<4)return [];const r=[];for(const [key,row] of invIdx().part){if(key.includes(k)){r.push(partRow(row));if(r.length>=8)break}}return r};
  const cartsOf=q=>q.length<2?[]:carts().filter(c=>c.cart.includes(keyOf(q))).slice(0,8);
  const ptab=(rows,el)=>K.xtable(el,{head:[['件號'],['品名','','l m-hide'],['樓層'],['WES 儲位','個']],
    rows:rows.map(p=>({c:[`<button type="button" class="dn-l mono" data-p="${esc(p.part)}">${esc(p.part)}</button><span class="k subm">${esc(p.name)}</span>`,esc(p.name),tag(p.floor),fmt(p.slots)]})),
    after:e=>e.querySelectorAll('[data-p]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();qEl.value=b.dataset.p;submit(b.dataset.p)})});
  /* 輸入欄、訊息 */
  S.on(st=>{
    const er=document.getElementById('err'),e=st.sub&&st.sub.err;er.hidden=!e;er.textContent=e||'';
    document.getElementById('scope').innerHTML=!st.q?'還沒輸入':`<b>${esc(st.q)}</b>${st.n?` · 手上 <b>${/^\d+$/.test(st.n)?fmt(+st.n):esc(st.n)}</b> 個`:''}`;
  });
  /* 最近查過 */
  S.on(()=>{
    const a=rget(),el=document.getElementById('recent');
    el.innerHTML=a.length?`<div class="rc"><span class="tl">最近查過</span>${a.map(x=>`<button type="button" class="chip" data-r="${esc(x)}">${esc(x)}</button>`).join('')}<button type="button" class="lk" id="rx">清除紀錄</button></div>`:'';
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{qEl.value=b.dataset.r;submit(b.dataset.r)});
    const rx=document.getElementById('rx');if(rx)rx.onclick=()=>{rclear();S.go()};
  });
  /* 結果區：輸入中（建議）、送出後（查不到／一個／多個商品別／台車） */
  S.on(st=>{
    const sec=document.getElementById('ressec'),res=document.getElementById('res'),H=document.getElementById('resH'),B=document.getElementById('resB'),sub=st.sub;
    if(sub&&sub.err){sec.hidden=true;return}
    if(!sub){   /* 輸入中：件號裡有包含這串字的 */
      const q=st.q,cs=cartsOf(q),ps=sugOf(q);
      if(!q||(q.length<4&&!cartOf(q))){sec.hidden=true;return}
      sec.hidden=false;H.textContent='件號裡有包含這串字的';B.textContent=`輸入 ${q} · 最多列 8 個；按「查」或點件號`;
      res.innerHTML=ps.length?'<div id="rt"></div>':`<div class="empty">目前 0 個件號含「${esc(q)}」。</div>`;
      if(ps.length)ptab(ps,'#rt');
      if(cs.length)res.innerHTML+=`<div class="note" style="margin-top:16px">台車：${cs.map(c=>`<button class="chip" data-c="${esc(c.cart)}">${esc(c.cart)} ${esc(c.floor)}</button>`).join(' ')}</div>`;
      res.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{qEl.value=b.dataset.c;submit(b.dataset.c)});
      return}
    sec.hidden=false;const q=sub.q;
    const at=sub.at||'';
    const nTxt=sub.n?`手上 ${fmt(+sub.n)} 個`:'';
    const cart=cartOf(q);
    if(cart){rput(q);H.textContent='找到 1 台台車';B.textContent='';
      res.innerHTML=`<div class="hitc"><span class="frc" style="color:var(--ink2);background:var(--soft)">台車</span><span class="mid">${esc(cart.cart)}</span>${tag(cart.floor)}<span>未上架 <b>${fmt(cart.points)}</b> 點・<b>${fmt(cart.pcs)}</b> 個</span><a class="lk go" href="${esc(hashOf('find/'+encodeURIComponent(cart.cart)))}">看這台車的未上架零件 ›</a></div>${sub.n?`<div class="note">台車號不需要手上數量，已忽略「${esc(nTxt)}」。</div>`:''}`;return}
    const hit=invFindPart(q).map(partRow);
    if(!hit.length){
      const sug=sugOf(q);H.textContent='查不到這個件號';B.textContent='';
      res.innerHTML=`<div class="empty">資料裡沒有「${esc(q)}」（只有 2F／3F 的零件和台車）。請確認件號有沒有打錯；商品別可以不輸入。</div>`+(sug.length?`<div class="note" style="margin:12px 0 8px">件號裡有包含這串字的：</div><div id="rt"></div>`:'');
      if(sug.length)ptab(sug,'#rt');return}
    if(hit.length===1){const p=hit[0];rput(q);H.textContent='找到 1 個零件';B.textContent='';
      res.innerHTML=`<div class="hitc"><span class="frc">商品別 ${esc(keyOf(p.part).charAt(0))}</span><span class="mono">${esc(p.part)}</span><span>${esc(p.name||'（沒有品名）')}</span>${tag(p.floor)}<span class="k">WES 儲位 ${fmt(p.slots)} 個</span><a class="lk go" href="${esc(qtyHash(p.part,sub.n,{at}))}">看這個零件 ›</a></div>
        <div class="note">${nTxt?esc(nTxt)+'：結果頁會多列「可能是 N 種狀況」，最可能的排最前面。':'只填件號：結果頁列出這個零件的數字、不是 0 的項目、在哪些待辦裡與履歷。再填手上數量，會列出最可能的狀況與動作。'}</div>`;return}
    H.textContent=`這個件號有 ${hit.length} 個商品別`;B.textContent='請點選要查的零件';rput(q);
    res.innerHTML=hit.sort((a,b)=>keyOf(a.part)<keyOf(b.part)?-1:1).map(p=>`<div class="opt"><span class="frc">商品別 ${esc(keyOf(p.part).charAt(0))}</span><span><span class="mono">${esc(p.part)}</span> ${esc(p.name||'（沒有品名）')}<span class="k"> ${tag(p.floor)}　WES 儲位 ${fmt(p.slots)} 個</span></span><a class="lk" href="${esc(qtyHash(p.part,sub.n,{at,from:q}))}">查這個 ›</a></div>`).join('');
    res.querySelectorAll('.opt').forEach(o=>o.onclick=e=>{if(e.target.closest('a'))return;const a=o.querySelector('a');if(a)a.click()});
  });
  K.onResize(()=>S.go());
  if(innerWidth>=1000&&!S.get('q'))setTimeout(()=>{const el=document.getElementById('fq');if(el&&!el.value)el.focus()},0);
}

/* ===== 零件結果 ===== */
function mountPart(S,ctx){
  const st0=S.get(),pm=partModel(st0.part);
  if(!pm){document.getElementById('pn').innerHTML='<span class="empty">資料裡沒有這個件號</span>';return}
  const qEl=document.getElementById('fq'),hEl=document.getElementById('fh');
  qEl.value=pm.P.part;hEl.value=st0.h?String(st0.h):'';
  K.seg('#fPd',S,'pd',[['7','近 7 天'],['30','近 30 天'],['all','全部']]);
  hEl.oninput=e=>{const x=parseInt(e.target.value,10);S.set('h',x>0?x:null)};
  /* 從「多個商品別」點進來的 */
  {const b=document.getElementById('back'),f=st0.from;if(f){b.hidden=false;b.textContent=`‹ 回到「${f}」的商品別`;b.href=qtyHash(f,st0.h&&String(st0.h),{at:st0.at})}}
  /* 查另一個號碼：換網址（可能是別的件號、台車、多個商品別…，由路由決定畫面） */
  document.getElementById('pfrm').onsubmit=e=>{
    e.preventDefault();
    const part=norm(qEl.value),qs=hEl.value.replace(/[\s,　]/g,''),er=document.getElementById('perr'),say=t=>{er.textContent=t;er.hidden=!t};
    if(!part){say('請輸入件號或台車號。');qEl.focus();return}
    if(qs&&!/^[1-9]\d{0,5}$/.test(qs)){say('手上數量請輸入 1 以上的整數，或不填。');hEl.focus();return}
    say('');go(withQ('find/'+encodeURIComponent(part)+(qs?'/'+qs:''),{at:st0.at}));
  };
  const toIso=s=>String(s||'');
  const inPd=(st,iso)=>{if(st.pd==='all'||!iso)return true;const t=Date.parse(String(ipToday())+'T00:00:00Z'),x=Date.parse(String(iso).slice(0,10)+'T00:00:00Z');return !isFinite(x)||(t-x)/864e5<=+st.pd};
  let dead=false;V5.clean.push(()=>{dead=true});
  let H_=null;   /* 履歷（分片）載入狀態 */
  const hist=()=>histRows(pm);

  /* 零件抬頭＋足跡 */
  S.on(()=>{
    document.getElementById('pn').innerHTML=`<span class="k">商品別 ${esc(pm.P.frcd||'—')}</span><span class="mono">${esc(pm.P.part)}</span><b>${esc(pm.P.name||'')}</b>${tag(pm.P.floor)}`;
    document.getElementById('trail').textContent=trailText(pm);
  });
  /* ② 手上數量 → 可能狀況 */
  S.on(st=>{
    const H=st.h,sec=document.getElementById('secCand');sec.hidden=!H;if(!H)return;
    const cs=candCards(pm,H,st.at);
    document.getElementById('cdH').textContent=cs.length&&cs[0].ord===8?`手上 ${fmt(H)} 個，這個件號沒有對應的紀錄`:`手上 ${fmt(H)} 個，可能是 ${cs.length} 種狀況`;
    document.getElementById('cdB').textContent='最可能的排第一；改手上數量，提醒會跟著重算';
    K.xtable('#cd',{open:0,head:[['狀況','','wrap'],['要做的動作','','l wrap'],['','','m-hide']],
      rows:cs.map((c,i)=>({c:[`<span class="chipx ${i?'':'top'}">${i?'其他可能':'最可能'}</span><b>${esc(c.name)}</b>`,`<span style="white-space:normal">${esc(c.action)}</span>`,qchip(c,H)],
        x:()=>`<dl class="cdl">${c.rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${Array.isArray(v)?v.map(esc).join('<br>'):esc(v)}</dd>`).join('')}</dl>`}))});
  });
  /* ③ KPI */
  S.on(st=>{
    const core=pm.M.core,dif=pm.dash.dif,tr=dif?dif.reduce((a,r)=>a+(+r[7]||0),0):0,eff=pm.P.eff;
    const hs=hist(),moved=H_==='ok'?hs.slots.filter(r=>r.cur||inPd(st,toIso(r.last))).length:null;
    const val=c=>numTxt(c.v)?{v:c.v,u:'pcs'}:{v:c.v==='載入中'?'載入中':'—',u:''};
    K.kpis('#kp',[
      Object.assign({l:'HOPES 庫存'},val(core[0])),
      Object.assign({l:'WES 庫存'},val(core[1])),
      {id:'diff',l:'帳差 HOPES − WES',v:sgn(eff),u:'pcs',cls:eff?'bad':'',sub:`已扣在途 ${fmt(tr)} pcs · 金額 ${sgn(pm.rec.effAmt||0)} 元`},
      Object.assign({id:'slot',l:'WES 儲位（現在）',sub:'點一下＝儲位歷程只看現在'},numTxt(core[3].v)?{v:core[3].v,u:'個'}:{v:'—',u:''}),
      {id:'moved',l:'期間內有進出的儲位',v:moved==null?(H_==='err'?'—':'載入中'):fmt(moved),u:moved==null?'':'個',sub:st.pd==='all'?'全部期間':`近 ${st.pd} 天`}],
      st.slot==='now'?'slot':st.hl==='diff'?'diff':null,
      id=>{if(id==='slot')S.set('slot',st.slot==='now'?'all':'now');else if(id==='moved')S.set('slot','all');else if(id==='diff'){S.set('hl',st.hl==='diff'?null:'diff');nzOpen('diff')}
        document.getElementById(id==='diff'?'nz':'secHist').scrollIntoView({behavior:'smooth',block:'start'})});
  });
  /* ④ 不是 0 的項目 */
  let nzT;const nzOpen=key=>{const i=pm.items.findIndex(t=>t.key===key);if(nzT&&i>=0)nzT.openRow(i)};
  S.on(st=>{
    const items=pm.items;
    nzT=K.xtable('#nz',{open:st.hl==='diff'&&items.length&&items[0].key==='diff'?0:-1,head:[['項目'],['數字'],['補充','','l m-hide']],
      rows:items.map(t=>({cls:st.hl==='diff'&&t.key==='diff'?'sel':'',c:[esc(t.l),`<b>${esc(t.v)}</b> <span class="k" style="display:inline">${esc(t.u)}</span>`,`<span class="k" style="display:inline">${esc(t.s)}</span>`],
        x:()=>(t.def?`<p class="def k" style="display:block">${esc(t.def)}</p>`:'')+(t.tab?`<div class="tw" id="nzx-${t.key}"></div>`:'')})),
      after:el=>items.forEach(t=>{const h=el.querySelector('#nzx-'+t.key);if(h&&t.tab)K.xtable(h,{head:t.tab.head.map(x=>{const m=/^(.*?)（(.*)）$/.exec(x);return m?[m[1],m[2]]:[x]}),rows:t.tab.rows.map(r=>({c:r.map(esc)}))})})});
    const M=pm.M;
    document.getElementById('zero').textContent=`${M.waiting?'零件查詢資料載入中…　':''}其餘是 0：${M.zero.map(z=>z.l).join('、')||'（無）'}${M.na.length?`　　缺資料：${M.na.map(z=>z.l).join('、')}`:''}`;
  });
  /* ⑤ 在哪些待辦裡 */
  S.on(()=>{
    const cards=todoCards(pm);
    K.xtable('#td',{empty:'這個件號目前不在任何待辦裡',head:[['待辦'],['筆數','筆'],['數量','pcs'],['已過','工作日']],
      rows:cards.map(c=>({c:[`<b>${esc(c.name)}</b> <span class="k">${esc(c.tag)}</span>`,fmt(c.rows.length),c.rows.map(r=>sgn(r.q)).join('、'),c.rows.map(r=>(r.ge?'≥ ':'')+fmt(r.a)).join('、')],
        x:()=>`<p class="def">${esc(PCS(c.def))} · <b>期限 ${esc(c.lim)}</b></p><p class="todo"><b style="color:var(--acc)">要做什麼</b>　${esc(PCS(c.act))}</p>`+c.rows.map(r=>`<div class="k" style="display:block">${r.pos?`<span class="mono">${esc(r.pos)}</span> · `:''}${esc(PCS(r.act||r.ev))}${r.ev&&r.act?` · ${esc(PCS(r.ev))}`:''}</div>`).join('')+`<div class="note"><a class="lk" href="${esc(hashOf(c.link))}">到異常看全部 ${esc(c.name)} ›</a></div>`}))});
  });
  /* ⑥ 零件履歷 */
  S.on(st=>{
    document.getElementById('hsB').textContent=st.pd==='all'?'全部期間':`近 ${st.pd} 天（篩選列「履歷期間」）`;
    const hs=hist(),warn=H_==='err'?`<div class="stale"><b>零件履歷</b><span>${esc((pm.shard&&pm.shard.msg)||'詳細資料讀取失敗')}；下面只有帳差紀錄。</span></div>`:'';
    const rows=hs.slots.filter(r=>(st.slot!=='now'||r.cur)&&(r.cur||inPd(st,toIso(r.last))));
    document.getElementById('slB').textContent=H_==='ok'?`${fmt(rows.length)}／${fmt(hs.slots.length)} 個儲位${st.slot==='now'?' · 只看現在':''}`:'';
    if(H_==null)document.getElementById('sl').innerHTML='<div class="empty">載入履歷中…</div>';
    else K.xtable('#sl',{limit:10,empty:H_==='err'?'詳細資料讀取失敗，沒有儲位歷程':'這段期間沒有進出的儲位',head:[['儲位'],['狀態','','m-hide'],['最後紀錄'],['進／出','pcs','wrap'],['盤點','','m-hide'],['WES 現量','pcs']],
      rows:rows.map(r=>({cls:r.cur?'':'dim',c:[`<span class="mono">${esc(r.pos)}</span>`,r.cur?'<b>現在</b>':'曾經',esc(ipT(r.last)),esc(r.io),esc(r.cl),r.q==null?'–':fmt(r.q)]}))});
    const dlr=hs.ledger.filter(r=>inPd(st,r.t));
    K.xtable('#dlg',{empty:'這段期間帳差沒有變化',head:[['時間'],['前次→本次','pcs'],['變化','pcs'],['類別'],['說明','','l m-hide']],rows:dlr.map(r=>({cls:st.hl==='diff'?'sel':'',c:[esc(ipT(r.t)),esc(r.chg),esc(r.d),esc(r.cat),`<span style="white-space:normal">${esc(r.why)}</span>`]}))});
    const ev=hs.events.filter(e=>inPd(st,e.t));
    if(H_==null)document.getElementById('ev').innerHTML='<div class="empty">載入履歷中…</div>';
    else K.xtable('#ev',{limit:10,empty:H_==='err'?'詳細資料讀取失敗，沒有異動':'這段期間沒有異動',head:[['時間'],['系統'],['異動','','l'],['數量','pcs'],['單號／儲位','','m-hide']],
      rows:ev.map(e=>({c:[md(e.t)+' '+e.t.slice(11,16),e.sys,esc(e.what),sgn(e.q),`<span class="mono">${esc(e.ref)}</span>`]}))});
    const hw=document.getElementById('hsW');if(hw)hw.innerHTML=warn;
  });
  K.onResize(()=>S.go());

  /* 非同步：履歷分片、零件查詢發布檔（讀好再重畫） */
  invShard(pm.R.full).then(r=>{
    if(dead)return;
    const hit=r.recs.find(x=>keyOf(x[0])===pm.R.full)||null,e=r.errors[0];
    pm.shard=hit?{rc:hit[1]}:{rc:null,msg:e?'這個零件的詳細資料'+(IPT_WHY[e.kind]||'讀取失敗'):'詳細資料裡沒有這個件號（近 7 個月沒有儲位或盤點紀錄）'};
    H_=hit?'ok':'err';S.go();
  }).catch(e=>{if(dead)return;console.error('[hist]',e);pm.shard={rc:null,msg:'詳細資料讀取失敗'};H_='err';S.go()});
  if(pm.lk.state==='loading')ktLookup(pm.P.part).then(r=>{
    pm.lk={state:r.state,s:r.state==='ok'?ktLkSel(r.data,pm.P.frcd):null};pm.build();if(!dead)S.go();
  });
}

function mountCart(S,ctx){
  const CARTS=new Map(carts().map(c=>[c.cart,c]));
  const qEl=document.getElementById('fq');qEl.value=S.get('cart')||'';
  const dmap=new Map(((D.diff&&D.diff.rows)||[]).map(r=>[keyOf(r[1]),{hopes:r[3],wes:r[4],clo:r[5],diff:r[6],transit:r[7]}]));
  const pinfo=p=>{const row=invIdx().part.get(keyOf(p));if(!row)return ['','',0,0];const rec=invRec('parts',row);return [rec.name||'',rec.floor||'',rec.curSlots||0,rec.star||0]};
  /* 試試：挑幾台（每個樓層未上架點數最多的） */
  const TRY=['2F','3F'].flatMap(f=>carts().filter(c=>c.floor===f).sort((a,b)=>b.points-a.points).slice(0,2)).map(c=>c.cart);
  document.getElementById('try').innerHTML=TRY.map(c=>`<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  document.querySelectorAll('#try .chip').forEach(b=>b.onclick=()=>{qEl.value=b.dataset.c;go_(b.dataset.c)});
  document.getElementById('frm').onsubmit=e=>{e.preventDefault();go_(norm(qEl.value))};
  function go_(val){
    if(!val){S.set({cq:'__err'});return}
    const v=keyOf(val),ch=CARTS.has(v)&&v!==S.get('cart');
    S.set({cq:CARTS.has(v)?'':val,cart:CARTS.has(v)?v:S.get('cart'),sort:ch?null:S.get('sort'),desc:ch?true:S.get('desc')});
  }
  const cart=()=>CARTS.get(S.get('cart'));
  /* 範圍＋訊息（查不到、空白） */
  S.on(st=>{
    const c=cart(),m=document.getElementById('msg'),bad=st.cq&&st.cq!=='__err';
    document.getElementById('scope').innerHTML=`台車 <b>${esc(c.cart)}</b> · <b>${esc(c.floor)}</b> · 未上架 <b>${fmt(c.points)}</b> 點`;
    if(st.cq==='__err'){m.hidden=false;m.innerHTML=`<div class="empty"><span style="color:var(--bad);font-weight:700">請輸入件號或台車號。</span> 目前仍顯示台車 ${esc(c.cart)}。</div>`;return}
    if(bad){const k=keyOf(st.cq),sug=carts().filter(x=>x.cart.includes(k)).slice(0,8);
      m.hidden=false;
      m.innerHTML=`<div class="sh"><h2>查不到這台車</h2></div><div class="empty">991 追蹤裡沒有台車「${esc(st.cq)}」（只有 2F／3F 還有未上架零件的台車；件號請到<a class="lk" href="${esc(hashOf('find/'+encodeURIComponent(norm(st.cq))))}">查零件頁</a>輸入）。目前仍顯示台車 ${esc(c.cart)}。</div>`
        +(sug.length?`<div class="note">台車號裡有包含這串字的：</div><div class="try" style="margin-top:8px">${sug.map(x=>`<button class="chip" data-c="${esc(x.cart)}">${esc(x.cart)} ${esc(x.floor)}</button>`).join('')}</div>`:'');
      m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{qEl.value=b.dataset.c;go_(b.dataset.c)});return}
    m.hidden=true;
  });
  /* 抬頭一行＋狀態 */
  let stateTxt=null;
  S.on(()=>{
    const c=cart();
    document.getElementById('hd').innerHTML=`<span class="mid">${esc(c.cart)}</span>${tag(c.floor)}<span class="st">未上架 <b>${fmt(c.points)}</b> 點・<b>${fmt(c.pcs)}</b> 個・最舊開箱 <b>${md(c.oldest)}</b>${c.low?`・庫存不到 7 天 <b>${fmt(c.low)}</b> 點`:''}</span>`;
    const t=stateTxt&&stateTxt.cart===c.cart?stateTxt.t:null,rd=D.inbound&&D.inbound.reportDate;
    document.getElementById('stt').innerHTML=t?`台車狀態：<b>${esc(t)}</b>（原本的零件查詢，即時）`:`${stateTxt&&stateTxt.cart===c.cart?'原本的零件查詢查無這台車的狀態':'台車狀態讀取中…'}${rd?`　991 追蹤算到 ${md(rd)}。`:''}`;
  });
  /* 件號數字小卡 */
  function card(it,c){
    const [name,fl,slots,star]=pinfo(it[0]),d=dmap.get(keyOf(it[0]));
    const net=d?d.diff-d.transit:null;
    const cell=(l,v,u,s,cls)=>`<div class="kpi"><span class="kl">${l}</span><span class="big ${cls||''}">${v}${u?`<u>${u}</u>`:''}</span>${s?`<span class="k">${s}</span>`:''}</div>`;
    return `<div class="xl"><b>${esc(name||'（沒有品名）')}</b><span class="k">商品別 ${esc(it[6]||keyOf(it[0]).charAt(0))}</span>${tag(fl||c.floor)}${star?'<span class="k">★ 常揀</span>':''}<span class="k">發票 ${esc(it[2])}・開箱 ${md(it[3])}・這台車 ${fmt(it[1])} 個</span></div>
  <div class="xk"><div class="kpis">${cell('HOPES 庫存',d?fmt(d.hopes):'—','pcs',d?'':'沒有未清帳差，數量由零件查詢讀取',d?'':'zero')}${cell('WES 庫存',d?fmt(d.wes):'—','pcs','',d?'':'zero')}${cell('帳差 HOPES−WES',d?(net?sgn(net):'0'):'0','pcs',d?(d.transit?`已扣在途 ${fmt(d.transit)} pcs`:(d.clo?`封箱 ${fmt(d.clo)} pcs`:'')):'目前沒有未清帳差',net?'bad':'zero')}${cell('WES 儲位',fmt(slots),'個','')}</div></div>
  <div class="note"><a class="lk" href="${esc(hashOf('find/'+encodeURIComponent(it[0])))}">查零件 ›　看這個件號的全部項目、待辦與履歷</a></div>`;
  }
  /* 未上架零件表（可依欄位排序；件號列展開＝數字小卡） */
  const COLS=[['件號',null,0],['發票數量','pcs',1],['發票號碼','',2],['開箱日','',3],['在庫','pcs',4],['庫存天數','天',5]];
  function rowsOf_(c,st){
    let r=c.items.slice();
    if(st.sort!=null){const k=st.sort,s=st.desc?-1:1;r.sort((a,b)=>{const x=a[k]==null?-1:a[k],y=b[k]==null?-1:b[k];return (x<y?-1:x>y?1:0)*s})}
    return r;
  }
  S.on(st=>{
    const c=cart(),rows=rowsOf_(c,st);
    document.getElementById('tb').textContent=`${fmt(c.items.length)} 筆`;
    const head=COLS.map(([n,u,k])=>[`<button type="button" class="sortb${st.sort===k?' on':''}" data-k="${k}">${n}${st.sort===k?(st.desc?' ▾':' ▴'):''}</button>`,u,k===2||k===3?'m-hide':'']);
    K.xtable('#tbl',{head,limit:10,empty:'這台車目前 0 筆未上架零件',
      rows:rows.map(it=>({c:[`<span class="mono">${esc(it[0])}</span><span class="k">${esc(pinfo(it[0])[0])}</span>`,fmt(it[1]),esc(it[2]),md(it[3]),fmt(it[4]),it[5]==null?'–':fmt(it[5],1)],x:()=>card(it,c)})),
      after:el=>el.querySelectorAll('.sortb').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=+b.dataset.k;S.set(st.sort===k?{desc:!st.desc}:{sort:k,desc:k!==0&&k!==3?true:false})})});
  });
  /* 複製、匯出 */
  const xrows=()=>rowsOf_(cart(),S.get()).map(it=>[it[0],it[1],it[2],md(it[3]),it[4],it[5]==null?'':it[5]]);
  const xhead=COLS.map(x=>x[0]+(x[1]?'('+x[1]+')':''));
  document.getElementById('cp').onclick=()=>V5.copy(xhead,xrows());
  document.getElementById('xl').onclick=()=>V5.xlsx('台車未上架零件',xhead,xrows(),'台車_'+cart().cart+'_未上架零件_'+isoDay(Date.now()).replace(/-/g,'')+'.xlsx');
  K.onResize(()=>S.go());
  /* 台車狀態：原本的零件查詢（非同步） */
  {let dead=false;V5.clean.push(()=>{dead=true});
   const c0=S.get('cart');
   const ask=cn=>lkRead(keyOf(cn)).then(d=>{if(dead)return;const r=d&&d.cart&&d.cart.records&&d.cart.records[0];stateTxt={cart:cn,t:r?`${r.STATE_SUMMARY||'查無狀態'}　最後更新 ${r.MTDT||'–'}`:''};S.go()}).catch(err=>{if(dead)return;stateTxt={cart:cn,t:''};S.go()});
   const asked=new Set([c0]);ask(c0);S.on(st=>{if(!asked.has(st.cart)){asked.add(st.cart);ask(st.cart)}})}
}

/* ================= v5 詳細說明（ref）：設計稿 redesign_v5\pages\ref.template.html 的上線版 =================
   內容（段落、項目、來源與算法）一字不改，來自 ref.js 的段落資料陣列（REF_FIXED／REF_TAIL／每一項待辦的節點定義 INV_NODES），不抓畫面。
   「資料更新時間」「問題查找怎麼排」兩段本來就是函式產生的 HTML（refFreshHtml／refFindRule），這裡把它們的 <dl>／<table> 拆成同一個列結構。
   左側目錄（≤ 900px 收成「跳到」選單）＋搜尋框（沒有相關字的段落收起來、有相關字的列標淡紅）。
   網址：ref／ref/<段落代號>（舊的 #r-段落 也是這個代號）；搜尋字 q 寫進 query。盤點資料（階段日期、盤點追查更新時間）還沒載好時先寫「載入後顯示」，載完補上。 */
(()=>{
const LEAD='數字看起來不對時來這裡查：從哪個系統、哪張表來，差異是誰減誰。';
const dlRows=h=>{const d=new DOMParser().parseFromString('<body>'+h+'</body>','text/html'),out=[];
  d.querySelectorAll('dl').forEach(dl=>{let cur=null;for(const c of dl.children){if(c.tagName==='DT'){cur=[c.innerHTML,''];out.push(cur)}else if(c.tagName==='DD'&&cur)cur[1]=c.innerHTML}});return out};
const tblOf=h=>{const d=new DOMParser().parseFromString('<body>'+h+'</body>','text/html'),tb=d.querySelector('table');
  return tb?{head:[...tb.querySelectorAll('thead th')].map(x=>x.textContent.trim()),rows:[...tb.querySelectorAll('tbody tr')].map(tr=>[...tr.children].map(td=>td.innerHTML))}:null};

/* ---------- 資料轉接：和 ref.js 的 pRef 同一份段落清單 ---------- */
function data(){
  const nodes=INV_NODES.filter(t=>IVN_UI[t.id]&&(t.board==='ab'||t.board==='abd'||t.board==='inv')&&t.id!==16),secs=[];
  const add=(id,title,rows,tbl,board)=>secs.push({id,title,board:board||'',rows,tbl:tbl||null});
  REF_FIXED.forEach(([id,title,rows])=>add(id,title,id==='fresh'?dlRows(refFreshHtml()):(rows||[])));
  nodes.forEach(t=>add('t-'+ivnSlug(t),t.name,refNodeRows(t),null,t.board));
  REF_TAIL.forEach(([id,title,rows])=>{
    if(id==='findrule'){const h=refFindRule();add(id,title,dlRows(h),tblOf(h))}
    else add(id,title,id==='inv'?(rows||[]).concat(refInvPhases()):(rows||[]))});
  const g=(typeof META!=='undefined'&&META&&META.generatedAt)||'';
  return {secs,gen:g,lead:LEAD};
}

function mount(S,D,ctx){
  const {esc}=K,SECS=D.secs;
  /* 目錄分組（順序同內文，不重排） */
  const grpOf=s=>{if(/^t-/.test(s.id))return s.board==='inv'?'g3':'g2';
    if(['todo'].includes(s.id))return 'g2';
    if(['other','part','find','findrule','inv'].includes(s.id))return 'g4';
    return 'g1'};
  const GN={g1:'資料更新與營運頁',g2:'異常待辦（共通＋各項）',g3:'盤點後出問題（各項）',g4:'其他狀況、零件、查零件、盤點'};
  const plain=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&').replace(/\s+/g,' ').toLowerCase();
  const fix=h=>String(h||'').replace(/class="chip (ok|warn|bad)"/g,'class="st $1"').replace(/class="chip "/g,'class="st ok"').replace(/class="muted"/g,'class="k"');
  const rowHit=(r,q)=>q&&plain(r.join(' ')).includes(q);
  /* 頁首 */
  {const el=document.getElementById("asof");
   if(el&&D.gen){const t=new Date(new Date(D.gen).getTime()+8*3600e3),p=n=>String(n).padStart(2,'0');
     if(isFinite(t))el.textContent=`資料 ${t.getUTCFullYear()}/${p(t.getUTCMonth()+1)}/${p(t.getUTCDate())} ${p(t.getUTCHours())}:${p(t.getUTCMinutes())}`}}
  const qEl=document.getElementById('rq');
  qEl.value=S.get('q')||'';
  qEl.addEventListener('input',()=>S.set('q',qEl.value.trim().toLowerCase()));
  document.getElementById('rqx').onclick=()=>{qEl.value='';S.set('q','')};
  /* 符合搜尋的段落 */
  const matchOf=q=>SECS.map(s=>{if(!q)return {s,ok:true,n:0};const tm=plain(s.title).includes(q);
    const n=s.rows.filter(r=>rowHit(r,q)).length+(s.tbl?s.tbl.rows.filter(r=>rowHit(r,q)).length:0);return {s,ok:tm||n>0,n}});
  /* 範圍 */
  S.on(st=>{const m=matchOf(st.q),k=m.filter(x=>x.ok).length;
    document.getElementById('scope').innerHTML=st.q?`搜尋「<b>${esc(qEl.value.trim())}</b>」 · 符合 <b>${k}</b>／${SECS.length} 段`:`顯示全部 <b>${SECS.length}</b> 段`});
  /* 目錄＋手機選單 */
  S.on(st=>{
    const m=matchOf(st.q),okSet=new Set(m.filter(x=>x.ok).map(x=>x.s.id));
    let h='',last='';
    SECS.forEach(s=>{const g=grpOf(s);if(g!==last){h+=`<div class="tg">${GN[g]}</div>`;last=g}

document.addEventListener('click',e=>{if(!e.target.closest('#hdr .hq'))$('#sugg').classList.remove('on')});
/* ================= 資料時間燈號（右上角） =================
   門檻放在這裡，之後要調只改這幾個數字：
     workStart／workEnd  上班時段（台北時間）；只有這段時間、且不是週日與假日（meta.calendar.holidays）才計入「資料有多舊」
     warnHours           資料超過幾個「上班小時」沒更新 → 黃燈
     badWorkDays         超過幾個「上班日」（＝上班小時 × 一天的長度）沒更新 → 紅燈
   任一區塊 meta.status 不是 ok（這次更新失敗、沿用上一版）或資料是 null → 至少黃燈。
   算法用「上班小時」而不是日曆時間：週六 20:30 最後一輪排程到週一 08:00 只算 1 小時，不會週一早上一開就紅燈。 */
const FRESH_CFG={workStart:7,workEnd:21,warnHours:3,badWorkDays:1};
function workHoursBetween(t0,t1){
  const hol=new Set((META&&META.calendar&&META.calendar.holidays)||[]),H=36e5;let total=0;
  for(let d=Math.floor((t0+8*H)/864e5);;d++){
    const day0=d*864e5-8*H;if(day0>t1)break;
    const dt=new Date(d*864e5);if(dt.getUTCDay()===0||hol.has(dt.toISOString().slice(0,10)))continue;
    const a=Math.max(t0,day0+FRESH_CFG.workStart*H),b=Math.min(t1,day0+FRESH_CFG.workEnd*H);if(b>a)total+=b-a;
  }
  return total/H;
}
/* 回傳 {level:0|1|2|-1(沒有 meta), rows:[{key,name,asOf,gen,level,why}], newest} */
function freshState(now=Date.now()){
  if(!META||!META.sections)return {level:-1,rows:[],newest:NaN};
  const badH=FRESH_CFG.badWorkDays*(FRESH_CFG.workEnd-FRESH_CFG.workStart),rows=[];let level=0,newest=NaN;
  Object.keys(META.sections).forEach(k=>{
    const i=META.sections[k],t=parseT(i.generatedAt),wh=isFinite(t)?workHoursBetween(t,now):0;let lv=0,why='';
    const ext=!(k in D);  /* 不在這包資料裡、另外載入的區塊（例如第三看板的 inv.enc）：列在彈出框，但不影響這個燈號，由用到它的看板自己提示 */
    if(D[k]==null&&!ext){lv=1;why='沒有資料'}else if(secBad(k)){lv=1;why='這次更新失敗，沿用上一版'}
    if(wh>badH){lv=2;why='超過 '+FRESH_CFG.badWorkDays+' 個上班日沒更新'}else if(wh>FRESH_CFG.warnHours&&lv<1){lv=1;why='超過 '+FRESH_CFG.warnHours+' 小時沒更新'}
    if(ext){why=(secStatus(k)&&secStatus(k)!=='ok'?String(secStatus(k)).slice(0,24):'另行載入');lv=0}
    else if(isFinite(t)&&!(t<newest))newest=t;
    rows.push({key:k,name:secName(k),asOf:asOfLabel(k)||'–',gen:isFinite(t)?fmtT(t):'–',level:lv,why,ext});level=Math.max(level,lv);
  });
  /* W19：「看板資料今天有沒有正常更新」（原每日檢查第 0 項）併進這個燈號：今天有幾次沒更新完整就至少黃燈（第三看板資料載入後才知道） */
  try{if(typeof INV!=='undefined'&&INV.status==='ready'){const x=invLoopList().find(y=>y.n===0);if(x&&x.cnt>0){level=Math.max(level,1);rows.push({key:'health',name:'看板資料今天有沒有正常更新',asOf:'–',gen:'–',level:1,why:invLoopEm(x).replace(/<[^>]+>/g,''),ext:false})}}}catch(e){}
  return {level,rows,newest};
}
/* 右上角：只有「資料 MM/DD HH:MM」＋燈號，點了到詳細說明 #ref/fresh（各區塊來源、更新頻率、這次更新時間與狀態都在那裡；W19 取代原本滑過彈出的框） */
function renderFresh(){
  try{
    const f=freshState(),main=(D.fresh&&D.fresh.main)||(isFinite(f.newest)?fmtT(f.newest):'–'),el=$('#fresh');if(!el)return;
    const word=['資料','資料需留意','資料已過期'][Math.max(0,f.level)];
    el.classList.remove('ok','warn','bad','na');el.classList.add(f.level<0?'na':['ok','warn','bad'][f.level]);
    $('#freshText').textContent=word+' '+main;$('#freshShort').textContent=main.slice(-5);
    el.title='各資料來源的更新時間（點一下看詳細說明）';
    el.setAttribute('aria-label',word+' '+main+'（點一下看各資料來源的更新時間）');
  }catch(e){console.error(e)}
}
renderFresh();setInterval(renderFresh,6e4);
$('#fresh').setAttribute('href',hashOf('ref/fresh'));$('#brand').setAttribute('href',hashOf('ops'));$('#hdrRef').setAttribute('href',hashOf('ref'));
route(true);
</script>
<script>
(function(){
  const msg=t=>{document.body.innerHTML='<div style="font:16px/1.7 \'Microsoft JhengHei\',system-ui,sans-serif;max-width:560px;margin:90px auto;padding:0 24px;color:#17222d"><h2 style="margin:0 0 8px">三倉看板</h2><p style="color:#617283">'+t+'</p></div>'};
  const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const APP=document.getElementById('app').textContent;
  const key=location.hash.slice(1).split('/')[0];
  window.DASH_KEY=key;
  if(!key){msg('這個網址缺少金鑰。請向管理者要完整連結（網址最後面有一長串 # 開頭的字）。');return}
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){msg('這個瀏覽器太舊，請改用新版 Edge、Chrome 或 Safari。');return}
  msg('載入資料中…');
  (async()=>{
    try{
      const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('資料檔讀取失敗（'+r.status+'）');
      const buf=new Uint8Array(await r.arrayBuffer());
      let k;try{k=await crypto.subtle.importKey('raw',b64(key),'AES-GCM',false,['decrypt'])}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12))}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      const text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      window.DATA=JSON.parse(text);
    }catch(e){msg(e.message||String(e));return}
    document.body.innerHTML=window.__BODY;
    const s=document.createElement('script');s.textContent=APP;document.body.appendChild(s);
  })();
})();
</script></body>
