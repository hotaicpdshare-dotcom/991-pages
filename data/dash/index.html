<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三倉看板</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#17222d;--ink2:#3a4a59;--muted:#617283;--line:#e2e8ee;--line2:#edf1f5;--soft:#f7f9fb;
  --brand:#941e34;--brandS:#fbeff2;--accent:#0b7285;--accentS:#e3f4f7;
  --f2:#2563eb;--f3:#e8710a;--good:#12805c;--goodS:#e3f5ee;--bad:#c0362c;--badS:#fde9e7;--warn:#a56a2c;--warnS:#fdf1e0;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent);text-decoration:none;font-weight:700}a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---------- 頂部 ---------- */
header.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:18px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand i{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:19px}
.brand b{display:block;font-size:18px;line-height:1.15}.brand span{font-size:12.5px;color:var(--muted)}
.boards{display:flex;gap:6px;padding:5px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.boards button{padding:8px 20px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:16px;color:var(--muted)}
.boards button.on{background:var(--brand);color:#fff}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:44px;padding:0 54px 0 42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.search input::placeholder{color:#8c9aa8}
.search:before{content:"";position:absolute;left:15px;top:14px;width:12px;height:12px;border:2px solid #8c9aa8;border-radius:50%}
.search:after{content:"";position:absolute;left:28px;top:27px;width:7px;height:2px;background:#8c9aa8;transform:rotate(45deg)}
.search kbd{position:absolute;right:10px;top:10px;padding:1px 9px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:13px;background:var(--soft)}
.sugg{position:absolute;left:0;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);display:none;overflow:hidden}
.sugg.on{display:block}.sugg button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;font-size:15.5px}
.sugg button:hover{background:var(--soft)}
.fresh{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;color:var(--ink2);white-space:nowrap;background:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.pop{position:absolute;right:0;top:52px;width:340px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);display:none;color:var(--ink);white-space:normal;z-index:40;font-size:14.5px}
.fresh:hover .pop,.fresh:focus-within .pop{display:block}.pop table{width:100%;border-collapse:collapse}.pop td{padding:4px 0}.pop td:last-child{text-align:right;color:var(--muted)}
/* ---------- 版型 ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 64px)}
nav.side{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);padding:22px 14px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
nav.side h4{margin:22px 14px 8px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
nav.side h4:first-child{margin-top:4px}
nav.side a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:16px;border-left:3px solid transparent}
nav.side a:hover{background:var(--soft);text-decoration:none}
nav.side a.on{background:var(--brandS);color:var(--brand);border-left-color:var(--brand);font-weight:700}
nav.side a small{margin-left:auto;font-size:12.5px;padding:0 8px;border-radius:99px;background:var(--warnS);color:var(--warn)}
main{min-width:0}.content{max-width:1480px;margin:0 auto;padding:30px 36px 72px}
.ph{margin:0 0 6px}.ph h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}.ph p{margin:4px 0 0;font-size:16px;color:var(--muted)}
.mockbar{margin:14px 0 4px;padding:10px 16px;border-radius:10px;background:var(--warnS);color:var(--warn);font-size:14.5px}
.sec{display:flex;align-items:baseline;gap:14px;margin:38px 0 16px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.sec h2{margin:0;font-size:21px;font-weight:800}.sec span{font-size:15px;color:var(--muted)}
.grid{display:grid;gap:20px;align-items:stretch}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px}
.card-h h3{margin:0;font-size:17px;font-weight:800;color:var(--ink)}.card-h>span{font-size:14.5px;color:var(--muted)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:700;background:var(--warnS);color:var(--warn);margin-left:8px;vertical-align:1px}
a.card,button.card{text-align:left;color:inherit;font-weight:400;width:100%}a.card:hover,button.card:hover{text-decoration:none;border-color:var(--accent)}
/* 2F | 3F 對齊欄位 */
.cols{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);column-gap:28px}
.col{min-width:0}
.pill{display:inline-block;min-width:38px;padding:1px 10px;border-radius:99px;font-size:14px;font-weight:800;color:#fff;text-align:center}
.pill.f2{background:var(--f2)}.pill.f3{background:var(--f3)}.pill.all{background:var(--ink2)}
.big{margin:8px 0 0;font-size:38px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line2);font-size:15.5px;color:var(--ink2);white-space:nowrap}
.ln:first-of-type{margin-top:14px}.ln b{color:var(--ink);font-variant-numeric:tabular-nums}
.d{font-size:13.5px;font-weight:700;margin-left:5px}.d.up{color:var(--bad)}.d.down{color:var(--good)}.d.eq{color:var(--muted)}
/* KPI 表（標籤 | 2F | 3F） */
.kpi{display:grid;grid-template-columns:minmax(150px,1fr) 96px 96px;column-gap:10px;align-items:center}
.kpi .h{font-size:14px;color:var(--muted);font-weight:700;padding:0 0 10px;border-bottom:1px solid var(--line)}
.kpi .h.r,.kpi .v{text-align:right}
.kpi .l{white-space:nowrap;padding:14px 0;border-bottom:1px solid var(--line2);font-size:15.5px;color:var(--ink2)}
.kpi .v{padding:14px 0;border-bottom:1px solid var(--line2);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v.span{grid-column:span 2;font-size:17px}.kpi .v.bad{color:var(--bad)}
.kpi .l:nth-last-child(-n+3),.kpi .v:nth-last-child(-n+2){border-bottom:0}
.foot{margin-top:auto;padding-top:14px;font-size:14.5px;color:var(--muted)}
/* 控制列 */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 18px}.tools .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{padding:8px 16px;border:0;background:transparent;font-weight:700;color:var(--muted);font-size:15px}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--accent);color:#fff}
.cc-btns .btn{height:34px;padding:0 11px;font-size:14px}.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:14.5px}.btn:hover{border-color:var(--accent);color:var(--accent)}
input[type=search],.in{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15.5px;min-width:240px}
/* 圖表卡片 */
.cc{margin:0}
.cc-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.cc-h h3{margin:0;font-size:18px;font-weight:800}.cc-h p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.cc-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* 昨日重點：圖形列 */
.vz{display:grid;grid-template-columns:96px minmax(0,1fr) 112px;column-gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line2)}
.vz:first-of-type{border-top:0;padding-top:4px}.vz.ax{padding-bottom:34px}
.vz .l{color:var(--ink2);font-size:15.5px;white-space:nowrap}.vz .v{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.4}.vz .v b{display:block}.vz .v .a{color:var(--f2)}.vz .v .c{color:var(--f3)}.vz .v .r{color:var(--bad)}.vz .v .m{color:var(--muted)}
.axis{position:relative;height:32px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/var(--stepw) 100%}
.axis .dot.c3{top:66%}.axis .tk{position:absolute;top:36px;font-size:13px;color:var(--muted);transform:translateX(-50%)}
.axis .dot{position:absolute;top:34%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.dbars{display:grid;gap:5px}.dbar{height:18px;border-radius:5px;background:var(--soft);position:relative;overflow:hidden}.dbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.stk{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--soft)}.stk i{display:block}
.vz .fl{display:flex;align-items:center}
.cc-ctl{display:none;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:0 0 14px;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:14.5px;color:var(--ink2)}
.cc-ctl label{display:inline-flex;gap:10px;align-items:center}.cc-ctl output{min-width:58px;color:var(--ink);font-weight:800}
.cc-ctl input[type=range]{width:150px;accent-color:var(--accent)}.cc-ctl .seg button{padding:6px 12px;font-size:14px}
.cc.open .cc-ctl{display:flex}.cc-cv{position:relative;margin-top:auto}.cc-cv canvas{width:100%;display:block;border-radius:10px;background:#fff}
.tip{position:absolute;pointer-events:none;z-index:5;min-width:170px;padding:10px 12px;border-radius:10px;background:#17222d;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:none}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;justify-content:space-between;gap:18px}
/* 表格 */
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-size:14px;font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t td{padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}.t .n{text-align:right;font-variant-numeric:tabular-nums}.t th.n{text-align:right}
.t tr:hover td{background:var(--soft)}.t tr.tr td{color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.bad{background:var(--badS);color:var(--bad)}.chip.warn{background:var(--warnS);color:var(--warn)}.chip.ok{background:var(--goodS);color:var(--good)}.chip.blue{background:var(--accentS);color:var(--accent)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.stat div{padding:14px 16px;border-radius:12px;background:var(--soft)}.stat small{display:block;color:var(--muted);font-size:14px;font-weight:700}.stat b{font-size:26px;font-variant-numeric:tabular-nums}.stat em{display:block;font-style:normal;font-size:13.5px;color:var(--muted)}
.stat .w b{color:var(--warn)}.stat .r b{color:var(--bad)}
.wait{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wait div{padding:14px 16px;background:var(--soft);border-radius:12px}.wait small{display:block;color:var(--muted);font-size:14px;font-weight:700}.wait b{font-size:30px}.wait b span{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.note{color:var(--muted);font-size:14px;margin:12px 2px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:11px 20px;border-radius:10px;background:#17222d;color:#fff;font-size:15px;z-index:99;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden}.acc+.acc{margin-top:12px}.acc>button{width:100%;display:flex;justify-content:space-between;padding:13px 16px;border:0;background:var(--soft);font-weight:700;font-size:16px;text-align:left}
.acc .ab{padding:6px 16px 14px;display:none}.acc.on .ab{display:block}
.hero{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin:0 0 18px}.hero h2{margin:0;font-size:30px}.hero span{color:var(--muted);font-size:16px}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side h4{display:none}nav.side a{white-space:nowrap;border-left:0}
  header.top{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}.search{order:5;flex-basis:100%;max-width:none;margin:0}.fresh{display:none}
  .content{padding:18px 16px 48px}.g2,.g3,.g4{grid-template-columns:1fr}.cols{column-gap:14px}
}
</style>
</head>
<body><script>window.__BODY="\n<header class=\"top\">\n  <div class=\"brand\"><i>三<\/i><div><b>三倉看板<\/b><span>2F ／ 3F 自動倉<\/span><\/div><\/div>\n  <div class=\"boards\" id=\"boards\"><\/div>\n  <div class=\"search\"><input id=\"q\" type=\"text\" placeholder=\"輸入件號或台車號，例如 9098113046、M0442\" autocomplete=\"off\"><kbd>/<\/kbd><div class=\"sugg\" id=\"sugg\"><\/div><\/div>\n  <div class=\"fresh\" tabindex=\"0\"><span class=\"dot\"><\/span><span id=\"freshText\"><\/span><div class=\"pop\" id=\"pop\"><\/div><\/div>\n<\/header>\n<div class=\"shell\"><nav class=\"side\" id=\"side\"><\/nav><main><div class=\"content\" id=\"page\"><\/div><\/main><\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n";</script><script type="text/plain" id="app">
'use strict';
const D = window.DATA, FL = ['2F','3F'], COL = {'2F':'#2563eb','3F':'#e8710a'};
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(n,d=1)=>n==null||isNaN(n)?'–':fmt(n*100,d)+'%';
const hh=h=>{if(h==null)return'–';let H=Math.floor(h),M=Math.round((h-H)*60);if(M==60){H++;M=0}return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
const md=d=>d.slice(5).replace('-','/');
const WK=['日','一','二','三','四','五','六'];
const wk=d=>'星期'+WK[new Date(d+'T00:00:00Z').getUTCDay()];
const FONT='"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",Arial,sans-serif';
const pl=p=>`<a href="#/search/${encodeURIComponent(p)}">${esc(p)}</a>`;
let LS={};try{LS=JSON.parse(localStorage.getItem('sancang.v3')||'{}')}catch(e){}
const saveLS=()=>{try{localStorage.setItem('sancang.v3',JSON.stringify(LS))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

/* ================= 資料輔助 ================= */
const DAYS=D.ops.days, LAST=DAYS[DAYS.length-1], OPN={north:'北區出貨',replenish:'副倉補充',follow:'副倉據點（FOLLOW）',puton:'進貨上架'};
function metric(day,op,fl){
  const m=day.m[op];if(!m)return null;if(fl!=='ALL')return m[fl]||null;
  const a=m['2F'],b=m['3F'];if(!a||!b)return a||b||null;
  const st=a.stations+b.stations,w=(x,y)=>(x*a.stations+y*b.stations)/st,pts=a.points+b.points;
  const ah=w(a.actualHours,b.actualHours),wh=w(a.waitHours,b.waitHours);
  return {stations:st,points:pts,actualHours:ah,waitHours:wh,ratio:wh/(ah+wh||1),totalPerItem:(ah+wh)*st*3600/pts,actualPerItem:ah*st*3600/pts,waitPerItem:wh*st*3600/pts};
}
function prevDay(op,fl){for(let i=DAYS.length-2;i>=0;i--){const m=metric(DAYS[i],op,fl);if(m)return m}return null}
function monthWait(fl,month){let o=0,oc=0,g=0,gc=0;for(const d of DAYS){if(d.d.slice(0,7)!==month)continue;const m=d.m.north&&d.m.north[fl];if(!m)continue;o+=m.openSum;oc+=m.openCount;g+=m.ongoingSum;gc+=m.ongoingCount}return {open:oc?o/oc:null,ongoing:gc?g/gc:null,oc,gc}}
const lastMonth=LAST.d.slice(0,7), prevMonth=(()=>{const [y,m]=lastMonth.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`})();

/* ================= 圖表引擎 =================
   畫面：依卡片寬度畫（真實像素字級，所以字不會被縮小）、2 倍以上解析度。
   複製／PNG：另外用 1400×600、2 倍解析度重畫一張，貼進信件或簡報不糊。 */
const CFG={}, st=id=>(LS[id]=LS[id]||{});
function niceCeil(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e}
function niceTop(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return([1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(c=>c>=m-1e-9))*e}
function ticksOf(max,min=0,count=5){const step=niceCeil((max-min)/count),a=[];for(let v=Math.ceil(min/step-1e-9)*step;v<=max+step/1e6;v+=step)a.push(+v.toFixed(6));return a}
function visible(cfg,s){const n=cfg.labels.length,r=cfg.ranges?Math.min(n,s.range||cfg.defRange||n):n;return {from:n-r,n:r}}
function chartCard(id,cfg){CFG[id]=cfg;return `<section class="card cc" id="cc-${id}"><div class="cc-h"><div><h3>${cfg.title}${cfg.sample?'<span class="tag">示意</span>':''}</h3>${cfg.sub?`<p>${cfg.sub}</p>`:''}</div><div class="cc-btns"><button class="btn" data-ca="adj" data-id="${id}">調整</button><button class="btn" data-ca="copy" data-id="${id}">複製圖</button><button class="btn" data-ca="png" data-id="${id}">PNG</button>${cfg.noData?'':`<button class="btn" data-ca="tsv" data-id="${id}">複製資料</button>`}</div></div><div class="cc-ctl" id="ctl-${id}"></div><div class="cc-cv"><canvas id="cv-${id}"></canvas><div class="tip" id="tip-${id}"></div></div></section>`}
function autoScale(cfg,s){
  const {from,n}=visible(cfg,s);let hi=0;

const LK={act:null,t:0,q:'',data:null,sel:''};
async function lkActive(force){
  if(force||!LK.act||Date.now()-LK.t>300000){
    const r=await fetch('../active.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('零件查詢資料尚未發布');
    LK.act=await r.json();LK.t=Date.now();
  }
  return LK.act;

async function lkRead(q,retry){
  const act=await lkActive(retry),norm=q.trim().replace(/^['’]+/,'').replace(/\s+/g,'').toUpperCase();
  const dg=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm)),h=[...new Uint8Array(dg)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const base='../releases/'+encodeURIComponent(act.version);
  const gone=()=>{if(!retry)return lkRead(q,true);throw new Error('零件查詢資料正在更新，請稍後再試')};
  const r1=await fetch(base+'/lookup/'+h.slice(0,2)+'.json',{cache:'force-cache'});
  if(r1.status===404)return gone();
  if(!r1.ok)throw new Error('索引讀取失敗（'+r1.status+'）');
  const id=String((await r1.json())[h]||'');
  if(!id)return null;
  const r2=await fetch(base+'/records/'+id.slice(0,2)+'.json',{cache:'force-cache'});
  if(r2.status===404)return gone();
  if(!r2.ok)throw new Error('查詢結果讀取失敗（'+r2.status+'）');
  const d=(await r2.json())[id];
  if(!d)throw new Error('查詢結果索引不一致，請稍後再試');
  return d;
}

function lkFill(q,inDash){

  const dr=DIF.find(r=>r[1]===q),ab=ABN.filter(r=>r[2]===q),ac=ABNC.filter(r=>r[1]===q),cc=D.inbound.carts.filter(c=>c.items.some(i=>i[0]===q));

  <div class="stat"><div class="${diffV?'r':''}"><small>帳差（HOPES − WES − 封箱）</small><b>${diffV==null?'無':(diffV>0?'+':'')+fmt(diffV)}</b><em>${dr?'HOPES '+fmt(dr[3])+'／WES '+fmt(dr[4])+'／封箱 '+fmt(dr[5])+(dr[8]?'；可能在途':''):'不在帳差清單'}</em></div><div class="${ab.length?'w':''}"><small>異常案件（看板）</small><b>${ab.length} 件</b></div><div class="${ac.length?'r':''}"><small>異常儲位（WESABNCELL）</small><b>${ac.length} 筆</b></div><div><small>未上架台車（991 追蹤）</small><b>${cc.length} 台車</b></div></div>
  <div style="height:14px"></div><div><div class="acc ${ab.length?'on':''}"><button onclick="this.parentNode.classList.toggle('on')">異常案件 <span>${ab.length}</span></button><div class="ab">${tb(ab.map(r=>`<tr><td>${r[0]}${r[1]}</td><td class="n">${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`))}</div></div>
   <div class="acc ${ac.length?'on':''}"><button onclick="this.parentNode.classList.toggle('on')">異常儲位（WES） <span>${ac.length}</span></button><div class="ab">${tb(ac.map(r=>`<tr><td>${r[0]}</td><td>${r[2]}</td><td class="n">${r[3]}</td></tr>`))}</div></div>

}
/* ================= 路由 ================= */
const NAV={ops:[['home','總覽'],['_','作業'],['workload','作業量與下班時間'],['eff','效率與等待'],['hit','貨架命中率'],['heat','貨架熱點圖'],['_','進貨與儲位'],['inbound','進貨追蹤'],['lt','進貨時間'],['util','儲位／貨架／空間利用率']],
  ab:[['home','總覽'],['_','異常'],['parts','異常零件'],['cases','異常案件'],['cells','異常儲位'],['_','帳務與進出貨'],['diff','帳差'],['picking','昨日以前揀料中'],['putdiff','上架數量不一致']]};

const MOUNT={'ops/home':['hN','hR','hF','hP','heat'],'ops/workload':['strip','wkPts','wkLate','wkIns'],'ops/eff':['eff'],'ops/hit':['hitOut','hitIn'],'ops/heat':['heat'],'ops/inbound':['inDaily','inOpen','inArr'],'ops/lt':['ltWeek','ltArr'],'ops/util':['utSlot','utVol'],
  'ab/parts':['abLayer','abLayer2'],'ab/cases':['abAge'],'ab/cells':['abCellRack'],'ab/diff':['abDiffDist'],'ab/picking':['abPick'],'ab/putdiff':['abPutDay']};
const KEY=window.DASH_KEY||'';
const hashPath=()=>{const h=location.hash.slice(1);if(!KEY)return h.replace(/^\//,'')||'ops/home';return h.startsWith(KEY+'/')?h.slice(KEY.length+1)||'ops/home':'ops/home'};
const hashOf=p=>KEY?'#'+KEY+'/'+p:'#/'+p;
let PATH=hashPath(),BOARD='ops',CUR='';
function go(p){PATH=p;try{history.replaceState(null,'',hashOf(p))}catch(e){}route()}
function route(){
  const parts=PATH.split('/');let board=parts[0],sub=parts[1];
  if(board==='search'){sub='search'}else if(!PAGES[board]){board='ops';sub='home'}else{BOARD=board;if(!PAGES[board][sub])sub='home'}
  const b=board==='search'?BOARD:board;
  $('#boards').innerHTML=[['ops','營運看板'],['ab','異常管理看板']].map(([k,t])=>`<button data-board="${k}" class="${k===b?'on':''}">${t}</button>`).join('');
  $('#side').innerHTML=NAV[b].map(x=>x[0]==='_'?`<h4>${x[1]}</h4>`:`<a href="#/${b}/${x[0]}" class="${board!=='search'&&sub===x[0]?'on':''}">${x[1]}${x[2]?`<small>${x[2]}</small>`:''}</a>`).join('');
  $('#page').innerHTML=board==='search'?pSearch(parts.slice(1).join('/')):PAGES[board][sub]();CUR=board==='search'?'search':board+'/'+sub;
  (MOUNT[CUR]||[]).forEach(mountChart);if(board==='search'&&parts[1]){const sq=decodeURIComponent(parts.slice(1).join('/')).trim().toUpperCase();lkFill(sq,D.inbound.carts.some(c=>c.cart===sq))}window.scrollTo(0,0);
}
/* ================= 事件 ================= */

  const lv=e.target.closest('[data-lkv]');if(lv){LK.sel=lv.dataset.lkv;const el=$('#lk');if(el&&LK.data)el.innerHTML=lkWhen()+lkPart(LK.data);return}

  const o=e.target.closest('[data-eop],[data-efl],[data-ewf],[data-ofl],[data-hu],[data-hd],[data-inf],[data-ltgs],[data-ltw]');
  if(o){const d=o.dataset;if(d.eop)S.ops.op=d.eop;if(d.efl)S.ops.floor=d.efl;if(d.ewf)S.ops.wfloor=d.ewf;if(d.ofl)S.ops.floor=d.ofl;if(d.hu)S.ops.hitUnit=d.hu;if(d.hd)S.ops.heatDate=d.hd;if(d.inf)S.ops.inFloor=d.inf;if(d.ltgs)S.ops.ltgs=d.ltgs;if(d.ltw)S.ops.ltw=d.ltw;const y=scrollY;route();scrollTo(0,y)}
});
document.addEventListener('input',e=>{
  const cs=e.target.closest('[data-cs]');if(cs){const id=cs.dataset.id,s=st(id),k=cs.dataset.cs;if(k==='labels'||k==='lineLabels')s[k]=cs.checked;else s[k]=+cs.value;saveLS();const out=cs.parentNode.querySelector('output');if(out)out.textContent=k==='rightMax'?cs.value+'%':CFG[id].left.fmt(+cs.value);paintScreen(id);return}
  const tq=e.target.closest('[data-tq]');if(tq){const id=tq.dataset.tq;TBL[id].q=tq.value;TBL[id].lim=TBL[id].opt.limit||100;clearTimeout(tq._t);tq._t=setTimeout(()=>refreshTable(id,true),200)}
});
document.addEventListener('change',e=>{const te=e.target.closest('[data-te]');if(te){TBL[te.dataset.te].extraOn=te.checked;refreshTable(te.dataset.te)}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
window.addEventListener('hashchange',()=>{PATH=hashPath();route()});
let RT;window.addEventListener('resize',()=>{clearTimeout(RT);RT=setTimeout(()=>(MOUNT[CUR]||[]).forEach(paintScreen),160)});
const ALL=[...new Set([...DIF.map(r=>r[1]),...ABN.map(r=>r[2]),...ABNC.map(r=>r[1]),...D.samples])];
$('#q').addEventListener('input',e=>{const v=e.target.value.trim().toUpperCase(),s=$('#sugg');if(v.length<3){s.classList.remove('on');return}
  const hit=[...D.inbound.carts.map(c=>c.cart).filter(c=>c.includes(v)).slice(0,3).map(c=>[c,'台車']),...ALL.filter(p=>p.includes(v)).slice(0,6).map(p=>[p,'件號'])];
  s.innerHTML=(hit.length?hit:[[v,'查詢']]).map(([p,k])=>`<button data-p="${esc(p)}"><b>${esc(p)}</b><span class="chip">${k}</span></button>`).join('');s.classList.add('on')});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim().toUpperCase();if(v){go('search/'+encodeURIComponent(v));$('#sugg').classList.remove('on')}}});
$('#sugg').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){go('search/'+encodeURIComponent(b.dataset.p));$('#sugg').classList.remove('on');$('#q').value=b.dataset.p}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sugg').classList.remove('on')});
$('#freshText').textContent='資料更新 '+D.fresh.main;
$('#pop').innerHTML='<b>各資料來源更新時間</b><table>'+D.fresh.src.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join('')+'</table>';
route();

<script>
(function(){
  const msg=t=>{document.body.innerHTML='<div style="font:16px/1.7 \'Microsoft JhengHei\',system-ui,sans-serif;max-width:560px;margin:90px auto;padding:0 24px;color:#17222d"><h2 style="margin:0 0 8px">三倉看板</h2><p style="color:#617283">'+t+'</p></div>'};
  const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const APP=document.getElementById('app').textContent;
  const key=location.hash.slice(1).split('/')[0];
  window.DASH_KEY=key;
  if(!key){msg('這個網址缺少金鑰。請向管理者要完整連結（網址最後面有一長串 # 開頭的字）。');return}
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){msg('這個瀏覽器太舊，請改用新版 Edge、Chrome 或 Safari。');return}
  msg('載入資料中…');
  (async()=>{
    try{
      const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('資料檔讀取失敗（'+r.status+'）');
      const buf=new Uint8Array(await r.arrayBuffer());
      let k;try{k=await crypto.subtle.importKey('raw',b64(key),'AES-GCM',false,['decrypt'])}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12))}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      const text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      window.DATA=JSON.parse(text);
    }catch(e){msg(e.message||String(e));return}
    document.body.innerHTML=window.__BODY;
    const s=document.createElement('script');s.textContent=APP;document.body.appendChild(s);
  })();
})();
</script></body>
