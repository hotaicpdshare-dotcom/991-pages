      ev:[['WES 倉缺暫存',`${fmt(W)} 個｜${mis.slice(0,3).map(r=>fdSlotL(r.ref)).join('、')}${mis.length>3?` 等 ${mis.length} 格`:''}｜${esc(fdD(at))}`],['HOPES 倉缺暫存',Hq?`${fmt(Hq)} 個（${esc(hTxt)}）`:'沒有']],
      notes:[`盤點期間（${fdRoundTxt()}）改成：放回原儲位，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）。`]});

    const l6=(invIdx().partSlots.get(k)||[]).filter(r=>+g(r,'rd')===1&&g(r,'disc')!=null&&+g(r,'disc')<0).map(r=>({pos:String(g(r,'pos')),q:-(+g(r,'disc')),at:g(r,'cntAt')||'',cnt:g(r,'cntQty')}));
    if(l6.length){
      const sel=fdSub(l6,H),R=sel.reduce((a,r)=>a+r.q,0),at=sel.map(r=>fdIso(r.at)).sort().pop();
      add({ord:6,R,at,own:[],act:()=>`放回原儲位 ${fdSlotsTxt(sel)}，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）；不要開上架單`,
        ev:sel.slice(0,6).map(r=>['盤少的儲位',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜盤差 −${fmt(r.q)} 個${r.cnt==null?'':'（盤點量 '+fmt(r.cnt)+'）'}`]),

  if(!out.length&&P.eff>0){
    const why=dRow?ivtWhy(dRow.causeCode,dRow.lastReason):'';
    add({ord:7.5,R:P.eff,at:dRow?String(dRow.first||'').replace(/^≤/,''):'',own:[1],dpos:true,up:true,
      act:N=>`WES 開單上架 ${fmt(N)} 個`,
      ev:[['帳差（HOPES−WES）',`${fdSgn(P.eff)} 個`],['第一次出現日',dRow?esc(mdy(String(dRow.first||'').replace(/^≤/,'').slice(0,10))):'–']].concat(why?[['帳差原因',esc(why)]]:[]),
      notes:['HOPES 已經多了，不用再動。']});

  /* 8 沒有對應的紀錄（沒有 1–6，也沒有正向帳差；帳差方向相反也走這裡）：動作留空 */
  if(!out.length){

      ev:P.eff<0?[['帳差（HOPES−WES）',`${fdSgn(P.eff)} 個（WES 比 HOPES 多，方向相反）`]]:[]});
    out[0].qc=0;

  out.sort((a,c)=>a.qc-c.qc||a.pc-c.pc||c.atMs-a.atMs||a.ord-c.ord);
  out.forEach(o=>{o.clears=fdClears(P,o,H,dRow,L,I)});

}
/* 做完之後會一起消失的待辦：帳差（HOPES−WES；補上架、補揀、WES 少帳這類會讓 WES 變多／出貨的動作，帳差 > 0 才算方向相符；其他動作看資料端判定的 diffs.toNode）、WES 上架 < HOPES 入帳（迴路 7、putdiff） */
function fdClears(P,c,H,dRow,L,I){
  const out=[];
  if(P.eff!==0&&(P.eff>0&&c.dpos||(dRow&&dRow.toNode&&(c.own||[]).includes(+dRow.toNode))))
    out.push({id:1,kind:'diff',html:`帳差未清（HOPES ≠ WES）<b>${fdSgn(P.eff)}</b> 個（HOPES−WES）`});
  if(c.cartRow)out.push({id:0,kind:'open',html:`未上架（991 追蹤）：台車 ${esc(c.cartRow.cart)} 的這個件號（應上架 ${fmt(c.cartRow.need)}、已上架 ${fmt(c.cartRow.put)}）`});
  if(c.up){
    L(7).forEach(r=>{
      const m=/HOPES 入帳 (\d+) > WES 上架 (\d+)/.exec(r.ev||'');
      out.push({id:3,kind:'l7',html:`上架少於入帳：${m?`WES 上架 ${m[2]} &lt; HOPES 入帳 ${m[1]}`:esc(invEv(r.ev))}（${esc(fdD(r.at))}）`});
    });
    I('putdiff').forEach(r=>out.push({id:0,kind:'putdiff',html:`HOPES≠WES 上架數：台車 ${esc(r.ref)}，${esc(r.note.replace(/^上架數量不一致：/,''))}（${esc(fdD(r.since))}）`}));
  }
  return out;
}

function fdQcChip(c,H){

  if(c.qc===0&&H<c.R)return `<span class="chip ok">可分次釋回 ${fmt(H)}≤${fmt(c.R)}</span>`;

function fdFillTiles(arg){
  const seg=String(arg||'').split('/').filter(Boolean);

  const P=fdPartInfo(res.rows[0]),sel={frcd:P.frcd,bare:P.bare,keys:[P.key]},host=document.getElementById('ktHost');if(!host)return;
  ktLookup(P.part).then(r=>{

    const open=[...h.querySelectorAll('.xcard:not([hidden])')].map(x=>x.id);

function fdFillCart(arg){

function series(n){
  const lc=invCols('ledger'),lr=invRows('ledger'),dc=invCols('diffs'),dr=invRows('diffs');if(lc.part==null||!lr.length)return [];
  const ev=new Map(),cur=new Set(),skip=new Set();
  lr.forEach(r=>{const k=keyOf(r[lc.part]);let a=ev.get(k);if(!a)ev.set(k,a=[]);a.push([String(r[lc.t]).slice(0,10),String(r[lc.t]),+r[lc.prev]||0,+r[lc.cur]||0])});
  ev.forEach(a=>a.sort((x,y)=>x[1]<y[1]?-1:x[1]>y[1]?1:0));
  dr.forEach(r=>{const k=keyOf(r[dc.part]);cur.add(k);if(+r[dc.toNode])skip.add(k)});
  const parts=[...new Set([...ev.keys(),...cur])].filter(k=>!skip.has(k)),hol=iwHol(),last=invRef().today,days=[];
  for(let d=last,i=0;i<60&&days.length<30;d=iwDay(d,-1),i++)if(iwIsWD(d,hol))days.unshift(d);
  const open=(k,day)=>{const a=ev.get(k);if(a){let s=null;for(const e of a){if(e[0]<=day)s=e;else break}return s?s[3]!==0:a[0][2]!==0}return cur.has(k)};

function ibOf(){
  const I=D.inbound;if(!I)return null;const T=I.trk,A=x=>x?[x.carts,x.points,x.pcs]:[null,null,null];
  if(T&&T.day&&T.open&&T.open.all&&T.arr&&T.arr.all)
    return {base:T.base||I.reportDate,daily:{open:T.day.open,putaway:T.day.putaway},open:{today:A(T.open.today),in3:A(T.open.in3),over3:A(T.open.over3),all:A(T.open.all)},arr:T.arr,noBox:T.noBox||0};
  if(!I.openDays||!I.carts||!I.daily||!I.daily.length)return null;
  const base=I.reportDate,n3=I.olderThan,od=I.openDays,cs=I.carts;
  const pts=rows=>rows.reduce((s,r)=>s+r['2F'].points+r['3F'].points,0),pcs=rows=>rows.reduce((s,r)=>s+r['2F'].pcs+r['3F'].pcs,0),nc=f=>cs.filter(c=>f(c.oldest)).length;
  const today=od.filter(r=>r.d===base),in3=od.filter(r=>r.d>=n3),old=od.filter(r=>r.d<n3);
  const arr={all:{impPoints:0,pkgPoints:0},in3:{impPoints:0,pkgPoints:0},over3:{impPoints:0,pkgPoints:0}};
  (I.arrived||[]).forEach(a=>Object.entries(a.counts||{}).forEach(([k,c])=>{const [kind,st]=k.split('|');if(st!=='已到貨')return;const f=kind==='進口件'?'impPoints':'pkgPoints';arr.all[f]+=c;arr[a.d>=n3?'in3':'over3'][f]+=c}));
  const dl=I.daily[I.daily.length-1];
  return {base,daily:{open:dl.open,putaway:dl.putaway},open:{today:[nc(o=>o===base),pts(today),pcs(today)],in3:[nc(o=>o>=n3),pts(in3),pcs(in3)],over3:[nc(o=>o<n3),pts(old),pcs(old)],all:[cs.length,pts(od),pcs(od)]},arr,noBox:0};
}

    x.m.forEach(r=>{(e[r.op]=e[r.op]||{})[r.floor]=[r.points,r.actualSec,r.waitSec,r.totalSec,r.stations]});M[d]=e;   /* 每天每作業別每樓層：[點數, 實際秒, 等待秒, 總作業秒, 開站數] */
    if(has(x.tm))tm[d]=x.tm;if(has(x.ib))ib[d]=x.ib;if(has(x.nw))nw[d]=x.nw;if(has(x.have))have[d]=x.have;
    if(has(x.rh)){rh[d]={};Object.keys(x.rh).forEach(c=>{rh[d][c]={};Object.keys(x.rh[c]).forEach(f=>{rh[d][c][f]=x.rh[c][f].slice(0,4)})})}   /* [同面點, 同面次, 同架點, 同架次] */
    if(has(x.sc)){sc[d]={};Object.keys(x.sc).forEach(f=>{sc[d][f]=x.sc[f].map(r=>r.slice(0,5))})}
    if(x.ex!=null&&has(x.have))exig[d]=x.ex.concat(x.ig||[]);   /* [排除揀貨, 排除上架, 工作站外揀貨, 工作站外上架] */
    if(has(x.rhFx))rhFx[d]=x.rhFx;   /* WP-D：days[d].rhFx[作業子集][樓層]={fixed,other}；還沒有就是空的 */
  });
  const rw={},pg={};
  ((D.ops&&D.ops.days)||[]).forEach(x=>{
    const r=x.rw||{};if(has(r)){rw[x.d]={};FL.forEach(f=>{rw[x.d][f]=SHIP.reduce((s,o)=>s+(((r[o]||{})[f]||{}).n||0),0)})}
    const p=x.pg||{};if(has(p)){pg[x.d]={};FL.forEach(f=>{if(p[f])pg[x.d][f]=[p[f].avg,p[f].groups]})}});
  const U=D.util,util=U&&U.floors&&U.yesterday&&U.yesterday.floors?{now:{},prev:{},prevDate:U.yesterdayDate,asOf:U.asOf}:null;
  if(util)FL.forEach(f=>{util.now[f]={used:U.floors[f].used,slots:U.floors[f].slots};util.prev[f]={used:U.yesterday.floors[f].used,slots:U.yesterday.floors[f].slots}});
  let fxList=null;for(let i=days.length-1;i>=0&&!fxList;i--)fxList=(Dd[days[i]].rhFxList)||null;
  const day=td.day,i0=days.indexOf(day);
  return {asOf:T.generatedAt,day,from:days[Math.max(0,i0-6)],today:td.today,days,M,tm,ib,rh,rhFx,rhFxList:fxList,sc,nw,exig,have,prog:T.progress||{},IB:ibOf(),
    over3:D.inbound?{'2F':ov('2F'),'3F':ov('3F')}:null,rw,pg,util};
}

function mount(S,D,ctx){

  /* 列印時圖用 560px 的畫布畫（才看得到數字標籤），再用 viewBox 縮到欄寬 */
  function BL(el,o){if(typeof el==='string')el=K.$(el);if(PV){el.style.width='560px';if(!o.noTopPV)o.topLabel=true;o.lineLabel=true}K.barLine(el,o);if(PV){el.style.width='';const sv=el.querySelector('svg');if(sv){sv.setAttribute('viewBox','0 0 '+sv.getAttribute('width')+' '+sv.getAttribute('height'));sv.style.width='100%';sv.style.height='auto'}}}

  const todayNote=()=>`<div class="empty"><span style="font-weight:700;color:var(--ink2)">今日（即時）資料還不完整</span>：目前只有上架（WAR）；揀貨與查照要等隔天每日報表 CSV，沒有資料的地方顯示「—」。</div>`;
  function todayBtn(){const b=document.getElementById('bToday');if(!b)return;const st=S.get(),on=st.day===TDK;b.className='chip'+(on?' on':'');b.textContent=on?`今日（即時，資料 ${TDY.at}）`:'看今日';b.title=on?'回到最近完整作業日':'看今日的即時資料';b.onclick=()=>S.set(on?{day:D.day,mode:'day'}:{day:TDK,mode:'day'})}
  
  const clk=s=>{if(s==null)return'—';s=Math.floor(s/60);const nx=s>=1440;s%=1440;return(nx?'翌日 ':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const mget=(k,op,f)=>D.M[k]&&D.M[k][op]&&D.M[k][op][f];
  const avg=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
  const sum=a=>a.reduce((s,x)=>s+(x||0),0);
  const dnOf=d=>d.replace(/-/g,'/');

  {const st0=S.get();if(!DAYS.includes(st0.day))st0.day=D.day;if(!DAYS.includes(st0.from))st0.from=DAYS.find(x=>x>=st0.from)||D.from;if(st0.mode!=='range')st0.mode='day';if(!['all','2F','3F'].includes(st0.fl))st0.fl='all'}

  /* ① 歷史：每日點數＋各樓層最後完成時間（取代對話框） */
  function histRows(st){

    const insp=(k,f)=>{const t=D.tm[k];if(!t)return undefined;if(card==='total')return f==null?(t.insp==null?null:t.insp):undefined;if(card==='follow')return t.inspF&&t.inspF[f]!=null?t.inspF[f]:null;return undefined};
    let ds=DAYS.filter(k=>k<=st.day);
    let rows=ds.map(k=>({k,p:{'2F':pts(k,'2F'),'3F':pts(k,'3F')},t:{'2F':fin(k,'2F'),'3F':fin(k,'3F')},ti:insp(k,null),tf:{'2F':insp(k,'2F'),'3F':insp(k,'3F')},hasTm:!!D.tm[k]})).filter(r=>fls.some(f=>r.p[f]!=null));

  function histChart(el,rows,o){
    const n=rows.length;if(!n){el.innerHTML='<div class="empty">沒有資料</div>';return}
    const W=Math.max(300,el.clientWidth||900),H=300,L=64,R=52,T=28,B=36,pw=W-L-R,ph=H-T-B,FS=14,slot=pw/n,fls=o.fls;
    const tv=[];rows.forEach(r=>{fls.forEach(f=>{if(r.t[f]!=null)tv.push(r.t[f])});if(o.insp&&r.ti!=null)tv.push(r.ti)});
    let lo=tv.length?Math.floor(Math.min(...tv)/3600):12,hi=tv.length?Math.ceil(Math.max(...tv)/3600):24;if(hi-lo<4)hi=lo+4;
    const tstep=hi-lo<=8?1:hi-lo<=16?2:3,ty=v=>T+ph-ph*(v/3600-lo)/(hi-lo);
    const tot=rows.map(r=>sum(fls.map(f=>r.p[f])));let pm=Math.max(10,...tot);const ps=[10,20,50,100,200,500,1000,2000,2500,5000,10000,20000].find(s=>pm*1.1/s<=5)||50000;pm=Math.ceil(pm*1.1/ps)*ps;const py=v=>T+ph-ph*v/pm;
    const bw=Math.min(28,slot*0.62),x=i=>L+slot*(i+.5),every=Math.max(1,Math.ceil(40/slot));
    const lab=h=>(h>=24?'翌日 ':'')+String(h%24).padStart(2,'0')+':00';
    let s=`<svg width="${W}" height="${H}" role="img" font-size="${FS}">`;
    if(o.sel>=0)s+=`<rect x="${L+slot*o.sel}" y="${T}" width="${slot}" height="${ph}" fill="#fbeef0"/>`;
    for(let h=lo;h<=hi;h+=tstep)s+=`<line x1="${L}" x2="${W-R}" y1="${ty(h*3600)}" y2="${ty(h*3600)}" stroke="#e8ecf0"/><text x="${L-6}" y="${ty(h*3600)+5}" text-anchor="end" fill="#3f4d5c">${lab(h)}</text>`;
    for(let v=0;v<=pm;v+=ps)s+=`<text x="${W-R+6}" y="${py(v)+5}" fill="#6c7a89">${fmt(v)}</text>`;
    s+=`<text x="${L-6}" y="14" text-anchor="end" fill="#6c7a89">時間</text><text x="${W-R+6}" y="14" fill="#6c7a89">點</text>`;
    rows.forEach((r,i)=>{let acc=0;fls.forEach(f=>{const v=r.p[f]||0;if(v>0){s+=`<rect x="${x(i)-bw/2}" y="${py(acc+v)}" width="${bw}" height="${Math.max(.5,py(acc)-py(acc+v))}" fill="${f==='2F'?'#cfdcf7':'#f8dcc0'}"/>`}acc+=v});
      if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-B+20}" text-anchor="middle" fill="${i===o.sel?'#941e34':'#3f4d5c'}" font-weight="${i===o.sel?700:400}">${md(r.k)}</text>`});
    const path=(get,col,dash)=>{let d='',pen=false;rows.forEach((r,i)=>{const v=get(r);if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+ty(v);pen=true});
      let c='';if(n<=45)rows.forEach((r,i)=>{const v=get(r);if(v!=null)c+=`<circle cx="${x(i)}" cy="${ty(v)}" r="3" fill="#fff" stroke="${col}" stroke-width="2"/>`});
      return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?`stroke-dasharray="${dash}"`:''}/>${c}`};
    fls.forEach(f=>s+=path(r=>r.t[f],f==='2F'?K.C.f2:K.C.f3));
    if(o.insp)s+=path(r=>r.ti,'#3f4d5c','5 4');
    rows.forEach((_,i)=>s+=`<rect class="hit" data-i="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}"/>`);
    el.innerHTML=s+'</svg>';
    el.querySelectorAll('.hit').forEach(h=>K.tip.bind(h,()=>{const r=rows[+h.dataset.i];
      return K.tip.card(`${ymd(r.k)}（${wk(r.k)}）`,o.nm,[...fls.map(f=>[f==='2F'?K.C.f2:K.C.f3,f+' 點數',fmt(r.p[f]),'點']),...fls.map(f=>[f==='2F'?K.C.f2:K.C.f3,f+' '+o.lab,r.t[f]===undefined?'未匯入':r.t[f]===null?'無紀錄':clk(r.t[f]),'']),...(o.insp?[['#3f4d5c','查照結束',r.ti==null?'—':clk(r.ti),'']]:[])],'',r.k===S.get('day')?[]:[['看這天',()=>S.set({day:r.k,pv:'now'})]])}));
  }

/* ================= v5 效率與開站（ops/eff，併開站甘特圖）：設計稿 redesign_v5\pages\eff.template.html 的上線版 =================
   篩選列：作業日期（單日／區間平均）、樓層、作業別（膠囊，可複選），帶動 ① 人員效率 ② 站點效率與 AGV ③ 開站數 ④ 開站甘特圖 ⑤ 北區出貨等待 ⑥ 三倉每日效率統計；
   ③ 的某一列點了 → ④ 甘特只亮那個開站數的時段（篩選列出現可移除的「開站數 N 站 ✕」，狀態 fk 不寫進網址）。
   資料轉接 data()：設計稿 extract.py eff() 改寫成前端 JS，只讀 TOOL.data（tool.enc）。人員姓名來自 tool.enc。
   網址：ops/eff?day=&fl=&mode=range&from=&ops=（V5.OPS_Q）；舊網址 ops/gantt → ops/eff?to=sec-gantt（router.js redirectOf，保留 ?d=、?go=）、
   ops/eff?d=、?m=r&a=&b=、?eop=（舊作業別）、?go=（舊甘特作業別）都轉成狀態（from）。
   後端欄位 gantt[d].fl[f].rec（甘特色條逐條點數）還沒有時：色條浮框只寫時段與時長；有了就自動顯示逐條點數。 */
(()=>{
const OPS=['north','replenish','puton','follow'],OPN={north:'北區出貨',replenish:'副倉補充',puton:'進貨上架',follow:'副倉 FOLLOW'},SHIP=['north','replenish','follow'],FL=['2F','3F'];
const OPC={north:'#0f8b8d',replenish:'#8a6bbf',puton:'#6aa84f',follow:'#b07d4f'};
const has=v=>!!v&&(Array.isArray(v)?v.length:Object.keys(v).length)>0;

/* ---------- 資料轉接（extract.py eff()：_M／_sc／_nw＋ef 壓成 [點數, 作業秒, 總秒, 等待秒]） ---------- */
function data(){
  const T=TOOL.data,td=V5.tDays(),Dd=T.days,days=td.all;
  const M={},ef={},sc={},nw={},have={};
  const cv=m=>{const o={};Object.keys(m||{}).forEach(k=>{const v=m[k];o[k]=[v[0],v[2],v[3],v[4]]});return o};
  days.forEach(d=>{const x=Dd[d],e={};
    x.m.forEach(r=>{(e[r.op]=e[r.op]||{})[r.floor]=[r.points,r.actualSec,r.waitSec,r.totalSec,r.stations]});M[d]=e;
    if(has(x.nw))nw[d]=x.nw;if(has(x.have))have[d]=x.have;
    if(has(x.sc)){sc[d]={};Object.keys(x.sc).forEach(f=>{sc[d][f]=x.sc[f].map(r=>r.slice(0,5))})}
    if(has(x.ef)){ef[d]={};Object.keys(x.ef).forEach(op=>{ef[d][op]={};Object.keys(x.ef[op]).forEach(f=>{const e2=x.ef[op][f];ef[d][op][f]={p:cv(e2.p),s:cv(e2.s)}})})}});
  const day=td.day,i0=days.indexOf(day),S0=T.settings||{};
  return {asOf:T.generatedAt,day,from:days[Math.max(0,i0-6)],today:td.today,days,M,ef,sc,nw,have,gantt:T.gantt||{},win:S0.gantt||{start:32400,end:64800},rawDays:S0.rawDays||[]};
}

{const st0=S.get();if(!DAYS.includes(st0.day))st0.day=D.day;if(!DAYS.includes(st0.from))st0.from=DAYS.find(x=>x>=st0.from)||D.from;if(st0.mode!=='range')st0.mode='day';if(!['all','2F','3F'].includes(st0.fl))st0.fl='all';

/* ---------- ① 人員效率 ---------- */
function efAgg(ds,f,kind){const m={};ds.forEach(k=>{const e=D.ef[k];if(!e)return;OPS.forEach(o=>{const x=e[o]&&e[o][f];if(!x)return;for(const n in x[kind]){const a=m[n]=m[n]||{};const b=a[o]=a[o]||[0,0,0,0];x[kind][n].forEach((v,i)=>b[i]+=v)}})});return m}
const tot4=(o,ops)=>{const t=[0,0,0,0];ops.forEach(p=>o[p]&&o[p].forEach((v,i)=>t[i]+=v));return t};
const effSec=t=>t[0]&&t[1]?t[1]/t[0]:null,effH=t=>t[0]&&t[1]?t[0]*3600/t[1]:null,prodH=t=>t[0]&&(t[2]+t[3])?t[0]*3600/(t[2]+t[3]):null;
S.on(st=>{
  const fls=K.FLS(st.fl),ds=sel(st).filter(k=>D.ef[k]),pe=document.getElementById('pe');
  pe.className='fl2'+(fls.length===1?' only':'');
  document.getElementById('peB').textContent=`${opsTxt(st)} · ${scopeTxt(st)} · 依效率（點／小時）排名`;
  document.getElementById('peLeg').innerHTML='出貨作業點數佔比色塊（佔該同仁在此樓層的出貨點數）：'+SHIP.map(o=>`<span><i style="background:${OPC[o]}"></i>${OPN[o]}</span>`).join('');
  if(!ds.length){pe.className='';pe.innerHTML=`<div class="empty">目前 0 筆：${scopeTxt(st)} 沒有人員資料（人員與站點效率需要逐筆明細，9/01 起）</div>`;return}
  pe.innerHTML=fls.map(f=>`<div><div class="ct">${tag(f)}<small id="peN${f}"></small><span style="margin-left:auto"><button type="button" class="lk" data-pex="${f}">匯出 Excel</button></span></div><div id="peT${f}"></div></div>`).join('');
  fls.forEach(f=>{
    const m=efAgg(ds,f,'p'),rows=Object.keys(m).map(n=>({n,o:m[n],t:tot4(m[n],st.ops)})).filter(r=>r.t[0]>0);
    rows.forEach(r=>r.eh=effH(r.t));
    rows.forEach(r=>r.rank=r.eh==null?null:1+rows.filter(x=>x.eh!=null&&x.eh>r.eh+1e-9).length);
    rows.sort((a,b)=>(a.rank==null)-(b.rank==null)||a.rank-b.rank||b.t[0]-a.t[0]);

function workSegs(byOp,ops){
  const ev=[];ops.forEach(o=>(byOp[o]||[]).forEach(([s,e])=>{ev.push([s,1,o]);ev.push([e,-1,o])}));
  const pts=[...new Set(ev.map(x=>x[0]))].sort((a,b)=>a-b),act={},out=[];
  for(let i=0;i<pts.length-1;i++){ev.filter(x=>x[0]===pts[i]).forEach(([_,d,o])=>act[o]=(act[o]||0)+d);
    const set=OPS.filter(o=>act[o]>0).join(',');if(!set)continue;
    const l=out[out.length-1];if(l&&l[1]===pts[i]&&l[2]===set)l[1]=pts[i+1];else out.push([pts[i],pts[i+1],set])}
  return out;
}

  {const RAW={a:[r=>r.s,r=>r.p,r=>r.a/r.s/3600,r=>r.w/r.s/3600],b:[r=>r.p,r=>r.t/r.s/3600,r=>r.t?r.w/r.t*100:null],c:[r=>r.t/r.p,r=>r.a/r.p,r=>r.w/r.p]}[m],

  document.getElementById('r5N').textContent='日期由新到舊；(A) 站數、(B) 總作業點數；(C)＝站均實際作業＝實際作業秒 ÷ 站數 ÷ 3600、(D)＝等待秒 ÷ 站數 ÷ 3600、(E)＝總作業秒 ÷ 站數 ÷ 3600、(F)＝等待 ÷ 總作業、(G)(H)(I)＝秒數 ÷ 點數。';
  /* 北區月平均：各日各樓層每點秒數的算術平均（工具 floorReportMonthly） */

/* ================= v5 日報表（ops/report，列印版）：設計稿 redesign_v5\pages\report.template.html 的上線版 =================
   日期、樓層帶動 ① 作業等待圖表（4 張，軸上限滑桿、複製圖／下載 PNG）② 貨架勤後熱點圖 ③ 固定儲位上架推進 ④ 每日貨架命中率（全部／固定 vs 其他）⑤ 三倉每日效率統計＋北區月平均。
   列印：按「列印（彩色／灰階）」（或瀏覽器 Ctrl+P）會加上 html.pv 並用紙張寬度重畫，A4 橫式；afterprint 還原。
   資料轉接 data()：設計稿 extract.py report() 改寫成前端 JS，只讀 TOOL.data（tool.enc）：熱點彙總（layout／heat／same／ov／st）照 Python 那段逐行改寫。
   網址：ops/report?day=&fl=&hq=&hm=&hx=&hops=；舊網址 ?d=、?hm=c（累計頻度）轉成狀態（from）；其餘舊鍵（rt／rg／rmf）已併入效率與開站。
   後端欄位 rhFx（命中率固定 vs 其他）還沒有時：「固定 vs 其他」沒有資料（目前 0 筆），「全部」不受影響。 */
(()=>{
const OPS=['north','replenish','puton','follow'],OPN={north:'北區出貨',replenish:'副倉補充',puton:'進貨上架',follow:'副倉 FOLLOW'},FL=['2F','3F'];
const has=v=>!!v&&(Array.isArray(v)?v.length:Object.keys(v).length)>0;

/* ---------- 熱點彙總（extract.py report()）：每天每個貨架位置的當日／累計出貨次數、熱區高銷貨架、鎖定貨架、與前一週熱區相同比例、>10 次熱區分布 ---------- */
function heatOf(T){
  const lay=(T.static&&T.static.layout)||[],N=lay.length,idx=new Map(lay.map((r,i)=>[r[3]+'|'+String(r[2]).toUpperCase(),i])),locked=new Set((T.static&&T.static.locked)||[]);
  const heat={},acc={},prev={};
  Object.keys(T.heat||{}).sort().forEach(d=>{
    const row=T.heat[d],Tt=new Array(N).fill(0),A=new Array(N).fill(0),c2i=new Map(),ov={'2F':[0,0],'3F':[0,0]};
    (row.loc||[]).forEach(([cid,loc,fl,times])=>{
      acc[cid]=(acc[cid]||0)+times;
      const i=idx.get(fl+'|'+String(loc).toUpperCase());if(i==null)return;
      c2i.set(cid,i);Tt[i]+=times;if(times>10&&ov[fl])ov[fl][lay[i][4]?0:1]++});
    c2i.forEach((i,cid)=>{A[i]+=acc[cid]});
    const hot=new Set((row.hot||[]).map(h=>h[0]));prev[d]=hot;
    const st={'2F':[0,0,0,0],'3F':[0,0,0,0]};
    (row.loc||[]).forEach(([cid,loc,fl])=>{const s=st[fl];if(!s)return;s[0]++;if(c2i.has(cid)&&lay[c2i.get(cid)][4])s[1]++;if(hot.has(cid))s[2]++;if(locked.has(cid))s[3]++});
    const hI=new Set(),kI=new Set();hot.forEach(c=>{if(c2i.has(c))hI.add(c2i.get(c))});c2i.forEach((i,c)=>{if(locked.has(c))kI.add(i)});
    heat[d]={t:Tt,a:A,h:[...hI].sort((a,b)=>a-b),k:[...kI].sort((a,b)=>a-b),ov,nh:hot.size,st};
  });
  Object.keys(heat).forEach(d=>{
    const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-7);const d7=x.toISOString().slice(0,10);
    if(prev[d7]){let n=0;prev[d].forEach(c=>{if(prev[d7].has(c))n++});heat[d].same=[n,prev[d].size,prev[d7].size]}else heat[d].same=null});
  return {layout:lay.map(r=>[r[0],r[1],r[2],r[3],r[4]]),heat};
}

/* ---------- 資料轉接（extract.py report()） ---------- */
function data(){
  const T=TOOL.data,td=V5.tDays(),Dd=T.days,days=td.all;
  const M={},rh={},rhFx={},have={};
  days.forEach(d=>{const x=Dd[d],e={};
    x.m.forEach(r=>{(e[r.op]=e[r.op]||{})[r.floor]=[r.points,r.actualSec,r.waitSec,r.totalSec,r.stations]});M[d]=e;
    if(has(x.have))have[d]=x.have;
    if(has(x.rh)){rh[d]={};Object.keys(x.rh).forEach(c=>{rh[d][c]={};Object.keys(x.rh[c]).forEach(f=>{rh[d][c][f]=x.rh[c][f].slice(0,4)})})}   /* [同面點, 同面次, 同架點, 同架次] */
    if(has(x.rhFx))rhFx[d]=x.rhFx;   /* WP-D：days[d].rhFx[作業子集][樓層]={fixed,other}；還沒有就是空的 */
  });
  let fxList=null;for(let i=days.length-1;i>=0&&!fxList;i--)fxList=(Dd[days[i]].rhFxList)||null;
  const H=heatOf(T),S0=T.settings||{};
  return {asOf:T.generatedAt,day:td.day,today:td.today,days,M,prog:T.progress||{},rh,rhFx,rhFxList:fxList,layout:H.layout,heat:H.heat,chart:S0.chartSettings||{},have};
}

function mount(S,D,ctx){

const {fmt,md,wk,ymd,tag,dl,esc}=K;

const TDY=D.today,TDK=TDY?TDY.d:null,DAYS=D.days,ix=k=>DAYS.indexOf(k);
/* 「看今日」：今日只有 WAR 上架資料；沒資料的地方顯示「—」並用一行灰字說明，不是錯誤樣式 */
const todayNote=()=>`<div class="empty"><span style="font-weight:700;color:var(--ink2)">今日（即時）資料還不完整</span>：目前只有上架（WAR）；揀貨與查照要等隔天每日報表 CSV，沒有資料的地方顯示「—」。</div>`;
function todayBtn(){const b=document.getElementById('bToday');if(!b)return;const st=S.get(),on=st.day===TDK;b.className='chip'+(on?' on':'');b.textContent=on?`今日（即時，資料 ${TDY.at}）`:'看今日';b.title=on?'回到最近完整作業日':'看今日的即時資料';b.onclick=()=>S.set(on?{day:D.day,mode:'day'}:{day:TDK,mode:'day'})}

const HDAYS=Object.keys(D.heat).sort();
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const FLN=f=>f==='all'?'2F＋3F':f;
const mget=(k,op,f)=>D.M[k]&&D.M[k][op]&&D.M[k][op][f];
{const st0=S.get();if(!DAYS.includes(st0.day))st0.day=D.day;if(!['all','2F','3F'].includes(st0.fl))st0.fl='all';if(!['t','a'].includes(st0.hq))st0.hq='t';if(!['f','r'].includes(st0.hm))st0.hm='f';if(!['all','fx'].includes(st0.hx))st0.hx='all';
  st0.hops=['n','r','f'].filter(o=>st0.hops.includes(o));if(!st0.hops.length)st0.hops=['n','r','f']}
/* 連到其他營運頁：帶著日期與樓層（目標是 v5 頁用 V5.OPS_Q；還沒換成 v5 的舊工具頁用 ?d=）；spec＝「ops/頁#區塊 id」 */
const opsPath=spec=>{const [p,to]=spec.split('#'),st=S.get(),q={};
  if(V5.has(p==='ops'?'ops':p)){q.day=st.day;if(st.fl!=='all')q.fl=st.fl}else q.d=st.day;
  if(to)q.to=to;return withQ(p,q)};
S.on(()=>document.querySelectorAll('#page a[data-ops]').forEach(a=>a.setAttribute('href',hashOf(opsPath(a.dataset.ops)))));
K.date('#fDay',S,'day',DAYS);K.seg('#fFl',S,'fl',K.FLOPTS);
K.seg('#hqSeg',S,'hq',[['t','當日頻度'],['a','累計頻度']]);
K.seg('#hxSeg',S,'hx',[['all','全部'],['fx','固定 vs 其他']]);
K.seg('#hmSeg',S,'hm',[['f','同面連續'],['r','同架連續']]);
K.chips('#hitops',S,'hops',[['n','北區出貨'],['r','副倉補充'],['f','副倉 FOLLOW']]);

const hday=d=>HDAYS.filter(k=>k<=d).slice(-1)[0];
let PV=false,PG=false,PMODE='color';
const PC=()=>PG?{act:'#3f4d5c',wait:'#c9d0d8',ratio:'#16202a',cfg:'#aab3bc'}:{act:K.C.act,wait:K.C.wait,ratio:K.C.ratio,cfg:K.C.cfg};
/* 列印時圖用 560px 的畫布畫（才看得到數字標籤），再用 viewBox 縮到欄寬 */
function BL(el,o){if(typeof el==='string')el=K.$(el);if(PV){el.style.width='560px';if(!o.noTopPV)o.topLabel=true;o.lineLabel=true}K.barLine(el,o);if(PV){el.style.width='';const sv=el.querySelector('svg');if(sv){sv.setAttribute('viewBox','0 0 '+sv.getAttribute('width')+' '+sv.getAttribute('height'));sv.style.width='100%';sv.style.height='auto'}}}
const INK='"Microsoft JhengHei","Noto Sans TC",sans-serif';

/* ---------- 複製／下載 PNG（圖連標題一起輸出） ---------- */
function flash(b,t){if(!b)return;const o=b.dataset.t||(b.dataset.t=b.textContent);b.textContent=t;setTimeout(()=>b.textContent=o,1600)}
function pngOf(host,title,sub,fname,copy,btn){
  const svg=host.querySelector('svg');if(!svg){flash(btn,'沒有圖');return}
  const W=+svg.getAttribute('width'),H=+svg.getAttribute('height'),pad=56,sc=2,c=svg.cloneNode(true);
  c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('style','font-family:'+INK);c.querySelectorAll('.hit').forEach(n=>n.remove());
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=W*sc;cv.height=(H+pad)*sc;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.scale(sc,sc);
    g.fillStyle='#16202a';g.font='800 20px '+INK;g.fillText(title,0,24);g.fillStyle='#6c7a89';g.font='14px '+INK;g.fillText(sub,0,46);g.drawImage(img,0,pad);
    cv.toBlob(b=>{if(copy){try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>flash(btn,'已複製'),()=>flash(btn,'無法複製'))}catch(e){flash(btn,'無法複製')}}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname+'.png';a.click();flash(btn,'已下載')}})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(c));
}
const pbtns=(id)=>`<span class="pbtn"><button type="button" class="lk" data-png="${id}" data-c="1">複製圖</button><button type="button" class="lk" data-png="${id}">下載 PNG</button></span>`;
function bindPng(root,meta){root.querySelectorAll('[data-png]').forEach(b=>b.onclick=()=>{const m=meta[b.dataset.png];pngOf(document.getElementById(m.host),m.title,m.sub,m.file,!!b.dataset.c,b)})}
let PMETA={};

/* ---------- 頁首 ---------- */
S.on(st=>{
  document.getElementById('scope').innerHTML=`<b>${FLN(st.fl)}</b> · <b>${st.day===TDK?'今日 ':''}${md(st.day)}（${wk(st.day)}）</b>${st.day===TDK?' · 即時':''}`;
  todayBtn();document.getElementById('asof').textContent=st.day===TDK?`資料 ${TDY.at} · 今日（即時）`:`資料 ${D.asOf.slice(5,16).replace('T',' ').replace('-','/')} · 最近完整作業日 ${md(D.day)}（${wk(D.day)}）`;
  const hv=D.have[st.day],n=document.getElementById('pnote');
  if(st.day===TDK)n.innerHTML=todayNote();
  else if(!hv)n.innerHTML=`<div class="stale"><b>${md(st.day)} 只有點數彙總</b><span>這天來自 Excel 歷史彙總，沒有命中率與逐筆明細；等待圖仍有資料。</span></div>`;
  else if(!hv.pick)n.innerHTML=`<div class="stale"><b>${md(st.day)} 只有上架資料</b><span>此日期尚缺 PickingTime；請等資料更新後再使用完整日報。</span></div>`;
  else n.innerHTML='';
});

/* ---------- ① 作業等待圖表 4 張（軸上限滑桿） ---------- */
const AX={};
const nice=v=>{const s=[10,20,25,50,100,150,200,250,300,500,600,1000,2000].find(x=>v<=x);return s||Math.ceil(v/100)*100};
function waitData(st,o){const fls=K.FLS(st.fl);const ks=DAYS.filter(k=>k<=st.day&&fls.some(f=>mget(k,o,f))).slice(-10);
  const g=ks.map(k=>{let a=0,w=0,t=0,s=0,p=0;fls.forEach(f=>{const r=mget(k,o,f);if(r){p+=r[0];a+=r[1];w+=r[2];t+=r[3];s+=r[4]}});return{a:a/s/60,w:w/s/60,r:t?w/t*100:null,p,s}});return{ks,g}}
function drawWait(o){
  const st=S.get(),{ks,g}=waitData(st,o),host=document.getElementById('wc'+o);
  if(!ks.length){host.innerHTML='<div class="empty">目前 0 筆：這個作業別沒有資料</div>';return}
  const cs=D.chart[o]||{},tot=Math.max(...g.map(x=>x.a+x.w)),autoM=nice(tot*1.1),autoP=cs.percentMax||nice(Math.max(...g.map(x=>x.r||0))*1.1);
  const ax=AX[o]=AX[o]||{};const M=ax.m!=null?ax.m:(cs.minutesMax||autoM),P=ax.p!=null?ax.p:autoP;
  const mi=document.getElementById('wm'+o),pi=document.getElementById('wp'+o);
  if(mi){mi.max=Math.max(autoM*2,M);mi.value=M;document.getElementById('wmv'+o).textContent=M;pi.value=P;document.getElementById('wpv'+o).textContent=P}
  const M2=PV?Math.ceil(M*1.5/50)*50:M,pad=Math.max(0,M2-(g[0].a+g[0].w));
  BL(host,{cats:ks.map(md),sub:ks.map(wk),stacks:[{vals:g.map(x=>x.a),color:PC().act},{vals:g.map(x=>x.w),color:PC().wait},{vals:g.map((x,i)=>i===0?pad:0),color:'transparent'}],line:{vals:g.map(x=>x.r),color:PC().ratio},lineMax:P,yUnit:'分',h:PV?210:innerWidth<=600?240:270,topLabel:false,head:1,sel:ks.indexOf(st.day),
    tip:i=>{const v=g[i],k=ks[i];return K.tip.card(`${ymd(k)}（${wk(k)}）`,OPN[o]+' · '+FLN(st.fl),[['','點數',fmt(v.p),'點'],['','開站數',fmt(v.s),'站'],[K.C.act,'實際作業',fmt(v.a,1),'分鐘／站'],[K.C.wait,'等待',fmt(v.w,1),'分鐘／站'],[K.C.ratio,'等待時間佔比',fmt(v.r,1),'%']],'站均＝總秒數 ÷ 開站數')}});
  const si=ks.indexOf(st.day),wn=document.getElementById('wn'+o);
  if(wn)wn.innerHTML=`圖軸：左 0–${M2} 分鐘、右 0–${P}%。${si>=0?`${md(st.day)}（${wk(st.day)}）實際作業 <b>${fmt(g[si].a,1)}</b>、等待 <b>${fmt(g[si].w,1)}</b> 分鐘／站，等待佔比 <b>${fmt(g[si].r,1)}%</b>（${fmt(g[si].p)} 點、${fmt(g[si].s)} 站）`:`${md(st.day)} 沒有這個作業別的資料`}`;
  PMETA['w'+o]={host:'wc'+o,title:OPN[o]+' 作業等待',sub:`${FLN(st.fl)} · ${md(ks[0])}～${md(ks[ks.length-1])} · 軸上限 ${M} 分鐘／${P}%`,file:'wait_'+o+'_'+st.day};
}
S.on(st=>{
  document.getElementById('wt').innerHTML=OPS.map(o=>`<div class="col s6"><div class="ct">${OPN[o]}<small id="wr${o}"></small>${pbtns('w'+o)}</div>
    <div class="ax"><label>作業時間上限 <input type="range" id="wm${o}" min="10" max="600" step="10"><b id="wmv${o}"></b>分鐘</label><label>等待佔比上限 <input type="range" id="wp${o}" min="10" max="100" step="5"><b id="wpv${o}"></b>%</label><button type="button" class="lk" data-reset="${o}">重設</button></div>
    <div id="wc${o}"></div><div class="pvn" id="wn${o}"></div></div>`).join('');
  OPS.forEach(o=>{const {ks}=waitData(st,o);document.getElementById('wr'+o).textContent=ks.length?`${md(ks[0])}～${md(ks[ks.length-1])}`:'';
    const mi=document.getElementById('wm'+o),pi=document.getElementById('wp'+o);
    mi.oninput=()=>{AX[o].m=+mi.value;document.getElementById('wmv'+o).textContent=mi.value;drawWait(o)};
    pi.oninput=()=>{AX[o].p=+pi.value;document.getElementById('wpv'+o).textContent=pi.value;drawWait(o)};
    document.querySelector(`[data-reset="${o}"]`).onclick=()=>{AX[o]={};drawWait(o)};
    drawWait(o)});
  bindPng(document.getElementById('wt'),PMETA);
});

/* ---------- ② 貨架勤後熱點圖 2F／3F ---------- */
S.on(st=>{
  const fls=K.FLS(st.fl),hd=hday(st.day),el=document.getElementById('hm');
  el.className='fl2'+(fls.length===1?' only':'');
  if(!hd){el.className='';el.innerHTML=`<div class="empty">目前 0 筆：沒有熱點資料（只保留最近 60 天）</div>`;document.getElementById('hmB').textContent='';document.getElementById('hmLeg').innerHTML='';return}
  const H=D.heat[hd],mode=st.hq,lay=D.layout;
  document.getElementById('hmB').textContent=`${ymd(hd)} · ${mode==='t'?'當日頻度':'累計頻度（自 '+md(HDAYS[0])+' 起）'}${hd!==st.day?` · ${md(st.day)} 的熱點資料還沒產生，顯示最近一天`:''}`;
  const arr=mode==='t'?H.t:H.a,vals=arr.filter(v=>v>0).sort((a,b)=>a-b),q=p=>vals.length?vals[Math.min(vals.length-1,Math.floor(vals.length*p))]:0;
  const th=[q(.25),q(.5),q(.75),q(.92)],COL=PG?['#e0e3e7','#bcc3ca','#8d96a0','#555f69','#1a2027']:['#cfdcf4','#8fb0e6','#f2c071','#e5782e','#b8281f'];
  const bin=v=>v<=0?-1:v>=th[3]?4:v>=th[2]?3:v>=th[1]?2:v>=th[0]?1:0;
  const rg=i=>i===4?'≥ '+fmt(th[3]):i===0?(th[0]>2?'1–'+fmt(th[0]-1):'1'):(th[i]-1>th[i-1]?fmt(th[i-1])+'–'+fmt(th[i]-1):fmt(th[i-1]));
  document.getElementById('hmLeg').innerHTML=`<span>${mode==='t'?'當日出貨次數':'累計出貨次數'}：</span><span><i style="background:#eef1f4"></i>0</span>`+COL.map((c,i)=>`<span><i style="background:${c}"></i>${rg(i)}</span>`).join('')
    +`<span><i style="background:#fff;border:2px solid #16202a"></i>熱區庫位</span><span><b style="font-size:14px">●</b> 高銷貨架</span><span>╳ 鎖定貨架</span>`;
  PMETA={...PMETA};
  el.innerHTML=fls.map(f=>{const s=H.st[f];return `<div><div class="ct">${tag(f)}<small>${f} 貨架熱點圖</small>${pbtns('h'+f)}</div><div class="hmst"><span>出貨貨架 <b>${fmt(s[0])}</b> 座</span><span>熱區 <b>${fmt(s[1])}</b></span><span>高銷 <b>${fmt(s[2])}</b></span><span>鎖定 <b>${fmt(s[3])}</b></span></div><div id="hc${f}"></div><div class="pvn" id="ht${f}"></div></div>`}).join('');
  const hot=new Set(H.h),lock=new Set(H.k);
  fls.forEach(f=>{
    const host=document.getElementById('hc'+f),cells=lay.map((r,i)=>[r,i]).filter(([r])=>r[3]===f&&r[0]!=null);
    const xs=cells.map(([r])=>r[0]),ys=cells.map(([r])=>r[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const W=Math.max(280,host.clientWidth||600),cw=Math.floor((W-2)/(x1-x0+1)*10)/10,Hh=Math.ceil((y1-y0+1)*cw)+2;
    let s=`<svg width="${W}" height="${Hh}" role="img" font-size="14">`;
    cells.forEach(([r,i])=>{const v=arr[i],b=bin(v),x=1+(r[0]-x0)*cw,y=1+(r[1]-y0)*cw;
      s+=`<rect class="hc" data-i="${i}" x="${x}" y="${y}" width="${cw-1}" height="${cw-1}" rx="1.5" fill="${b<0?'#eef1f4':COL[b]}" ${r[4]?'stroke="#16202a" stroke-width="1.5"':''} style="${v>0?'cursor:pointer':''}"/>`;
      if(hot.has(i))s+=`<circle cx="${x+(cw-1)/2}" cy="${y+(cw-1)/2}" r="${Math.max(1.5,cw/7)}" fill="${b>=2?'#fff':'#16202a'}" pointer-events="none"/>`;
      if(lock.has(i))s+=`<path d="M${x+2},${y+2}L${x+cw-3},${y+cw-3}M${x+cw-3},${y+2}L${x+2},${y+cw-3}" stroke="#16202a" stroke-width="1" opacity=".55" pointer-events="none"/>`});
    host.innerHTML=s+'</svg>';
    host.querySelectorAll('.hc').forEach(n=>{const i=+n.dataset.i;if(!(arr[i]>0))return;K.tip.bind(n,()=>{const r=lay[i];return K.tip.card(r[2],`${f} · ${ymd(hd)}`,[['','當日出貨',fmt(H.t[i]),'次'],['','累計出貨',fmt(H.a[i]),'次'],['','熱區庫位',r[4]?'是':'否',''],['','高銷貨架',hot.has(i)?'是':'否',''],['','鎖定貨架',lock.has(i)?'是':'否','']])})});
    const top5=cells.map(([r,i])=>[r[2],arr[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5),ht=document.getElementById('ht'+f);
    if(ht)ht.innerHTML=`${f} ${mode==='t'?'當日':'累計'}出貨次數最多的 5 個位置：${top5.map(([n,v])=>`${n}（${fmt(v)} 次）`).join('、')}`;
    PMETA['h'+f]={host:'hc'+f,title:f+' 貨架勤後熱點圖',sub:`${ymd(hd)} · ${mode==='t'?'當日頻度':'累計頻度'}`,file:'heat_'+f+'_'+hd};
  });

function lineChart(el,o){
  const W=Math.max(300,el.clientWidth||700),H=o.h||260,L=48,R=o.R||56,T=22,B=30,pw=W-L-R,ph=H-T-B,n=o.cats.length,FS=14,slot=pw/Math.max(1,n),x=i=>L+slot*(i+.5);
  const all=[].concat(...o.series.map(s=>s.vals.filter(v=>v!=null)));
  let lo=all.length?Math.min(...all):1,hi=all.length?Math.max(...all):1.2;const step=hi-lo>.5?.1:hi-lo>.2?.05:.02;lo=Math.floor((lo-step*.3)/step)*step;hi=Math.ceil((hi+step*.3)/step)*step;
  const y=v=>T+ph-ph*(v-lo)/(hi-lo),every=Math.max(1,Math.ceil(36/slot));
  let s=`<svg width="${W}" height="${H}" role="img" font-size="${FS}">`;
  if(o.sel>=0)s+=`<rect x="${L+slot*o.sel}" y="${T}" width="${slot}" height="${ph}" fill="#fbeef0"/>`;
  for(let v=lo;v<=hi+1e-9;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf0"/><text x="${L-6}" y="${y(v)+5}" text-anchor="end" fill="#6c7a89">${v.toFixed(2)}</text>`;
  s+=`<text x="${L-6}" y="12" text-anchor="end" fill="#6c7a89">${o.unit||''}</text>`;
  o.cats.forEach((c,i)=>{if(i%every===0||i===n-1)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="${i===o.sel?'#941e34':'#3f4d5c'}" font-weight="${i===o.sel?700:400}">${c}</text>`});
  const labs=[];
  o.series.forEach(se=>{let d='',pen=false,last=null;se.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v);pen=true;last=[x(i),y(v)]});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''}/>`;
    if(n<=45)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===o.sel?5:2.5}" fill="${i===o.sel?se.color:'#fff'}" stroke="${se.color}" stroke-width="2"/>`});
    if(last)labs.push({x:last[0]+8,y:last[1]+5,t:se.name,c:se.color})});
  labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<16)labs[i].y=labs[i-1].y+16;
  labs.forEach(l=>s+=`<text x="${l.x}" y="${l.y}" font-weight="700" fill="${l.c}">${l.t}</text>`);
  o.cats.forEach((_,i)=>s+=`<rect class="hit" data-i="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}"/>`);
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('.hit').forEach(h=>K.tip.bind(h,()=>o.tip(+h.dataset.i)));
}

/* ================= v5 貨架熱點圖（ops/heat）：設計稿 redesign_v5\pages\heat.template.html 的上線版（WP-B） =================

   資料轉接 data()：設計稿 extract.py heat_page() 的 Python 逐行搬成 JS，來源 TOOL.data.heat／static（layout、aisles、locked）；只帶最近 21 天的圖，前週比對 hist 全部（最多 60 天）。
   網址：ops/heat?day=&fl=&cum=c&focus=out&q=KIVA-020-007；舊網址 ?d=日期、?hm=c（累計）轉成狀態。 */
(()=>{
const FL=['2F','3F'];

/* ---------- 資料轉接（extract.py heat_page()） ---------- */
function data(){
  const T=TOOL.data,H=(T&&T.heat)||{},S0=(T&&T.static)||{},lay=S0.layout||[],N=lay.length,days=Object.keys(H).sort(),show=new Set(days.slice(-21));
  const idx=new Map();lay.forEach((r,i)=>idx.set(r[3]+'|'+String(r[2]).toUpperCase(),i));
  const aisle=new Set((S0.aisles||[]).map(a=>a[3]+'|'+String(a[2]).toUpperCase()));
  const c2f=new Map();
  days.forEach(d=>(H[d].loc||[]).forEach(([cid,loc,fl,tm])=>c2f.set(cid,fl)));
  const cids=new Map(),acc=new Map(),out={},hot={};
  days.forEach(d=>{
    const Tt=new Array(N).fill(-1),C=new Array(N).fill(-1),A=new Array(N).fill(0),un={'2F':0,'3F':0},names=new Array(N);
    (H[d].loc||[]).forEach(([cid,loc,fl,tm])=>{
      acc.set(cid,(acc.get(cid)||0)+tm);
      const i=idx.get(fl+'|'+String(loc).toUpperCase());
      if(i==null){if(tm>10)un[fl]=(un[fl]||0)+1;return}
      Tt[i]=tm;if(!cids.has(cid))cids.set(cid,cids.size);C[i]=cids.get(cid);names[i]=cid;

    const hs=new Set((H[d].hot||[]).map(h=>h[0]));hot[d]=hs;
    if(show.has(d)){
      for(let i=0;i<N;i++)if(C[i]>=0)A[i]=acc.get(names[i]);
      const hl=[];for(let i=0;i<N;i++)if(C[i]>=0&&hs.has(names[i]))hl.push(i);
      out[d]={t:Tt,c:C,a:A,hot:hl,un};

    const inter=(a,b)=>{let n=0;a.forEach(x=>{if(b.has(x))n++});return n};
    const row=[d,cur.size,prv?prv.size:null,prv?inter(cur,prv):null];
    FL.forEach(f=>{const a=new Set([...cur].filter(c=>c2f.get(c)===f)),b=new Set(prv?[...prv].filter(c=>c2f.get(c)===f):[]);row.push(a.size,prv?b.size:null,prv?inter(a,b):null)});

}

/* ================= v5 等待同貨架（ops/rack）：設計稿 redesign_v5\pages\rack.template.html 的上線版（WP-B） =================
   篩選列：作業日期、樓層、作業別（＋點貨架時多一個「貨架 ✕」標籤），帶動整頁（KPI、趨勢、現在誰在等誰、該日每一次等待、最常被搶、只放一座又常被揀）。
   資料轉接 data()：設計稿 extract.py rack() 的 Python 搬成 JS，來源 D.rackWait（rackwait.json）＋D.ops.days[].rw（ops.json）；比率不另算，沿用資料裡的 sec／wait。
   最少儲位數（minpos）：D.rackWait.minpos.map（WP-D 後端欄位）；沒有這個欄位時整欄「—」、沒有淡底色；有欄位時不在 map 的零件一律當 1（淡底色＝1）。
   固定儲位（舊 ops/rack 的 sec-bind）已搬到 ops/util（router 轉址）；這一頁不放。
   網址：ops/rack?day=&fl=&ops=north,follow&rack=2-06-0002；舊網址 ?to=sec-rw、?floor=2F 轉成狀態。 */
(()=>{
const OPS=['north','replenish','follow'],OPN={north:'北區出貨',replenish:'副倉補充',follow:'副倉 FOLLOW'},FL=['2F','3F'];

/* ---------- 資料轉接（extract.py rack()） ---------- */
function data(){
  const R=D.rackWait,O=D.ops,days={},single={},tot={};
  ((O&&O.days)||[]).forEach(x=>{const r=x.rw;if(r&&Object.keys(r).length)days[x.d]=r});   /* 每天、每作業別（含 all）、每樓層：{n,sec,visits,wait,ratio} */
  ((R&&R.days)||[]).forEach(x=>{single[x.d]={};tot[x.d]={};Object.entries(x.fl||{}).forEach(([f,v])=>{single[x.d][f]=v&&v.single;tot[x.d][f]=v})});
  const DAYS=Object.keys(days).sort(),ld=R&&R.latest&&R.latest.d,out={
    asOf:R?R.generatedAt:'',days,single,tot,DAYS,
    latest:(R&&R.latest)||{d:null,rows:[]},live:(R&&R.live)||null,topRacks:(R&&R.topRacks)||[],singleHot:(R&&R.singleHot)||[],parts:(R&&R.parts)||{},
    pickDays:R?R.pickDays:null,minpos:R&&R.minpos&&R.minpos.map?R.minpos:null};
  out.defDay=DAYS.includes(ld)?ld:(DAYS[DAYS.length-1]||null);
  def.state.day=out.defDay;   /* 預設日期＝等待同貨架最新一天；網址不寫預設值 */
  return out;
}

/* ================= v5 進貨（ops/in）：設計稿 redesign_v5\pages\in.template.html 的上線版（WP-B） =================
   篩選列：日期、樓層，帶動整頁；點 KPI「超過 3 工作日／3 工作日內」或圖上某個開箱日 → 台車清單就地篩選（篩選列多可移除的標籤）。
   991 快照（未上架、台車、進貨進度追蹤）是最新一份，不隨日期變；每日圖、每零件上架格數看日期。
   資料轉接 data()：設計稿 extract.py in_page() 搬成 JS，來源 D.inbound（inbound.json）、D.ops.days[].pg、D.lt、META.sections.inbound.detail.lastDailyDay。
   進貨進度追蹤 trk：D.inbound.trk（後端已算）；舊資料沒有 trk 時照 extract.py _ib() 從 inbound 算。
   網址：ops/in?day=&fl=&focus=over3&od=2026-10-20&lt=IMP,DOM&lst=2&ltw=26；舊網址 ?to=sec-991｜sec-pg｜sec-lt、?floor=2F、?fl=ALL、?lt=、?lst=、?ltw= 轉成狀態。 */
(()=>{
const FL=['2F','3F'];

/* ---------- 進貨進度追蹤（後端 dashboard_extra 給 inbound.trk；萬一沒有才從 inbound 自己算：櫃數、包裝件 pcs 算不出來，畫面寫「—」） ---------- */
function trkOf(ij){
  const base=ij.reportDate,n3=ij.olderThan,od=ij.openDays||[],cs=ij.carts||[];
  const agg=(rows,cf)=>({carts:cs.filter(c=>cf(c.oldest)).length,points:rows.reduce((a,r)=>a+FL.reduce((b,f)=>b+r[f].points,0),0),pcs:Math.round(rows.reduce((a,r)=>a+FL.reduce((b,f)=>b+r[f].pcs,0),0))});
  const open={today:agg(od.filter(r=>r.d===base),o=>o===base),in3:agg(od.filter(r=>r.d>=n3),o=>o>=n3),over3:agg(od.filter(r=>r.d<n3),o=>o<n3),all:agg(od,()=>true)};
  const arr={all:{impBoxes:null,impPoints:0,pkgPoints:0,pkgPcs:null},in3:{impBoxes:null,impPoints:0,pkgPoints:0,pkgPcs:null},over3:{impBoxes:null,impPoints:0,pkgPoints:0,pkgPcs:null}};
  (ij.arrived||[]).forEach(a=>Object.entries(a.counts||{}).forEach(([k,c])=>{const q=k.split('|');if(q[1]!=='已到貨')return;const f=q[0]==='進口件'?'impPoints':'pkgPoints';arr.all[f]+=c;arr[a.d>=n3?'in3':'over3'][f]+=c}));
  return {base,open,arr,noBox:0};
}

/* ---------- 資料轉接（extract.py in_page()） ---------- */
function data(){
  const I=D.inbound,O=D.ops,L=D.lt,M=(typeof META!=='undefined'&&META&&META.sections&&META.sections.inbound)||{};
  const pg={};((O&&O.days)||[]).forEach(x=>{if(x.pg)pg[x.d]=x.pg});
  const IB=I?Object.assign({},I,{trk:I.trk||trkOf(I)}):null;
  const DAYS=IB?(IB.daily||[]).map(r=>r.d):[],ld=M.detail&&M.detail.lastDailyDay;
  const out={ib:IB,pg,lt:L?{generatedAt:L.generatedAt,basis:L.basis,days:L.days||[],arr:L.arr,weeks:L.weeks||[],kinds:L.kinds}:null,
    asOf:M.generatedAt||(L&&L.generatedAt)||'',lastDay:ld,DAYS,PGD:Object.keys(pg).sort(),ok:{ib:!!IB,ops:!!O,lt:!!L}};
  out.defDay=DAYS.includes(ld)?ld:(DAYS[DAYS.length-1]||null);
  def.state.day=out.defDay;   /* 預設日期＝991 每日最後一天；網址不寫預設值 */
  return out;
}

  /* 圖：折線（2F 藍／3F 橘、或自訂系列）；字級 14 */
  function lineChart(el,o){
    if(typeof el==='string')el=document.querySelector(el);
    const W=Math.max(280,el.clientWidth||600),H=o.h||220,L=o.L||50,R=12,T=24,B=o.sub?46:28,pw=W-L-R,ph=H-T-B,n=o.cats.length;

    let s=`<svg width="${W}" height="${H}" role="img" font-size="14">`;
    if(o.sel!=null&&o.sel>=0)s+=`<rect x="${L+slot*o.sel}" y="${T}" width="${slot}" height="${ph}" fill="#fbeef0"/>`;
    for(let v=lo;v<=hi+step/1e3;v+=step){const vv=+v.toFixed(6);s+=`<line x1="${L}" x2="${W-R}" y1="${y(vv)}" y2="${y(vv)}" stroke="#e8ecf0"/><text x="${L-6}" y="${y(vv)+5}" text-anchor="end" fill="#6c7a89">${o.yfmt?o.yfmt(vv):fmt(vv)}</text>`}
    s+=`<text x="${L-6}" y="12" text-anchor="end" fill="#6c7a89">${o.yUnit||''}</text>`;
    o.cats.forEach((c,i)=>{if((n-1-i)%every===0)s+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" fill="${i===o.sel?'#941e34':'#3f4d5c'}" font-weight="${i===o.sel?700:400}">${c}</text>`;if(o.sub&&(n-1-i)%every===0)s+=`<text x="${x(i)}" y="${H-B+36}" text-anchor="middle" fill="#6c7a89">${o.sub[i]}</text>`});
    o.series.forEach(sr=>{const pts=sr.vals.map((v,i)=>v==null?null:[x(i),y(v)]);let seg=[];const flush=()=>{if(seg.length>1)s+=`<polyline fill="none" stroke="${sr.color}" stroke-width="${sr.w||2.2}"${sr.dash?` stroke-dasharray="${sr.dash}"`:''} points="${seg.map(p=>p.join(',')).join(' ')}"/>`;seg=[]};
      pts.forEach(p=>{if(p)seg.push(p);else flush()});flush();
      if(n<=40)pts.forEach(p=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${sr.color}" stroke-width="2"/>`})});
    if(o.tip)o.cats.forEach((_,i)=>{s+=`<rect class="hit" data-i="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}"/>`});
    el.innerHTML=s+'</svg>';
    if(o.tip)K.$$('.hit',el).forEach(r=>K.tip.bind(r,()=>o.tip(+r.dataset.i)));
  }
  const STEPS=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000,20000,50000,100000];

  /* 頁首範圍、篩選標籤 */
  S.on(st=>{
    const ex=[];if(st.focus)ex.push(st.focus==='over3'?'超過 3 工作日':'3 工作日內');if(st.od)ex.push('開箱 '+md(st.od));
    document.getElementById('scope').innerHTML=`<b>${st.fl==='all'?'2F＋3F':st.fl}</b>${st.day?` · <b>${md(st.day)}（${wk(st.day)}）</b>`:''}${ex.length?' · '+ex.join('、'):''}`;
    document.getElementById('asof').textContent=IB?'資料 '+(D.asOf?D.asOf.slice(0,10).replace(/-/g,'/'):'—')+' · 991 快照報表日 '+md(IB.reportDate)+'（'+wk(IB.reportDate)+'）':'資料 '+(D.asOf?D.asOf.slice(0,10).replace(/-/g,'/'):'—');
    const x=document.getElementById('fX');x.classList.toggle('on',ex.length>0);
    x.innerHTML=ex.length?'<label>只看</label>'+(st.focus?`<button type="button" class="chip on" data-k="focus">${ex[0]} ✕</button>`:'')+(st.od?`<button type="button" class="chip on" data-k="od">開箱 ${md(st.od)} ✕</button>`:''):'';
    K.$$('button',x).forEach(b=>b.onclick=()=>S.set(b.dataset.k,null));
  });

  /* ① KPI */
  S.on(st=>{
    if(!IB){document.getElementById('kpB').textContent='';document.getElementById('kp').innerHTML='<div class="empty">沒有 991 進貨資料</div>';return}
    const fls=K.FLS(st.fl),old=d=>d<N3,nw=d=>d>=N3;
    const sum=(pred,f)=>OPEN.filter(r=>pred(r.d)).reduce((a,r)=>a+r[f].points,0);
    const tot=pred=>fls.reduce((a,f)=>a+sum(pred,f),0),cn=pred=>CARTS.filter(c=>K.flIn(st.fl,c.floor)&&pred(c.oldest)).length;
    const pair=pred=>st.fl==='all'?K.flPair(sum(pred,'2F'),sum(pred,'3F'),'點'):'';
    const r=dayRow(st.day),p=r&&DAYS[DAYS.indexOf(st.day)-1]?dayRow(DAYS[DAYS.indexOf(st.day)-1]):null;
    document.getElementById('kpB').textContent=`最新快照（報表日 ${md(IB.reportDate)}），不隨日期變；開箱日早於 ${md(N3)} ＝ 超過 3 工作日（週日不算）`;
    const o3=tot(old),dTxt=st.day?`${md(st.day)}（${wk(st.day)}）`:'這天';
    K.kpis('#kp',[
      {id:'over3',l:'991 未上架超過 3 工作日',v:fmt(o3),u:'點',cls:o3>0?'bad':'zero',fl:pair(old),sub:`${fmt(cn(old))} 台車 · 點了只看這些台車`},
      {id:'in3',l:'991 未上架 3 工作日內',v:fmt(tot(nw)),u:'點',fl:pair(nw),sub:`${fmt(cn(nw))} 台車`},
      {l:`${dTxt}開箱`,v:r?fmt(r.open):'—',u:r?'點':'',sub:`兩樓合計（每日數字不分樓層）${p?' · 比前一日 '+neu(r.open-p.open):''}`},
      {l:`${dTxt}上架`,v:r?fmt(r.putaway):'—',u:r?'點':'',sub:r?`當日新增未上架 <b>${r.net>0?'+':''}${fmt(r.net)}</b> 點${p?' · 比前一日 '+neu(r.putaway-p.putaway):''}`:'這天沒有 991 資料'}],
      st.focus,id=>{S.set('focus',S.get('focus')===id?null:id);toCart()});
  });

  /* ② 每日開箱與上架（長條＋線，兩條線共用同一個刻度） */
  S.on(st=>{
    const ks=DAYS.filter(d=>d<=st.day).slice(-30),rows=ks.map(dayRow);
    if(!ks.length){document.getElementById('dyB').textContent='';noData('dy');return}
    document.getElementById('dyB').textContent=`近 ${ks.length} 個作業日 · ${md(ks[0])}～${md(ks[ks.length-1])} · 兩樓合計`;
    const mxO=Math.max(1,...rows.map(r=>r.open)),M=Math.max(mxO,...rows.map(r=>r.putaway))*1.12,stp=STEPS.find(s=>5*s>=M)||100000;
    K.barLine('#dy',{cats:ks.map(md),sub:ks.map(wk),stacks:[{vals:rows.map(r=>r.open),color:'#3f4d5c'}],line:{vals:rows.map(r=>r.putaway),color:K.C.act,unit:'點'},lineMax:5*stp,head:5*stp/mxO,yUnit:'點',topLabel:false,h:innerWidth<=600?240:260,sel:ks.length-1,
      tip:j=>{const k=ks[j],r=rows[j];return K.tip.card(`${ymd(k)}（${wk(k)}）`,'兩樓合計',[['#3f4d5c','開箱',fmt(r.open),'點'],[K.C.act,'上架',fmt(r.putaway),'點'],['','當日新增未上架',(r.net>0?'+':'')+fmt(r.net),'點']],'',k===st.day?[]:[['看這天',()=>S.set('day',k)]])}});
  });
  S.on(st=>{
    if(!IB){document.getElementById('opB').textContent='';document.getElementById('opL').innerHTML='';noData('op');return}
    const fls=K.FLS(st.fl),rows=OPEN,sel=st.od?rows.findIndex(r=>r.d===st.od):-1;
    document.getElementById('opB').textContent=`還沒上架的點，哪一天開箱的 · ${st.fl==='all'?'兩層合計':st.fl} · 點長條 → 台車清單只看那天`;
    document.getElementById('opL').innerHTML=fls.map(f=>`<span><i style="background:${f==='2F'?K.C.f2:K.C.f3}"></i>${f}</span>`).join('')+`<span class="k">開箱日早於 ${md(N3)} 的是超過 3 工作日</span>`;
    if(!rows.length){noData('op');return}
    K.barLine('#op',{cats:rows.map(r=>md(r.d)),sub:rows.map(r=>wk(r.d)),stacks:fls.map(f=>({vals:rows.map(r=>r[f].points),color:f==='2F'?K.C.f2:K.C.f3})),yUnit:'點',h:innerWidth<=600?240:260,topLabel:true,sel,
      tip:j=>{const r=rows[j];return K.tip.card(`${ymd(r.d)}（${wk(r.d)}）開箱`,r.d<N3?'超過 3 工作日':'3 工作日內',fls.map(f=>[f==='2F'?K.C.f2:K.C.f3,f+' 未上架',fmt(r[f].points),'點 · '+fmt(r[f].carts)+' 台車']),'',[[st.od===r.d?'取消只看這天':'台車清單只看這天',()=>{S.set('od',st.od===r.d?null:r.d);toCart()}]])}});
  });

  /* ③ 進貨進度追蹤（完整版）：已開箱未上架、已到貨未上台車 */
  S.on(st=>{
    if(!IB){document.getElementById('trkB').textContent='';noData('trkO');noData('trkA');document.getElementById('trkN').textContent='';document.getElementById('arB').textContent='';noData('ar');return}
    const T=IB.trk;
    const bk=(fl,pred)=>{const cs=new Set();let pts=0,pcs=0;CARTS.forEach(c=>{if(!K.flIn(fl,c.floor))return;c.items.forEach(r=>{if(pred(age(r[3]))){cs.add(c.cart);pts++;pcs+=r[1]}})});return {carts:cs.size,points:pts,pcs:Math.round(pcs)}};
    const defs=[['today','當天','',a=>a===0],['in3','三日內','含當天',a=>a<3],['over3','三日以上','',a=>a>=3],['all','合計','',a=>true]];
    document.getElementById('trkB').textContent=`追蹤基準 ${ymd(T.base)} · 991 開箱／上架 · 最新快照`;
    const rowO=([k,lab,sub,pred])=>{const v=st.fl==='all'?T.open[k]:bk(st.fl,pred),hl=k==='over3'&&v.points>0;
      return {cls:k==='all'?'tot':'',c:[`${lab}${sub?` <span class="k">${sub}</span>`:''}`,hl?`<span class="hl2">${fmt(v.carts)}</span>`:fmt(v.carts),hl?`<span class="hl2">${fmt(v.points)}</span>`:fmt(v.points),fmt(v.pcs)],
        x:()=>`<div class="k">${lab}${sub?'（'+sub+'）':''}：開箱日距報表日 ${k==='today'?'0':k==='in3'?'0～2':k==='over3'?'3 以上':'全部'} 天（日曆日，首頁口徑）</div><div class="fl2 only" style="margin-top:8px">${FL.map(f=>{const w=bk(f,pred);return `<div>${tag(f)} <b>${fmt(w.points)}</b> 點 · ${fmt(w.carts)} 台車 · ${fmt(w.pcs)} pcs</div>`}).join('')}</div>`}};
    K.xtable('#trkO',{head:[['開箱日區分'],['台車數','台'],['點數','點'],['pcs 數','pcs']],rows:defs.map(rowO)});
    const ab=(fl,pred)=>{let imp=0,pkg=0;ARR.forEach(r=>{if(!pred(age(r.d)))return;Object.entries(r.counts).forEach(([kk,n])=>{const q=kk.split('|');if(fl!=='all'&&q[2]!==fl)return;if(q[0]==='進口件')imp+=n;else pkg+=n})});return {imp,pkg}};
    const A=T.arr,all=st.fl==='all',cols=[['all',a=>true],['in3',a=>a<=3],['over3',a=>a>3]],v=cols.map(([k,p])=>all?A[k]:{impPoints:ab(st.fl,p).imp,pkgPoints:ab(st.fl,p).pkg,impBoxes:null,pkgPcs:null});
    const nz=(x,hl)=>x==null?'<span class="na">—</span>':hl&&x>0?`<span class="hl2">${fmt(x)}</span>`:fmt(x);
    const R=(lab,sub,k,strong)=>({c:[`${lab} <span class="k">${sub}</span>`,strong?`<b>${nz(v[0][k])}</b>`:nz(v[0][k]),nz(v[1][k]),nz(v[2][k],1)]});
    K.xtable('#trkA',{head:[['分類／指標'],['合計'],['三天內','0～3 天'],['大於三天','4 天以上']],rows:[R('進口件','櫃數(櫃)','impBoxes'),R('進口件','點數(點)','impPoints',1),R('包裝件','點數(點)','pkgPoints',1),R('包裝件','pcs 數(pcs)','pkgPcs')]});
    document.getElementById('trkN').textContent=all?(T.noBox>0?`${fmt(T.noBox)} 筆進口件未填櫃號，點數保留、櫃數不補估。`:''):`${st.fl} 只有點數；櫃數與 pcs 數不分樓層，看「全區」。`;
    /* 到貨未上台車（筆） */
    const rs=ARR,val=suf=>rs.map(r=>{let t=0;Object.entries(r.counts).forEach(([kk,c])=>{const q=kk.split('|');if(q[1]===suf&&(all||q[2]===st.fl))t+=c});return t});
    document.getElementById('arB').textContent=`到貨後還沒上台車的筆數 · ${all?'全區（含未分樓層）':st.fl} · 近 ${rs.length} 個作業日`;
    if(!rs.length){noData('ar');return}
    const a1=val('已到貨'),a2=val('開櫃完畢'),lm=Math.max(10,Math.ceil(Math.max(...a2,1)*1.25/5)*5);
    K.barLine('#ar',{cats:rs.map(r=>md(r.d)),sub:rs.map(r=>wk(r.d)),stacks:[{vals:a1,color:'#cfd5dc'}],line:{vals:a2,color:K.C.ratio,unit:'筆'},lineMax:lm,yUnit:'筆',topLabel:false,h:innerWidth<=600?220:230,
      tip:j=>K.tip.card(`${ymd(rs[j].d)}（${wk(rs[j].d)}）`,all?'全區（含未分樓層）':st.fl,[['#cfd5dc','已到貨',fmt(a1[j]),'筆'],[K.C.ratio,'開櫃完畢',fmt(a2[j]),'筆']])});
  });

  /* ④ 台車清單 */
  let curRows=[];
  S.on(st=>{
    let rows=CARTS.filter(c=>K.flIn(st.fl,c.floor));
    if(st.focus==='over3')rows=rows.filter(c=>c.oldest<N3);else if(st.focus==='in3')rows=rows.filter(c=>c.oldest>=N3);
    if(st.od)rows=rows.filter(c=>c.items.some(r=>r[3]===st.od));
    curRows=rows;
    document.getElementById('cartB').textContent=`庫存不足 7 天的點數可優先上架 · 共 ${fmt(rows.length)} 台車（全部 ${fmt(CARTS.length)}）· 點台車展開未上架零件`;
    K.xtable('#cart',{limit:10,empty:'目前 0 筆：這個條件下沒有台車',head:[['台車'],['樓層'],['未上架','點'],['數量','pcs','m-hide'],['最舊開箱日'],['庫存 <7 天','點']],
      rows:rows.map(c=>({c:[`<span class="mono">${esc(c.cart)}</span>`,tag(c.floor),fmt(c.points),fmt(c.pcs),c.oldest<N3?`<span class="hl2">${md(c.oldest)}</span>`:md(c.oldest),c.low?`<b style="color:var(--bad)">${c.low}</b>`:'0'],
        x:()=>{const its=c.items.slice().sort((a,b)=>a[3]<b[3]?-1:a[3]>b[3]?1:b[1]-a[1]);
          return `<div class="xh"><b class="mono">${esc(c.cart)}</b>${tag(c.floor)}<span class="k">未上架 ${fmt(c.points)} 點 · ${fmt(c.pcs)} pcs · 最舊開箱 ${md(c.oldest)}${c.oldest<N3?'（超過 3 工作日）':''} · 庫存不足 7 天 ${c.low} 點</span><a class="lk" style="margin-left:auto" href="${esc(hashOf('find/'+encodeURIComponent(c.cart)))}">查零件（台車 ${esc(c.cart)}） ›</a></div>
          <table class="t"><thead><tr><th>件號</th><th>發票數量<small>(pcs)</small></th><th class="m-hide">發票號碼</th><th>開箱日</th><th class="m-hide">在庫<small>(pcs)</small></th><th>庫存天數<small>(天)</small></th></tr></thead><tbody>${its.map(r=>`<tr${st.od&&r[3]===st.od?' class="sel"':''}><td><span class="mono">${esc(r[0])}</span></td><td>${fmt(r[1])}</td><td class="m-hide mono">${esc(r[2])}</td><td${r[3]<N3?' class="hl"':''}>${md(r[3])}</td><td class="m-hide">${fmt(r[4])}</td><td${r[5]!=null&&r[5]<7?' class="hl"':''}>${r[5]==null?'—':fmt(r[5],1)}</td></tr>`).join('')}</tbody></table>
          <div class="note">只列還沒上架的零件，開箱日由舊到新；紅字＝開箱超過 3 工作日、庫存不足 7 天。</div>`}}))});
  });
  document.getElementById('cartX').onclick=()=>{
    const h=['台車','樓層','未上架點數','數量(pcs)','最舊開箱日','庫存<7天點數'];
    V5.xlsx('進貨台車清單',h,curRows.map(c=>[c.cart,c.floor,c.points,c.pcs,c.oldest,c.low]),`進貨台車清單_${IB?IB.reportDate:isoDay(Date.now())}.xlsx`)};

  /* ⑤ 每零件上架格數 */
  const pgOf=(d,f)=>D.pg[d]&&D.pg[d][f];
  S.on(st=>{
    const ds=PGD.filter(d=>d<=(st.day||'9999-12-31'));
    if(!ds.length){document.getElementById('pgB').textContent='只有部分日期有資料';
      document.getElementById('pgK').innerHTML='<div class="empty">還沒有「每零件上架格數」的資料</div>';['pgL1','pgL2','pgA','pgR','pgD'].forEach(i=>document.getElementById(i).innerHTML='');document.getElementById('pgT').textContent='';return}
    const Ld=ds[ds.length-1],Pd=ds[ds.length-2],fls=K.FLS(st.fl);
    document.getElementById('pgB').textContent=`最近作業日 ${md(Ld)}${Ld!==st.day?'（所選日期沒有這份數字，顯示最近一天）':''} · 只有部分日期有資料`;
    const agg=(d,fn)=>{if(!d)return null;let a=0,g=0,d1=0;fls.forEach(f=>{const e=pgOf(d,f);if(e){a+=e.avg*e.groups;g+=e.groups;d1+=e.d1}});return g?{avg:a/g,share:d1/g*100,g}:null};
    const one=(fn,dec,u,lb)=>{const c=agg(Ld,fn),p=agg(Pd,fn);return {v:c?fmt(fn(c),dec):'—',u,fl:st.fl==='all'?FL.map(f=>{const e=pgOf(Ld,f),q=Pd&&pgOf(Pd,f);const g=x=>x?fn({avg:x.avg,share:x.groups?x.d1/x.groups*100:0,g:x.groups}):null;return `<span><span class="d${f[0]}">${f}</span> <b>${e?fmt(g(e),dec):'—'}</b> ${u} ${e&&q?dl(g(e)-g(q),'',dec,lb):''}</span>`}).join(''):(c&&p?`<span>比前一筆 ${dl(fn(c)-fn(p),u,dec,lb)}</span>`:'')}};
    const a=one(x=>x.avg,2,'格',true),b=one(x=>x.share,1,'%',false),c=one(x=>x.g,0,'組',false);
    K.kpis('#pgK',[Object.assign({l:'平均上架格數'+(st.fl==='all'?'（兩層加權）':'')},a),Object.assign({l:'只放 1 格的比例'+(st.fl==='all'?'（兩層）':'')},b),Object.assign({l:'台車×零件組數'},c)]);
    const ks=ds.slice(-30),ser=(fn)=>fls.map(f=>({name:f,color:f==='2F'?K.C.f2:K.C.f3,vals:ks.map(d=>{const e=pgOf(d,f);return e&&e.groups?fn(e):null})}));
    const lg=document.getElementById('pgL1');lg.innerHTML=fls.map(f=>`<span><i class="ln" style="background:${f==='2F'?K.C.f2:K.C.f3}"></i>${f}</span>`).join('');document.getElementById('pgL2').innerHTML=lg.innerHTML;
    const tipf=(fn,u,dec)=>j=>{const k=ks[j],se=ser(fn);return K.tip.card(`${ymd(k)}（${wk(k)}）`,'',se.map(s=>[s.color,s.name,s.vals[j]==null?'—':fmt(s.vals[j],dec),u]),'',[['看這天',()=>S.set('day',k)]])};
    lineChart('#pgA',{cats:ks.map(md),sub:ks.map(wk),series:ser(e=>e.avg),yfmt:v=>fmt(v,2),yUnit:'格',h:230,L:56,sel:ks.indexOf(Ld),tip:tipf(e=>e.avg,'格',2)});
    lineChart('#pgR',{cats:ks.map(md),sub:ks.map(wk),series:ser(e=>e.d1/e.groups*100),yfmt:v=>fmt(v,0),yUnit:'%',h:230,sel:ks.indexOf(Ld),tip:tipf(e=>e.d1/e.groups*100,'%',1)});
    const rows=[];ds.slice().reverse().forEach(d=>fls.forEach(f=>{const e=pgOf(d,f);if(e)rows.push([d,f,e])}));
    document.getElementById('pgT').textContent=`${fmt(ds.length)} 天 · 日期由新到舊 · 點一天展開：上架到最多格的台車×零件`;
    K.xtable('#pgD',{limit:10,head:[['日期'],['樓層'],['平均上架格數','格'],['只放 1 格','%'],['台車×零件','組']],
      rows:rows.map(([d,f,e])=>({cls:d===Ld?'sel':'',c:[`${md(d)}（${wk(d)}）`,tag(f),fmt(e.avg,2),fmt(e.d1/e.groups*100,1),fmt(e.groups)],
        x:()=>`<div class="k">${ymd(d)} ${f}：只放 1 格 ${fmt(e.d1)} 組 · 2 格 ${fmt(e.d2)} 組 · 3 格以上 ${fmt(e.d3)} 組；上架 ${fmt(e.qty)} pcs${e.miss?'；'+fmt(e.miss)+' 筆缺資料':''}</div>
          ${e.top&&e.top.length?`<div class="ct" style="margin-top:8px">上架到最多格的台車×零件</div><table class="t"><thead><tr><th>台車</th><th>件號</th><th>上架格數<small>(格)</small></th><th>數量<small>(pcs)</small></th></tr></thead><tbody>${e.top.map(r=>`<tr><td><span class="mono">${esc(r[0])}</span></td><td><span class="mono">${esc(r[1])}</span></td><td>${fmt(r[2])}</td><td>${fmt(r[3])}</td></tr>`).join('')}</tbody></table>`:''}`}))});

    /* 每日明細：日期 × 樓層 */

    document.getElementById('bdT').textContent=`${fmt(rows.length)} 筆 · 日期由新到舊 · 點一列看筆數與數量`;

    K.xtable('#bD',{limit:10,head:[['日期'],['樓層'],['出貨點數','%'],['進貨數量','%'],['庫存非固定','%']],
      rows:rows.map(({r,f,s})=>({c:[`${md(r.d)}（${wk(r.d)}）${r.bf?' <span class="k">回補</span>':''}`,tag(f),`${P1(r,'o','h','n',f)} <span class="m-hide"><span class="k">數量 ${P1(r,'o','qh','q',f)}</span></span>`,`${P1(r,'i','qh','q',f)} <span class="m-hide"><span class="k">筆數 ${P1(r,'i','h','n',f)}</span></span>`,s?fmt(s[f].oth/(s[f].own+s[f].oth)*100,1):'<span class="na">—</span>'],
        x:()=>{const o=r.o&&r.o[f],i=r.i&&r.i[f];return `<div class="k">${ymd(r.d)} ${f}${r.bf?'（回補：用 '+md(r.l)+' 的綁定清單）':''}</div>

          <div class="s4"><b>庫存（${s?s.at.slice(5,16).replace('-','/'):'沒有這天'}）</b><div class="k">${s?`固定 ${fmt(s[f].own)} pcs ／ 非固定 ${fmt(s[f].oth)} pcs；固定格沒貨但別處有貨的綁定零件 ${fmt(s[f].emp)} 種`:'這天沒有庫存快照'}</div></div></div>`}}))});
  });

  /* ③ 依儲位類型：熱點格子圖（綠 <75、黃 75–85、紅 ≥85；原本另放的類型表已併進來） */
  S.on(st=>{

    K.$$('tbody tr',gh).forEach(tr=>{const t=T[+tr.dataset.i];tr.firstElementChild.onclick=()=>S.set('type',S.get('type')===t.type?null:t.type)});
    K.$$('td.c',gh).forEach(td=>{const t=T[+td.dataset.i],c=cols[+td.dataset.j],v=c.fn(t,c.f);if(v==null)return;
      K.tip.bind(td,()=>K.tip.card(`類型 ${t.type} · ${c.f}`,t.dims+' cm（深×寬×高）',[[FC(c.f),c.f+' '+c.m+'利用率',fmt(v,1),'%'],['','門檻',v<75?'綠（＜75%）':v<85?'黃（75–85%）':'紅（≥85%）']],c.m==='儲位'?`${fmt(t[c.f].used)} 個有庫存 ／ ${fmt(t[c.f].slots)} 個儲位`:`庫存體積占這類儲位最大體積的 ${fmt(v,1)}%（資料只有比例，沒有體積數字）`,[[st.type===t.type?'取消標出':'標出這一類',()=>S.set('type',st.type===t.type?null:t.type)]]))});

/* ================= v5 盤點（inv）：設計稿 redesign_v5\pages\inv.template.html（盤點前）＋inv_live.template.html（盤點中）的上線版 =================
   盤點首頁與「貨架」合成一頁：同一個模組依 invMode() 換內容（pre＝盤點前；live／rehearsal＝盤點中）。
   篩選列：樓層、分類、貨架狀態、貨架／件號，帶動 KPI、先清儲位、分類進度、貨架清單（盤點中另有「盤點後出問題」清單）；點 KPI 或分類列＝就地篩選貨架清單；貨架列就地展開儲位格。
   資料轉接 data()：設計稿 extract.py 的 INV_JS／B3_LIVE_JS（在 dev 站呼叫現有前端函式）搬到這裡；口徑完全沿用 invRO／iwTot／iwCls／invTonightInfo／invNodeModel／invProgData…。
   儲位格不預先算：只在展開那一座貨架時才從 invIdx().rackSlots 取（1,593 座、38,434 格）。
   下載「盤點貨架清單」：分類（高／中／低銷、空架）、樓層、避開「已綁定未上架」；CSV＋Excel。racks 的 bound／bindEmpty 欄（WP-D）還沒有時：避開選項停用並寫「綁定資料準備中」，下載照樣可用（綁定欄留空）。
   網址：inv?fl=&cls=&st=&q=&open=&rk=&dlCls=&dlFl=&dlAvoid=；舊網址 inv/racks[/<貨架或儲位>][?f=…]、inv/<盤點後代號> 都轉成狀態（from）。
   盤點前 open＝展開的貨架；盤點中 open＝展開的「盤點後出問題」那一列、rk＝展開的貨架（同設計稿）。 */
(()=>{
const CLS=[['all','全部'],['低','低銷'],['中','中銷'],['高','高銷'],['空架','空架']];
const ORD=['高','中','低','空架'];
const clsName=c=>c==='空架'?'空架':c+'銷';
const SK={ok:['✓','已盤無差'],disc:['差','已盤有盤差'],add:['新','盤點後新放進去'],miss:['漏','可能沒盤到'],swap:['換','盤點後換了零件'],todo:['','有貨未盤']};
const KP={disc:6,miss:5,swap:4,add:3,ok:2,todo:1,empty:0};
const DL_HEAD=['貨架','樓層','分類','儲位數','有貨儲位','已綁定儲位','已綁定未上架儲位','已綁定未上架儲位代碼'];
const RK_HEAD=['貨架','樓層','分類','狀態','儲位數','有貨儲位','已盤儲位','有差儲位','盤點後新放進去','可能沒盤到','盤點後換了零件','帳差零件(種)','預估工時(小時)','預計盤點日'];
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'');

/* ---------- 資料轉接 ---------- */
function data(){
  if(invGet('racks')==null||invGet('loopRows')==null)return {nodata:true,live:invMode()!=='pre'};
  const mode=invMode(),live=mode!=='pre',meta=invMeta(),ix=invIdx(),ref=invRef(),racks=invRO();
  const D0={nodata:false,live,mode,ref,racks,T:iwTot(),cls:iwCls(),ph:iwPhases(),round:meta.round||{},tn:invTonightInfo(),prog:invProgData(),shapes:(invGet('layout')||{}).shapes||[],
    asOf:invDate(),hasBind:ix.c.racks.bindEmpty!=null,bind:meta.bind||null,bindEmpty:meta.bindEmpty||null};
  if(!live){
    D0.P=iwParts();D0.rdy=invReadyItems();D0.dailyN=invNodeModel().daily.n;
  }else{
    const m=invNodeModel(),pc=ix.c.parts,flOf0=r=>r.floor||(/^2-/.test(r.pos||'')?'2F':/^3-/.test(r.pos||'')?'3F':'');
    const flOf=r=>{const f=flOf0(r);if(f)return f;const pr=ix.part.get(keyOf(r.part));return pr&&pc.floor!=null?pr[pc.floor]:''};
    const node=id=>INV_NODES.find(t=>t.id===id)||{};
    const mk=c=>{const t=node(c.id),ui=IVN_UI[c.id]||{};
      return {id:c.id,slug:ivnSlug(c),name:c.name,tag:c.tag||'',grp:c.grp||'',gi:IVT_GRP.indexOf(c.grp),oi:ivtOrd(c),pending:!!c.pending,u:t.u||'',lim:t.lim||'',def:ui.sdef||t.def||'',act:ui.act1||(t.todo&&t.todo[0])||'',n:c.n,over:c.over||0,
        rows:(c.rows||[]).map(r=>({p:r.part,f:flOf(r),pos:r.pos||'',q:r.qty,a:r.age==null?null:r.age,at:String(r.at||'').slice(0,16),ge:!!(t.fromFirst||r.ge),ev:strip(r.ev),g:r.grp||'',sc:r.scope||'',ov:!!r.over,
          act:(()=>{try{return t.act?String(t.act(r)||''):''}catch(e){return ''}})()}))}};
    D0.board={n:m.board.n,secs:[2,3].map(n=>ivtSecCards(m,n).map(mk))};
    D0.tnRacks=(meta.tonight||{}).racks||[];D0.rates=meta.rates||{};D0.health=meta.health||null;D0.secTitle={2:'盤點後的儲位',3:'盤點過的零件'};
  }
  return D0;
}

/* ---------- 樣式（設計稿 <style>：盤點前＋盤點中合併；階段條置中是使用者 10/23 的決定，兩種模式都套） ---------- */

.chk li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk i{font-style:normal;font-weight:800;text-align:center}
.chk .ok i{color:var(--good)}.chk .no i{color:var(--bad)}.chk .wn i{color:var(--warn)}
.faces{display:flex;flex-wrap:wrap;gap:16px 24px;margin-top:8px}
.face b{font-size:14px;color:var(--ink2)}
.grid{display:grid;gap:3px;margin-top:4px}
.cell{width:48px;height:40px;border-radius:4px;border:1px solid var(--line);font-size:14px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cell small{font-size:14px;color:var(--mut)}
table.t td .ki{display:inline;font-size:14px;color:var(--mut)}
@media (max-width:600px){table.t td .ki{display:none}}
.cell.has,.cell.todo{background:#eef1f4;border-color:#c9d1da}
.cell.ok{background:#e3f3ea;border-color:#9fd3b6}.cell.disc{background:#fde8e6;border-color:#f0a8a1}
.cell.add{background:#e6eefc;border-color:#9db8ee}.cell.miss{background:#fff3c4;border-color:#e0b100}.cell.swap{background:#efe6fa;border-color:#c3a6e6}
.cell.clr{outline:2px solid var(--bad);outline-offset:-2px}
.cell.unk{border-style:dashed;background:#fff;color:var(--mut)}   /* meta.degraded：slots 被簡化時沒列到的格，不代表空格 */
.ivpre .cell.hit{background:#fff3c4;border-color:#e0b100}
.ivlive .cell.hit{box-shadow:0 0 0 2px var(--acc)}
.lg2{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink2);margin-top:8px}
.lg2 span{display:inline-flex;align-items:center;gap:6px}.lg2 .cell{width:20px;height:16px}
@media (max-width:900px){.phase{grid-template-columns:repeat(4,minmax(0,1fr))}.phase div:nth-child(4){border-right:0}.phase div:nth-child(-n+4){border-bottom:1px solid var(--line)}}
@media (max-width:600px){.cell{width:40px;height:36px}.qbox input{width:100%}.xin .faces{max-width:calc(100vw - 72px);overflow-x:auto}#rk td:nth-child(2){white-space:normal}}   /* 390 寬：貨架清單展開的儲位格自己左右捲、狀態欄可換行，整頁不橫向溢出 */
.dlc{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:12px}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--acc);margin:0;flex:none}
.ck.off{cursor:default;color:var(--mut)}
.dls{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.dls div{padding:2px 0}
.dlb{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px}
.btn:disabled{opacity:.4;cursor:default}
table.t tr.bmk td{background:#fff8e6}
.bm{color:var(--warn);font-weight:800}
.qbox{display:flex;gap:8px;align-items:center}.qbox input{width:200px;height:32px;border:1px solid #c9d1da;border-radius:8px;padding:0 10px;font:inherit;font-size:16px}
@media (max-width:600px){.qbox{width:100%}.qbox input{flex:1;width:auto}}
.def{margin:0 0 4px}.def b{color:var(--ink)}
.tdo{margin:0 0 8px;color:var(--ink2)}.tdo b{color:var(--acc)}
table.t td.why{white-space:normal;max-width:520px;min-width:120px}
.cl{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.st{display:inline-block;font-size:14px;font-weight:700;border-radius:999px;padding:0 8px;line-height:22px}
.st.ok{background:#e6f4ec;color:var(--good)}.st.w{background:#fff3dc;color:var(--warn)}
@media (max-width:600px){table.t td.why{min-width:0;word-break:break-all}}
`;

/* ---------- 頁面骨架 ---------- */
const FBAR=D=>`<div class="fbar"><div class="in">
  <div class="fg"><label>樓層</label><div id="fFl"></div></div>
  <div class="fg"><label>分類</label><div id="fCl"></div></div>
  <div class="fg"><label>貨架狀態</label><div id="fSt"></div></div>
  <div class="fg qbox"><label for="iq">貨架／件號</label><input id="iq" placeholder="例：2-01-0012 或件號" autocomplete="off"></div>
  <div class="scope" id="scope"></div>
</div></div>`;
const RACKSEC=`<section class="sec" id="secRk">
    <div class="sh"><h2>貨架清單</h2><span class="badge" id="rkB"></span><span class="act"><button type="button" class="lk" id="rkX">匯出 Excel</button></span></div>
    <div id="rk"></div>
  </section>`;
const CLSSEC=`<section class="sec g">
    <div class="col s6">
      <div class="sh"><h2>分類進度</h2><span class="badge">點一列＝只看那個分類</span></div>
      <div id="cls"></div>
    </div>
    <div class="col s6">
      <div class="sh"><h2>每日累計已盤貨架</h2><span class="badge">第一輪計畫 vs 實際</span></div>
      <div class="legend"><span><i style="background:var(--act)"></i>實際累計已盤（座）</span><span><i style="background:var(--none)"></i>計畫累計還差（座）</span></div>
      <div id="pg"></div>
    </div>
  </section>`;
const DLSEC=`<section class="sec" id="secDl">
    <div class="sh"><h2>下載盤點貨架清單</h2><span class="badge" id="dlB"></span></div>
    <div class="dlc">
      <div class="fg"><label>分類</label><div id="dlCls"></div></div>
      <div class="fg"><label>樓層</label><div id="dlFl"></div><span class="k" id="dlFlN"></span></div>
      <label class="ck" id="dlAvL"><input type="checkbox" id="dlAv"><span id="dlAvT">避開有「已綁定未上架」儲位的貨架</span></label>
    </div>
    <div class="dls" id="dlSum"></div>
    <div id="dlTb"></div>
    <div class="dlb"><button type="button" class="btn" id="dlCsv">下載 CSV</button><button type="button" class="btn ghost" id="dlXls">下載 Excel</button><span class="note" id="dlNote" style="margin:0"></span></div>
    <p class="note" id="dlDef"></p>
  </section>`;

const degNote=()=>{const dg=invDegraded();return dg?`<div class="stale" role="status"><span>${esc('部分儲位未列出（資料太多，先省略'+(dg.from&&dg.to?'：列出 '+K.fmt(dg.to)+'／'+K.fmt(dg.from)+' 個儲位':'')+'）。貨架狀態和各項數字以貨架彙總為準；貨架明細裡虛線「未列出」的格，不代表空格或沒貨；零件履歷和各清單不受影響。')}</span></div>`:''};
function html(D,st){
  if(D.nodata)return `<div class="ph"><h1>盤點</h1></div><main><section class="sec"><div class="empty">還沒有資料：這份資料沒有貨架或每日檢查明細，要新版資料整理程式才有。</div></section></main>`;
  const ph=`<div class="ph"><h1>盤點</h1>${D.live?'<span class="st ok">盤點中</span>':''}<span class="asof">資料 ${esc(D.asOf)}</span></div>`;
  if(!D.live)return ph+FBAR(D)+`<main class="ivpre">
  ${degNote()}${V5.stale(['diff','picking','putDiff'])}
  <section class="sec">
    <div class="sh"><h2 id="phH">盤點開始前</h2><span class="badge" id="phB"></span><span class="act"><a class="lk" href="${esc(hashOf('ref/inv'))}">ⓘ 盤點規則</a></span></div>
    <div class="phase" id="ph"></div>
  </section>
  <section class="sec"><div id="kp"></div></section>
  ${DLSEC}
  <section class="sec g">
    <div class="col s6">
      <div class="sh"><h2>準備度檢查</h2><span class="badge">盤點開始前要確認的事</span></div>
      <ul class="chk" id="rdy"></ul>
    </div>
    <div class="col s6">
      <div class="sh"><h2 id="clH">第一晚要先清的儲位</h2><span class="badge" id="clB"></span></div>
      <div id="cl"></div>
    </div>
  </section>
  ${CLSSEC}
  ${RACKSEC}
</main>`;
  return ph+FBAR(D)+`<main class="ivlive">
  <section class="sec">
    <div class="sh"><h2 id="phH">盤點中</h2><span class="badge" id="phB"></span><span class="act"><a class="lk" href="${esc(hashOf('ref/inv'))}">ⓘ 盤點規則</a></span></div>
    <div class="phase" id="ph"></div>
    <div id="stale"></div>${degNote()}
  </section>
  <section class="sec"><div id="kp"></div></section>
  <section class="sec" id="secIssue">
    <div class="sh"><h2>盤點後出問題</h2><span class="badge">盤過的東西，盤完之後有沒有被弄壞；每一項都應該是 0 筆</span><span class="act"><button class="lk" type="button" id="xlsx">匯出 Excel：每種問題一頁 ›</button></span></div>
    <div id="is"></div>
    <div class="cl" id="close"></div>
  </section>
  <section class="sec" id="secTn">
    <div class="sh"><h2 id="clH">今晚要先清的儲位</h2><span class="badge" id="clB"></span></div>
    <div id="cl"></div>
  </section>
  ${CLSSEC}
  ${RACKSEC}
</main>`;
}

/* ---------- render ---------- */
function mount(S,D,ctx){
  if(D.nodata)return;
  const {fmt,md,wk,ymd,tag}=K,live=D.live,ix=invIdx(),sc=ix.c.slots;
  const ST=[['all','全部'],['todo','待盤'],['done','已盤'],['tonight',live?'今晚要盤':'第一晚要盤'],['added','盤點後新放進去'],['missed','可能沒盤到'],['disc','盤點有差異']];
  K.seg('#fFl',S,'fl',[['all','全部'],['2F','2F','f2b'],['3F','3F','f3b']]);K.seg('#fCl',S,'cls',CLS);K.seg('#fSt',S,'st',ST);
  const qi=document.getElementById('iq');let qt;
  qi.value=S.get('q')||'';
  qi.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>S.set('q',qi.value.trim().toUpperCase()),200)};
  const TN=D.tn,TNSET=new Set(D.tnRacks||[]),clrSet=new Set((TN?TN.rows:[]).map(r=>r[1]));
  const isDone=r=>r.state==='done'||r.state==='doneMiss';
  const isTn=live?(r=>TNSET.has(r.rack)&&!isDone(r)):(r=>!!TN&&r.pd===TN.date&&r.state!=='done');
  const inFl=(st,f)=>st.fl==='all'||f===st.fl;
  const nmTn=live?'今晚':'第一晚';
  /* 含這串字的件號放在哪些貨架（輸入件號時用）：依輸入字串記起來 */
  const partRacks=(()=>{let k0=null,set=null;return q=>{const k=keyOf(q);if(k===k0)return set;k0=k;set=new Set();
    if(k)ix.partSlots.forEach((rows,pk)=>{if(pk.includes(k))rows.forEach(r=>set.add(String(r[sc.pos]).slice(0,9)))});return set}})();
  function match(st,r){
    if(st.fl!=='all'&&r.floor!==st.fl)return false;
    if(st.cls!=='all'&&(st.cls==='空架'?r.cls!=='空架':r.cls!==st.cls))return false;
    if(st.st==='todo'&&r.state!=='todo')return false;if(st.st==='done'&&!(live?isDone(r):r.state==='done'))return false;if(st.st==='tonight'&&!isTn(r))return false;
    if(st.st==='added'&&!r.add)return false;if(st.st==='missed'&&!r.miss)return false;if(st.st==='disc'&&!r.disc)return false;
    if(st.q){if(r.rack.startsWith(st.q.slice(0,9)))return true;return partRacks(st.q).has(r.rack)}
    return true;
  }
  let R;S.on(st=>{R=D.racks.filter(r=>match(st,r))});
  const bumpUrl=()=>V5.sync(ctx.def,S.get());   /* 展開貨架／清單列只改網址，不重畫 */

  /* 盤點後出問題各卡依樓層與件號／貨架篩過（盤點中） */
  let CARDS=[];
  const keepRow=(st,r)=>inFl(st,r.f)&&(!st.q||r.p.toUpperCase().includes(st.q)||String(r.pos).startsWith(st.q.slice(0,9)));
  if(live)S.on(st=>{CARDS=D.board.secs.map(sec=>sec.map(c=>Object.assign({},c,{rs:c.rows.filter(r=>keepRow(st,r))})))});
  const issueN=()=>CARDS.flat().filter(c=>!c.pending).reduce((s,c)=>s+c.rs.length,0);

  /* 範圍 */
  S.on(st=>{document.getElementById('scope').innerHTML=`<b>${fmt(R.length)}</b> 座貨架 · ${st.fl==='all'?'2F＋3F':st.fl}${st.cls!=='all'?' · '+CLS.find(c=>c[0]===st.cls)[1]:''}${st.st!=='all'?' · '+ST.find(c=>c[0]===st.st)[1]:''}${st.q?' · 含 <b>'+esc(st.q)+'</b>':''}${live?` · 盤點後出問題 <b>${fmt(issueN())}</b> 筆`:''}`});

  /* ① 階段條 */
  S.on(()=>{
    const t=D.ref.today,ps=D.ph;let cur=ps.findIndex(p=>p.start<=t&&t<=p.end);if(cur<0&&!live)cur=0;   /* 開盤前還沒進任何階段時，反白第一格（前置作業） */
    document.getElementById('ph').innerHTML=ps.map((p,i)=>`<div class="${i===cur?'on':p.end<t?'past':''}"><b>${esc(p.name)}</b><span>${md(p.start)}${p.end!==p.start?'～'+md(p.end):''}</span></div>`).join('');
    if(!live){
      const rs=D.round.start,dd=rs?Math.round((new Date(rs)-new Date(t))/864e5):null;
      document.getElementById('phB').textContent=rs&&t<rs?`距離試盤 ${dd} 天（${md(rs)}）`:'';
    }else{
      const p=ps[cur],wd=(a,b)=>{let n=0;for(let d=new Date(a+'T00:00:00Z');d<=new Date(b+'T00:00:00Z');d=new Date(+d+864e5))if(d.getUTCDay()!==0)n++;return n};
      document.getElementById('phH').textContent=p?`${p.name}第 ${wd(p.start,t)} 個工作日`:'盤點中';
      document.getElementById('phB').textContent=`第一輪 ${D.round.start?md(D.round.start):'—'} 起${D.ref.night?` · 最近一個有盤點紀錄的晚上 ${md(D.ref.night)}`:''}`;
      const h=D.health;document.getElementById('stale').innerHTML=h&&h.complete===false?`<div class="stale"><b>盤點資料這一輪沒更新完整</b><span>${(h.warnings||[]).map(esc).join('；')}。燈號可能不準。來源：資料整理程式每輪的檢查（今天應更新 ${fmt(h.runsExpected)} 次、實跑 ${fmt(h.runsActual)} 次）</span></div>`:'';
    }
  });

  /* ② KPI */
  const toRk=()=>document.getElementById('secRk').scrollIntoView({behavior:'smooth'});
  if(!live)S.on(st=>{
    const inF=r=>st.fl==='all'||r.floor===st.fl,todo=D.racks.filter(r=>r.state==='todo'&&inF(r)),tn=TN?D.racks.filter(r=>r.pd===TN.date&&inF(r)):[],tnE=tn.filter(r=>r.state==='empty');
    const items=[{id:'todo',l:'待盤貨架',v:fmt(todo.length),u:'座',fl:st.fl==='all'?K.flPair(D.T.t2,D.T.t3,'座'):'',sub:'點一下＝下方只看待盤'}];
    if(TN)items.push({id:'tonight',l:`第一晚 ${md(TN.date)} 要盤`,v:fmt(tn.length),u:'座',sub:`含空架 ${fmt(tnE.length)} 座 · ${TN.clearBy} 前先清 ${fmt(TN.rows.filter(r=>st.fl==='all'||r[1][0]===st.fl[0]).length)} 個儲位`});
    items.push({l:'開始前 HOPES ≠ WES 帳差',v:fmt(D.P.eff),u:'種',sub:`金額 ${fmt(D.P.effAmt)} 元 · 全倉 <a class="lk" href="${esc(hashOf('ab'))}">到異常 ›</a>`},
      {l:'日常待辦（要清到 0）',v:fmt(D.dailyN),u:'筆',sub:`全倉 <a class="lk" href="${esc(hashOf('ab'))}">到異常 ›</a>`});
    K.kpis('#kp',items,st.st,id=>{S.set({st:st.st===id?'all':id,open:null});toRk()});
  });
  else S.on(st=>{
    const ne=D.racks.filter(r=>r.state!=='empty'&&inFl(st,r.floor)),done=ne.filter(isDone).length;
    const d2=D.racks.filter(r=>r.floor==='2F'&&isDone(r)).length,d3=D.racks.filter(r=>r.floor==='3F'&&isDone(r)).length;
    const rt=D.rates.slotRecorded||{n:0,d:0},all=st.fl==='all';
    const sl=all?[rt.n,rt.d]:[ne.reduce((s,r)=>s+r.rd,0),ne.reduce((s,r)=>s+r.used,0)];
    const pf=f=>{const x=D.racks.filter(r=>r.state!=='empty'&&r.floor===f);const u=x.reduce((s,r)=>s+r.used,0);return u?fmt(x.reduce((s,r)=>s+r.rd,0)/u*100,0)+'%':'—'};
    const tn=TN?D.racks.filter(r=>isTn(r)||TNSET.has(r.rack)).filter(r=>inFl(st,r.floor)):[],tnE=tn.filter(r=>r.state==='empty').length,clr=TN?TN.rows.filter(r=>inFl(st,r[1][0]+'F')).length:0;
    const live2=D.board.secs.flat().filter(c=>!c.pending);
    const is2=live2.reduce((s,c)=>s+c.rows.filter(r=>r.f==='2F').length,0),is3=live2.reduce((s,c)=>s+c.rows.filter(r=>r.f==='3F').length,0);
    const secN=i=>CARDS[i].filter(c=>!c.pending).reduce((s,c)=>s+c.rs.length,0);
    const items=[
      {id:'done',l:'貨架已盤',v:fmt(done),u:`／${fmt(ne.length)} 座`,fl:all?K.flPair(d2,d3,'座'):'',sub:`${fmt(done/ne.length*100,0)}%${all&&D.T.plan!=null?`・落後 ${fmt(D.T.lag)} 座（計畫累計 ${fmt(D.T.plan)} 座）`:''}${all?'':'・點一下＝下方只看已盤'}`},
      {l:'有貨儲位已盤',v:fmt(sl[0]/sl[1]*100,0),u:'%',fl:all?`<span><span class="d2">2F</span> <b>${pf('2F')}</b></span><span><span class="d3">3F</span> <b>${pf('3F')}</b></span>`:'',sub:`${fmt(sl[0])}／${fmt(sl[1])} 個${all?'':'（依貨架加總）'}`}];
    if(TN)items.push({id:'tonight',l:`今晚 ${md(TN.date)} 要盤`,v:fmt(tn.length),u:'座',sub:`含空架 ${fmt(tnE)} 座 · ${TN.clearBy} 前先清 ${fmt(clr)} 個儲位`});
    items.push({id:'issue',l:'盤點後出問題',v:fmt(issueN()),u:'筆',cls:issueN()?'bad':'good',fl:all&&!st.q?K.flPair(is2,is3,'筆'):'',sub:`儲位 ${fmt(secN(0))}・零件 ${fmt(secN(1))}`});
    K.kpis('#kp',items,st.st==='tonight'?'tonight':st.st==='done'?'done':null,id=>{
      if(id==='issue'){document.getElementById('secIssue').scrollIntoView({behavior:'smooth'});return}
      const v=id==='done'?'done':'tonight';S.set({st:st.st===v?'all':v,rk:null});toRk()});
  });

  /* ③ 盤點後出問題（盤點中）：清單列（儲位｜零件兩區），展開＝定義＋要做什麼＋表；關帳條件一行 */
  if(live){
    const LV_HEAD=['件號','樓層','位置(儲位)','數量(pcs)','發生','已過(工作日)','動作／原因'];
    const lvRows=rs=>rs.map(r=>[r.p,r.f,r.pos||'',r.q==null?'':r.q,r.at?r.at:'',r.a==null?'':r.a,r.act||r.ev]);
    const age=r=>r.a==null?'':`<span class="k">已過 ${fmt(r.a)} 工作日</span>`;
    const pbtn=p=>`<button class="dn-l mono" data-q="${esc(p)}" title="整頁只看這個件號">${esc(p)}</button>`;
    const bindQ=el=>el.querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{e.stopPropagation();qi.value=b.dataset.q;S.set({q:b.dataset.q});window.scrollTo({top:0,behavior:'smooth'})});
    S.on(st=>{
      const order=(a,b)=>(a.gi-b.gi)||(a.oi-b.oi)||(b.n-a.n);
      const body=c=>{const id='it-'+c.slug;
        setTimeout(()=>{const el=document.getElementById(id);if(!el)return;K.xtable(el,{limit:8,head:[['件號'],['樓層'],['位置','儲位','m-hide'],['數量','pcs'],['發生'],['原因','','l why']],
          rows:c.rs.map(r=>({c:[pbtn(r.p),tag(r.f),`<span class="mono">${esc(r.pos||'—')}</span>`,r.q==null?'<span class="na">—</span>':fmt(r.q),`${r.at?md(r.at):'—'}${age(r)}`,
            `${esc(r.act||r.ev)}${r.sc?`<span class="k" style="display:block">${esc(r.sc)}</span>`:''}`]})),after:bindQ});
          const bc=document.getElementById(id+'-c'),bx=document.getElementById(id+'-x'),nm='盤點後出問題_'+c.name;
          if(bc)bc.onclick=()=>V5.copy(LV_HEAD,lvRows(c.rs));

        return `<p class="def">${esc(c.def)} · <b>期限 ${esc(c.lim)}</b> ${V5.ref('t-'+c.slug,'這一項怎麼算、怎麼發生、做完怎樣算好')}</p><p class="tdo"><b>要做什麼</b>　${esc(c.act)}</p><div id="${id}"></div><div class="note"><button type="button" class="lk" id="${id}-c">複製表格</button>　<button type="button" class="lk" id="${id}-x">匯出 Excel</button></div>`};
      const groups=CARDS.map((sec,i)=>{const lv=sec.filter(c=>!c.pending&&c.rs.length>0).sort(order),zero=sec.filter(c=>c.pending||c.rs.length===0);
        return {g:D.secTitle[i+2],items:lv.map(c=>({id:c.slug,name:esc(c.name),sub:(c.tag||c.grp?esc(c.tag||c.grp)+' · ':'')+`期限 ${esc(c.lim)}`,n2:c.rs.filter(r=>r.f==='2F').length,n3:c.rs.filter(r=>r.f==='3F').length,tot:c.rs.length,x:()=>body(c)})),zero:zero.length?`目前 0 筆：${zero.map(c=>esc(c.name)).join('、')}`:''}});
      K.xlist('#is',{head:'項目（點一列就地展開）',groups,open:st.open,fl:st.fl,flTot:it=>it.tot,onOpen:id=>{S.get().open=id;bumpUrl()}});
      const rt=D.rates.slotRecorded||{n:0,d:0},ok=issueN()===0&&rt.d>0&&rt.n>=rt.d;
      document.getElementById('close').innerHTML=`<b>關帳條件</b><span>上面全部 0 筆，且有貨儲位 100% 盤過</span><span class="st ${ok?'ok':'w'}">${ok?'已達成':'還沒達成'}</span><span class="k">目前出問題 ${fmt(D.board.secs.flat().filter(c=>!c.pending).reduce((s,c)=>s+c.n,0))} 筆（全倉）· 有貨儲位已盤 ${fmt(rt.d?rt.n/rt.d*100:null,1)}%</span>`;
    });
    document.getElementById('xlsx').onclick=()=>{if(typeof IVLX!=='undefined'&&IVLX.state==='missing')toast('盤點後問題的 Excel 還沒有發布（資料整理程式第一次產生後才會有）');else ivlExport()};
    try{ivlProbeExport()}catch(e){}
  }

  /* ④ 準備度＋先清的儲位 */
  S.on(st=>{
    if(!live){
      const ic={ok:'✓',no:'✗',wn:'!'};
      document.getElementById('rdy').innerHTML=D.rdy.map(([k,t])=>`<li class="${k}"><i>${ic[k]||'·'}</i><span>${t}</span></li>`).join('');
    }
