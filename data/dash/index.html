/* ===================== 全站共用（任何頁面都啟用）：頂列 #hdr、搜尋建議、資料時間燈、toast =====================
   頂列用 id 選擇器，避免和舊版（#cssL）或 v5（#cssK）的 class 撞名；顏色寫死（兩套樣式的 :root 變數值不同）。 */
*{box-sizing:border-box}
html{scroll-padding-top:104px}   /* 頂列 sticky：捲到某個區塊時不要被頂列蓋住（v5 頁 #cssK 另有 120px） */
#hdr{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e1e6ec;font:400 16px/1.5 "Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC",system-ui,Arial,sans-serif;color:#16202a}
#hdr .hin{max-width:1400px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap}
#hdr a{text-decoration:none}
#brand{font-weight:800;color:#941e34;font-size:20px;white-space:nowrap}
#boards{display:flex;gap:4px;flex-wrap:wrap}
#boards a{padding:4px 12px;border-radius:8px;color:#3f4d5c;font-weight:700;font-size:16px;white-space:nowrap}
#boards a.on{background:#941e34;color:#fff}
#subtabs{order:9;flex:1 0 100%;display:flex;gap:4px 16px;flex-wrap:wrap;font-size:14px;font-weight:700}   /* 營運子頁籤固定在第二列 */
#subtabs[hidden]{display:none}
#subtabs a{color:#6c7a89;padding:2px 0;border-bottom:2px solid transparent;white-space:nowrap}
#subtabs a.on{color:#16202a;border-bottom-color:#941e34}
#hdr .hq{position:relative;margin-left:auto;flex:0 1 280px;min-width:180px}
#q{width:100%;height:32px;padding:0 12px;border:1px solid #c9d1da;border-radius:8px;background:#fff;font:inherit;font-size:14px;color:#16202a}
#q::placeholder{color:#8c9aa8}
#sugg{position:absolute;left:0;right:0;top:40px;z-index:31;background:#fff;border:1px solid #e1e6ec;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);display:none;overflow:hidden}
#sugg.on{display:block}
#sugg button{display:flex;gap:12px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid #edf1f5;background:#fff;text-align:left;font:inherit;font-size:16px;cursor:pointer}
#sugg button:hover{background:#f6f8fa}#sugg small{font-size:14px;color:#6c7a89}
#fresh{display:flex;align-items:center;gap:8px;font-size:14px;color:#3f4d5c;white-space:nowrap;font-weight:400}
#fresh:hover{text-decoration:underline}
#fresh .dot{width:9px;height:9px;border-radius:50%;background:#8795a3;flex:none}
#fresh.ok .dot{background:#14804a}#fresh.warn .dot{background:#e0a100}#fresh.bad .dot{background:#c2362b}#fresh.warn,#fresh.bad{font-weight:700}
#freshShort{display:none}
#hdrRef{font-size:14px;font-weight:700;color:#6c7a89;white-space:nowrap}#hdrRef.on{color:#941e34}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:11px 20px;border-radius:10px;background:#17222d;color:#fff;font-size:15px;z-index:99;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
@media (max-width:760px){#hdr .hq{display:none}#fresh{margin-left:auto}#freshText{display:none}#freshShort{display:inline}}
@media (max-width:600px){html{scroll-padding-top:16px}#hdr{position:static}#hdr .hin{padding:8px 16px;gap:8px 12px}#boards{gap:2px}#boards a{padding:4px 8px}#subtabs{width:100%;gap:4px 12px}}
/* 列印：頂列、toast 不印（v5 頁面的列印版另外用 html.pv，見各頁 css） */
@media print{#hdr,.toast{display:none!important}}
html.pv #hdr,html.pv .toast{display:none!important}

  --brand:#941e34;--brandS:#fbeff2;--accent:#0b7285;--accentS:#e3f4f7;
  /* 顏色語意（第三看板也照這套）：
     --f2 --f3（與淡色 --f2s --f3s）只給 2F／3F 樓層，任何圖表／標籤不可拿來表示別的東西
     --c1…--c6 分類色（作業別、環節、狀態分類…），刻意避開藍／橘（樓層）與紅／綠／琥珀（狀態）
     --good --bad --warn 只表好壞（改善／變差／逾期／警示），不拿來當分類

  --f2:#2563eb;--f2s:#9db8ff;--f3:#e8710a;--f3s:#ffc999;
  --c1:#1b94a8;--c2:#6f4bc4;--c3:#b83b8e;--c4:#8a6347;--c5:#5f7388;--c6:#0b4f6c;
  --neutral:#8795a3;--neutralS:#c9d3dd;

}

a{color:var(--accent);text-decoration:none;font-weight:700}a:hover{text-decoration:underline}

  .cc-h{flex-wrap:wrap}.cc-btns{width:100%}
  #page{padding:18px 16px 48px}.g2,.g3,.g4{grid-template-columns:1fr}.cols{column-gap:14px}
  .tools .chip{white-space:normal;border-radius:12px}.hot5{grid-template-columns:repeat(2,minmax(0,1fr))}.agelist{grid-template-columns:repeat(2,minmax(0,1fr))}.hc-r{justify-content:flex-start;width:100%;min-width:0}.hc-r .seg{max-width:100%;overflow-x:auto;scrollbar-width:thin}.hc-r .seg button{white-space:nowrap}.al{align-items:flex-start}.al em{display:none}
  /* 表格比螢幕寬時，左右邊緣出現漸層陰影提示「還能橫向捲動」（純 CSS：scroll／local 兩層背景） */
  .tw{background:linear-gradient(to right,#fff 30%,rgba(255,255,255,0)) left center/36px 100% no-repeat local,linear-gradient(to left,#fff 30%,rgba(255,255,255,0)) right center/36px 100% no-repeat local,linear-gradient(to right,rgba(16,24,40,.22),rgba(16,24,40,0)) left center/14px 100% no-repeat scroll,linear-gradient(to left,rgba(16,24,40,.22),rgba(16,24,40,0)) right center/14px 100% no-repeat scroll #fff}
}
/* ---------- 第三看板（盤點追查）：只用上面的 token；字級 >= 13px ---------- */
.banner.bad{background:var(--badS);color:var(--bad);font-weight:700}
.banner.rehearsal{background:var(--warnS);color:var(--warn);border:1px solid var(--warn);font-weight:700}
.frsw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.frs{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.frs:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neutral)}
.frs.ok:before{background:var(--good)}.frs.warn:before{background:var(--warn)}.frs.bad:before{background:var(--bad)}
.stat b.na{font-size:16px;color:var(--muted)}
/* W15 時段分析 */
.sl-col{min-width:0}.sl-end{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;margin:-10px 0 0;padding:12px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#fff;font-size:15px;color:var(--ink2)}.sl-end b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:16px}
.ci{display:block;color:var(--muted);font-size:13px;font-weight:400;white-space:nowrap}.t tr.sl-avg td{background:var(--soft);font-weight:700}
.chip.good{background:var(--goodS);color:var(--good)}
.chip.cat.c1{background:var(--accentS);color:var(--c1)}.chip.cat.c2{background:var(--soft);color:var(--c2);border:1px solid var(--c2)}.chip.cat.c3{background:var(--brandS);color:var(--c3)}.chip.cat.c4{background:var(--warnS);color:var(--c4)}.chip.cat.c5{background:var(--soft);color:var(--c5);border:1px solid var(--c5)}.chip.cat.c6{background:var(--soft);color:var(--c6)}
.chip.cat.neutral{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
/* 對帳迴路燈號（綠／黃／紅；灰＝尚無資料。不只靠顏色：每個燈旁都有文字） */
.lamp{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--neutralS)}
.lamp.ok{background:var(--good)}.lamp.warn{background:var(--warn)}.lamp.bad{background:var(--bad)}
.lpsum{margin:0 0 10px;font-size:15px;color:var(--ink2)}.lpsum small{color:var(--muted);margin-left:8px;font-size:13px}
.loops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
a.lp{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;column-gap:4px;align-items:center;min-width:0;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--neutralS);color:inherit;font-weight:400}
a.lp.ok{border-left-color:var(--good)}a.lp.warn{border-left-color:var(--warn)}a.lp.bad{border-left-color:var(--bad);background:var(--badS)}
a.lp:hover{text-decoration:none;box-shadow:0 3px 12px rgba(20,40,60,.1)}
.lp small{color:var(--muted);font-weight:800;font-size:13px}.lp b{font-size:15px;min-width:0;overflow-wrap:anywhere}.lp em{grid-column:1/4;font-style:normal;font-size:13.5px;color:var(--ink2);margin-top:3px}
/* 漏斗、階段條、趨勢小圖 */
.funnel{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.funnel>div{flex:1;min-width:130px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.funnel small{display:block;color:var(--muted);font-size:13.5px;font-weight:700}.funnel b{font-size:26px;font-variant-numeric:tabular-nums}.funnel em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.funnel .w{background:var(--warnS)}.funnel .w b{color:var(--warn)}.funnel .r{background:var(--badS)}.funnel .r b{color:var(--bad)}
.funnel>i{align-self:center;color:var(--muted);font-style:normal;font-weight:800}
.phases{display:flex;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.phases span{flex:1;text-align:center;padding:8px 4px;font-size:14.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}.phases span:first-child{border-left:0}
.phases .past{background:var(--soft);color:var(--ink2)}.phases .now{background:var(--accent);color:#fff}
.spark{width:120px;height:28px;vertical-align:middle}.spark polyline{fill:none;stroke:var(--bad);stroke-width:2;vector-effect:non-scaling-stroke}
/* 儲位格：格內一定有文字縮寫（✓差新漏換），不只靠顏色 */
.faces{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:22px}
.face h4{margin:0 0 8px;font-size:15px;color:var(--ink2)}
.sg{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:5px}
.sc{position:relative;min-width:0;height:50px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink2);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.sc small{font-size:13px;font-weight:600;color:var(--muted)}
.sc.blank{border:0;background:transparent}
.sc.sel{outline:3px solid var(--brand);outline-offset:1px}
.sc.k-ok{background:var(--goodS);color:var(--good);border-color:var(--good)}.sc.k-disc{background:var(--badS);color:var(--bad);border-color:var(--bad)}.sc.k-add{background:var(--brandS);color:var(--c3);border-color:var(--c3)}
.sc.k-miss{background:var(--warnS);color:var(--warn);border-color:var(--warn)}.sc.k-swap{background:var(--accentS);color:var(--c1);border-color:var(--c1)}.sc.k-empty{background:var(--soft);color:var(--neutral);border-color:var(--line2)}.sc.k-unk{background:var(--panel);color:var(--muted);border:1px dashed var(--neutral)}
.tag2{position:absolute;top:1px;right:3px;font-style:normal;font-size:13px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 16px;font-size:13.5px;color:var(--ink2)}
.legend i.sk{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);margin-right:6px;vertical-align:-2px;background:var(--panel)}
.legend i.sk.k-ok{background:var(--goodS);border-color:var(--good)}.legend i.sk.k-disc{background:var(--badS);border-color:var(--bad)}.legend i.sk.k-add{background:var(--brandS);border-color:var(--c3)}.legend i.sk.k-miss{background:var(--warnS);border-color:var(--warn)}.legend i.sk.k-swap{background:var(--accentS);border-color:var(--c1)}.legend i.sk.k-empty{background:var(--soft);border-color:var(--line2)}.legend i.sk.k-unk{background:var(--panel);border:1px dashed var(--neutral)}
/* 時間軸（HTML grid）：槓＝有庫存期間，◆＝盤點，≤＝歷程開始前就在 */
.tlr{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.tll{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.tlt{position:relative;height:22px;background:var(--soft);border-radius:6px}
.tlbar{position:absolute;top:5px;height:12px;border-radius:6px;background:var(--neutralS)}.tlbar.cur{background:var(--accent)}
.tlcnt{position:absolute;top:1px;font-size:14px;color:var(--bad);transform:translateX(-50%)}
.tlearly{position:absolute;top:2px;font-weight:800;color:var(--muted);font-size:13px}
.tlline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.5}
.tlax{position:relative;height:22px;margin:0 0 4px 210px;font-size:13px;color:var(--muted)}.tlax span{position:absolute;transform:translateX(-50%);white-space:nowrap}.tlax .tlnow{color:var(--bad);font-weight:800;top:-1px}
/* 帳物 O／X／△、流程步驟條 */
.ox{display:inline-block;min-width:26px;text-align:center;border-radius:6px;font-weight:900;padding:0 6px}
.ox.o{background:var(--goodS);color:var(--good)}.ox.x{background:var(--badS);color:var(--bad)}.ox.t{background:var(--warnS);color:var(--warn)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1;min-width:150px;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.st span{font-size:14px;color:var(--ink2)}.st em{font-style:normal;font-size:13px;color:var(--muted)}
.st.done{background:var(--goodS);border-color:var(--good)}.st.done b:before{content:"✓ ";color:var(--good)}
.st.now{background:var(--badS);border-color:var(--bad)}.st.now b:before{content:"● ";color:var(--bad)}.st.now em{color:var(--bad);font-weight:700}
.st.todo{opacity:.6}
/* 零件履歷頁的一句話、帳量式、頁底連結列 */
.trail{margin:0 0 18px;padding:14px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--bad);font-size:16px;line-height:1.8}
.trail i{font-style:normal;color:var(--muted);margin:0 8px;font-weight:800}
.eqs{font-size:17px;margin:0 0 14px;color:var(--ink2)}.eqs b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}.eqs b.r{color:var(--bad)}
.relbar{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
/* 總覽／貨架進度／貨架明細／關帳檢查（原本由 inv_home.js 執行時插入的 .iw-*，W4 搬進來） */
.iw-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.iw-grid.c2,.iw-grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.iw-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1800px){.iw-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.iw-tile .ln{white-space:normal;align-items:baseline}.iw-tile .ln b{text-align:right}.iw-tile .ln b.w{color:var(--warn)}.iw-tile .ln b.r{color:var(--bad)}
.iw-tile .big b{font-weight:800}
.iw-tile .card-h{flex-wrap:wrap;row-gap:2px}.iw-tile .card-h h3{white-space:nowrap}
.iw-duo{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.iw-meter{height:10px;border-radius:99px;background:var(--neutralS);margin:14px 0 6px;overflow:hidden}.iw-meter i{display:block;height:100%;background:var(--good)}.iw-meter.over i{background:var(--bad)}
.iw-chk>div{padding:8px 0;border-top:1px solid var(--line2);font-size:15px;color:var(--ink2);line-height:1.5}.iw-chk>div:first-child{border-top:0}
.iw-chk b{display:inline-block;min-width:1.4em}.iw-chk b.ok{color:var(--good)}.iw-chk b.wn{color:var(--warn)}.iw-chk b.no{color:var(--bad)}
.iw-sub{margin:0 0 14px;color:var(--ink2);font-size:15.5px}
.iw-rel{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.iw-rack .faces{grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr))}
.iw-tn td.x{white-space:normal}.iw-tn tr.dtl>td{background:var(--soft);padding:10px 14px}.iw-tn tr.dtl[hidden]{display:none}
.iw-num{font-variant-numeric:tabular-nums}
.iw-lbl{color:var(--muted);font-size:14px}
/* 待辦頁（W5）：頁首大字、情境卡、舊帳收合、系統看不到的情況；首頁最上面的待辦連結 */
.ivt-line{margin:0 0 14px}.ivt-line a{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:17px;color:var(--ink);text-decoration:none}.ivt-line a:hover{background:var(--soft)}.ivt-line .r,.ivt-big .r,.ivt-card .r{color:var(--bad)}
.ivt-sum{margin:0 0 18px}.ivt-big{font-size:22px;color:var(--ink)}.ivt-big b{font-size:30px;font-variant-numeric:tabular-nums}.ivt-sub{margin-top:6px;font-size:15.5px;color:var(--ink2)}
.ivt-card{margin-bottom:18px}.ivt-card .card-h span{white-space:nowrap}
.ivt-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0 0 14px;font-size:15.5px;line-height:1.55}.ivt-dl dt{color:var(--muted);font-weight:700}.ivt-dl dd{margin:0;color:var(--ink)}.ivt-dl ol{margin:0;padding-left:1.3em}
.ivt-scene{margin:0 0 12px}
details.ivt-old{margin:0 0 10px}details.ivt-old>summary{cursor:pointer;padding:10px 14px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:16px;color:var(--ink)}details.ivt-old[open]>summary{margin-bottom:10px}details.ivt-old .card{margin-bottom:0}
.ivt-blind ul{margin:0;padding-left:1.3em;font-size:15.5px;line-height:1.8}
@media (max-width:700px){.ivt-dl{grid-template-columns:minmax(0,1fr);gap:2px}.ivt-dl dd{margin-bottom:8px}.ivt-big{font-size:19px}.ivt-big b{font-size:26px}}
/* 每日檢查燈號：灰燈（還沒有資料／未啟用）、舊帳（不進燈號）；儲位格多件標記 */
a.lp.na{background:var(--soft)}
a.ivh{font-size:13px;white-space:nowrap;margin-left:2px}
.lp em.bl,.bl{color:var(--muted);font-style:normal}
.lp em.bl{display:block;margin-top:0}
.sc.k-multi{background:var(--soft)}
.sc .tagn{position:absolute;bottom:1px;right:3px;font-style:normal;font-size:13px;font-weight:800;color:var(--ink2)}
@media (max-width:1300px){.loops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){
  /* 三個看板鈕：第二行獨占整列，搜尋框第三行；燈號回到品牌那一行的右邊 */
  .tlr{grid-template-columns:120px minmax(0,1fr)}.tlax{margin-left:130px}
}
@media (max-width:560px){.loops{grid-template-columns:minmax(0,1fr)}}
/* W6：每日檢查的格子（燈號＋名稱＋一行定義＋筆數）、待辦卡的一行定義、首頁兩行待辦連結 */
.loops.dfn{grid-template-columns:repeat(2,minmax(0,1fr))}
.loops.dfn a.lp{display:block;padding:12px 14px}
.lp .lph{display:flex;align-items:baseline;gap:2px}.loops.dfn .lp b{font-size:16px}
.lp .df{display:block;margin-top:5px;font-size:14px;color:var(--ink2);line-height:1.5;font-style:normal}
.loops.dfn .lp em{display:block;margin-top:6px}
.ivt-b td{opacity:.6}.ivt-close{margin:0 0 14px;padding:12px 16px;font-size:16px}.ivt-close b{font-size:17px}details.ivt-conv{margin:14px 0 0}details.ivt-conv>summary{cursor:pointer;padding:10px 14px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:16px;color:var(--ink)}details.ivt-conv[open]>summary{margin-bottom:10px}
.ivt-def{margin:0 0 10px;font-size:15.5px;color:var(--ink2);line-height:1.55}
.ivt-line a+a{margin-left:10px}
#tb-invLoops .tw{max-height:none}
.ivt-zero{padding:6px 16px}.ivt-zr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:4px 18px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line2)}.ivt-zr:first-child{border-top:0}
.ivt-zr b{font-size:15.5px}.ivt-zr .df{font-size:14px;color:var(--ink2);line-height:1.5}.ivt-zr em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
@media (max-width:700px){.ivt-zr{grid-template-columns:minmax(0,1fr)}}
.ivt-daily{margin-top:10px}.ivt-daily a{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:15.5px}.ivt-daily a:hover{background:var(--panel)}
@media (max-width:1000px){.loops.dfn{grid-template-columns:minmax(0,1fr)}.ivt-line a+a{margin-left:0;margin-top:8px}.ivt-line a{display:block}}
/* W17：第四看板「問題查找」——輸入表單（手機用大輸入框、數字鍵盤）、選商品別、結果卡 */
.fd-form{margin:16px 0 18px;padding:20px 22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.fd-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:14px;align-items:end}
.fd-f label,.fd-pls legend{display:block;margin:0 0 6px;padding:0;font-size:15px;font-weight:700;color:var(--ink2)}
.fd-in{width:100%;height:56px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:700;letter-spacing:.02em;min-width:0}
.fd-in::placeholder{font-size:16px;font-weight:400;letter-spacing:0;color:#8c9aa8}
.fd-in:focus{border-color:var(--accent);outline:none}
.fd-go{height:56px;padding:0 38px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:20px;font-weight:800}
.fd-go:hover{filter:brightness(1.08)}
.fd-pls{margin:16px 0 0;padding:0;border:0;min-width:0}.fd-pls legend{float:none}
.fd-pls label{display:inline-block;margin:0 8px 8px 0;cursor:pointer}.fd-pls input{position:absolute;opacity:0;width:1px;height:1px}
.fd-pls span{display:inline-block;padding:9px 18px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:16px;font-weight:700;color:var(--ink2)}
.fd-pls input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}.fd-pls input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.fd-err{margin:6px 0 0;color:var(--bad);font-weight:700;font-size:15.5px}
.fd-part{margin:0 0 14px;padding:16px 20px}.fd-pl1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:16px}.fd-pl1 b{font-size:19px}
.fd-sum{margin:0 0 14px;font-size:17px;color:var(--ink2)}.fd-sum b{font-size:22px;color:var(--ink)}
.fd-card{margin:0 0 16px;padding:20px 24px;display:block}.fd-card.top{border-left:6px solid var(--brand)}
.fd-card h3{margin:8px 0 2px;font-size:21px;font-weight:800}.fd-means{margin:0 0 4px;color:var(--ink2);font-size:15.5px}
.fd-chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fd-act{margin:14px 0;padding:14px 18px;border-radius:12px;background:var(--accentS);color:var(--ink);font-size:20px;font-weight:800;line-height:1.5}
.fd-act small{display:block;margin-bottom:2px;font-size:13.5px;font-weight:700;color:var(--accent)}.fd-hopes{display:block;margin-top:4px;font-size:16px;font-weight:700;color:var(--warn)}
.fd-ev{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:10px 0;font-size:15.5px}.fd-ev dt{color:var(--muted);font-weight:700}.fd-ev dd{margin:0;overflow-wrap:anywhere}
.fd-note{margin:6px 0;font-size:15px;color:var(--ink2)}

/* 某資料區塊「資料到哪一天」的顯示文字：日期型 → 10/08（週四）；有時間的快照 → 10/10 20:18；沒有 meta 回傳空字串 */
const asOfLabel=k=>{const i=secInfo(k);if(!i||!i.asOf)return '';const a=String(i.asOf);return a.length>10?md(a.slice(0,10))+' '+a.slice(11,16):md(a)+dayWk(a)};

/* ================= 區塊狀態與錯誤隔離 =================
   資料包的區塊可能是 null（建置端讀檔失敗）。頁面函式開頭用 need('區塊鍵') 取資料，拿不到就丟 NoData；

const META=D.meta||null;
const SECLABEL={ops:'營運（WES 每日報表）',inbound:'進貨追蹤',util:'儲位／貨架利用率',heatAll:'貨架熱點圖',putDiff:'HOPES≠WES 上架數',abnormal:'異常案件',abncell:'異常儲位',diff:'帳差',picking:'揀料中',hit:'貨架命中率',lt:'進貨各環節時間',abnTrend:'異常每日計數',inv:'盤點追查'};

function need(key){const v=D[key];if(v==null)throw new NoData(key,'這個區塊這次更新失敗，沒有資料');return v}

/* ================= 資料輔助 ================= */
const DAYS=(D.ops&&D.ops.days)||[], LAST=DAYS[DAYS.length-1]||null, OPN={north:'北區出貨',replenish:'副倉補充',follow:'副倉FOLLOW',puton:'進貨上架'};
function metric(day,op,fl){

/* ================= 圖表引擎 =================
   畫面：依卡片寬度畫（真實像素字級，所以字不會被縮小）、2 倍以上解析度。
   複製／PNG：另外用 1400×600、2 倍解析度重畫一張（底下多一行資料來源頁尾），貼進信件或簡報不糊。
   用法：頁面函式回傳 chartCard(id, cfg)；路由完成後 MOUNT 表裡列出的 id 會各呼叫一次 mountChart(id)。
   cfg 欄位（折線＋長條圖）：
     flat             true＝不畫卡片外框（放在另一張卡片裡面時用，例如首頁常用圖表 2F｜3F 並排）
     title            標題（純文字，一行；太長會省略）        canvasTitle  匯出圖上的標題（預設同 title）
     sub              副標（最多兩行，超出省略，滑過看全文）   tag          標題旁的小標籤（HTML，例如熱點圖的日期）   sample 加「示意」
     labels[]         橫軸類別（字串）                         sub2[]       橫軸第二行（例如星期）

     left{title,fmt,min,max,adjMin,fixed}  左軸；min＝座標下限（資料更低時自動往下延伸）；max＝上限；adjMin 讓「調整」面板出現下限拉桿

/* 折線資料點：circle＝白底圓圈（預設）、triangle＝白底三角形；r＝圓的半徑（三角形外接同一個圓），k＝畫布倍率 */

const CFG={}, st=id=>(LS[id]=LS[id]||{});
function niceCeil(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e}

function ticksOf(max,min=0,count=5){const step=niceCeil((max-min)/count),a=[];for(let v=Math.ceil(min/step-1e-9)*step;v<=max+step/1e6;v+=step)a.push(+v.toFixed(6));return a}

/* ---------- 共用浮框（W24；全看板一種樣式）----------

/* 網址參數：data-qp="參數名" data-v="值" 的按鈕、下拉、勾選，改網址（replaceState）並重畫目前頁，捲動位置不動；值空＝拿掉參數 */

/* ---------------- 「⋯」選單的動作：複製圖、下載 PNG（把卡片內的 SVG 圖合成一張 2 倍大的圖）、匯出 Excel（圖上的資料） ---------------- */

/* ---------- 長條＋折線（從設計稿 v4 搬來；字級一律 14） ----------

function barLine(el,o){

  const FS=14,slot=pw/Math.max(1,n),cw=t=>[...String(t)].reduce((s,ch)=>s+(/[\x00-\x7f]/.test(ch)?8:FS),0);
  const narrow=cats.some(c=>cw(c)>slot-6),labs=cats.map((c,i)=>narrow&&/\//.test(c)?c.split('/')[1]:c);
  const thin=slot<18;   /* 類別太多：每隔幾個才標 */

  for(let v=0;v<=ym;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf0"/><text x="${L-6}" y="${y(v)+5}" text-anchor="end" fill="#6c7a89">${fmt(v)}</text>`}

/* ================= v5 頁面框架（GOLIVE.md §2；redesign_v5 設計稿的上線版） =================

V5.qParse=(def,v)=>{if(Array.isArray(def))return v?v.split(',').filter(Boolean):def.slice();if(typeof def==='number'){const n=Number(v);return isFinite(n)?n:def}if(typeof def==='boolean')return v==='1'||v==='true';return v};

    /* 頂列子頁籤的連結帶著日期／樓層（opsKeep 讀 QP）：網址變了要跟著更新，不然換子頁會帶舊日期 */

const mondayOf=d=>{const t=new Date(d+'T00:00:00Z'),w=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-w);return t.toISOString().slice(0,10)};
function ltWeeks(){
  const by={};
  D.lt.days.forEach(day=>{const w=mondayOf(day.d);(by[w]=by[w]||[]).push(day)});
  return Object.keys(by).sort().reverse().map(w=>({w,days:by[w]}));
}
function ltAggW(days,g){
  const kinds=g==='ALL'?['KZ','IMP','DOM','OTH']:[g],t={nb:0,sb:0,na:0,sa:0,np:0,sp1:0,sp2:0,sp3:0};
  days.forEach(day=>kinds.forEach(k=>{const x=day.g[k];if(x)for(const f in t)t[f]+=x[f]}));
  const n1=t.na+t.np,v=[n1?t.sa/n1/1440:0,n1?(t.sp1+t.sp2+t.sp3)/n1/1440:0,t.nb?t.sb/t.nb/1440:0];
  return {t,v,n:t.nb,total:v[0]+v[1]+v[2]};
}
const ltGs=()=>{const g=QP.get('lt');return LTSET[g]?g:'ALL,KZ'};
const ltStg=()=>{const s=QP.get('lst');return ['0','1','2'].includes(s)?+s:'total'};
function ltSeries(){
  const today=isoDay(Date.now()),wn=new Map((D.lt.weeks||[]).map(x=>[x.w,x])),gs=ltGs().split(','),st=ltStg(),weeks=ltWeeks().slice(0,+QP.get('ltw')||12).reverse();
  return weeks.map(({w,days})=>{const end=new Date(w+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+6);
    const partial=D.lt.basis==='start'&&Math.round((parseT(today)-parseT(w))/864e5)<LT_OPEN_DAYS;
    const per=gs.map(g=>{const a=ltAggW(days,g),x=wn.get(w),n=x&&x.n&&x.n[g]!=null?x.n[g]:a.n;return {g,n,v:a.n>0?(st==='total'?a.total:a.v[st]):null,low:n<LT_MIN_N}});
    return {w,lab:md(w)+'～'+md(end.toISOString().slice(0,10)),partial,per};
  });
}

/* ================= W21：固定儲位（綁定零件）3 張圖（ops/rack；資料 D.ops.bind）=================

   出貨 o＝PickingTime、進貨 i＝INObject：n 筆數、h 其中在自己固定儲位的筆數、q 數量、qh 其中在自己固定儲位的數量；庫存 own／oth＝綁定零件在自己固定儲位／其他儲位的個數，emp＝固定格沒貨但別處有貨的零件數。

const bndData=()=>{const b=D.ops&&D.ops.bind;return b&&((b.days&&b.days.length)||(b.stock&&b.stock.length))?b:null};

/* 某樓層某指標的每天序列：k＝'o'|'i'，a／b＝分子／分母欄；回傳 [{d,bf,l,v}]（沒有那一天的資料 v＝null） */

/* 回補說明：哪些日子是回補、用哪天的清單（沒有回補就不寫） */

/* 日期集合內某些作業別（某樓層）的點數：回傳 {sum, days（有資料的天數）, avg（每日平均）} */
function tPts(dates,ops,fl){
  let sum=0,n=0;
  dates.forEach(d=>{const day=tDay(d);if(!day||!day.m)return;let got=false,p=0;day.m.forEach(r=>{if(ops.includes(r.op)&&(!fl||r.floor===fl)){got=true;p+=r.points}});if(got){sum+=p;n++}});

}

const tN1=x=>x==null||isNaN(x)?'–':(Math.abs(x-Math.round(x))<1e-9?fmt(Math.round(x)):fmt(x,1));

/* ================= 零件查詢發布檔的讀取（W19：頁面搬到 find.js 的「查零件」）=================
   資料取自原本「零件／台車查詢」的發布檔（../active.json、../releases/，同一份、同一個更新週期）。
   lkRead(輸入)：先用輸入算 SHA-256 去 lookup/<前 2 碼>.json 找 id，再去 records/<id 前 2 碼>.json 取內容；查不到回 null；發布檔正在換版（404）會重試一次。
   比對規則（F6）：輸入先過 keyOf（去空白、橫線、轉大寫）；零件查詢發布檔用 keyOf 後的字串去查，查不到再用 bare、原樣輸入查（tiles.js 的 ktLookup）。 */
const LK={act:null,t:0};
async function lkActive(force){
  if(force||!LK.act||Date.now()-LK.t>300000){
    const r=await fetch('../active.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('零件查詢資料尚未發布');
    LK.act=await r.json();LK.t=Date.now();
  }
  return LK.act;
}
async function lkRead(q,retry){
  const act=await lkActive(retry),norm=q.trim().replace(/^['’]+/,'').replace(/\s+/g,'').toUpperCase();
  const dg=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm)),h=[...new Uint8Array(dg)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const base='../releases/'+encodeURIComponent(act.version);
  const gone=()=>{if(!retry)return lkRead(q,true);throw new Error('零件查詢資料正在更新，請稍後再試')};
  const r1=await fetch(base+'/lookup/'+h.slice(0,2)+'.json',{cache:'force-cache'});
  if(r1.status===404)return gone();
  if(!r1.ok)throw new Error('索引讀取失敗（'+r1.status+'）');
  const id=String((await r1.json())[h]||'');
  if(!id)return null;
  const r2=await fetch(base+'/records/'+id.slice(0,2)+'.json',{cache:'force-cache'});
  if(r2.status===404)return gone();
  if(!r2.ok)throw new Error('查詢結果讀取失敗（'+r2.status+'）');
  const d=(await r2.json())[id];
  if(!d)throw new Error('查詢結果索引不一致，請稍後再試');
  return d;
}

   載入、索引、模式、事件委派、共用元件。頁面在 inv_home／inv_racks／inv_part／inv_lists.js；API 清單見 README.md〈第三看板 API〉。
   資料不在 data.enc 裡：進第三看板時才抓 inv.enc（同一把金鑰、同樣的 IV＋AES-GCM＋gzip 格式）；其他看板永遠不會發這個請求。
   v3 新區塊（loops、confirm、evt…）還沒有時一律容錯：缺就顯示「還沒有資料」，不丟例外。 */
const INV={status:'idle',data:null,kind:'',msg:'',p:null,hook:false,idx:null,keyP:null,shard:new Map(),cols:{}};

const invErr=(kind,msg)=>Object.assign(new Error(msg),{kind});

/* ---------------- 載入與解密 ---------------- */
const invB64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const invKey=()=>INV.keyP||(INV.keyP=Promise.resolve().then(()=>crypto.subtle.importKey('raw',invB64(KEY),'AES-GCM',false,['decrypt'])));
/* 抓一個加密檔（相對於 index.html）→ 解密 → 解壓 → JSON。失敗丟 Error，e.kind＝missing（404）／net／http／decrypt／format */
async function invFetchEnc(name){
  let r;try{r=await fetch(name,{cache:'no-cache'})}catch(e){throw invErr('net','讀取 '+name+' 失敗（網路不通）')}
  if(r.status===404)throw invErr('missing','找不到 '+name);
  if(!r.ok)throw invErr('http','讀取 '+name+' 失敗（HTTP '+r.status+'）');
  const buf=new Uint8Array(await r.arrayBuffer());
  if(buf.length<29)throw invErr('decrypt',name+' 太短，不是加密檔');
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},await invKey(),buf.slice(12))}catch(e){throw invErr('decrypt',name+' 解密失敗')}
  let text;try{text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){throw invErr('decrypt',name+' 解壓縮失敗')}
  try{return JSON.parse(text)}catch(e){throw invErr('format',name+' 不是 JSON')}
}
function invCheck(x){

  if(!x||typeof x!=='object'||Array.isArray(x)||!x.meta||typeof x.meta!=='object'||!blk(x.parts))throw invErr('format','缺少 meta 或 parts 區塊');
}
/* 載入第三看板資料；永遠 resolve 成 INV（成敗看 INV.status：ready／error），同時間多次呼叫共用同一個請求。

function inv8(t,k3){
  if(/；(WES|HOPES) 沒有/.test(t))return t;
  let m=/^HOPES (PM2\w+)（([^）]+)）RSCD \S+，WES 無對應/.exec(t);
  if(m)return `HOPES ${m[2]}（${m[1]}${k3?'，單號 '+k3:''}）；WES 沒有`+t.slice(m[0].length);
  m=/^WES pc 人工開單上架，HOPES 無對應進貨\([^)]*\)/.exec(t);if(m)return 'WES pc 人工開單上架；HOPES 沒有進貨'+t.slice(m[0].length);
  m=/^WES 手動出庫單 (\S+?)（Type \d+），HOPES 無對應銷貨/.exec(t);if(m)return `WES 手動出庫單 ${m[1]}；HOPES 沒有銷貨`+t.slice(m[0].length);
  m=/^WES 手動庫存調整（[^）]*）/.exec(t);if(m)return 'WES 手動庫存調整；HOPES 沒有'+t.slice(m[0].length);
  return null;
}
function invEv(s,k3){let t=String(s==null?'':s);const r8=inv8(t,k3);if(r8!=null)return r8;INV_EVR.forEach(([re,to])=>{t=t.replace(re,to)});return t}

/* ---------------- 資料存取（區塊 → 列 → 欄名） ---------------- */
const invGet=k=>(INV.data&&INV.data[k]!=null)?INV.data[k]:null;
function invNeed(k){const v=invGet(k);if(v==null)throw new NoData('inv','盤點追查資料沒有「'+k+'」區塊');return v}
const invRows=k=>{const b=invGet(k);return Array.isArray(b)?b:(b&&Array.isArray(b.rows))?b.rows:[]};
/* 欄名 → 列索引：const c=invCols('parts'); r[c.part] */
function invCols(k){if(INV.cols[k])return INV.cols[k];const b=invGet(k),o={};if(b&&Array.isArray(b.columns))b.columns.forEach((n,i)=>{o[n]=i});return INV.cols[k]=o}
/* 一列 → 物件（缺的欄是 undefined） */
function invRec(k,r){const o={},c=invCols(k);for(const n in c)o[n]=r[c[n]];return o}
/* 1.0 版面沒有的區塊數量：缺就 null */
const invCount=k=>invGet(k)==null?null:invRows(k).length;
const invMeta=()=>invGet('meta')||{};
/* 索引：part（keyOf 後）→ 列；bare（去掉第 1 碼）→ 列們；rack → 儲位列們；part → 儲位列們；rack → 貨架列 */
function invIdx(){
  if(INV.idx)return INV.idx;
  const ix={part:new Map(),bare:new Map(),rackSlots:new Map(),partSlots:new Map(),rack:new Map(),c:{parts:invCols('parts'),slots:invCols('slots'),racks:invCols('racks')}};
  const pc=ix.c.parts.part;
  if(pc!=null)invRows('parts').forEach(r=>{const k=keyOf(r[pc]);ix.part.set(k,r);const b=k.slice(1);if(!ix.bare.has(b))ix.bare.set(b,[]);ix.bare.get(b).push(r)});
  const sp=ix.c.slots.pos,sq=ix.c.slots.part;
  if(sp!=null)invRows('slots').forEach(r=>{const pos=String(r[sp]),rk=pos.slice(0,9);if(!ix.rackSlots.has(rk))ix.rackSlots.set(rk,[]);ix.rackSlots.get(rk).push(r);
    if(sq!=null&&r[sq]){const k=keyOf(r[sq]);if(!ix.partSlots.has(k))ix.partSlots.set(k,[]);ix.partSlots.get(k).push(r)}});
  const rc=ix.c.racks.rack;
  if(rc!=null)invRows('racks').forEach(r=>ix.rack.set(String(r[rc]),r));
  return INV.idx=ix;
}
/* 用輸入的件號（可帶或不帶商品別、可帶橫線）找零件列；找不到回 []，帶商品別不同的同 bare 件會一起回傳 */
function invFindPart(input){
  const k=keyOf(input),ix=invIdx();if(!k)return [];
  if(ix.part.has(k))return [ix.part.get(k)];
  return ix.bare.get(k)||[];
}

/* ---------------- 分片（零件履歷）：invp/NN.enc ---------------- */
/* FNV-1a 32 位元；分片鍵＝fnv1a(keyOf(件號)) % 32（整串，含第 1 碼商品別；測試向量見 fixtures\inv_hash_vectors.json） */
function fnv1a(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)&255;h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const invShardN=()=>((invMeta().shards||{}).n)||32;
const invShardNo=part=>fnv1a(keyOf(part))%invShardN();
function invShardLoad(nn){
  if(INV.shard.has(nn))return INV.shard.get(nn);
  const p=invFetchEnc('invp/'+String(nn).padStart(2,'0')+'.enc').then(d=>({ok:true,nn,data:d}),e=>{INV.shard.delete(nn);return {ok:false,nn,kind:e.kind||'error',msg:e.message||String(e)}});
  INV.shard.set(nn,p);return p;
}
/* 載入某件號所在的分片。輸入不帶商品別（第 1 碼）時，先用 parts 找出完整件號再算分片（通常只有 1 片；同 bare 的不同商品別各一片）。
   永遠 resolve，不丟例外：{part:keyOf(輸入), shards:[NN…], recs:[[分片裡的件號, 內容物件]…], errors:[{shard,kind,msg}…]}（檔案還不存在＝errors 有 kind:'missing'）。
   分片內容預期 {件號: {p,c,l,d,e,x,a,f}}（schema 的 $defs.shardFile；也容許包在 parts 底下） */
async function invShard(part){
  const k=keyOf(part),N=invShardN();
  if(INV.status!=='ready')return {part:k,shards:[],recs:[],errors:[{shard:-1,kind:'notready',msg:'盤點追查資料尚未載入'}]};
  const pc=invIdx().c.parts.part,full=invFindPart(part).map(r=>keyOf(r[pc])),keys=full.length?full:[k],nns=[...new Set(keys.map(x=>fnv1a(x)%N))];
  const res=await Promise.all(nns.map(invShardLoad)),recs=[],errors=[];
  res.forEach(r=>{
    if(!r.ok){errors.push({shard:r.nn,kind:r.kind,msg:r.msg});return}
    const d=r.data&&typeof r.data==='object'?(r.data.parts&&typeof r.data.parts==='object'&&!Array.isArray(r.data.parts)?r.data.parts:r.data):{};
    for(const key in d){if(keys.includes(keyOf(key)))recs.push([key,d[key]])}
  });
  return {part:k,shards:nns,recs,errors};
}

/* WES 歷程（IPH）各樓層起點日（meta.iphStart；沒有就用 2F 04/27、3F 03/10）：更早就放著的儲位，第一次紀錄寫「≤ 起點」 */
const invIphStart=()=>Object.assign({'2F':'2026-04-27','3F':'2026-03-10'},invMeta().iphStart||{});

/* ---------------- 模式與健康列 ---------------- */
/* pre＝盤點開始前（今天 < 本輪起日）、live＝盤點中、rehearsal＝預演資料（meta.mode==='rehearsal'） */
function invMode(){
  const m=invMeta();if(m.mode==='rehearsal'||m.mode==='pre'||m.mode==='live')return m.mode;
  const r=m.round||{},t=m.today||isoDay(Date.now());return r.start&&t<r.start?'pre':'live';
}
const INV_MODE={pre:['盤點開始前',''],live:['盤點中','ok'],rehearsal:['預演','warn']};
const invModeChip=()=>{const x=INV_MODE[invMode()];return `<span class="chip ${x[1]}">${x[0]}</span>`};
const invT=s=>{const t=parseT(s);return isFinite(t)?fmtT(t):'–'};
function invDataTag(){

  return isFinite(t)?`<span class="dtag" title="這一頁的資料整理好的時間；各來源的資料時間見詳細說明">${esc(fmtT(t))}</span>`:'';
}
/* 資料量太大時發布端會把 slots 簡化成只放有旗標的儲位（meta.degraded；舊名 meta.slotsDegraded）：回傳說明物件，沒有降級回 null */
function invDegraded(){const m=invMeta(),d=m.degraded||m.slotsDegraded;return d?(typeof d==='object'?d:{note:typeof d==='string'?d:''}):null}
function invBanner(){
  const m=invMeta(),hl=m.health||{},dg=invDegraded();let h='';
  if(dg)h+=`<div class="banner warn" role="status">${esc('部分儲位未列出（資料太多，先省略'+(dg.from&&dg.to?'：列出 '+fmt(dg.to)+'／'+fmt(dg.from)+' 個儲位':'')+'）。貨架狀態和各項數字以貨架彙總為準；貨架明細裡虛線「未列出」的格，不代表空格或沒貨；零件履歷和各清單不受影響。')}</div>`;
  if(invMode()==='rehearsal')h+=`<div class="banner rehearsal" role="status">${esc(m.rehearsalNote||'預演資料：以 3F 3/09～5/13 的 WES 盤點紀錄模擬，不是本輪。')}</div>`;
  if(hl.nightMissing)h+=`<div class="banner bad" role="alert">昨晚是盤點夜，但 WES 沒有任何新的盤點紀錄：請確認現場盤點有寫進 WES。</div>`;
  if(m.stale)h+=`<div class="banner warn">${esc(m.staleText||'盤點追查資料這次更新失敗，顯示的是較早的資料')}</div>`;
  const errs=(m.errors||[]).filter(e=>!(typeof e==='string'&&/^size:/.test(e)));   // size: 開頭是大小縮減的說明，不是錯誤
  if(errs.length)h+=`<div class="banner warn">資料整理時有 ${errs.length} 項錯誤：${errs.slice(0,3).map(e=>esc(typeof e==='string'?e:JSON.stringify(e))).join('；')}</div>`;
  return h;
}
/* 資料來源新鮮度小膠囊：盤點後監控／帳差監控／WES 現量（meta.fresh，UTC）＋最近盤點夜＋meta.health.warnings；老化用「上班小時」（同右上角燈號的算法） */
function invHealthBar(){
  const m=invMeta(),mo=m.monitor||{},fr=m.fresh||{},hl=m.health||{};
  const items=[['WES 盤點紀錄',fr.monitor||mo.generatedAt||mo.snapTime],['HOPES／WES 帳差',fr.diff||(m.diffTimes||{}).hopes],['WES 儲位現量',fr.wesoh]].filter(x=>x[1]);
  const lv=s=>{const t=parseT(s);if(!isFinite(t))return '';const h=workHoursBetween(t,Date.now());return h>FRESH_CFG.badWorkDays*(FRESH_CFG.workEnd-FRESH_CFG.workStart)?'bad':h>FRESH_CFG.warnHours?'warn':'ok'};
  let h=items.map(([l,s])=>`<span class="frs ${lv(s)}">${l} ${esc(invT(s))}</span>`).join('');

  (hl.warnings||[]).slice(0,3).forEach(w=>{h+=`<span class="frs warn">${esc(invEv(w))}</span>`});

/* 右上角資料燈號彈出框多一列「盤點追查」（inv 已載入才有；不影響燈號顏色） */
function invFreshRow(){

/* 頁首：標題＋資料時間標籤＋模式＋提醒條（預演／更新失敗）＋資料新鮮度 */

/* ---------------- 共用元件（回傳 HTML 字串；顏色只用 shell.html 的 token） ---------------- */

   本檔也放 W1 兩個檔共用的小工具（iw 開頭）：日期、貨架／零件統計；inv_racks.js 會用到。版面 CSS（.iw-*）在 shell.html。
   數字一律從 inv.json 算（invRows／invIdx），沒有的區塊（v2 資料、缺 v3 欄位）顯示「還沒有資料」，不丟例外。 */

/* ---------- 共用：常數、日期 ---------- */
const IW_FL=['2F','3F'],IW_PH={'低':'low','中':'mid','高':'high'},IW_CLS3=['低','中','高'];
const IW_CACHE=new WeakMap();
const iwCache=()=>{const d=INV.data;if(!d)return {};let c=IW_CACHE.get(d);if(!c){c={};IW_CACHE.set(d,c)}return c};
const iwDay=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const iwDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const iwHol=()=>new Set((META&&META.calendar&&META.calendar.holidays)||[]);
const iwIsWD=(d,h)=>new Date(d+'T00:00:00Z').getUTCDay()!==0&&!h.has(d);
function iwWDays(a,b){const h=iwHol();let n=0;for(let d=a;d<=b&&n<400;d=iwDay(d,1))if(iwIsWD(d,h))n++;return n}
function iwAddWD(d,n){const h=iwHol();let k=0,x=d;for(let i=0;i<800&&k<n;i++){x=iwDay(x,1);if(iwIsWD(x,h))k++}return x}
const iwTm=s=>s?mdy(String(s).slice(0,10))+' '+String(s).slice(11,16):'–';
const iwPct=(a,b,d=1)=>b>0?pct(a/b,d):'–';

/* ---------- 共用：參考日、計畫、進度 ---------- */
/* today＝看板的「今天」（預演資料用最後一個盤點夜的隔天）；cut＝計畫應完成的截止日（今天的前一天＝資料涵蓋到昨晚）；night＝最近一個有盤點紀錄的晚上 */
function invRef(){
  const m=invMeta(),hl=m.health||{},r=m.round||{},night=hl.lastCountNight||'';
  let today=m.today||isoDay(Date.now());
  if(invMode()==='rehearsal'){const base=night||r.start||today;today=iwDay(base,1)}
  return {today,night,cut:iwDay(today,-1)};
}
const iwPhases=()=>((invMeta().round||{}).phases)||[];
const iwPhase=code=>iwPhases().find(p=>p.code===code)||null;
function iwPlan(){
  const c=iwCache();if(c.plan)return c.plan;
  const pc=invCols('plan'),by={};
  invRows('plan').forEach(r=>{const k=r[pc.cls];(by[k]=by[k]||[]).push([r[pc.date],+r[pc.cum]||0])});
  Object.values(by).forEach(a=>a.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0));
  return c.plan={by,has:Object.keys(by).length>0};
}
const iwPlanAt=(cls,d)=>{const a=iwPlan().by[cls]||[];let v=0;for(const x of a){if(x[0]<=d)v=x[1];else break}return v};
function iwProg(){
  const c=iwCache();if(c.prog)return c.prog;
  const pc=invCols('progress');
  return c.prog=invRows('progress').map(r=>({date:r[pc.date],floor:r[pc.floor],cls:r[pc.cls],racks:+r[pc.racks]||0,slots:+r[pc.slots]||0,diffSlots:+r[pc.diffSlots]||0}));
}

/* ---------- 共用：貨架物件（racks 每列轉成物件，欄名同 racks.columns；state 缺時由 invRackState 推）---------- */
function invRO(){
  const c=iwCache();if(c.racks)return c.racks;
  const cc=invIdx().c.racks,num=['slots','used','rd','never','swap','moved','abn','mis','diffParts','star','nw','disc','add','miss','estH','posN'];
  c.racks=invRows('racks').map(r=>{
    const o={row:r};for(const k in cc)o[k]=r[cc[k]];
    num.forEach(k=>{o[k]=+o[k]||0});o.cls=o.cls||'未分類';o.state=invRackState(r);o.rAt0=o.rAt0||'';o.rAt1=o.rAt1||'';o.phase=o.phase||IW_PH[o.cls]||'';o.pd=o.pd||'';o.ord=o.ord==null?null:+o.ord;
    return o;
  });
  c.rmap=new Map(c.racks.map(o=>[o.rack,o]));
  return c.racks;
}
const invRMap=()=>{invRO();return iwCache().rmap};
const iwDone=o=>o.state==='done'||o.state==='doneMiss';
/* 計畫順序（計畫書 v6 D8：第一輪按貨架編號整座盤）＝racks.ord；沒有 ord 的貨架排最後，依貨架編號 */
const iwOrderOf=list=>list.slice().sort((a,b)=>(a.ord==null?1e9:+a.ord)-(b.ord==null?1e9:+b.ord)||(a.rack<b.rack?-1:a.rack>b.rack?1:0));
function iwOrder(){const c=iwCache();return c.order||(c.order=iwOrderOf(invRO()))}

/* 分類統計（低／中／高／空架／未分類）：座數、已盤、待盤、應完成（計畫線在 cut 的累計）、落後、盤點儲位、差異儲位、預估完成 */
function iwCls(){
  const c=iwCache();if(c.cls)return c.cls;
  const ref=invRef(),pl=iwPlan(),out={};
  ['低','中','高','空架','未分類'].forEach(k=>{out[k]={cls:k,n:0,n2:0,n3:0,done:0,d2:0,d3:0,todo:0,empty:0,rd:0,disc:0,plan:null,lag:0,eta:'–'}});
  invRO().forEach(o=>{
    const s=out[o.cls]||(out[o.cls]={cls:o.cls,n:0,n2:0,n3:0,done:0,d2:0,d3:0,todo:0,empty:0,rd:0,disc:0,plan:null,lag:0,eta:'–'});
    s.n++;if(o.floor==='2F')s.n2++;else s.n3++;
    if(o.state==='empty')s.empty++;
    else if(iwDone(o)){s.done++;if(o.floor==='2F')s.d2++;else s.d3++;s.rd+=o.rd;s.disc+=o.disc}
    else s.todo++;
  });
  const prog=iwProg();
  IW_CLS3.forEach(k=>{
    const s=out[k];if(pl.has){s.plan=iwPlanAt(k,ref.cut);s.lag=Math.max(0,s.plan-s.done)}
    if(!s.todo){s.eta=s.n?'已完成':'–';return}
    const byDate={};prog.forEach(p=>{if(p.cls===k&&p.date<=ref.cut&&p.racks>0)byDate[p.date]=(byDate[p.date]||0)+p.racks});
    const ds=Object.keys(byDate).sort().slice(-3);
    if(ds.length){const pace=ds.reduce((a,d)=>a+byDate[d],0)/ds.length;s.eta=md(iwAddWD(ref.cut,Math.ceil(s.todo/pace)))}
  });
  return c.cls=out;
}
/* 全部合計：已盤／待盤（不含空架）、2F／3F、已過計畫期間、盤點後新放進去／可能沒盤到／換件、盤點儲位／差異儲位 */
function iwTot(){
  const c=iwCache();if(c.tot)return c.tot;
  const ref=invRef(),t={all:0,empty:0,nonEmpty:0,done:0,d2:0,d3:0,todo:0,t2:0,t3:0,todoBy:{'低':0,'中':0,'高':0,'其他':0},late:0,addR:0,addS:0,missR:0,missS:0,swapR:0,swapS:0,discR:0,discS:0,rd:0,rdAll:0,plan:null,lag:0};
  invRO().forEach(o=>{
    t.all++;
    if(o.state==='empty'){t.empty++;return}
    t.nonEmpty++;
    if(iwDone(o)){t.done++;if(o.floor==='2F')t.d2++;else t.d3++}
    else{t.todo++;if(o.floor==='2F')t.t2++;else t.t3++;t.todoBy[IW_CLS3.includes(o.cls)?o.cls:'其他']++;if(o.pd&&o.pd<ref.today)t.late++}
    t.rd+=o.rd;if(o.add>0){t.addR++;t.addS+=o.add}if(o.miss>0){t.missR++;t.missS+=o.miss}if(o.swap>0){t.swapR++;t.swapS+=o.swap}if(o.disc>0){t.discR++;t.discS+=o.disc}
  });
  const cs=iwCls();
  if(iwPlan().has){t.plan=IW_CLS3.reduce((a,k)=>a+cs[k].plan,0);t.lag=IW_CLS3.reduce((a,k)=>a+cs[k].lag,0)}
  return c.tot=t;
}
/* 零件統計：已盤零件、有事件的件、10 種事件各幾件、★件 */
function iwParts(){
  const c=iwCache();if(c.parts)return c.parts;
  const pc=invIdx().c.parts,t={n:0,hasEvt:pc.evt!=null,hasRnd:pc.rAt0!=null,rnd:0,evt:0,bit:new Array(10).fill(0),star:0,starRnd:0,starOpen:0,starEvt:0,eff:0,effAmt:0,rows:[]};
  invRows('parts').forEach(r=>{
    t.n++;const evt=pc.evt!=null?(+r[pc.evt]||0):0,rnd=pc.rAt0!=null&&!!r[pc.rAt0],eff=+r[pc.eff]||0;
    if(rnd)t.rnd++;
    if(evt){t.evt++;for(let i=0;i<10;i++)if(evt&(1<<i))t.bit[i]++;t.rows.push(r)}
    if(eff){t.eff++;t.effAmt+=Math.abs(pc.effAmt!=null?(+r[pc.effAmt]||0):eff*(+r[pc.price]||0))}
    if(pc.star!=null&&+r[pc.star]){t.star++;if(rnd)t.starRnd++;if(eff)t.starOpen++;if(evt)t.starEvt++}
  });
  return c.parts=t;
}
/* ---------- 每日累計已盤貨架圖（首頁、貨架進度共用）---------- */
function invProgData(){
  const pl=iwPlan(),pg=iwProg(),ref=invRef(),r=invMeta().round||{};
  const ds=[...new Set([...Object.values(pl.by).flat().map(x=>x[0]),...pg.map(x=>x.date)])].filter(d=>!r.start||d>=r.start).sort();
  if(!ds.length)return null;
  const last=ds.filter(d=>d<=ref.cut).pop()||'';
  let a=0;const act=ds.map(d=>{pg.forEach(x=>{if(x.date===d)a+=x.racks});return d<=ref.cut||d<=last?a:null});
  const plan=pl.has?ds.map(d=>IW_CLS3.reduce((x,k)=>x+iwPlanAt(k,d),0)):null;
  return {ds,act,plan};
}
/* 每日累計已盤貨架（§11）：主要＝實際累計（實線 2.5 深色）、對照＝照計畫累計（淡色細虛線）；只在線尾標最新值 */
function invProgDraw(id){
  const el=document.getElementById('cv-'+id),D0=invProgData();if(!el||!D0||D0.ds.length<2)return;
  const n=D0.ds.length,lab=D0.ds.map(md),fmtv=v=>fmt(v),ia=opsLastIdx(D0.act);
  const ser=[];
  if(D0.plan)ser.push({v:D0.plan,nm:'計畫累計（座）',color:CL2.mainL,w:1.5,dash:'5 4',end:'計畫 '+fmt(D0.plan[D0.plan.length-1])});
  ser.push({v:D0.act,nm:'已盤累計（座）',color:CL2.main,w:2.5,end:D0.act[ia]==null?null:'已盤 '+fmt(D0.act[ia])});
  c2Grp(id,i=>`<b>${lab[i]}${dayWk(D0.ds[i])}</b>：已盤 ${D0.act[i]==null?'–':fmt(D0.act[i])} 座${D0.plan?'｜計畫 '+fmt(D0.plan[i])+' 座':''}`,n);
  c2Chart(el,{gid:id,n,labels:lab,keys:D0.ds,series:ser,fmt:fmtv,zero:true,xlab:true,h:230,padR:84,aria:'每日累計已盤貨架座數'});
  c2Hover(id,null);
}

/* ---------- 階段條（W19）：現在那一格反白；開盤前還沒進任何階段時，反白第一格（前置作業） ---------- */
function invPhaseBar(ref){
  const ps=iwPhases();if(!ps.length)return '';
  let now=ps.findIndex(p=>p.start<=ref.today&&ref.today<=p.end);
  if(now<0&&invMode()==='pre')now=0;
  const rng=p=>p.start===p.end?md(p.start):md(p.start)+'～'+md(p.end);
  return `<div class="phase" role="list" aria-label="本輪階段">${ps.map((p,i)=>`<span role="listitem" class="${i===now?'now':''}" title="${esc(mdy(p.start)+(p.end!==p.start?'～'+mdy(p.end):''))}">${esc(p.name)}<small>${esc(rng(p))}</small></span>`).join('')}</div>`;
}
/* 今晚（或第一晚）：meta.tonight＝預定盤點的貨架（含空架）、要先清的儲位（WES 異常數量／倉缺暫存）；D9：座數含空架，空架另計（詳細說明 #ref/inv） */
function invTonightInfo(){
  const t=invMeta().tonight;if(!t||!Array.isArray(t.racks)||!t.racks.length)return null;
  const rm=invRMap(),empty=t.racks.filter(r=>{const o=rm.get(r);return o&&o.state==='empty'}).length;
  const rows=t.rows&&Array.isArray(t.rows.rows)?t.rows.rows:[],used=t.racks.reduce((a,r)=>{const o=rm.get(r);return a+(o&&o.state!=='empty'?o.used:0)},0);
  return {date:t.date,isToday:!!t.isToday,racks:t.racks.length,empty,todo:+t.todo||0,clearBy:t.clearBy||'18:30',slots:+t.rowsTotal||rows.length,rows,used};
}
/* 準備度檢查（盤點前）：分類清單、盤點後資料每天有更新、2F／3F 的 WES 盤點紀錄 */
function invReadyItems(){
  const m=invMeta(),hl=m.health||{},cs=iwCls(),n=invCount('racks')||0,ix=invIdx(),sc=ix.c.slots,items=[];
  items.push([n>0&&cs['低'].n&&cs['中'].n&&cs['高'].n?'ok':'no',esc(`貨架分類清單 ${fmt(n)} 座（低銷 ${fmt(cs['低'].n)}、中銷 ${fmt(cs['中'].n)}、高銷 ${fmt(cs['高'].n)}、空架 ${fmt(cs['空架'].n)}）`)]);
  const monOk=!m.stale&&hl.complete!==false&&!(hl.warnings||[]).length;
  items.push([monOk?'ok':'no',esc(`盤點後的資料每天有更新${monOk?'':'：'+((hl.warnings||[])[0]||m.staleText||'資料不完整')}`)]);
  if(invDegraded())items.push(['wn','2F／3F 的 WES 盤點紀錄：資料太多先省略，儲位沒全列，這項無法判斷']);
  else if(sc.cntAt!=null){
    const per={'2':0,'3':0};invRows('slots').forEach(r=>{if(r[sc.cntAt]){const f=String(r[sc.pos])[0];per[f]=(per[f]||0)+1}});
    ['2','3'].forEach(f=>{items.push(per[f]>0?['ok',esc(`${f}F 已有 WES 盤點紀錄（${fmt(per[f])} 個儲位）`)]:['wn',esc(`${f}F 還沒有 WES 盤點紀錄：第一晚確認有寫入`)])});
  }else items.push(['wn','WES 盤點紀錄：還沒有資料']);
  return items;
}
const invChk=items=>{const sym={ok:'✓',wn:'!',no:'✗'};return `<div class="card chk" data-w1="ready">${items.map(([k,t])=>`<div><b class="${k}">${sym[k]||'☐'}</b>${t}</div>`).join('')}</div>`};
/* 關帳條件一行：盤點後出問題全部 0 筆，而且有貨儲位 100% 盤過 */
function invCloseCard(){
  const m=invNodeModel(),nc=ivtNoCount(),rt=invMeta().rates,n=m.board.n;

  return `<div class="card" data-ivt="close" data-ok="${nc?'na':ok?'1':'0'}"><b>關帳條件</b>：上面全部 0 筆，且有貨儲位 100% 盤過　<span class="chip ${nc?'':ok?'ok':'w'}">${nc?'盤點開始後才有':ok?'已達成':'還沒達成'}</span></div>`;
}
function pInvHome(arg){

function invHomePre(ref){

  const tiles=[

    tile({l:'開始前 HOPES≠WES 帳差',v:fmt(P.eff),u:'種',s:`金額 ${fmt(P.effAmt)} 元`,sev:P.eff?'w':'',href:'ab/diff'}),

}

/* 一格的判定說明 */
function iwWhy(k,r,o,sc){
  const g=n=>sc[n]==null?undefined:r[sc[n]],part=g('part'),rk=g('rkAt'),t=rk?iwTm(rk):'',cnt=g('cntQty'),d=g('disc'),n=+g('rndN')||0;
  let s;
  if(k==='add')s=`${o.rAt1?iwTm(o.rAt1)+' 這座貨架盤完後，':'盤完後，'}${t||'之後'} 才放入 ${part}（回推盤點當下這格沒有這個件號）→ 盤點後新放進去`;
  else if(k==='miss')s=`盤點當下回推這格應該就有 ${part}，但本輪沒有它的盤點紀錄 → 可能沒盤到，建議補盤（也可能盤了但紀錄沒寫進 WES）`;
  else if(k==='swap')s=`盤點後這格的零件換成 ${part}${g('prev')?'（原本是 '+g('prev')+'）':''}${t?'，'+t+' 起':''} → 盤點後換了零件`;
  else if(k==='disc')s=`盤點量 ${fmt(cnt)}、盤點前 ${fmt((+cnt||0)-(+d||0))}，盤差 ${iwSigned(+d||0)}${n>1?`；同晚複點 ${n-1} 次（取最後一筆）`:''} → 已盤有盤差`;
  else if(k==='ok')s=`盤點量與盤點前相同（${fmt(cnt)}）${n>1?`；同晚複點 ${n-1} 次`:''} → 已盤無差`;
  else if(k==='todo')s=`這格有貨（${fmt(g('qty'))}），本輪尚未盤點${iwDone(o)?'，但這座貨架其他儲位已盤':''}`;
  else s='空格（沒有貨）';
  const calc=g('calc');if(calc!=null&&calc!==0)s+=`；WES 自己對不上：WES 現量 ≠ 盤點量＋盤點後進出，相差 ${iwSigned(calc)} 個`;
  if(+g('abn')>0)s+=`；WES 異常數量 ${g('abn')} 個`;if(+g('mis')>0)s+=`；WES 倉缺暫存 ${g('mis')} 個`;
  return s;
}
function iwSlotCard(o,pos){
  const ix=invIdx(),sc=ix.c.slots,pc=ix.c.parts,rows=(ix.rackSlots.get(o.rack)||[]).filter(r=>String(r[sc.pos])===pos);
  if(!rows.length)return `<div class="card" style="margin-top:16px"><div class="card-h"><h3>儲位 ${esc(pos)}</h3><span>${INV_SK.empty[0]}</span></div><p class="note" style="margin:0">這格沒有任何資料（空格，也沒有盤點紀錄或暫存）。</p></div>`;
  return rows.map(r=>{
    const k=invSlotKind(r),g=n=>sc[n]==null?undefined:r[sc[n]],part=g('part'),pr=part?ix.part.get(keyOf(part)):null,d=g('disc'),rndN=+g('rndN')||0;
    const stats=[['現在放的零件',part?tlk(part)+(pr&&pc.name!=null&&pr[pc.name]?`<small class="iw-lbl" style="display:block;font-weight:400">${esc(pr[pc.name])}</small>`:''):'–'],['WES 現量（個）',fmt(g('qty'))],
      ['本輪盤點',+g('rd')?iwYmd(g('cntAt')):'尚未盤'],['盤點前→盤點量（個）',+g('rd')&&g('cntQty')!=null?`${fmt((+g('cntQty')||0)-(+d||0))} → ${fmt(g('cntQty'))}`:'–'],
      ['盤差（個）',+g('rd')&&d!=null?iwSigned(+d):'–',+d?'r':''],['複點次數',+g('rd')?String(Math.max(0,rndN-1))+' 次':'–']];
    const extra=[];if(g('calc')!=null&&g('calc')!==0)extra.push(['WES 自己對不上（個）',iwSigned(g('calc')),'w']);if(+g('abn')>0)extra.push(['WES 異常數量（個）',fmt(g('abn')),'w']);if(+g('mis')>0)extra.push(['WES 倉缺暫存（個）',fmt(g('mis')),'w']);if(g('bind'))extra.push(['指定零件',esc(g('bind'))]);
    return `<div class="card" style="margin-top:16px" data-slotcard="1"><div class="card-h"><h3>儲位 ${esc(pos)}</h3><span>${esc(INV_SK[k][0])}${INV_SK[k][1]?`（${INV_SK[k][1]}）`:''}　${rkChip(g('rk'))}</span></div>${invStat(stats.concat(extra))}
      <p class="note" style="margin:12px 0 0"><b>判定說明：</b>${esc(iwWhy(k,r,o,sc))}${part?`　${tlk(part,'零件履歷 ›')}`:''}</p>${part?`<div class="iw-slot-async" data-part="${esc(part)}" data-pos="${esc(pos)}" style="margin-top:12px"><span class="iw-lbl">載入這個零件的盤點紀錄與進出歷程…</span></div>`:''}</div>`;
  }).join('');
}
/* 儲位詳情的非同步補畫：從該件所在分片取本輪盤點紀錄（時間、盤點前、盤點量、盤差、盤點單）與這個儲位的進出歷程 */
function iwSlotAsync(root){(root||document).querySelectorAll('.iw-slot-async:not([data-done])').forEach(el=>{
  el.dataset.done='1';const part=el.dataset.part,pos=el.dataset.pos;
  invShard(part).then(res=>{
    if(!document.body.contains(el))return;

function iwRackChanges(o){

/* ================= 第三看板：共用小工具與 Excel 匯出（W3；W19 第 5 期把舊的清單頁都拿掉了）=================

const ivlDays=(a,b)=>{a=String(a||'').replace('≤','').slice(0,10);b=String(b||'').slice(0,10);return a&&b>a?Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5):0};
const ivlWrap=(t,w)=>`<span class="wr">${esc(invEv(t))}</span>`;   /* W11：寬度由欄決定（table.js 的 fitTables／shell.html 的 .fx），w 保留只是為了舊呼叫不用改 */

/* ---------------- 盤點後風險 Excel（inv_export.enc）---------------- */
const IVLX={state:'unknown',busy:false};   /* unknown｜ok（確定有檔）｜missing（尚未產生） */
const IVLX_LABEL='匯出 Excel：盤點後問題（每種問題一頁）';
/* 抓加密檔 → 解密（同一把金鑰；若內容是 gzip 再解壓）→ xlsx 位元組。失敗丟 Error，e.kind＝missing／net／http／decrypt／format */
async function ivlFetchDec(name){
  let r;try{r=await fetch(name,{cache:'no-cache'})}catch(e){throw invErr('net','讀取 '+name+' 失敗（網路不通）')}
  if(r.status===404)throw invErr('missing','找不到 '+name);
  if(!r.ok)throw invErr('http','讀取 '+name+' 失敗（HTTP '+r.status+'）');
  const buf=new Uint8Array(await r.arrayBuffer());
  if(buf.length<29)throw invErr('decrypt',name+' 太短，不是加密檔');
  let plain;try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},await invKey(),buf.slice(12)))}catch(e){throw invErr('decrypt',name+' 解密失敗')}

  if(!(plain[0]===0x50&&plain[1]===0x4b))throw invErr('format',name+' 不是 xlsx 檔');
  return plain;
}
/* 檔名時間：以盤點追查資料的整理時間為準（監控快照時間，台北時間 YYYYMMDD_HHMM）；沒有就用現在 */

  const d=TP(t);return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'_'+p2(d.getUTCHours())+p2(d.getUTCMinutes());
}
function ivlXlsxBtn(){
  const b=document.getElementById('invXlsxBtn');if(!b)return;
  if(IVLX.busy){b.disabled=true;b.textContent='下載中…';return}
  if(IVLX.state==='missing'){b.disabled=true;b.textContent='尚未產生';b.title='盤點後問題的 Excel 還沒有發布（資料整理程式第一次產生後才會有）';return}
  b.disabled=false;b.textContent=IVLX_LABEL;b.title='下載盤點後問題的 Excel：每種問題一個分頁，含原始資料；所有問題的查詢語法在另一頁';
}
/* 頁面畫完後：用 HEAD 探一下檔案在不在（不下載內容）；404＝按鈕顯示「尚未產生」 */
function ivlProbeExport(){
  if(IVLX.state==='unknown'){
    fetch('inv_export.enc',{method:'HEAD',cache:'no-cache'}).then(r=>{if(r.status===404)IVLX.state='missing';else if(r.ok)IVLX.state='ok';ivlXlsxBtn()},()=>{});
  }
  ivlXlsxBtn();
}
async function ivlExport(){
  if(IVLX.busy||IVLX.state==='missing')return;
  IVLX.busy=true;ivlXlsxBtn();
  try{
    const bytes=await ivlFetchDec('inv_export.enc'),name='盤點追查_盤點後問題_'+ivlStamp()+'.xlsx',u=URL.createObjectURL(new Blob([bytes],{type:XLSX_MIME})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);IVLX.state='ok';toast('已下載 '+name);
  }catch(e){
    if(e.kind==='missing')IVLX.state='missing';else{console.error('[inv_export]',e);toast('匯出失敗：'+(e.message||e))}
  }
  IVLX.busy=false;ivlXlsxBtn();
}

function ktCarts(sel){
  const I=D.inbound;if(!I||!Array.isArray(I.carts))return null;
  const ipk=pkFn('inbound'),cp=ktCartPut(),rows=new Map();
  I.carts.forEach(c=>(c.items||[]).forEach(i=>{
    const [f,b]=ipk(i);if(b!==sel.bare||(sel.frcd&&f&&f!==sel.frcd))return;
    const part=String(i[0]),open=String(i[3]||''),k=c.cart+'|'+keyOf(part)+'|'+open;
    let e=rows.get(k);if(!e)rows.set(k,e={cart:c.cart,floor:c.floor,part,open,need:0,points:0});
    e.need+=+i[1]||0;e.points++;
  }));
  return [...rows.values()].map(e=>{
    const it=cp&&cp.items.get(e.cart+'|'+keyOf(e.part)+'|'+e.open),cr=cp&&cp.carts.get(e.cart+'|'+e.open);
    e.put=cp?(it?it.put:0):null;e.parts=cp?(cr?cr.parts:0):null;
    e.others=cp?Math.max(0,e.parts-(e.put>0?1:0)):null;e.gap=cr?cr.gap:0;e.started=cp?(e.others>0?true:(e.gap?null:false)):null;e.last=cr?cr.last:'';   /* 沒看到其他零件上架、但開箱日之後有沒資料的上班日（gap）→ 不判斷（null） */
    return e;
  }).sort((a,b)=>a.open<b.open?1:a.open>b.open?-1:a.cart<b.cart?-1:a.cart>b.cart?1:0);
}

/* ---------------- 零件查詢發布檔（問題查找用；零件查詢頁自己有 LK） ---------------- */
function ktLookup(part){
  const key=keyOf(part);let p=KT.lk.get(key);if(p)return p;
  p=(async()=>{
    let d=null;for(const k of [...new Set([key,key.slice(1),String(part).toUpperCase()])].filter(Boolean)){d=await lkRead(k);if(d)break}
    return d;
  })().then(d=>({state:d&&d.found!==false&&d.part?'ok':'none',data:d}),e=>({state:'err',data:null,msg:String((e&&e.message)||e)}));
  KT.lk.set(key,p);return p;
}
/* 零件查詢資料裡選定商品別的物件（沒選＝件號層合計） */
function ktLkSel(data,frcd){
  const part=data&&data.part;if(!part)return null;if(!frcd)return part;return (part.variants||[]).find(v=>v.productType===frcd)||null;
}

/* ---------------- 格子（W19）----------------
   「這個零件的數字」固定 4 格（HOPES 庫存、WES 庫存、帳差 HOPES−WES、WES 儲位）＋「不是 0 的項目」（只畫 n≠0 的格子，按下去就地展開明細表，每張 ≤ 6 欄）＋一行「其餘是 0：…」。
   HOPES／WES 庫存優先用帳差監控同一次取的數字（data.enc 的 diff：HOPES、WES 同一時間），帳差清單裡沒有這個件號（兩邊相同）才用零件查詢發布檔的 OH（見 W19_SPEC D4）。
   格子的 data-tile 代號沿用 W18：hopesoh wesoh diff slots｜open carts transit putback putdiff susp hopesmis hopesoth wespick wesmis abncell abnarea case label clo picking cnt。 */
const ktNum=n=>fmt(n,2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
const ktSigned=n=>(n>0?'+':n<0?'−':'')+ktNum(Math.abs(n));
const KT_ORDER=['open','carts','transit','putback','putdiff','susp','hopesmis','hopesoth','wespick','wesmis','abncell','abnarea','case','label','clo','picking','cnt'];
const ktTbl=(id,cols,rows,o)=>dataTable('kt'+id,cols.map(c=>Object.assign({},c)),rows,Object.assign({limit:10,xl:1,name:'零件_'+id},o||{}));
const ktD=s=>{s=String(s||'');return s?(s.length>10?ivtHm(s):mdy(s.slice(0,10))):'–'};
/* 回傳 {core:[tile 設定…], items:[{key,l,n,v,u,s,sev,det}], zero:[名稱…], waiting:布林}。n＝0 的不畫格子，只進 zero。waiting＝零件查詢發布檔還沒讀到，有幾格還不能判斷 */
function ktModel(ctx){
  const sel=ctx.sel,fig=ctx.fig,dash=ctx.dash||ktDash(sel),carts=ctx.carts!==undefined?ctx.carts:ktCarts(sel),lk=ctx.lk||{state:'loading',s:null},s=lk.s||{};
  const hp=s.hopes||{},wes=s.wes||{},oc=s.openCase||{},clo=s.clo||{},sus=s.suspense||{},pk=s.pickAbnormal||{};
  const lkOk=lk.state==='ok'&&!!lk.s,waiting=lk.state==='loading';
  const dif=dash.dif;
  /* ---- 固定 4 格 ---- */
  const core=[];
  let hv=null,wv=null,src='';
  if(dif&&dif.length){hv=ktSum(dif,r=>r[3]);wv=ktSum(dif,r=>r[4]);src='diff'}
  else if(lkOk){hv=+hp.oh||0;wv=+wes.oh||0;src='lk'}
  const w0=fig&&fig.wes!=null?fig.wes:null;
  core.push(hv!=null?{id:'hopesoh',l:'HOPES 庫存',v:ktNum(hv),u:'個'}:{id:'hopesoh',l:'HOPES 庫存',v:waiting?'載入中':'–',u:''});
  core.push(wv!=null?{id:'wesoh',l:'WES 庫存',v:ktNum(wv),u:'個',s:src==='lk'&&w0!=null&&Math.abs(w0-wv)>1e-9?`儲位加總 ${ktNum(w0)} 個`:''}
    :{id:'wesoh',l:'WES 庫存',v:w0!=null&&lk.state!=='loading'?ktNum(w0):(waiting?'載入中':'–'),u:w0!=null&&lk.state!=='loading'?'個':''});
  {
    const v=fig&&fig.eff!=null?fig.eff:(dif?ktSum(dif,r=>r[6]):null),tr=dif?ktSum(dif,r=>r[7]):0,cp=fig&&fig.cp?Math.abs(fig.cp):0;
    const sub=[tr?`已扣在途 ${ktNum(tr)} 個`:'',cp?`${tr?'':'已扣'}調帳 ${ktNum(cp)} 個`:''].filter(Boolean).join('・');
    core.push(v==null?{id:'diff',l:'帳差 HOPES−WES',v:'–',u:''}:{id:'diff',l:'帳差 HOPES−WES',v:v?ktSigned(v):'0',u:'個',s:sub,sev:v?'r':'',btn:dif&&dif.length?'kt-diff':''});
  }
  {
    const n=fig&&fig.wes!=null&&ctx.sel.keys.length?(()=>{const ii=invIdx(),qi=ii.c.slots.qty;return new Set(ctx.sel.keys.flatMap(k=>ii.partSlots.get(k)||[]).filter(r=>qi==null||+r[qi]>0).map(r=>r[ii.c.slots.pos])).size})():(lkOk?+wes.storageCount||0:null);
    core.push({id:'slots',l:'WES 儲位',v:n==null?(waiting?'載入中':'–'):ktNum(n),u:n==null?'':'個'});
  }
  /* ---- 不是 0 的項目 ---- */
  const L=[],M={},zero=[];
  const add=(key,l,n,v,u,sub,sev,det)=>{M[key]={key,l,n,v,u,s:sub,sev,det}};
  const na=(key,l)=>zero.push({key,l,na:true});
  const diffTbl=()=>dif&&dif.length?ktTbl('transit',[{h:'商品別',f:r=>esc(r[9]||'')},{h:'樓層',f:r=>esc(r[0])},{h:'HOPES（個）',n:1,f:r=>fmt(r[3])},{h:'WES（個）',n:1,f:r=>fmt(r[4])},{h:'封箱／在途（個）',n:1,f:r=>`${fmt(r[5])}／${fmt(r[7])}`},{h:'帳差（個）',n:1,f:r=>`<b>${ktSigned(r[6])}</b>`}],dif,{limit:20,name:'零件_帳差'}):'';
  /* 991 未上架 */
  {
    let n=null,q=0,det=null;
    if(lkOk){n=+oc.count||0;q=+oc.quantity||0}
    else if(carts&&lk.state!=='loading'){n=ktSum(carts,e=>e.points);q=ktSum(carts,e=>e.need)}
    if(n!=null)add('open','991 未上架',n,ktNum(n),'點',`${ktNum(q)} 個`,'w',()=>carts&&carts.length?ktTbl('open',[{h:'台車',f:e=>pl(e.cart)},{h:'樓層',f:e=>esc(e.floor)},{h:'開箱日',f:e=>esc(mdy(e.open))},{h:'未上架（個）',n:1,f:e=>ktNum(e.need)}],carts):ktTbl('open',[{h:'台車',f:d=>d.CARTNO?pl(d.CARTNO):''},{h:'數量（個）',n:1,f:d=>ktNum(+d.OPENQTY||0)},{h:'庫位',f:d=>esc(d.LOCATION||'')},{h:'最後更新',f:d=>esc(d.MTDT||'')}],oc.details||[]));
    else if(!waiting)na('open','991 未上架');
  }
  /* 未上架台車 */
  if(carts==null)na('carts','未上架台車');
  else{
    const q=carts.reduce((a,e)=>a+Math.max(0,(+e.need||0)-(+e.put||0)),0),nc=new Set(carts.map(e=>e.cart)).size;
    add('carts','未上架台車',q,ktNum(nc),'台',`${ktNum(q)} 個還沒上`,'w',()=>ktTbl('carts',[{h:'台車',f:e=>pl(e.cart)},{h:'應上架（個）',n:1,f:e=>ktNum(e.need)},{h:'已上架（個）',n:1,f:e=>e.put==null?'–':ktNum(e.put)},{h:'台車有沒有開始上架',f:e=>e.started==null?'不判斷':e.started?`已開始（其他 ${e.others} 種零件已上）`:'還沒有零件上架'}],carts));
  }
  /* HOPES 在途 */
  if(dif){const tr=ktSum(dif,r=>r[7]);if(tr>0)add('transit','HOPES 在途',tr,ktNum(tr),'個','','w',()=>`<p class="muted">WES 已揀貨、HOPES 還沒過帳的數量；已從帳差扣掉。</p>`+diffTbl())}
  /* 以下需要第三看板資料 */
  if(!fig){['putback','wespick','wesmis','hopesmis','hopesoth','abncell','abnarea','case'].forEach(k=>na(k,{putback:'補上架',wespick:'WES 揀貨暫存區',wesmis:'WES 倉缺暫存',hopesmis:'HOPES 倉缺暫存',hopesoth:'HOPES 其他暫存',abncell:'WES 異常儲位',abnarea:'WES 異常區',case:'異常案件還沒結案'}[k]))}
  else{
    add('putback','補上架',fig.putQ||fig.put.length,ktNum(fig.putQ),'個',`${fig.put.length} 筆`,'w',()=>ktTbl('putback',[{h:'台車',f:x=>esc(x.r.k2||'–')},{h:'批次',f:x=>esc(x.r.k3||'–')},{h:'還沒補（個）',n:1,f:x=>x.q==null?'–':ktNum(x.q)},{h:'取消時間',f:x=>esc(ktD(x.r.at))}],fig.put));
    add('wespick','WES 揀貨暫存區',fig.pickQ||fig.pick.length,ktNum(fig.pickQ),'個',`${fig.pick.length} 筆`,'w',()=>`<p class="muted">推算值：補揀拿下 − 分播出貨（WES 沒有這個區的現量可查）。</p>`+ktTbl('wespick',[{h:'補揀時間',f:x=>esc(ktD(x.r.at))},{h:'儲位',f:x=>esc(x.r.pos||'–')},{h:'還沒分播（個）',n:1,f:x=>x.q==null?'–':ktNum(x.q)}],fig.pick));
    add('wesmis','WES 倉缺暫存',fig.misQ,ktNum(fig.misQ),'個',fig.mis.length?`${fig.misSlots} 個儲位`:'','w',()=>ktTbl('wesmis',[{h:'WES 儲位',f:r=>r.ref?(INV_SLOT_RE.test(r.ref)?rkl(r.ref):esc(r.ref)):'–'},{h:'數量（個）',n:1,f:r=>ktNum(r.qty)},{h:'日期',f:r=>esc(ktD(r.since))}],fig.mis));
    const hsub=fig.hopesNew?`手機 ${ktNum(fig.hMobile)}・2F510 ${ktNum(fig.hM510)}`:'';
    add('hopesmis','HOPES 倉缺暫存',fig.hMisQ,ktNum(fig.hMisQ),'個',hsub,'w',()=>ktTbl('hopesmis',[{h:'建立方式',f:r=>esc(r[0])},{h:'數量（個）',n:1,f:r=>ktNum(r[1])}],fig.hopesNew?[['手機揀貨回報',fig.hMobile],['2F510 人工建立',fig.hM510]].filter(r=>r[1]>0):[['（舊資料，不分建立方式）',fig.hMisQ]],{bare:1}));
    const osub=fig.hopesNew?fig.hOth.filter(o=>o.q>0).map(o=>`${KT_KIND_NAME[o.kind]||o.kind} ${ktNum(o.q)}`).join('・'):'';
    add('hopesoth','HOPES 其他暫存',fig.hOthQ,ktNum(fig.hOthQ),'個',osub,'w',()=>ktTbl('hopesoth',[{h:'暫存方式',f:r=>esc(KT_KIND_NAME[r.kind]||r.kind)},{h:'數量（個）',n:1,f:r=>ktNum(r.q)}],fig.hOth.filter(o=>o.q>0),{bare:1}));
    add('abncell','WES 異常儲位',fig.cellQ||fig.cell.length,ktNum(fig.cellQ),'個',fig.cell.length?`${fig.cellSlots} 個儲位`:'','r',()=>ktTbl('abncell',[{h:'WES 儲位',f:x=>x.r.pos?(INV_SLOT_RE.test(x.r.pos)?rkl(x.r.pos):esc(x.r.pos)):'–'},{h:'異常數量（個）',n:1,f:x=>x.q==null?'–':ktNum(x.q)},{h:'已過（工作日）',n:1,f:x=>x.r.at?'≥ '+ivlWD(x.r.at,ivlToday()):'–'}],fig.cell));
    add('abnarea','WES 異常區',fig.areaQ||fig.area.length,ktNum(fig.areaQ),'個',fig.area.length?`${fig.area.length} 筆`:'','w',()=>ktTbl('abnarea',[{h:'原儲位',f:r=>r.pos?(INV_SLOT_RE.test(r.pos)?rkl(r.pos):esc(r.pos)):'不明'},{h:'數量（個）',n:1,f:r=>r.q==null?'–':ktNum(r.q)},{h:'移入時間',f:r=>esc(ktD(r.at))}],fig.area));
    add('case','異常案件還沒結案',fig.case.length,ktNum(fig.case.length),'件',fig.case.length?`${ktNum(fig.caseQ)} 個`:'','w',()=>ktTbl('case',[{h:'案件編號',f:r=>esc(r.ref)},{h:'數量（個）',n:1,f:r=>ktNum(r.qty)},{h:'階段',f:r=>{const m=/[（(]([^）)]+)[）)]/.exec(r.note||'');return esc(m?m[1]:'–')}},{h:'已過（工作日）',n:1,f:r=>r.age==null?'–':String(r.age)}],fig.case));
  }
  /* HOPES 暫存總數、倉缺貼紙、剩餘封箱：零件查詢發布檔 */
  if(lkOk){
    add('susp','HOPES 暫存',+sus.quantity||0,ktNum(+sus.quantity||0),'個',`${ktNum(+sus.count||0)} 筆`,'w',()=>(fig?`<p class="muted">${(()=>{const t=fig.hMisQ+fig.hOthQ,d=(+sus.quantity||0)-t;return Math.abs(d)<1e-9?'＝HOPES 倉缺暫存＋其他暫存（兩邊對得上）':`HOPES 倉缺暫存＋其他暫存 ${ktNum(t)} 個，差 ${ktSigned(d)} 個：兩邊口徑或更新時間不同${fig.hopesAll?'':'（新格子只算 3/1 起建立的暫存）'}`})()}</p>`:'')+ktTbl('susp',[{h:'發貨單號',f:d=>esc(d['發貨單號']||'')},{h:'暫存日期',f:d=>esc(d['暫存日期']||'')},{h:'商品別',f:d=>esc(d['F/C']||'')},{h:'數量（個）',n:1,f:d=>nz(d['數量'])}],sus.details||[]));
    add('label','倉缺貼紙',+pk.labelCount||0,ktNum(+pk.labelCount||0),'張',`${ktNum(+pk.quantity||0)} 個`,'r',()=>ktTbl('label',[{h:'索引碼',f:d=>esc(d.indexKey||'')},{h:'據點',f:d=>esc(d.strongholdId||'')},{h:'數量（個）',n:1,f:d=>nz(d.quantity)}],pk.details||[]));
    add('clo','剩餘封箱',+clo.remaining||0,ktNum(+clo.remaining||0),'個','','w',()=>`<p class="muted">封箱 ${nz(clo.closeQty)} 個、釋回 ${nz(clo.releaseQty)} 個，剩餘 ${nz(clo.remaining)} 個。</p>`);
  }else if(!waiting){['susp','label','clo'].forEach(k=>na(k,{susp:'HOPES 暫存',label:'倉缺貼紙',clo:'剩餘封箱'}[k]))}
  /* 出貨：昨日以前揀料中、HOPES≠WES 上架數 */
  if(dash.pck)add('picking','昨日以前揀料中',dash.pck.length,ktNum(dash.pck.length),'筆',dash.pck.length?`${ktNum(ktSum(dash.pck,r=>r[4]))} 個・最久 ${Math.max(...dash.pck.map(r=>r[7]))} 天`:'','w',()=>ktTbl('picking',[{h:'樓層',f:r=>r[0]},{h:'建立日',f:r=>mdy(String(r[1]).replaceAll('/','-'))},{h:'已過（天）',n:1,f:r=>r[7]},{h:'數量（個）',n:1,f:r=>ktNum(r[4])}],dash.pck));
  else na('picking','昨日以前揀料中');
  if(dash.put)add('putdiff','HOPES≠WES 上架數',dash.put.length,ktNum(dash.put.length),'筆',dash.put.length?`差 HOPES−WES ${ktSigned(dash.put.reduce((a,r)=>a+(r[4]-r[5]),0))}`:'','r',()=>ktTbl('putdiff',[{h:'台車',f:r=>pl(r[2])},{h:'開箱日',f:r=>mdy(r[0])},{h:'HOPES 上架（個）',n:1,f:r=>fmt(r[4])},{h:'WES 上架（個）',n:1,f:r=>fmt(r[5])},{h:'差 HOPES−WES（個）',n:1,f:r=>`<b>${ktSigned(r[4]-r[5])}</b>`}],dash.put));
  else na('putdiff','HOPES≠WES 上架數');
  /* 盤點期間：盤差（盤點開始後才有） */
  if(fig&&fig.counting){
    const v=fig.discNeg+fig.discPos,sub=[fig.discNegN?`盤少 ${ktNum(-fig.discNeg)}`:'',fig.discPosN?`盤多 ${ktNum(fig.discPos)}`:''].filter(Boolean).join('・');
    add('cnt','盤點期間盤差',v,v?ktSigned(v):'0','個',sub,'r',()=>{
      const ii=invIdx(),sc=ii.c.slots,g=(r,n)=>sc[n]==null?undefined:r[sc[n]];
      const rows=sel.keys.flatMap(k=>ii.partSlots.get(k)||[]).filter(r=>+g(r,'rd')===1&&g(r,'disc')!=null&&+g(r,'disc')!==0);
      return ktTbl('cnt',[{h:'儲位',f:r=>rkl(String(g(r,'pos')))},{h:'盤點量（個）',n:1,f:r=>ktNum(g(r,'cntQty'))},{h:'盤差（個）',n:1,f:r=>`<b>${ktSigned(+g(r,'disc'))}</b>`}],rows);
    });
  }
  const items=[];
  KT_ORDER.forEach(k=>{const m=M[k];if(!m)return;if(m.n!==0&&m.n!=null&&!isNaN(m.n))items.push(m);else zero.push({key:k,l:m.l})});
  return {core,items,zero:KT_ORDER.map(k=>zero.find(z=>z.key===k)).filter(z=>z&&!z.na),waiting,na:zero.filter(z=>z.na)};
}
/* 整塊 HTML：固定 4 格＋不是 0 的項目＋其餘是 0＋就地展開的明細卡。ctx：{sel, lk:{state:'loading'|'ok'|'none'|'err', s}, fig, dash, carts} */
function ktHtml(ctx){
  const M=ktModel(ctx),sel=ctx.sel;
  const dif=(ctx.dash||ktDash(sel)).dif;
  let h=sec('這個零件的數字','','part')+tilesRow(M.core.map(c=>tile(Object.assign({},c,{id:c.id}))));
  h+=sec('不是 0 的項目','點一格看明細')+(M.items.length?tilesRow(M.items.map(m=>tile({id:m.key,l:m.l,v:m.v,u:m.u,s:m.s,sev:m.sev,btn:'kt-'+m.key}))):`<p class="muted">沒有（下面這些都是 0）</p>`);
  h+=`<p class="muted" data-kt="zero">${M.waiting?'零件查詢資料載入中…　':''}其餘是 0：${M.zero.map(z=>esc(z.l)).join('、')||'（無）'}${M.na.length?`　　缺資料：${M.na.map(z=>esc(z.l)).join('、')}`:''}</p>`;
  M.items.forEach(m=>{LAZY['kt-'+m.key]=m.det;h+=detailCard('kt-'+m.key,esc(m.l)+'：'+esc(m.v)+(m.u?' '+esc(m.u):''),lazyBox('kt-'+m.key))});
  if(dif&&dif.length){LAZY['kt-diff']=()=>ktTbl('diff',[{h:'商品別',f:r=>esc(r[9]||'')},{h:'樓層',f:r=>esc(r[0])},{h:'HOPES（個）',n:1,f:r=>fmt(r[3])},{h:'WES（個）',n:1,f:r=>fmt(r[4])},{h:'封箱／在途（個）',n:1,f:r=>`${fmt(r[5])}／${fmt(r[7])}`},{h:'帳差（個）',n:1,f:r=>`<b>${ktSigned(r[6])}</b>`}],dif,{limit:20,name:'零件_帳差'});h+=detailCard('kt-diff','帳差 HOPES−WES = HOPES − WES − 封箱 − 在途'+info('part'),lazyBox('kt-diff'))}
  return `<div class="kt" data-kt="host">${h}</div>`;
}
/* ================= 查零件（W17 問題查找＋W18 零件查詢；W19 合成一頁）=================
   W19：網址 find／find/<件號或台車>[/<手上數量>][?at=…][&open=hist]；只填件號＝零件的數字（tiles.js）；加手上數量＝多列出「可能是 N 種狀況」候選卡（比對引擎照舊，下面 W17／W18 的說明仍適用）；
   零件一行有「零件履歷 ›」就地展開（inv_part.js）。舊的 find/home、search/<…>、inv/part/<…> 由 router.js 轉址。判斷規則的說明在詳細說明 #ref/findrule。
   以下是 W17／W18 原文：
   現場手上有某個零件 N 個（撿到、多出來、找到之前不見的）：輸入件號＋數量（＋找到的地方），看板把這個件號所有還沒清的紀錄依序比對，
   列出所有可能的狀況（最上面一張標「最可能」），每張卡附證據、動作、做完之後會一起消失的待辦。規格：inv_v3\W17_SPEC.md。
   資料只用 inv.enc（loopRows、issues、diffs、parts、slots、meta.hopesTmp），不新增資料端欄位。頁首的件號搜尋（search.js）不動。
   網址：#<金鑰>/find/<件號>/<數量>[?at=cart|abn|shelf|ground|other]（可分享、可重新整理）。件號不帶商品別、有多個商品別時先列選項，使用者點選後才往下判斷（點選＝換成帶商品別的網址）。
   比對順序（ord）：1 補上架｜1.5 這台車已開始上架、這個零件還沒上（W18）｜2 補揀卡在揀貨暫存區｜3 WES 異常儲位｜4 WES 異常區｜5 已認列倉缺＋HOPES 倉缺暫存｜5.5 WES 已認列倉缺、HOPES 還沒倉缺暫存（使用者 10/15：開新上架單）｜5.7 HOPES 倉缺暫存｜5.8 HOPES 其他暫存｜6 盤點期間盤少｜7.5 沒有 1–6、只是 HOPES 帳比 WES 多（WES 開單上架）｜8 沒有對應的紀錄（動作留空）。
   W18（使用者 10/15）：異常案件（原 7）不再是候選，只在格子「異常案件還沒結案」；每個候選的動作一定是系統裡實際要做的操作；卡片預設收合（標籤、數量、標題、動作），點開才看說明與證據；
   卡片上方是「零件關鍵數字格子」（tiles.js，和零件查詢頁共用），每種候選都有對應的格子（KT_TILE_OF_ORD）。
   排序：數量（剛好相等 > 紀錄比手上多 > 手上比紀錄多）→ 找到的地方優先（台車→1；異常區→4、5；貨架旁→3、4）→ 紀錄越新越前面 → 順序。
   動作的規則與用字對照「自動倉異常處理小幫手」的 found（找到之前不見的零件）／pick（揀貨揀不到）／inbound（進貨數量跟應上架不一樣）三個情境。
   全域名稱一律 fd／FD 開頭。測試：work\test_w17.py。 */
const FD_PLACES=[['','不指定'],['cart','台車'],['abn','異常區'],['shelf','貨架旁'],['ground','地上'],['other','其他']];
const FD_PREF={cart:[1,1.5],abn:[4,5,5.5],shelf:[3,4]};
/* ord → 名稱（一句話說這代表什麼，只寫事實）。節點 id（own）＝這個情況在待辦頁對應的卡，用來扣掉「同一件號另外還有的待辦」 */
const FD_RULES={
  1:{key:'putback',name:'補上架還沒補',means:'WES 上架時取消，這格剩下的量還沒補上架'},
  1.5:{key:'cartstart',name:'這台車已開始上架，這個零件還沒上',means:'同一台車已經有其他零件上架，這個零件在這台車還沒上架完成'},
  2:{key:'pickback',name:'補揀未分播',means:'補揀時從貨架拿下來，還沒分播出貨'},
  3:{key:'abncell',name:'異常儲位',means:'揀貨時找不到，WES 記了異常數量'},
  4:{key:'abnarea',name:'異常儲位：WES 異常區還有貨',means:'揀貨異常時移到異常區，還沒放回貨架'},
  5:{key:'written',name:'已認列倉缺，HOPES 也做了倉缺暫存',means:'WES、HOPES 都已經把這些貨扣掉了'},
  5.7:{key:'hopesmis',name:'HOPES 有倉缺暫存（WES 沒有認列倉缺）',means:'HOPES 已經用倉缺暫存把這些貨扣掉'},
  5.8:{key:'hopestmp',name:'HOPES 有暫存還沒結',means:'HOPES 用暫存（未結、借料、滯銷、破損）把這些貨扣著，撿到的可以釋回'},
  5.5:{key:'wesonly',name:'WES 已認列倉缺，HOPES 還沒做倉缺暫存',means:'只有 WES 把這些貨扣掉了'},
  6:{key:'counted',name:'盤點時這格盤少',means:'盤點時沒找到的貨'},
  7.5:{key:'diffup',name:'沒有其他異常，只是 WES 帳比 HOPES 少',means:'HOPES 帳比 WES 多，找不到其他異常紀錄'},
  8:{key:'nothing',name:'沒有對應的紀錄',means:'系統找不到這個件號的異常、暫存或帳差'}
};
const FD_ACT_TXT={
  1:'WES 補上架 N 個（台車 X、批次 Y）',
  1.5:'放回台車 {台車}，WES 上架 N 個',
  2:'WES 分播出貨 N 個',
  3:'補出給那張出貨單，或放回原儲位 {儲位}，再清 WES 異常數量',
  4:'放回原貨架 {儲位}',
  5:'WES 開新上架單 N 個；HOPES 倉缺暫存釋回 N 個（釋回可以分次，手上比暫存少也照手上數量釋回）',
  5.7:'HOPES 倉缺暫存釋回 N 個（可以分次釋回）',
  5.8:'HOPES {未結／借料／滯銷／破損}暫存釋回 N 個（可以分次釋回）',
  5.5:'WES 開新上架單 N 個（N＝WES 倉缺暫存 − HOPES 倉缺暫存）',
  6:'放回原儲位 {儲位}，晚上再盤一次（12/6 由 HOPES 認列）；不要開上架單',
  7.5:'WES 開單上架 N 個（N＝手上數量與帳差取小的）',
  8:'（沒有動作：系統裡找不到對應的紀錄，不確定就留空）'
};
const fdSgn=n=>(n>0?'+':'')+fmt(n);
const fdNum=v=>v==null||v===''||isNaN(+v)?null:+v;
/* 日期／時間顯示：有時間 → 10/05 19:28；只有日期 → 10/05；cntAt 的 yymmdd 也認 */
function fdD(s){
  s=String(s||'');if(!s)return '–';
  s=fdIso(s);
  return s.length>10?ivtHm(s):mdy(s.slice(0,10));
}
/* 日期字串 → YYYY-MM-DD…（cntAt 是 yymmdd） */
const fdIso=s=>{s=String(s||'');return /^\d{6}$/.test(s)?'20'+s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4,6):s};
const fdSlotL=pos=>pos?(INV_SLOT_RE.test(pos)?rkl(pos):esc(pos)):'–';
const fdSlotsTxt=a=>{const u=[...new Set(a.map(r=>r.pos).filter(Boolean))];return u.length?u.slice(0,3).join('、')+(u.length>3?` 等 ${u.length} 個儲位`:''):'（儲位不明）'};
/* 全形數字／空白 → 半形、去頭尾空白 */
const fdNorm=v=>String(v==null?'':v).replace(/[０-９Ａ-Ｚａ-ｚ－]/g,c=>c==='－'?'-':String.fromCharCode(c.charCodeAt(0)-65248)).trim();
const fdQty=v=>{const s=fdNorm(v);return /^\d{1,6}$/.test(s)&&+s>=1?+s:null};
/* 各迴路一列的數量（候選與格子共用，數字才會一致）：補上架＝還沒補；補揀＝拿下 − 分播出；異常儲位＝異常數量。q 為 null＝紀錄沒有數量 */
const fdQ10=r=>{const pq=ivtPutQty(r.ev);return r.q!=null?r.q:(pq?pq[0]-pq[1]:null)};
const fdQ6=r=>{const m=/補揀(?:離架|拿下) (\d+)(?: 個)?，分播(?:\(Type 5\))?只(?:沖掉|出) (\d+)/.exec(r.ev||'');return r.q!=null?r.q:(m?+m[1]-+m[2]:null)};
const fdQ3=r=>r.q!=null?r.q:fdNum((/異常數量 ([\d.]+)/.exec(r.ev||'')||[])[1]);

/* ---------------- 索引（每份 inv 資料只建一次）---------------- */
function fdIndex(){
  const c=iwCache();if(c.fd)return c.fd;
  const ix={loop:new Map(),iss:new Map(),diff:new Map(),hopes:null,hopesIss:new Map()};
  const push=(m,k,o)=>{if(!k)return;let a=m.get(k);if(!a)m.set(k,a=[]);a.push(o)};
  const lr=invCols('loopRows');
  if(lr.n!=null)invRows('loopRows').forEach(r=>{
    const n=r[lr.n];if(n===0||n===1||n===4||n===9)return;
    push(ix.loop,keyOf(r[lr.part]),{n,part:r[lr.part]||'',pos:r[lr.pos]||'',at:r[lr.at]||'',ev:r[lr.ev]||'',bl:lr.bl!=null?+r[lr.bl]||0:0,q:lr.qty!=null&&r[lr.qty]!=null?+r[lr.qty]:null,
      k1:lr.k1!=null?r[lr.k1]:null,k2:lr.k2!=null?r[lr.k2]:null,k3:lr.k3!=null?r[lr.k3]:null});
  });
  const ic=invCols('issues');
  if(ic.stage!=null)invRows('issues').forEach(r=>{
    const st=r[ic.stage];if(st!=='abncase'&&st!=='mistemp'&&st!=='hopestmp'&&st!=='putdiff')return;
    push(ix.iss,keyOf(r[ic.part]),{stage:st,part:r[ic.part]||'',ref:String(r[ic.ref]==null?'':r[ic.ref]),qty:+r[ic.qty]||0,since:r[ic.since]||'',age:ic.ageWD!=null?r[ic.ageWD]:null,note:String(r[ic.note]||'')});
  });
  const dc=invCols('diffs');
  if(dc.part!=null)invRows('diffs').forEach(r=>ix.diff.set(keyOf(r[dc.part]),invRec('diffs',r)));
  /* HOPES 倉缺暫存：meta.hopesTmp.rows（件號×暫存方式，各自的數量）；舊資料沒有就退回 issues 的 hopestmp（只知道種類、數量是合計） */
  const h=invMeta().hopesTmp,hr=h&&(h.rowsAll||h.rows);   /* rowsAll＝不限建立日（10/15 起）；舊資料只有 3/1 起的 rows */
  if(hr&&Array.isArray(hr.rows)){
    const hc=Object.fromEntries((hr.columns||[]).map((n,i)=>[n,i]));
    ix.hopes=new Map();ix.hopesOther=new Map();
    hr.rows.forEach(r=>{
      const k=keyOf(r[hc.part]);if(!k)return;
      const kind=String(r[hc.kind]||''),q=+r[hc.qty]||0,at=String(r[hc.since]||'').slice(0,10);
      if(q<=0)return;
      if(kind==='mis_mobile'||kind==='mis_510'){
        let e=ix.hopes.get(k);if(!e)ix.hopes.set(k,e={mobile:0,m510:0,at:''});
        if(kind==='mis_mobile')e.mobile+=q;else e.m510+=q;
        if(at&&(!e.at||at<e.at))e.at=at;
      }else{
        let a=ix.hopesOther.get(k);if(!a)ix.hopesOther.set(k,a=[]);
        const o=a.find(x=>x.kind===kind);if(o){o.q+=q;if(at&&at<o.at)o.at=at}else a.push({kind,q,at});
      }
    });
  }
  return c.fd=ix;
}
/* 件號 k（含商品別）的紀錄；資料端有些來源（異常案件）沒填商品別，只有 bare：bare 不是任何已知完整件號時一併算進來 */
function fdGet(map,k,bare){
  let a=map.get(k)||[];
  if(bare&&bare!==k&&!invIdx().part.has(bare))a=a.concat(map.get(bare)||[]);
  return a;
}

/* ---------------- 件號解析 ---------------- */
function fdPartInfo(row){
  const ix=invIdx(),c=ix.c.parts,key=keyOf(row[c.part]),bare=key.slice(1),sl=ix.partSlots.get(key)||[],qi=ix.c.slots.qty;
  return {row,part:String(row[c.part]),key,bare,frcd:key.charAt(0),name:c.name!=null?String(row[c.name]||''):'',floor:c.floor!=null?row[c.floor]:'',
    eff:c.eff!=null?+row[c.eff]||0:0,wes:qi!=null?sl.reduce((a,r)=>a+(+r[qi]||0),0):null};
}
/* 輸入 → {kind:'one'|'many'|'none'|'empty', rows} ；完整件號（含商品別）優先；只有一筆符合就直接用（byBare＝輸入沒有商品別） */
function fdResolve(input){
  const k=keyOf(input);if(!k)return {kind:'empty',rows:[]};
  const ix=invIdx();
  if(ix.part.has(k))return {kind:'one',rows:[ix.part.get(k)],byBare:false};
  const rs=ix.bare.get(k)||[];
  if(rs.length===1)return {kind:'one',rows:rs,byBare:true};
  if(rs.length>1)return {kind:'many',rows:rs};
  return {kind:'none',rows:[]};
}
/* 這個件號目前有幾筆還沒清的紀錄（選商品別時給使用者參考） */
function fdOpenCount(P){
  const ix=fdIndex();
  return fdGet(ix.loop,P.key,P.bare).length+fdGet(ix.iss,P.key,P.bare).filter(r=>r.stage==='abncase').length+(P.eff?1:0);
}

/* ---------------- 比對（核心）----------------
   回傳排序好的候選；每個候選：{ord,key,name,means,R 紀錄量（null＝不明）,N 動作數量,qc 數量符合度（0 剛好／1 紀錄比手上多／2 手上比紀錄多）,pc 找到的地方（0 優先／1）,at,atMs,action,hopes,ev:[[標籤,HTML]],notes:[],own:[節點],clears:[…]} */
function fdSub(recs,H){const one=recs.find(r=>r.q===H);return one?[one]:recs}
function fdCands(P,H,place){
  const ix=fdIndex(),k=P.key,b=P.bare,L=n=>fdGet(ix.loop,k,b).filter(r=>r.n===n),I=st=>fdGet(ix.iss,k,b).filter(r=>r.stage===st);
  const dRow=ix.diff.get(k)||null,out=[],pref=FD_PREF[place]||[];
  const add=o=>{
    const def=FD_RULES[o.ord];Object.assign(o,{key:def.key,name:o.name2||def.name,means:def.means});
    o.R=o.R==null||isNaN(o.R)?null:o.R;
    o.N=o.R==null?H:Math.min(H,o.R);
    o.qc=o.R==null?1:H===o.R?0:H<o.R?(o.partOk?0:1):2;   /* partOk：HOPES 倉缺暫存釋回本來就會分次，手上比暫存少也算符合（使用者 10/15） */
    o.pc=pref.includes(o.ord)?0:1;
    o.atMs=parseT(String(o.at||'').slice(0,19));if(!isFinite(o.atMs))o.atMs=-Infinity;
    o.action=o.act?o.act(o.N):'';o.notes=o.notes||[];o.ev=o.ev||[];
    out.push(o);
  };
  /* 1 補上架還沒補（loopRows n=10：台車 k2、批次 k3、原因 k1） */
  L(10).forEach(r=>{
    const pq=ivtPutQty(r.ev),q=fdQ10(r);if(q!=null&&q<=0)return;
    const tag=[r.k2?'台車 '+r.k2:'',r.k3?'批次 '+r.k3:''].filter(Boolean).join('、');
    add({ord:1,R:q,at:r.at,own:[40],dpos:true,up:true,
      act:N=>`WES 補上架 ${fmt(N)} 個`+(tag?`（${tag}）`:''),
      ev:[['時間',esc(fdD(r.at))],['台車',esc(r.k2||'–')],['儲位',fdSlotL(r.pos)],['批次',esc(r.k3||'–')],['數量',pq?`這格應上 ${fmt(pq[0])}、實上 ${fmt(pq[1])}，還沒補 ${fmt(q)} 個`:(q!=null?`還沒補 ${fmt(q)} 個`:'–')],['原因',esc(ivtPutReason(r.k1))]]});
  });
  /* 1.5 這台車已開始上架，這個零件還沒上（W18）：991 未上架追蹤有這個件號（台車＋開箱日），而且同一台車、開箱日之後 WES 有其他零件的上架紀錄（inv.enc meta.cartPut）；
     這個零件的已上架量 < 應上架量才算。這一筆如果就是「補上架」那一格（同台車有補上架）只列補上架。整台車都還沒開始上架的（正常的未上架）不列，只在格子 */
  try{
    const put10=new Set(L(10).map(r=>String(r.k2||'').trim()).filter(Boolean));
    (ktCarts({frcd:P.frcd,bare:P.bare,keys:[k]})||[]).filter(e=>e.started&&keyOf(e.part)===k&&e.need-e.put>0&&!put10.has(e.cart)).forEach(e=>{
      const R=e.need-e.put;
      add({ord:1.5,R,at:e.open,own:[],cartRow:e,act:N=>`放回台車 ${e.cart}，WES 上架 ${fmt(N)} 個`,
        ev:[['台車',pl(e.cart)],['開箱日',esc(mdy(e.open))],['這台車已上架的零件數',`${fmt(e.parts)} 種（開箱日之後 WES 有上架紀錄；最後一筆 ${esc(fdD(e.last))}）`],['這個零件',`應上架 ${fmt(e.need)} 個、已上架 ${fmt(e.put)} 個，還沒上 ${fmt(R)} 個`]],
        notes:['台車已經開始上架，這個零件卻沒有上完：可能是零件異常、也可能漏上。']});
    });
  }catch(e){console.error(e)}
  /* 2 補揀的貨卡在 WES 揀貨暫存區（loopRows n=6；數量＝補揀拿下 − 分播出） */
  L(6).forEach(r=>{
    const q=fdQ6(r);if(q!=null&&q<=0)return;
    add({ord:2,R:q,at:r.at,own:[11],dpos:true,act:N=>`WES 分播出貨 ${fmt(N)} 個`,
      ev:[['補揀時間',esc(fdD(r.at))],['儲位',fdSlotL(r.pos)],['數量',esc(invEv(r.ev))]]});
  });
  /* 3 WES 異常儲位還沒處理（loopRows n=3：每格一列，數量＝異常數量）；有一格剛好等於手上數量就只指那一格，否則全部格 */
  const l3=L(3).map(r=>Object.assign({},r,{q:fdQ3(r)})).filter(r=>r.q==null||r.q>0);
  if(l3.length){
    const sel=fdSub(l3,H),R=sel.every(r=>r.q!=null)?sel.reduce((a,r)=>a+r.q,0):null,at=sel.map(r=>r.at).sort().pop();
    add({ord:3,R,at,own:[6],act:()=>`補出給那張出貨單，或放回原儲位 ${fdSlotsTxt(sel)}，再清 WES 異常數量`,
      ev:sel.slice(0,6).map(r=>['異常儲位',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜異常數量 ${r.q==null?'–':fmt(r.q)} 個`]).concat(sel.length>6?[['',`還有 ${sel.length-6} 格`]]:[]),
      notes:l3.length>sel.length?[`這個件號共有 ${l3.length} 格異常儲位；其中一格的異常數量剛好等於手上數量，先看那一格。`]:[]});
  }
  /* 4 WES 異常區還有貨（loopRows n=5：儲位＝異常揀貨的來源貨架，k1＝T2 回推筆數） */
  const l5=L(5);
  if(l5.length){
    const sel=fdSub(l5.map(r=>Object.assign({},r)),H),R=sel.every(r=>r.q!=null)?sel.reduce((a,r)=>a+r.q,0):null,at=sel.map(r=>r.at).sort().pop(),src=sel.filter(r=>r.pos);
    add({ord:4,R,at,own:[6],act:()=>src.length?`放回原貨架 ${fdSlotsTxt(src)}`:'放回原貨架（找不到異常揀貨紀錄，來源儲位不明）',
      ev:sel.slice(0,6).map(r=>['異常區',`${fdSlotL(r.pos)}｜${esc(fdD(r.at))}｜${r.q==null?'':fmt(r.q)+' 個｜'}${esc(invEv(r.ev))}`]),

      ev:[['WES 倉缺暫存',`${fmt(W)} 個｜${mis.slice(0,3).map(r=>fdSlotL(r.ref)).join('、')}${mis.length>3?` 等 ${mis.length} 格`:''}｜${esc(fdD(at))}`],['HOPES 倉缺暫存',`${fmt(Hq)} 個（${esc(hTxt)}）｜${esc(fdD(hAt))}`]],
      notes:['HOPES 倉缺暫存釋回可以分次：手上有幾個就先釋回幾個。',
        '原本倉缺暫存的貨補回後，HOPES 可能重新拋單；如果這些貨就是要出給那張單的，要通知 HOPES。',
        `盤點期間（${fdRoundTxt()}）改成：放回原儲位，晚上再盤一次（${ivtRecDate()} 由 HOPES 認列）。`].concat(W!==Hq?[`兩邊倉缺數量不同（WES ${fmt(W)}、HOPES ${fmt(Hq)}），入帳量以較小的為準。`]:[])});

  if(Hq>0&&W===0){
    add({ord:5.7,R:Hq,at:hAt,own:[],partOk:true,act:N=>`HOPES 倉缺暫存釋回 ${fmt(N)} 個`,
      ev:[['HOPES 倉缺暫存',`${fmt(Hq)} 個（${esc(hTxt)}）｜${esc(fdD(hAt))}`],['WES 倉缺暫存','沒有']],

  if(W>Hq){
