  ops:{home:pOpsHome,eff:pOpsEff,rack:pOpsRack,in:pOpsIn,util:pOpsUtil},
  ab:{home:pAbHome},
  inv:{home:pInvHome,racks:pInvRacks},
  find:{home:pFind},
  ref:{home:pRef}};
const MOUNT={'ops/home':['hLate'],'ops/eff':['drv2','drv3','st2','st3','eff2','eff3','slD2','slD3','slI2','slI3'],'ops/rack':['rwT2','rwT3','hitOut','hitIn'],'ops/in':['inDaily','inOpen','inArr','pgT2','pgT3','ltWeek','ltArr'],'ops/util':['utSlot','utVol']};   /* 熱點圖在 <details data-mount="heat"> 裡，點開才畫（ops.js） */
Object.assign(MOUNT,INV_MOUNT);   /* 第三看板各頁在自己的檔案裡登記（INV_MOUNT['inv/home']=[…]），不要改這裡 */
let PATH=hashPath(),BOARD='ops',CUR='';   /* PATH 含 query（'ab?open=pk'） */

/* ---------- 舊網址 → 新網址（W19_SPEC §2.3）----------
   回傳新路徑（可帶 query）；不用轉就回 null。舊網址原本的 query（floor、age、q…）併到新網址。P1 轉的是異常、查零件、零件履歷；營運、盤點在 P2 接著加。 */
const AB_SLUGS=['diff','case','cell','area','wmis','hmis','pick','one','rest','put','loc','clo','putback','transit','temp'];
function redirectOf(p){
  const qi=p.indexOf('?'),base=qi<0?p:p.slice(0,qi),q0=qi<0?'':p.slice(qi+1),seg=base.split('/'),b=seg[0],s=seg[1]||'';
  const mk=(path,extra)=>{const qs=[extra,q0].filter(Boolean).join('&');return path+(qs?'?'+qs:'')};
  if(b==='search')return mk(seg.length>1?'find/'+seg.slice(1).join('/'):'find');
  if(b==='find'){if(s==='home')return mk('find'+(seg.length>2?'/'+seg.slice(2).join('/'):''));return null}
  if(b==='ab'){
    if(!s||AB_SLUGS.includes(s))return null;
    const m={home:'',todo:'',check:'',cases:'case',parts:'case',cells:'cell',picking:'',putdiff:''};
    if(!(s in m))return seg.length>2?null:mk('ab');
    return s==='picking'?mk('ab','open=pk'):s==='putdiff'?mk('ab','open=pd'):mk(m[s]?'ab/'+m[s]:'ab');
  }
  if(b==='ops'){   /* 營運：34 頁 → 5 頁（§2.3）；to＝要捲到的區塊 id */
    const m={home:['ops',''],workload:['ops/eff','sec-strip'],slots:['ops/eff','sec-slots'],rackwait:['ops/rack','sec-rw'],hit:['ops/rack','sec-hit'],heat:['ops/rack','sec-heat'],inbound:['ops/in','sec-991'],putgrid:['ops/in','sec-pg'],lt:['ops/in','sec-lt']};
    if(s in m)return mk(m[s][0],m[s][1]?'to='+m[s][1]:'');
    return null;
  }
  if(b==='inv'){   /* 盤點：15 頁 → 2 頁（§2.3）；盤點後出問題的清單在 inv 首頁，貨架在 inv/racks */
    if(!s)return null;
    if(s==='part'&&seg[2])return mk('find/'+seg.slice(2).join('/'),'open=hist');
    if(s==='part')return mk('find');
    if(s==='rack')return mk('inv/racks'+(seg[2]?'/'+seg.slice(2).join('/'):''));
    if(s==='racks'){const f=seg[2];if(['todo','done','added','missed','disc','tonight'].includes(f)&&seg.length===3)return mk('inv/racks','f='+f);return null}
    if(['ledger','confirm','queue'].includes(s))return mk('ab/diff');
    if(s==='rules')return mk('ref/inv');
    if(typeof IVN_BY_SLUG!=='undefined'&&IVN_BY_SLUG[s]&&seg.length===2)return null;
    return mk('inv');   /* home、todo、check、loops、risk 與其他不認得的 */
  }
  return null;
}
/* 換頁：預設 pushState（上一頁鍵可用）；同一頁重畫（p 與目前相同）或 replace=true 時用 replaceState */
function go(p,replace){const same=p===PATH;PATH=p;try{history[replace||same?'replaceState':'pushState'](null,'',hashOf(p))}catch(e){}route(true)}
const BOARD_TITLE={ops:'營運',ab:'異常',inv:'盤點',find:'查零件',ref:'詳細說明'};
/* fresh＝這次是「換頁／開網址」（會套用網址上的 ?floor=… 篩選）；單純重畫（分段按鈕）不要傳 */
function route(fresh){
  const rd=redirectOf(PATH);if(rd&&rd!==PATH){PATH=rd;try{history.replaceState(null,'',hashOf(rd))}catch(e){}}
  const qi=PATH.indexOf('?');QP=new URLSearchParams(qi<0?'':PATH.slice(qi+1));QFRESH=!!fresh;
  const parts=(qi<0?PATH:PATH.slice(0,qi)).split('/');let board=parts[0],sub=parts[1]||'',arg;
  if(!PAGES[board]){board='ops';sub=''}
  BOARD=board;
  /* 子頁：ops、inv 看 PAGES 有沒有（沒有就回首頁）；ab、find、ref 的第二段是代號／件號／段落，整串交給首頁函式 */
  if(board==='ab'||board==='find'||board==='ref'){arg=parts.slice(1).join('/');sub='home'}
  else if(board==='inv'&&sub&&!PAGES.inv[sub]&&typeof IVN_BY_SLUG!=='undefined'&&IVN_BY_SLUG[sub]){arg=parts.slice(1).join('/');sub='home'}   /* inv/<代號>：直接展開那一列 */
  else{if(!sub||!PAGES[board][sub])sub='home';arg=parts.slice(2).join('/')}
  const title=BOARD_TITLE[board];
  $('#boards').innerHTML=BOARDS.map(([k,t])=>`<a data-board="${k}" href="${esc(hashOf(k))}" class="${k===board?'on':''}"${k===board?' aria-current="true"':''}>${t}</a>`).join('');
  /* 第三看板的資料不在 data.enc：進 ab／inv／find 且還沒載入好時，先畫「載入中」，載完再 route(true)；失敗畫錯誤卡（其他看板不受影響） */
  const needsInv=board==='inv'||board==='find'||board==='ab',gated=needsInv&&INV.status!=='ready';
  let html;try{html=gated?invGate(title):PAGES[board][sub](arg)}catch(e){html=pageErr(title,e)}
  $('#page').innerHTML=html;if(!route.mo&&window.MutationObserver){route.mo=new MutationObserver(()=>fitTables($('#page')));route.mo.observe($('#page'),{childList:true,subtree:true})}fitTables($('#page'));CUR=gated?board+'/_wait':board+'/'+sub;document.title=title+'｜三倉看板';
  (MOUNT[CUR]||[]).forEach(id=>{try{mountChart(id)}catch(e){chartErr(id,e)}});
  window.scrollTo(0,0);
  if(!gated&&INV_AFTER[CUR]){try{INV_AFTER[CUR](arg)}catch(e){console.error(e)}}
  {const to=QP.get('to'),el=to&&document.getElementById(to);if(el)setTimeout(()=>el.scrollIntoView(),60)}   /* 舊網址轉過來時捲到對應區塊 */
  if(gated&&INV.status!=='error'&&!INV.hook){INV.hook=true;invLoad().then(()=>{INV.hook=false;if(onInvData())route(true)})}
}
/* 貨架頁：熱點圖在收合的 <details> 裡；已選過日期（重畫後 open）就直接畫 */
INV_AFTER['ops/rack']=()=>{const d=document.querySelector('details[data-mount="heat"]');if(d&&S.ops.heatDate)d.open=true;if(d&&d.open){try{mountChart('heat')}catch(e){chartErr('heat',e)}}};
/* ================= 事件 ================= */
document.addEventListener('click',e=>{
  /* 站內連結：一般點擊走 pushState；Ctrl／Shift／Cmd／中鍵交給瀏覽器開新分頁（href 帶金鑰，新分頁能直接用） */
  const a=e.target.closest('a[href^="#"]');
  if(a){if(e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;const p=pathOfHref(a.getAttribute('href'));if(p!=null){e.preventDefault();go(p);return}}
  const tg=e.target.closest('[data-tg]');if(tg){tileToggle(tg);return}   /* 數字格就地展開明細卡（ui.js） */
  const ca=e.target.closest('[data-ca]');if(ca){chartAction(ca.dataset.ca,ca.dataset.id);return}
  const cr=e.target.closest('[data-cr]');if(cr){st(cr.dataset.id).range=+cr.dataset.cr;saveLS();mountChart(cr.dataset.id);return}
  if(invClick(e))return;   /* 第三看板：data-inv-act（見 inv_core.js） */
  if(tableClick(e))return;
  const o=e.target.closest('[data-hop],[data-eop],[data-rwop],[data-efl],[data-ofl],[data-hu],[data-hd],[data-inf],[data-ltgs],[data-ltw]');
  if(o){const d=o.dataset;if(d.hop)S.ops.homeOp=d.hop;if(d.eop)S.ops.op=d.eop;if(d.rwop)S.ops.rwOp=d.rwop;if(d.efl)S.ops.floor=d.efl;if(d.ofl)S.ops.wkFloor=d.ofl;if(d.hu)S.ops.hitUnit=d.hu;if(d.hd)S.ops.heatDate=d.hd;if(d.inf)S.ops.inFloor=d.inf;if(d.ltgs)S.ops.ltgs=d.ltgs;if(d.ltw)S.ops.ltw=d.ltw;const y=scrollY;route();scrollTo(0,y)}
});
document.addEventListener('input',e=>{
  const cs=e.target.closest('[data-cs]');if(cs){const id=cs.dataset.id,s=st(id),k=cs.dataset.cs;if(k==='labels'||k==='lineLabels')s[k]=cs.checked;else s[k]=+cs.value;saveLS();const out=cs.parentNode.querySelector('output');if(out)out.textContent=k==='rightMax'?cs.value+(CFG[id].right&&CFG[id].right.unit!=null?CFG[id].right.unit:'%'):CFG[id].left.fmt(+cs.value);paintScreen(id);return}
  if(invInput(e))return;
  if(tableInput(e))return;
});
document.addEventListener('change',e=>{if(invChange(e))return;tableChange(e)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
/* 上一頁／下一頁／手動改網址：popstate 與 hashchange 會一起來，PATH 沒變就不重畫 */
function syncRoute(){const p=hashPath();if(p!==PATH){PATH=p;route(true)}}
window.addEventListener('popstate',syncRoute);window.addEventListener('hashchange',syncRoute);
let RT;window.addEventListener('resize',()=>{clearTimeout(RT);RT=setTimeout(()=>(MOUNT[CUR]||[]).forEach(id=>{try{paintScreen(id)}catch(e){chartErr(id,e)}}),160)});
const CARTS=()=>(D.inbound&&D.inbound.carts)||[];
/* 搜尋框在第三看板（網址是 inv/…）時：儲位格式→貨架明細並選中該格；貨架格式→貨架明細；其餘→零件履歷（invSearchPath／invSuggest 在 inv_core.js） */
/* 搜尋建議：輸入先過 keyOf（橫線、空白不影響）；比對 bare，輸入帶商品別字首時比對「商品別＋bare」 */
function suggest(v){
  const k=keyOf(v),m=bareMap(),out=[];
  CARTS().forEach(c=>{if(out.length<3&&c.cart.includes(k))out.push([c.cart,'台車'])});
  let n=0;for(const [b,fs] of m){if(n>=6)break;if(b.includes(k)||(k.length>1&&[...fs].some(f=>(f+b).startsWith(k)))){out.push([b,'件號']);n++}}
  return out.length?out:[[v,'查詢']];
}
$('#q').addEventListener('input',e=>{const v=e.target.value.trim().toUpperCase(),s=$('#sugg');if(keyOf(v).length<3&&!(onInv()&&/^\d-/.test(v))){s.classList.remove('on');return}
  s.innerHTML=(onInv()?invSuggest(v):suggest(v)).map(([p,k])=>`<button data-p="${esc(p)}"><b>${esc(p)}</b><span class="chip">${k}</span></button>`).join('');s.classList.add('on')});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim().toUpperCase();if(v){go(onInv()?invSearchPath(v):'find/'+encodeURIComponent(v));$('#sugg').classList.remove('on')}}});
$('#sugg').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){go(onInv()?invSearchPath(b.dataset.p):'find/'+encodeURIComponent(b.dataset.p));$('#sugg').classList.remove('on');$('#q').value=b.dataset.p}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sugg').classList.remove('on')});
/* ================= 資料時間燈號（右上角） =================
   門檻放在這裡，之後要調只改這幾個數字：
     workStart／workEnd  上班時段（台北時間）；只有這段時間、且不是週日與假日（meta.calendar.holidays）才計入「資料有多舊」
     warnHours           資料超過幾個「上班小時」沒更新 → 黃燈
     badWorkDays         超過幾個「上班日」（＝上班小時 × 一天的長度）沒更新 → 紅燈
   任一區塊 meta.status 不是 ok（這次更新失敗、沿用上一版）或資料是 null → 至少黃燈。
   算法用「上班小時」而不是日曆時間：週六 20:30 最後一輪排程到週一 08:00 只算 1 小時，不會週一早上一開就紅燈。 */
const FRESH_CFG={workStart:7,workEnd:21,warnHours:3,badWorkDays:1};
function workHoursBetween(t0,t1){
  const hol=new Set((META&&META.calendar&&META.calendar.holidays)||[]),H=36e5;let total=0;
  for(let d=Math.floor((t0+8*H)/864e5);;d++){
    const day0=d*864e5-8*H;if(day0>t1)break;
    const dt=new Date(d*864e5);if(dt.getUTCDay()===0||hol.has(dt.toISOString().slice(0,10)))continue;
    const a=Math.max(t0,day0+FRESH_CFG.workStart*H),b=Math.min(t1,day0+FRESH_CFG.workEnd*H);if(b>a)total+=b-a;
  }
  return total/H;
}
/* 回傳 {level:0|1|2|-1(沒有 meta), rows:[{key,name,asOf,gen,level,why}], newest} */
function freshState(now=Date.now()){
  if(!META||!META.sections)return {level:-1,rows:[],newest:NaN};
  const badH=FRESH_CFG.badWorkDays*(FRESH_CFG.workEnd-FRESH_CFG.workStart),rows=[];let level=0,newest=NaN;
  Object.keys(META.sections).forEach(k=>{
    const i=META.sections[k],t=parseT(i.generatedAt),wh=isFinite(t)?workHoursBetween(t,now):0;let lv=0,why='';
    const ext=!(k in D);  /* 不在這包資料裡、另外載入的區塊（例如第三看板的 inv.enc）：列在彈出框，但不影響這個燈號，由用到它的看板自己提示 */
    if(D[k]==null&&!ext){lv=1;why='沒有資料'}else if(secBad(k)){lv=1;why='這次更新失敗，沿用上一版'}
    if(wh>badH){lv=2;why='超過 '+FRESH_CFG.badWorkDays+' 個上班日沒更新'}else if(wh>FRESH_CFG.warnHours&&lv<1){lv=1;why='超過 '+FRESH_CFG.warnHours+' 小時沒更新'}
    if(ext){why=(secStatus(k)&&secStatus(k)!=='ok'?String(secStatus(k)).slice(0,24):'另行載入');lv=0}
    else if(isFinite(t)&&!(t<newest))newest=t;
    rows.push({key:k,name:secName(k),asOf:asOfLabel(k)||'–',gen:isFinite(t)?fmtT(t):'–',level:lv,why,ext});level=Math.max(level,lv);
  });
  /* W19：「看板資料今天有沒有正常更新」（原每日檢查第 0 項）併進這個燈號：今天有幾次沒更新完整就至少黃燈（第三看板資料載入後才知道） */
  try{if(typeof INV!=='undefined'&&INV.status==='ready'){const x=invLoopList().find(y=>y.n===0);if(x&&x.cnt>0){level=Math.max(level,1);rows.push({key:'health',name:'看板資料今天有沒有正常更新',asOf:'–',gen:'–',level:1,why:invLoopEm(x).replace(/<[^>]+>/g,''),ext:false})}}}catch(e){}
  return {level,rows,newest};
}
/* 右上角：只有「資料 MM/DD HH:MM」＋燈號，點了到詳細說明 #ref/fresh（各區塊來源、更新頻率、這次更新時間與狀態都在那裡；W19 取代原本滑過彈出的框） */
function renderFresh(){
  try{
    const f=freshState(),main=(D.fresh&&D.fresh.main)||(isFinite(f.newest)?fmtT(f.newest):'–'),el=$('#fresh');if(!el)return;
    const word=['資料','資料需留意','資料已過期'][Math.max(0,f.level)];
    el.classList.remove('ok','warn','bad','na');el.classList.add(f.level<0?'na':['ok','warn','bad'][f.level]);
    $('#freshText').textContent=word+' '+main;$('#freshShort').textContent=main.slice(-5);
    el.title='各資料來源的更新時間（點一下看詳細說明）';
    el.setAttribute('aria-label',word+' '+main+'（點一下看各資料來源的更新時間）');
  }catch(e){console.error(e)}
}
renderFresh();setInterval(renderFresh,6e4);
$('#fresh').setAttribute('href',hashOf('ref/fresh'));$('#brand').setAttribute('href',hashOf('ops'));
route(true);
</script>
<script>
(function(){
  const msg=t=>{document.body.innerHTML='<div style="font:16px/1.7 \'Microsoft JhengHei\',system-ui,sans-serif;max-width:560px;margin:90px auto;padding:0 24px;color:#17222d"><h2 style="margin:0 0 8px">三倉看板</h2><p style="color:#617283">'+t+'</p></div>'};
  const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const APP=document.getElementById('app').textContent;
  const key=location.hash.slice(1).split('/')[0];
  window.DASH_KEY=key;
  if(!key){msg('這個網址缺少金鑰。請向管理者要完整連結（網址最後面有一長串 # 開頭的字）。');return}
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){msg('這個瀏覽器太舊，請改用新版 Edge、Chrome 或 Safari。');return}
  msg('載入資料中…');
  (async()=>{
    try{
      const r=await fetch('data.enc',{cache:'no-cache'});if(!r.ok)throw new Error('資料檔讀取失敗（'+r.status+'）');
      const buf=new Uint8Array(await r.arrayBuffer());
      let k;try{k=await crypto.subtle.importKey('raw',b64(key),'AES-GCM',false,['decrypt'])}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12))}catch(e){throw new Error('金鑰不正確，或連結被截斷。請向管理者要完整連結。')}
      const text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      window.DATA=JSON.parse(text);
    }catch(e){msg(e.message||String(e));return}
    document.body.innerHTML=window.__BODY;
    const s=document.createElement('script');s.textContent=APP;document.body.appendChild(s);
  })();
})();
